<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172554}.title{font-size:32px;font-weight:800}.body{font-size:25px}.small{font-size:22px}.head{font-size:27px;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="1220" rx="18" fill="#f8fafc"/>
<text x="45" y="55" class="title" text-anchor="start">代码怎样进入 V80：两份配置依次装入</text>
<text x="45" y="95" class="small" text-anchor="start">操作路线｜构建与装卡尚未实测；Boot 和 PL 必须来自同一次构建</text>
<g class="node"><rect x="45" y="135" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="300.0" y="176" class="head" text-anchor="middle">1　准备同一份判断代码</text>
<text x="300.0" y="215" class="small" text-anchor="middle">market_filter.sv + 寄存器外壳</text>
<text x="300.0" y="250" class="small" text-anchor="middle">固定 V80 工程、Vivado / Vitis 2026.1</text>
</g>
<g class="node"><rect x="645" y="135" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="900.0" y="176" class="head" text-anchor="middle">2　Vivado 构建电路</text>
<text x="900.0" y="215" class="small" text-anchor="middle">得到 Boot PDI + PLD PDI</text>
<text x="900.0" y="250" class="small" text-anchor="middle">XSA 记录本次硬件；检查时序与设计</text>
</g>
<path d="M555 205 H621" class="arrow"/>
<path d="M900 275 V306" class="arrow"/>
<g class="node"><rect x="645" y="330" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="900.0" y="371" class="head" text-anchor="middle">3　AMR 按 XSA 打包启动镜像</text>
<text x="900.0" y="410" class="small" text-anchor="middle">Vitis 编译管理固件</text>
<text x="900.0" y="445" class="small" text-anchor="middle">与 Boot 配置组合为 amr_ospi.bin</text>
</g>
<g class="node"><rect x="45" y="330" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="300.0" y="371" class="head" text-anchor="middle">4　复制两份文件并选卡</text>
<text x="300.0" y="410" class="small" text-anchor="middle">启动 .bin + 同次构建的 PLD .pdi</text>
<text x="300.0" y="445" class="small" text-anchor="middle">核对校验值、序列号、BDF 和启动槽</text>
</g>
<path d="M645 400 H579" class="arrow"/>
<path d="M300 470 V501" class="arrow"/>
<g class="node"><rect x="45" y="525" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="300.0" y="566" class="head" text-anchor="middle">5　先写入启动槽</text>
<text x="300.0" y="605" class="small" text-anchor="middle">cfgmem_program -q</text>
<text x="300.0" y="640" class="small" text-anchor="middle">写非活动 PDI_BOOT 槽，保留回退镜像</text>
</g>
<g class="node"><rect x="645" y="525" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="900.0" y="566" class="head" text-anchor="middle">6　启动新底座，重新认卡</text>
<text x="900.0" y="605" class="small" text-anchor="middle">device_boot → overview</text>
<text x="900.0" y="640" class="small" text-anchor="middle">确认 READY，重新读取实际 BDF</text>
</g>
<path d="M555 595 H621" class="arrow"/>
<path d="M900 665 V696" class="arrow"/>
<g class="node"><rect x="645" y="720" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="900.0" y="761" class="head" text-anchor="middle">7　再装入 PL 用户电路</text>
<text x="900.0" y="800" class="small" text-anchor="middle">pdi_program 加载同次 PLD</text>
<text x="900.0" y="835" class="small" text-anchor="middle">工具检查 Parent UUID 与底座匹配</text>
</g>
<g class="node"><rect x="45" y="720" width="510" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="300.0" y="761" class="head" text-anchor="middle">8　读取本课标识与判决</text>
<text x="300.0" y="800" class="small" text-anchor="middle">经 PF1 写测试消息与一次额度</text>
<text x="300.0" y="835" class="small" text-anchor="middle">核对 ID、额度、放行数和丢弃数</text>
</g>
<path d="M645 790 H579" class="arrow"/>
<g class="node"><rect x="45" y="935" width="1110" height="170" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="600.0" y="976" class="head" text-anchor="middle">为什么分两次：启动管理环境 ≠ 过滤电路已经工作</text>
<text x="600.0" y="1015" class="small" text-anchor="middle">首次安装 AMR 的 FPT 初始化另行完成；本图只更新已初始化的台架。</text>
<text x="600.0" y="1050" class="small" text-anchor="middle">写入启动存储后仍要加载 PL；本次 PL 装载不等于设置断电自动恢复。</text>
<text x="600.0" y="1085" class="small" text-anchor="middle">最后还要读回本课 APP_ID 和判断结果，才能证明用户电路已运行。</text>
</g>
</svg>
