<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc">
  <title id="title">两份来源不同的代码，编成一个程序</title>
  <desc id="desc">编译时：SystemVerilog文件market_filter.sv经Verilator生成C++模型；手写的mold_filter_adapter.cpp提供网络收发和模型调用。两者和运行库由C++编译器编成同一个mold_filter_adapter。运行时：点二的同一个Linux进程中，手写代码收报文并填写生成模型的s_itch与序号、设置模拟时钟并调用eval；生成模型计算字段比较和状态；手写代码读取drop_valid并转发或丢弃。底部放大模型模拟的电路：Type、Locate、Stock三项匹配，且正常接受消息、有额度时，在模拟时钟上升沿输出DROP并消耗额度。全程运行编译后的C++，没有返回执行SystemVerilog源码，也不是两个独立进程。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}
    .title{font-size:36px;font-weight:700}.section{font-size:29px;font-weight:700}
    .label{font-size:26px;font-weight:700}.body{font-size:24px}.small{font-size:22px;fill:#475569}
    .arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linejoin:round;marker-end:url(#arrow)}
    .wire{fill:none;stroke:#64748b;stroke-width:3;stroke-linejoin:round}
  </style>
  <rect width="1200" height="1510" rx="20" fill="#fff"/>
  <text x="40" y="55" class="title">两份来源不同的代码，编成一个程序</text>
  <text x="40" y="97" class="body">生成的 C++ 管过滤逻辑；手写的 C++ 管收发报文和调用模型。</text>
  <text x="40" y="146" class="section">编译时：代码从哪里来</text>
  <rect x="50" y="173" width="460" height="108" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="280" y="211" text-anchor="middle" class="label">我们写的 RTL 电路设计</text>
  <text x="280" y="252" text-anchor="middle" class="body">market_filter.sv · SystemVerilog</text>
  <path d="M280 281V358" class="arrow"/>
  <text x="301" y="326" class="small">Verilator 自动翻译</text>
  <rect x="50" y="360" width="460" height="87" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="280" y="395" text-anchor="middle" class="label">生成的 C++ 模型代码</text>
  <text x="280" y="429" text-anchor="middle" class="small">实现字段比较、丢包判决和额度更新</text>
  <rect x="690" y="173" width="460" height="108" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="920" y="211" text-anchor="middle" class="label">另外手写的 C++ 适配代码</text>
  <text x="920" y="252" text-anchor="middle" class="body">mold_filter_adapter.cpp</text>
  <text x="690" y="326" class="small">接收报文、准备输入、调用模型、转发</text>
  <path d="M920 281V305H1167V521H842" class="arrow"/>
  <path d="M280 447V521H358" class="arrow"/>
  <rect x="360" y="477" width="480" height="108" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="517" text-anchor="middle" class="label">C++ 编译器 + 运行库</text>
  <text x="600" y="558" text-anchor="middle" class="body">把两部分编译、链接成一个可执行文件</text>
  <path d="M600 585V643" class="arrow"/>
  <rect x="32" y="645" width="1136" height="382" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="687" class="section">运行时：.2 上的同一个 Linux 进程</text>
  <text x="60" y="729" class="body">可执行文件：mold_filter_adapter</text>
  <rect x="60" y="761" width="330" height="193" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="800" text-anchor="middle" class="label">① 手写 C++ 收包</text>
  <text x="80" y="843" class="small">recvfrom 收包并检查格式</text>
  <text x="80" y="882" class="small">填 s_itch 和序号，设置 clk</text>
  <text x="80" y="921" class="small">调用模型的 eval() 计算方法</text>
  <path d="M390 858H433" class="arrow"/>
  <rect x="435" y="761" width="330" height="193" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="600" y="800" text-anchor="middle" class="label">② 生成的 C++ 模型</text>
  <text x="455" y="843" class="small">Vmarket_filter 对象</text>
  <text x="455" y="882" class="small">读取输入，比较三个字段</text>
  <text x="455" y="921" class="small">更新丢包判决与剩余额度</text>
  <path d="M765 858H808" class="arrow"/>
  <rect x="810" y="761" width="330" height="193" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="975" y="800" text-anchor="middle" class="label">③ 手写 C++ 处理结果</text>
  <text x="830" y="843" class="small">读取模型的 drop_valid</text>
  <text x="830" y="882" class="small">放行：sendto 转发原报文</text>
  <text x="830" y="921" class="small">丢弃：不转发这条报文</text>
  <text x="600" y="987" text-anchor="middle" class="body">① 和 ③ 属于同一份手写代码；运行中没有再执行 SystemVerilog 源码。</text>
  <text x="600" y="1015" text-anchor="middle" class="small">图示格式检查通过的消息；其它收到的报文由适配代码直接转发。</text>
  <path d="M600 1027V1070" class="arrow"/>
  <text x="40" y="1110" class="section">放大 ②：生成的模型模拟哪些电路逻辑</text>
  <text x="40" y="1150" class="small">以下是正常接收消息的分支：valid 与 ready 同时为 1；复位与配置分支在后文说明。</text>
  <rect x="60" y="1175" width="320" height="83" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="220" y="1209" text-anchor="middle" class="label">Type 比较</text>
  <text x="220" y="1242" text-anchor="middle" class="body">消息类型 = A</text>
  <rect x="440" y="1175" width="320" height="83" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="600" y="1209" text-anchor="middle" class="label">Locate 比较</text>
  <text x="600" y="1242" text-anchor="middle" class="body">股票编号 = 8095</text>
  <rect x="820" y="1175" width="320" height="83" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="980" y="1209" text-anchor="middle" class="label">Stock 比较</text>
  <text x="980" y="1242" text-anchor="middle" class="body">股票名称 = NVDA + 4 空格</text>
  <path d="M220 1258V1290H980V1258" class="wire"/>
  <path d="M600 1258V1323" class="arrow"/>
  <circle cx="600" cy="1290" r="5" fill="#64748b"/>
  <rect x="140" y="1325" width="920" height="107" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="1361" text-anchor="middle" class="label">模拟时钟上升沿：写入判决与额度</text>
  <text x="600" y="1404" text-anchor="middle" class="body">三项匹配且额度 &gt; 0 → DROP，额度 1 变 0；其它接受的消息 → PASS</text>
  <text x="600" y="1480" text-anchor="middle" class="small">三个比较框表示 RTL 中并列的电路关系；本章由 CPU 运行生成的 C++ 来模拟。</text>
</svg>
