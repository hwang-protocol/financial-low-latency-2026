<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img"><title>假设有一张 U250：在 DMA 前过滤 NVDA 行情</title>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0 0L11 6L0 12Z" fill="context-stroke"/></marker><g id="parcel" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"><rect width="62" height="44" rx="5"/><path d="M25 0V17H38V0M8 31H21" fill="none"/></g><g id="chip" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"><rect width="64" height="60" rx="8"/><rect x="16" y="15" width="32" height="30" rx="3" fill="#fff"/><path d="M-9 12H0M-9 30H0M-9 48H0M64 12H73M64 30H73M64 48H73M12 -9V0M32 -9V0M52 -9V0M12 60V69M32 60V69M52 60V69"/></g><g id="monitor" fill="#fff" stroke="#2563eb" stroke-width="3"><rect width="90" height="57" rx="6"/><path d="M45 57V70M22 70H68"/><path d="M17 37V27M35 37V16M53 37V22M71 37V10" stroke-width="7"/></g><g id="clock" stroke="#475569" stroke-width="3" fill="#fff"><circle cx="24" cy="24" r="23"/><path d="M24 8V24L34 30" fill="none"/></g></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a} .title{font-size:32px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#475569}.label{font-size:25px;font-weight:700}</style>
<rect width="1200" height="870" rx="18" fill="#f8fafc"/>
<text x="35" y="48" class="title">真卡怎样过滤同一条 NVDA 行情</text>
<text x="35" y="83" class="small">设计示意：独立 100G 台架；本课尚未实现板级外壳或上板。</text>
<rect x="25" y="180" width="165" height="164" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#monitor" x="63" y="199"/>
<text x="43" y="306" class="label">Exchange</text>
<text x="43" y="333" class="small">.1 角色 / 100G</text>
<rect x="225" y="120" width="950" height="350" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="250" y="160" class="label">U250 内的 FPGA：网口与 PCIe 基础电路 + 自定义过滤器</text>
<rect x="255" y="193" width="215" height="184" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#parcel" x="330" y="217"/>
<text x="272" y="323" class="label">收以太网帧</text>
<text x="267" y="355" class="small">CMAC / 322 MHz</text>
<rect x="480" y="193" width="215" height="184" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#parcel" x="555" y="217"/>
<text x="497" y="323" class="label">存下整包</text>
<text x="492" y="355" class="small">缓存 / 换时钟</text>
<rect x="705" y="193" width="215" height="184" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#chip" x="780" y="217"/>
<text x="722" y="323" class="label">比较三个字段</text>
<text x="717" y="355" class="small">用户 RTL / 250 MHz</text>
<rect x="930" y="193" width="215" height="184" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#chip" x="1005" y="217"/>
<text x="947" y="323" class="label">搬到主机</text>
<text x="942" y="355" class="small">QDMA / PCIe</text>
<path d="M190 260H254" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M470 266H480" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M695 266H705" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M920 266H930" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="250" y="422" class="body" style="fill:#15803d">PASS：整帧与原顺序保留</text>
<text x="250" y="451" class="small">TX：主机发出的包沿原路径发送</text>
<path d="M811 377V391" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="720" y="391" width="208" height="62" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="736" y="430" class="small" style="fill:#b91c1c">命中且有额度：丢弃</text>
<rect x="690" y="530" width="485" height="198" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<use href="#monitor" x="1050" y="556"/>
<text x="716" y="570" class="label">插卡主机 / .2 角色</text>
<text x="716" y="611" class="body">onic 驱动 → Linux UDP</text>
<text x="716" y="650" class="body">Feed Guardian 收原组播</text>
<text x="716" y="692" class="small">软件 adapter 退出</text>
<path d="M1038 377V529" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="25" y="530" width="620" height="198" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
<text x="47" y="570" class="label">主机怎样给卡设规则</text>
<text x="47" y="611" class="body">PCIe BAR → AXI-Lite → 新建控制寄存器</text>
<text x="47" y="650" class="body">Locate 8095 / NVDA + 四个空格 / 额度 1</text>
<text x="47" y="692" class="small">需补：配置接口、超时、序号审计；地址尚未定义</text>
<path d="M600 530V494H811V472" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="25" y="760" width="1150" height="84" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="47" y="793" class="body">怎么确认成功：卡上策略丢包数 = 1，丢包序号 = Feed 等待的序号</text>
<text x="47" y="827" class="body">业务结果：GAP → 拒绝下单；清额度并重放后 HEALTHY → 成交</text>
</svg>
