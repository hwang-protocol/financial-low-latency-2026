<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172554}.title{font-size:32px;font-weight:800}.body{font-size:25px}.small{font-size:22px}.head{font-size:27px;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="830" rx="18" fill="#f8fafc"/>
<text x="45" y="55" class="title" text-anchor="start">同一段判断代码，两条验证路线</text>
<text x="45" y="95" class="small" text-anchor="start">第八章把电路放在交换机；本章把电路放在服务器加速卡</text>
<g class="node"><rect x="270" y="135" width="660" height="120" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="600.0" y="176" class="head" text-anchor="middle">market_filter.sv：SystemVerilog / RTL</text>
<text x="600.0" y="215" class="small" text-anchor="middle">比较 Type、Locate、Stock；管理一次额度</text>
</g>
<path d="M450 255 V288 H300 V326" class="arrow"/>
<path d="M750 255 V288 H900 V326" class="arrow"/>
<g class="node"><rect x="45" y="350" width="510" height="145" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="300.0" y="391" class="head" text-anchor="middle">本地：Verilator + g++</text>
<text x="300.0" y="430" class="small" text-anchor="middle">生成 C++ 模型</text>
<text x="300.0" y="465" class="small" text-anchor="middle">与手写收发代码编成一个程序</text>
</g>
<g class="node"><rect x="645" y="350" width="510" height="145" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="900.0" y="391" class="head" text-anchor="middle">真卡：Vivado + Vitis 2026.1</text>
<text x="900.0" y="430" class="small" text-anchor="middle">同一 RTL + V80 板级与寄存器电路</text>
<text x="900.0" y="465" class="small" text-anchor="middle">配套生成 Boot 与 PL 两部分配置</text>
</g>
<path d="M300 495 V546" class="arrow"/>
<path d="M900 495 V546" class="arrow"/>
<g class="node"><rect x="45" y="570" width="510" height="145" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
