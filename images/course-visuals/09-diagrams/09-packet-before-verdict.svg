<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>要丢整包，必须在发出首拍前知道判决</title><desc>以本课 100 B 可见帧放到 512-bit 接口为例：每拍最多承载 64 B</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#475569}.label{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}</style><rect width="1200" height="700" rx="20" fill="#fff"/><text x="40" y="55" class="title">要丢整包，必须在发出首拍前知道判决</text><text x="40" y="94" class="sub">以本课 100 B 可见帧放到 512-bit 接口为例：每拍最多承载 64 B</text>
<rect x="40" y="150" width="535" height="137" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="187" class="label">第 1 拍：帧偏移 0–63</text>
<text x="60" y="223" class="body">Ethernet + IPv4 + UDP + Mold + Length</text>
<text x="60" y="256" class="body">目标 Stock 尚未到达 → 先缓存</text>
<rect x="625" y="150" width="530" height="137" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="645" y="187" class="label">第 2 拍：帧偏移 64–99</text>
<text x="645" y="223" class="body">ITCH Type / Locate / Stock 均已到齐</text>
<text x="645" y="256" class="body">tlast=1；本例最后 36 B 有效</text>
<path d="M575 216L625 216" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="380" width="330" height="145" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="417" class="label">存储与解析</text>
<text x="60" y="453" class="body">保留原帧和长度元数据</text>
<text x="60" y="486" class="body">重排字节送入 288-bit RTL</text>
<text x="60" y="519" class="body">Verdict 和整包 ID 对齐</text>
<rect x="440" y="380" width="330" height="145" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="460" y="417" class="label">PASS：整包释放</text>
<text x="460" y="453" class="body">按原顺序输出所有拍</text>
<text x="460" y="486" class="body">下游不 ready 时保持数据</text>
<text x="460" y="519" class="body">可见网络字节不改</text>
<rect x="830" y="380" width="325" height="145" rx="12" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="850" y="417" class="label">DROP：整包回收</text>
<text x="850" y="453" class="body">不发任何数据拍</text>
<text x="850" y="486" class="body">释放该包全部缓存</text>
<text x="850" y="519" class="body">仅递增策略 drop</text>
<path d="M890 287L890 333L200 333L200 380" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M370 442L440 442" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M205 525L205 565L990 565L990 525" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="617" class="small">CMAC 的 RX 不会因用户逻辑停顿而停止来帧；有限 FIFO 满时另记 overflow。</text>
<text x="40" y="657" class="small">本方案先用整包缓存保证正确性；更早的 cut-through 需重新证明决策时点与错误处置。</text>
</svg>
