<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172554}.title{font-size:32px;font-weight:800}.body{font-size:25px}.small{font-size:22px}.head{font-size:27px;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#a)}</style>
<rect width="1200" height="820" rx="18" fill="#f8fafc"/>
<text x="45" y="55" class="title" text-anchor="start">AMD 产品：芯片、板卡、工具各是什么</text>
<text x="45" y="95" class="small" text-anchor="start">分类示意｜本章关注右侧可编程器件和下方 Alveo 卡</text>
<g class="node"><rect x="45" y="140" width="340" height="155" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="215.0" y="181" class="head" text-anchor="middle">CPU</text>
<text x="215.0" y="220" class="small" text-anchor="middle">EPYC / Ryzen</text>
<text x="215.0" y="255" class="small" text-anchor="middle">运行 Linux 与普通程序</text>
</g>
<g class="node"><rect x="430" y="140" width="340" height="155" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="600.0" y="181" class="head" text-anchor="middle">GPU</text>
<text x="600.0" y="220" class="small" text-anchor="middle">Instinct / Radeon</text>
<text x="600.0" y="255" class="small" text-anchor="middle">并行计算与图形处理</text>
</g>
<g class="node"><rect x="815" y="140" width="340" height="155" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="985.0" y="181" class="head" text-anchor="middle">FPGA / 自适应 SoC</text>
<text x="985.0" y="220" class="small" text-anchor="middle">UltraScale+ / Versal</text>
<text x="985.0" y="255" class="small" text-anchor="middle">按设计配置硬件逻辑</text>
</g>
<path d="M985 295 V356" class="arrow"/>
<g class="node"><rect x="585" y="380" width="570" height="155" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="870.0" y="421" class="head" text-anchor="middle">Alveo：做成可插入服务器的卡</text>
<text x="870.0" y="460" class="small" text-anchor="middle">UL3422 / UL3524：超低延时交易</text>
<text x="870.0" y="495" class="small" text-anchor="middle">V80：大容量、存储与网络带宽</text>
</g>
<g class="node"><rect x="45" y="380" width="480" height="155" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="285.0" y="421" class="head" text-anchor="middle">Vivado：构建工具</text>
<text x="285.0" y="460" class="small" text-anchor="middle">输入 RTL 与对应板卡工程</text>
<text x="285.0" y="495" class="small" text-anchor="middle">输出设备配置文件</text>
</g>
<path d="M525 456 H561" class="arrow"/>
<text x="600" y="605" class="head" text-anchor="middle">语言可相同：SystemVerilog；板级工程随卡而变。</text>
<g class="node"><rect x="45" y="650" width="1110" height="115" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="600.0" y="691" class="head" text-anchor="middle">其他选择：Altera Agilex / Quartus；Lattice Nexus、Avant</text>
<text x="600.0" y="730" class="small" text-anchor="middle">AMD 的配套生态成熟；不能由此推成行业垄断。</text>
</g>
</svg>
