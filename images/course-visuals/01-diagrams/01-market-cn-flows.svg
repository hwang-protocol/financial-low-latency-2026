<text x="195.0" y="567" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户策略进程</text>
<text x="195.0" y="603" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">产生委托 / 处理回报</text>
<rect x="425" y="550" width="220" height="105" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="535.0" y="587" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">XTP 交易服务</text>
<text x="535.0" y="623" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">账户 / 权限 / 风控</text>
<rect x="715" y="550" width="165" height="105" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="797.5" y="587" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">市场报盘</text>
<text x="797.5" y="623" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">获准接口</text>
<rect x="990" y="550" width="170" height="105" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="1075.0" y="587" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">上交所接入</text>
<text x="1075.0" y="623" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">交易与撮合</text>
<polyline points="337,577 401.0,577.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#tcp)"/>
