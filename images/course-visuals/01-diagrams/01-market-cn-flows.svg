<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">02 · 国内客户：接线、订单会话与行情转发</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="start">SmartX / XTP + 上交所公开资料；角色和产品边界是真实信息，布局为教学示意</text>
