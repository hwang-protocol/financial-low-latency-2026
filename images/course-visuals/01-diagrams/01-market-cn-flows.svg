<text x="355" y="432" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#7e22ce" text-anchor="start">紫色虚线：管理 / 查看；订单从托管主机发出。</text>
<text x="54" y="503" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">订单 / 自身回报</text>
