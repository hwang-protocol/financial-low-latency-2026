<polyline points="990,632 904.0,632.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#tcp)"/>
<text x="365" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="middle">XTP / TCP</text>
<text x="935" y="534" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="middle">市场会话</text>
<text x="194" y="692" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="middle">客户端会话止于 XTP 服务</text>
<text x="650" y="692" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="middle">内部处理后申报；实际实例与机器数量未公开</text>
<rect x="36" y="745" width="1128" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="782" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">行情另行接收 · 两类市场产品是可选示例，不能据此认定 XTP 的上游</text>
<rect x="65" y="888" width="260" height="150" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="195.0" y="925" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户行情进程</text>
<text x="195.0" y="961" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">绑定接收 NIC</text>
<text x="195.0" y="999" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">订阅 / 序号 / 回补</text>
<rect x="440" y="855" width="285" height="213" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="582.5" y="892" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">券商行情边界</text>
<text x="582.5" y="928" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">接收市场数据</text>
<text x="582.5" y="966" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">解析 / 转换 / 分发</text>
<text x="582.5" y="1004" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">XTP 行情服务</text>
<rect x="840" y="805" width="290" height="113" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="985.0" y="842" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">Level-1 / 期权</text>
<text x="985.0" y="878" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">广域专线：UDP 组播</text>
<rect x="840" y="982" width="290" height="113" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="985.0" y="1019" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">Level-2 · LDDS</text>
<text x="985.0" y="1055" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">所核 VDE 接口：TCP</text>
<polyline points="828,870 749.0,870.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#udp)"/>
<polyline points="828,1038 749.0,1038.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#tcp)"/>
<polyline points="428,940 349.0,940.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#tcp)"/>
<polyline points="428,1000 349.0,1000.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#udp)"/>
<text x="376" y="869" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172b4d" text-anchor="middle">TCP 或 UDP</text>
<text x="582" y="1106" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="middle">上游接收与客户分发在应用处终止 / 重建</text>
<rect x="36" y="1150" width="1128" height="168" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="1186" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">XTP 接口版本：20250806_2.2.50.8；交易 Login 仅 TCP，行情支持 TCP / UDP。</text>
<text x="54" y="1221" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">市场到券商、券商到客户分别核对地址、端口与接口；UDP 不能直接等同组播。</text>
<text x="54" y="1256" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">LDDS 与 Level-1 广域产品分别申请；图示不代表 XTP 同时使用这两个上游。</text>
<text x="54" y="1291" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">办公管理是独立受控入口；光纤接通、TCP 建连、业务受理分别确认。</text>
</svg>
