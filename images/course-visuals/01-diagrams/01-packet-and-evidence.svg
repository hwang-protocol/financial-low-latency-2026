<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>一个请求，两份证据</title><desc>按 ① → ② → ③ 读主线，再看 ④a 抓包与 ④b 回应两条分支。</desc><defs>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#7e22ce"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#15803d"/></marker>
<marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#c76a08"/></marker>
<marker id="arr-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#64748b"/></marker>
<marker id="arr-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#172338"/></marker>
<symbol id="chip" viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="6"/><rect x="23" y="23" width="18" height="18" rx="2"/><path d="M20 4v8m12-8v8m12-8v8M20 52v8m12-8v8m12-8v8M4 20h8m-8 12h8m-8 12h8m40-24h8m-8 12h8m-8 12h8"/></symbol>
<symbol id="file" viewBox="0 0 64 64"><path d="M16 5h23l12 12v42H16zM39 5v14h12M24 29h19M24 38h19M24 47h13"/></symbol>
<symbol id="packet" viewBox="0 0 64 64"><rect x="6" y="13" width="52" height="38" rx="5"/><path d="m7 15 25 20 25-20M7 49l16-15m34 15L41 34"/></symbol>
<symbol id="box" viewBox="0 0 64 64"><path d="m6 19 26-13 26 13v29L32 60 6 48zM6 19l26 13 26-13M32 32v28M19 12l26 13v12"/></symbol>
<symbol id="server" viewBox="0 0 64 64"><rect x="12" y="5" width="40" height="54" rx="5"/><path d="M13 23h38M13 41h38M31 14h12M31 32h12M31 50h12"/><circle cx="22" cy="14" r="2"/><circle cx="22" cy="32" r="2"/><circle cx="22" cy="50" r="2"/></symbol>
<symbol id="cache" viewBox="0 0 64 64"><rect x="6" y="9" width="52" height="46" rx="5"/><path d="M7 32h50M24 20h16M24 43h16"/></symbol>
<symbol id="ram" viewBox="0 0 64 64"><rect x="3" y="16" width="58" height="30" rx="4"/><path d="M10 46v9m9-9v9m9-9v9m9-9v9m9-9v9m9-9v9"/><rect x="11" y="23" width="14" height="15"/><rect x="36" y="23" width="14" height="15"/></symbol>
<symbol id="clock" viewBox="0 0 64 64"><circle cx="32" cy="35" r="23"/><path d="M32 12V5m-9 0h18m10 8 6 6M32 21v15l12 7"/></symbol>
<symbol id="eye" viewBox="0 0 64 64"><path d="M3 32s11-18 29-18 29 18 29 18-11 18-29 18S3 32 3 32z"/><circle cx="32" cy="32" r="9"/></symbol>
<symbol id="check" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="m17 32 10 10 22-23"/></symbol>
<symbol id="queue" viewBox="0 0 64 64"><rect x="4" y="22" width="13" height="22" rx="2"/><rect x="22" y="22" width="13" height="22" rx="2"/><rect x="40" y="22" width="13" height="22" rx="2"/><path d="M60 9v46M3 51h50"/></symbol>
<symbol id="gate" viewBox="0 0 64 64"><path d="M7 57V12h50v45M7 22h50M25 23v34M39 23v34M2 57h60"/></symbol>
<symbol id="key" viewBox="0 0 64 64"><circle cx="21" cy="25" r="13"/><path d="m30 34 24 24m-13-13 7-7m-1 13 7-7"/></symbol>
<symbol id="gear" viewBox="0 0 64 64"><path d="M25 6h14l2 10 9-3 7 12-8 7 8 7-7 12-9-3-2 10H25l-2-10-9 3-7-12 8-7-8-7 7-12 9 3z"/><circle cx="32" cy="32" r="10"/></symbol>
<symbol id="screen" viewBox="0 0 64 64"><rect x="4" y="8" width="56" height="39" rx="5"/><path d="M32 47v10M18 58h28M12 37l10-9 9 5 18-16"/></symbol>
</defs><rect width="1200" height="100%" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" fill="#172338" font-weight="700" text-anchor="start">一个请求，两份证据</text>
<text x="36" y="94" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">按 ① → ② → ③ 读主线，再看 ④a 抓包与 ④b 回应两条分支。</text>
<rect x="40" y="185" width="290" height="175" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#server" x="58" y="203" width="58" height="58" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="128" y="238" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">X2522 网卡</text>
<text x="62" y="290" font-size="23" fill="#172338" font-weight="400" text-anchor="start">收到 ICMP 请求</text>
<text x="62" y="325" font-size="23" fill="#172338" font-weight="400" text-anchor="start">目的主机是 .2</text>
<rect x="455" y="185" width="290" height="175" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#ram" x="473" y="203" width="58" height="58" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="543" y="238" font-size="26" fill="#15803d" font-weight="700" text-anchor="start">RAM 缓冲区</text>
<text x="477" y="290" font-size="23" fill="#172338" font-weight="400" text-anchor="start">驱动预先登记地址</text>
<text x="477" y="325" font-size="23" fill="#172338" font-weight="400" text-anchor="start">DMA 把字节写到这里</text>
<rect x="870" y="185" width="290" height="175" rx="15" fill="#fff" stroke="#7e22ce" stroke-width="1.6"/>
<use href="#chip" x="888" y="203" width="58" height="58" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="958" y="238" font-size="26" fill="#7e22ce" font-weight="700" text-anchor="start">CPU / 驱动</text>
<text x="892" y="290" font-size="23" fill="#172338" font-weight="400" text-anchor="start">NAPI 批量处理</text>
<text x="892" y="325" font-size="23" fill="#172338" font-weight="400" text-anchor="start">读取已经收到的帧</text>
<path d="M342,275 L431.00,275.00" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-blue)"/>
<text x="347" y="245" font-size="23" fill="#2563eb" font-weight="400" text-anchor="start">① DMA</text>
<path d="M757,275 L846.00,275.00" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-green)"/>
<text x="759" y="245" font-size="23" fill="#15803d" font-weight="400" text-anchor="start">③ 读取</text>
<path d="M185,173 L185,139 L1015,139 L1015.0,161.0" fill="none" stroke="#c76a08" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arr-orange)" stroke-dasharray="7 5"/>
<text x="380" y="130" font-size="23" fill="#c76a08" font-weight="400" text-anchor="start">② 中断通知：请安排收包处理</text>
<rect x="290" y="490" width="380" height="172" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#file" x="308" y="508" width="58" height="58" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="378" y="543" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">tcpdump 留副本</text>
<text x="312" y="595" font-size="23" fill="#172338" font-weight="400" text-anchor="start">pcap 中找到三条请求</text>
<text x="312" y="630" font-size="23" fill="#172338" font-weight="400" text-anchor="start">证明到达指定数据口</text>
<rect x="780" y="490" width="380" height="172" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#packet" x="798" y="508" width="58" height="58" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="868" y="543" font-size="26" fill="#15803d" font-weight="700" text-anchor="start">内核处理 ICMP</text>
<text x="802" y="595" font-size="23" fill="#172338" font-weight="400" text-anchor="start">产生回应，沿发送路径回去</text>
<text x="802" y="630" font-size="23" fill="#172338" font-weight="400" text-anchor="start">发送端看到 3 received</text>
<path d="M930,372 L930,415 L480,415 L480.0,466.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="477" y="403" font-size="23" fill="#2563eb" font-weight="400" text-anchor="start">④a 复制给抓包工具</text>
<path d="M1060,372 L1060.00,466.00" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-green)"/>
<text x="808" y="458" font-size="23" fill="#15803d" font-weight="400" text-anchor="start">④b 继续协议处理</text>
<text x="36" y="710" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">④a 与 ④b 是两条处理分支；内核生成回应无需等待抓包工具保存完成。</text>
</g></svg>