<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380" role="img" aria-labelledby="title desc"><title id="title">09 · 时间戳和监测支线放在哪里</title><desc id="desc">客户侧测量设计；TAP 直通光纤承载业务，采集卡从分光副本产生 t1</desc><defs>
<marker id="ink" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#172b4d"/></marker>
<marker id="muted" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#52647b"/></marker>
<marker id="tcp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="udp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#b66a0b"/></marker>
<marker id="ctl" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#7e22ce"/></marker>
<marker id="wire" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<marker id="green" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#15803d"/></marker>
</defs><rect width="1200" height="100%" fill="white"/>
<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">09 · 时间戳和监测支线放在哪里</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#52647b" text-anchor="start">客户侧测量设计；TAP 直通光纤承载业务，采集卡从分光副本产生 t1</text>
<rect x="36" y="125" width="1128" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">业务路径与两个测点 · 采集卡位于旁路，NIC 位于接收主机</text>
<rect x="65" y="205" width="260" height="135" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="195.0" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">入口光纤 TAP</text>
<text x="195.0" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">直通口：业务光路</text>
<text x="195.0" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">监测口：分光副本</text>
<rect x="470" y="205" width="260" height="135" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="600.0" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">转发交换机</text>
<text x="600.0" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">转发 / 排队</text>
<text x="600.0" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">业务出口</text>
<rect x="875" y="205" width="260" height="135" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="1005.0" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">交易主机 NIC</text>
<text x="1005.0" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">硬件 RX 时间戳</text>
<text x="1005.0" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">测点 t2</text>
<polyline points="337,270 446.0,270.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<polyline points="742,270 851.0,270.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<rect x="65" y="405" width="300" height="110" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="215.0" y="442" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">硬件采集卡</text>
<text x="215.0" y="481" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">副本时间戳 t1</text>
<polyline points="195,352 195.0,381.0" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#green)" stroke-dasharray="8 6"/>
<text x="430" y="451" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">t2 − t1 包含传输、排队与时钟误差</text>
<text x="430" y="495" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">测量前校准 TAP 分支 / 采集路径差异。</text>
<rect x="36" y="575" width="1128" height="305" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="612" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">时间分发支线 · 图示采用 Boundary Clock（BC）</text>
<rect x="65" y="655" width="260" height="135" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="195.0" y="692" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">PTP Grandmaster</text>
<text x="195.0" y="731" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">提供时间基准</text>
<rect x="470" y="655" width="260" height="135" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="600.0" y="692" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">时间交换机 · BC</text>
<text x="600.0" y="731" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">上游同步</text>
<text x="600.0" y="771" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">下游分发时间</text>
<rect x="875" y="655" width="260" height="135" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="1005.0" y="692" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">测点硬件时钟</text>
<text x="1005.0" y="731" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">采集卡 / NIC PHC</text>
<text x="1005.0" y="771" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">分别同步并记录偏差</text>
<polyline points="337,720 446.0,720.0" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ctl)" stroke-dasharray="8 6"/>
<polyline points="742,720 851.0,720.0" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ctl)" stroke-dasharray="8 6"/>
<text x="600" y="845" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">TC：将驻留时间计入 PTP correctionField；不消除业务排队。</text>
<rect x="36" y="910" width="1128" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="947" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">交换机观察支线 · 展开上方同一台业务交换机的监测出口</text>
<rect x="65" y="990" width="350" height="135" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="240.0" y="1027" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">业务交换机 · 监测出口</text>
<text x="240.0" y="1066" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">SPAN 包副本</text>
<text x="240.0" y="1106" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">LANZ 队列事件</text>
<rect x="760" y="990" width="375" height="135" rx="12" fill="white" stroke="#15803d" stroke-width="2"/>
<text x="947.5" y="1027" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">抓包与队列分析器</text>
<text x="947.5" y="1066" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">核对采集口丢弃</text>
<text x="947.5" y="1106" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">管理网取日志 / 指标</text>
<polyline points="427,1055 736.0,1055.0" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#green)" stroke-dasharray="8 6"/>
<text x="590" y="1030" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#15803d" text-anchor="middle">独立采集支线</text>
<rect x="36" y="1210" width="1128" height="133" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="1246" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">SPAN 超订阅时，采集缺包不直接证明业务口丢包；TAP 分支也须计入光预算。</text>
<text x="54" y="1281" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">PHC 是网卡硬件时钟；硬件能力、PTP 锁定与时延测量精度分别验证。</text>
<text x="54" y="1316" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">测点只有产生并校准时间戳后才能相减；物理交付口自身不提供 t1。</text>
</svg>
