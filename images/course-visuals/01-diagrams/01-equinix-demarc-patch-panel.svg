<rect x="802" y="132" width="362" height="230" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text class="label" x="827" y="178">部署位置</text>
<text class="note" x="827" y="222">交付架靠近客户围隔区</text>
<text class="note" x="827" y="262">入口；走线架把它连到</text>
<text class="note" x="827" y="302">首个客户机柜。</text>
<rect x="802" y="386" width="362" height="310" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text class="label" x="827" y="433">交付与跳接责任</text>
<text class="note" x="827" y="478">配线面板承接交付分界</text>
<text class="note" x="827" y="515">（Demarc）。</text>
<text class="note" x="827" y="563">面板到自有设备的跳接，</text>
<text class="note" x="827" y="603">由客户负责，</text>
<text class="note" x="827" y="643">也可付费请机房代接。</text>
<text class="note" x="42" y="738">线色沿用原图区分线束，不表示责任归属；具体交付端口以订单为准。</text>
<text class="sub" x="42" y="773">来源：Equinix Product Documentation · Demarcations（2026-09-11 核对）</text>
