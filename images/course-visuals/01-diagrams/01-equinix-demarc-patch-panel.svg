<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">机柜旁的交付分界：配线架与跳接</title>
<desc id="desc">根据 Equinix 官方 2-post demarcation rack 原图中文重绘。保留客户机柜、顶部走线架、独立双柱配线架及两块面板。红色线束经顶部走线架，在上层面板左后侧被遮挡；下层面板没有可见接线。蓝色按原图保留上层面板前侧线环和右侧向上延伸的可见片段，未补画面板后的连接。线色仅沿用原图区分线束，不表示责任归属或线路方向。旁注依据官方页面说明部署位置及客户跳接责任。未添加交换机、服务器网口、远端设备或 LOA 线路节点。</desc>
