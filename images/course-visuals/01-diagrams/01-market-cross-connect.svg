<text x="750.0" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">对方配线架 A</text>
<text x="750.0" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">LOA 指定端口</text>
<rect x="960" y="202" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="1050.0" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">服务商设备 A</text>
<text x="1050.0" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">交付光口 A</text>
