<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">03 · 机房跳线接到哪里</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#52647b" text-anchor="start">Equinix 交付规则 + Lime 公开服务；机柜和端口名称为教学示意</text>
<rect x="36" y="122" width="1128" height="435" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="159" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">物理接线 · 一行是一条完整电路；实线无箭头，表示双向光链路</text>
<rect x="60" y="202" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="150.0" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户 Edge-A</text>
<text x="150.0" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">业务光口 A</text>
<rect x="360" y="202" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="450.0" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">本方配线架 A</text>
<text x="450.0" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">DMARC / 芯对 A</text>
