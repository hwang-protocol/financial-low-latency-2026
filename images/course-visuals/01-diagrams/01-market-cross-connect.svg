<rect x="360" y="397" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="450.0" y="434" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">本方配线架 B</text>
<text x="450.0" y="473" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">DMARC / 芯对 B</text>
<rect x="660" y="397" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="750.0" y="434" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">对方配线架 B</text>
<text x="750.0" y="473" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">LOA 指定端口</text>
<rect x="960" y="397" width="180" height="114" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="1050.0" y="434" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">服务商设备 B</text>
<text x="1050.0" y="473" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">交付光口 B</text>
<polyline points="240,457 360,457" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt"/>
<polyline points="540,457 660,457" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt"/>
<polyline points="840,457 960,457" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt"/>
<text x="300" y="547" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">本方跳纤</text>
<text x="600" y="547" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">Cross Connect</text>
<text x="900" y="547" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#172b4d" text-anchor="middle">对方跳纤</text>
<rect x="36" y="586" width="1128" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="623" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">选择对方交付点 · 两项连接分别申请，不在图上虚构 Lime 的市场上联</text>
<rect x="60" y="650" width="300" height="132" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="687" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户订单口</text>
<text x="210.0" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">1G / 10G 跳接</text>
<text x="210.0" y="766" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">服务端会话参数</text>
<rect x="780" y="650" width="360" height="132" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="960.0" y="687" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">Lime 接入服务</text>
<text x="960.0" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">客户设备 → Lime</text>
<text x="960.0" y="766" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">Lime 再提供市场接入</text>
<polyline points="372,715 756.0,715.0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#tcp)"/>
<text x="570" y="694" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="middle">订单 TCP</text>
<text x="60" y="822" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">PITCH 直连：另选 Cboe 的获准交付口，按市场接入流程办理。</text>
<rect x="36" y="876" width="1128" height="133" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="912" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">DMARC = 交付分界点；面板到自有设备的延伸跳纤仍须安排。</text>
<text x="54" y="947" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">A/B 两条电路各自核对 LOA、芯对、Tx/Rx、光功率与电路编号。</text>
<text x="54" y="982" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">同一 IBX 内两条 Cross Connect 不保证路由分离；冗余需核实共同故障点。</text>
</svg>
