<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1810" viewBox="0 0 1200 1810" role="img" aria-labelledby="title desc">
<title id="title">Cboe NY5：单播、组播和观测支路</title>
<desc id="desc">中文重绘 Cboe 官方 NY5 Expanded View。保留客户光纤盘、四层交换机、订单网关、内部交换机、撮合系统、行情服务器、行情数据生成与 TAP 观测分支的关系及方向。单播红色双向，组播蓝色向客户，行情生成路径绿色，观测副本橙色。TAP 仅提取副本，时间戳实现另见第六章。</desc>
<defs>
