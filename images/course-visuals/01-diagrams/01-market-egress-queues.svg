<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc"><title id="title">08 · 微突发堵在哪个出口</title><desc id="desc">容量计算为教学算例；cut-through、LANZ 能力依据 Arista 7150S 官方说明</desc><defs>
<marker id="ink" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#172b4d"/></marker>
<marker id="muted" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#52647b"/></marker>
<marker id="tcp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="udp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#b66a0b"/></marker>
<marker id="ctl" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#7e22ce"/></marker>
<marker id="wire" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<marker id="green" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#15803d"/></marker>
</defs><rect width="1200" height="100%" fill="white"/>
<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">08 · 微突发堵在哪个出口</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#52647b" text-anchor="start">容量计算为教学算例；cut-through、LANZ 能力依据 Arista 7150S 官方说明</text>
<rect x="36" y="125" width="1128" height="490" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">客户行情汇聚点 · 两路同时到达一个接收端口</text>
<rect x="65" y="205" width="260" height="110" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="195.0" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">行情入口 A</text>
<text x="195.0" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">10 Gbit/s</text>
<rect x="65" y="435" width="260" height="110" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="195.0" y="472" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">行情入口 B</text>
<text x="195.0" y="511" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">10 Gbit/s</text>
<rect x="475" y="280" width="310" height="210" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="630.0" y="317" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">汇聚交换机</text>
<text x="630.0" y="356" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">接收 / 复制</text>
<text x="630.0" y="396" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">出口队列 Q</text>
<text x="630.0" y="436" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">调度 → 发往 NIC</text>
<rect x="900" y="310" width="235" height="145" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="1017.5" y="347" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">行情服务器</text>
<text x="1017.5" y="386" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">10 Gbit/s NIC</text>
<text x="1017.5" y="426" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">收包 / 解析</text>
<polyline points="337,255 400,255 400,335 451.0,335.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<polyline points="337,485 400,485 400,430 451.0,430.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<polyline points="797,385 876.0,385.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<text x="630" y="590" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">竞争发生在同一个出口；A/B 合并在收包之后才减少副本。</text>
<rect x="36" y="645" width="1128" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="682" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">估算队列 · 忽略线速开销，假设 20G 输入持续 1ms、10G 输出持续服务</text>
<text x="66" y="725" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172b4d" text-anchor="start">积压 ≈ (20 − 10) Gbit/s × 1 ms ÷ 8 = 1.25 MB</text>
<text x="66" y="780" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172b4d" text-anchor="start">队尾新增等待 ≈ 1.25 MB × 8 ÷ 10 Gbit/s = 1 ms</text>
<text x="66" y="842" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">缓冲不足 → 丢包；缓冲够大 → 仍可能带着过时行情继续排队。</text>
<rect x="36" y="947" width="1128" height="168" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="983" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">位置：在汇聚出口核对峰值、队列占用与丢弃；LANZ 可观察短时队列事件。</text>
<text x="54" y="1018" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">cut-through 减少开始转发前的等待；出口忙时仍要排队。</text>
<text x="54" y="1053" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">QoS 作用于竞争的出口；端口隔离、提升出口容量需按实际流向设计。</text>
<text x="54" y="1088" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">全双工收、发带宽独立，不能把入站行情直接当作挤占出站订单带宽。</text>
</svg>
