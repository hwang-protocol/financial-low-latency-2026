<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">深交所交易系统接入架构</title>
<desc id="desc">依据深圳证券交易所《交易系统接口规范开发指南》Ver1.09（封面2026年4月，官网2026年5月19日发布）图2-1忠实重绘。保留市场参与者、集中交易系统/行情系统、委托、回报、行情、静态交易参考信息、接口规范、交易网关TGW、行情网关MDGW、文件网关FxClient、交易通信网、交易所和交易系统的分组与连接。原图无箭头，本图不新增方向、协议、运营商、客户量化机构或物理网络设备。来源：https://docs.static.szse.cn/www/marketServices/technicalservice/guide/P020260519353303152094.pdf；PDF第6页、正文第1页。原件SHA256：6ccb48e39ab379af1fe8eb781cbe20cb85354db95e8ada2f2e0e5132c4b51725。</desc>
<defs>
<symbol id="icon-server" viewBox="0 0 64 68">
 <rect x="9" y="5" width="46" height="58" rx="6" fill="#e8eef8" stroke="#38628b" stroke-width="2"/>
 <g fill="#fff" stroke="#38628b" stroke-width="1.5"><rect x="15" y="12" width="34" height="12" rx="2"/><rect x="15" y="28" width="34" height="12" rx="2"/><rect x="15" y="44" width="34" height="12" rx="2"/></g>
 <g fill="#0284c7"><circle cx="21" cy="18" r="2"/><circle cx="21" cy="34" r="2"/><circle cx="21" cy="50" r="2"/></g>
 <g stroke="#64748b" stroke-width="2"><path d="M29 18H43 M29 34H43 M29 50H43"/></g>
</symbol>
<symbol id="icon-server-bank" viewBox="0 0 110 80">
 <use href="#icon-server" x="0" y="0" width="64" height="68"/>
 <use href="#icon-server" x="24" y="6" width="64" height="68"/>
 <use href="#icon-server" x="48" y="12" width="64" height="68"/>
</symbol>
</defs>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#172338">
<rect width="1200" height="760" fill="#f7f9fc"/>
<text x="40" y="56" font-size="34" font-weight="700">深交所交易系统接入架构</text>
<text x="40" y="99" font-size="25" fill="#64748b">按深交所官方图重绘 · 市场参与者与交易所的连接关系</text>
<g id="group-participant" data-source-label="市场参与者">
 <rect x="30" y="135" width="670" height="555" rx="16" fill="#eaf2ff" stroke="#93b5d6" stroke-width="2"/>
 <text x="55" y="184" font-size="28" font-weight="650" fill="#215982">市场参与者</text>
 <g id="group-client-system" data-source-label="集中交易系统/行情系统">
  <rect x="55" y="215" width="282" height="455" rx="13" fill="#fff" stroke="#aabed1" stroke-width="1.8"/>
  <use href="#icon-server-bank" x="76" y="241" width="60" height="58"/>
  <text x="145" y="263" font-size="24" font-weight="650">集中交易系统</text>
  <text x="145" y="297" font-size="24" font-weight="650">/ 行情系统</text>
  <g id="node-order" data-source-label="委托"><rect x="80" y="335" width="225" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="192.5" y="364" font-size="25" text-anchor="middle">委托</text></g>
  <g id="node-report" data-source-label="回报"><rect x="80" y="390" width="225" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="192.5" y="419" font-size="25" text-anchor="middle">回报</text></g>
  <g id="node-quote" data-source-label="行情"><rect x="80" y="469" width="225" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="192.5" y="498" font-size="25" text-anchor="middle">行情</text></g>
  <g id="node-reference" data-source-label="静态交易参考信息"><rect x="80" y="599" width="225" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="192.5" y="628" font-size="24" text-anchor="middle">静态交易参考信息</text></g>
 </g>
 <g id="boundary-interface" data-source-label="接口规范">
  <rect x="374" y="215" width="49" height="455" rx="4" fill="none" stroke="#8da2b7" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="398.5" y="529" text-anchor="middle" font-size="24" fill="#64748b"><tspan x="398.5" dy="0">接</tspan><tspan x="398.5" dy="27">口</tspan><tspan x="398.5" dy="27">规</tspan><tspan x="398.5" dy="27">范</tspan></text>
 </g>
 <g id="node-tgw" data-source-label="交易网关TGW">
  <rect x="468" y="309" width="210" height="102" rx="13" fill="#fff" stroke="#aabed1" stroke-width="1.8"/>
  <use href="#icon-server" x="480" y="329" width="58" height="62"/>
  <text x="549" y="351" font-size="25" font-weight="650">交易网关</text><text x="549" y="385" font-size="24" fill="#64748b">TGW</text>
 </g>
 <g id="node-mdgw" data-source-label="行情网关MDGW">
  <rect x="468" y="439" width="210" height="102" rx="13" fill="#fff" stroke="#aabed1" stroke-width="1.8"/>
  <use href="#icon-server" x="480" y="459" width="58" height="62"/>
  <text x="549" y="481" font-size="25" font-weight="650">行情网关</text><text x="549" y="515" font-size="24" fill="#64748b">MDGW</text>
 </g>
 <g id="node-fxclient" data-source-label="文件网关FxClient">
  <rect x="468" y="569" width="210" height="102" rx="13" fill="#fff" stroke="#aabed1" stroke-width="1.8"/>
  <use href="#icon-server" x="480" y="589" width="58" height="62"/>
  <text x="549" y="611" font-size="25" font-weight="650">文件网关</text><text x="549" y="645" font-size="24" fill="#64748b">FxClient</text>
 </g>
</g>
<g id="group-exchange" data-source-label="交易所">
 <rect x="950" y="135" width="220" height="555" rx="16" fill="#f0f9f7" stroke="#94b9af" stroke-width="2"/>
 <text x="1060" y="184" font-size="28" font-weight="650" fill="#216557" text-anchor="middle">交易所</text>
 <g id="node-exchange-system" data-source-label="交易系统">
  <rect x="976" y="407" width="168" height="168" rx="13" fill="#fff" stroke="#aabed1" stroke-width="1.8"/>
  <use href="#icon-server-bank" x="1005" y="432" width="110" height="80"/>
  <text x="1060" y="554" font-size="26" font-weight="650" text-anchor="middle">交易系统</text>
 </g>
</g>
