<g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round">
 <path id="edge-order-tgw" data-source-edge="委托—交易网关TGW" d="M305 356 L468 344"/>
 <path id="edge-report-tgw" data-source-edge="回报—交易网关TGW" d="M305 411 L468 378"/>
 <path id="edge-quote-mdgw" data-source-edge="行情—行情网关MDGW" d="M305 490 H468"/>
 <path id="edge-reference-fxclient" data-source-edge="静态交易参考信息—文件网关FxClient" d="M305 620 H468"/>
</g>
<g fill="none" stroke="#b18a27" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round">
 <path id="edge-tgw-network" data-source-edge="交易网关TGW—交易通信网" d="M678 360 L720 398 L704 411 L773 448"/>
 <path id="edge-mdgw-network" data-source-edge="行情网关MDGW—交易通信网" d="M678 490 L707 481 L705 497 L750 490"/>
 <path id="edge-fxclient-network" data-source-edge="文件网关FxClient—交易通信网" d="M678 620 L719 582 L726 596 L784 533"/>
 <path id="edge-network-exchange" data-source-edge="交易通信网—交易系统" d="M939 489 H976"/>
</g>
<g id="node-network" data-source-label="交易通信网">
 <path d="M780 445 C780 422 804 413 820 426 C835 403 873 408 883 428 C908 421 929 437 925 458 C944 472 942 500 923 512 C932 538 911 556 889 551 C872 568 844 563 834 550 C809 564 785 550 784 533 C760 535 746 516 753 495 C738 477 752 450 780 445Z" fill="#e4f0fb" stroke="#38628b" stroke-width="2"/>
 <text x="842" y="496" font-size="25" font-weight="650" fill="#215982" text-anchor="middle">交易通信网</text>
</g>
<text x="40" y="733" font-size="24" fill="#64748b">据深交所 Ver1.09 图 2-1 重绘；连线表示连接关系。</text>
