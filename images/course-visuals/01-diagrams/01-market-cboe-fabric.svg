<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc"><title id="title">04 · Cboe NY5：BZX 股票的四层网络与业务出口</title><desc id="desc">按 Cboe Connectivity Manual 10.4.29、NY5 Expanded View 和四层设备表重绘。成组设备数量与层间职责来自公开资料；层间连线不指定未公开的逐端口矩阵。订单 TCP 到 BOE/FIX Gateway；内部单播连接撮合。Feed Servers 经 ToR 与三层网络向客户发送行情。DC Core 与 Environment Core 之间 optical TAP 将副本送往汇聚交换机，由汇聚交换机加时间戳并通过 PTP 同步。</desc><defs>
<marker id="a-blue" viewBox="0 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#2563eb"/></marker>
<marker id="a-orange" viewBox="0 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#b66a0b"/></marker>
<marker id="a-purple" viewBox="0 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#7e22ce"/></marker>
<marker id="a-gray" viewBox="0 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#64748b"/></marker>
<marker id="a-green" viewBox="0 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#15803d"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:24px;fill:#172338}.head{font-size:32px;font-weight:700}.bold{font-weight:700}.muted{fill:#64748b}.flow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}.small{font-size:24px}</style></defs>
