<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc"><title id="title">05 · 组播在客户网络里怎样分发</title><desc id="desc">以 Cboe BZX ZA 接入为背景；客户内部 R1 / R2 / VLAN-M 均为教学设计</desc><defs>
<marker id="ink" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#172b4d"/></marker>
<marker id="muted" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#52647b"/></marker>
<marker id="tcp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="udp" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#b66a0b"/></marker>
<marker id="ctl" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#7e22ce"/></marker>
<marker id="wire" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<marker id="green" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#15803d"/></marker>
</defs><rect width="1200" height="100%" fill="white"/>
<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">05 · 组播在客户网络里怎样分发</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#52647b" text-anchor="start">以 Cboe BZX ZA 接入为背景；客户内部 R1 / R2 / VLAN-M 均为教学设计</text>
<rect x="36" y="125" width="1128" height="680" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">橙色：UDP 行情流向；紫色虚线：建立和维护分发状态的控制报文</text>
<rect x="70" y="195" width="270" height="138" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="205.0" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">Cboe 接入侧</text>
<text x="205.0" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">发布源前缀 / RP</text>
<text x="205.0" y="311" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">实时组与补包组</text>
<rect x="455" y="195" width="270" height="138" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="590.0" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户边界 R1</text>
<text x="590.0" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">BGP / 前缀策略 / ACL</text>
<text x="590.0" y="311" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">组播交付协议待确认</text>
<rect x="840" y="195" width="290" height="138" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="985.0" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">客户内网 R2</text>
<text x="985.0" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">三层组播 / RPF</text>
<text x="985.0" y="311" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">下联：IGMP 查询</text>
<polyline points="352,270 431.0,270.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<polyline points="737,270 816.0,270.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<polyline points="455,230 352,230" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" stroke-dasharray="8 6"/>
<polyline points="890,345 890,370 590,370 590.0,357.0" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ctl)" stroke-dasharray="8 6"/>
<text x="785" y="410" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#7e22ce" text-anchor="middle">PIM Join → 上游</text>
<rect x="840" y="505" width="290" height="140" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="985.0" y="542" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">行情接入交换机</text>
<text x="985.0" y="581" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">VLAN-M / snooping</text>
<text x="985.0" y="621" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">上联口与成员口表</text>
<polyline points="985,345 985.0,481.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<text x="720" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#b66a0b" text-anchor="start">UDP 下行</text>
<rect x="70" y="525" width="300" height="120" rx="12" fill="white" stroke="#b66a0b" stroke-width="2"/>
<text x="220.0" y="562" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">行情服务器 H1</text>
<text x="220.0" y="601" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">数据 NIC · 已入组</text>
<rect x="70" y="685" width="300" height="90" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="220.0" y="722" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">服务器 H2</text>
<text x="220.0" y="761" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">未订阅此组</text>
<polyline points="828,572 394.0,572.0" fill="none" stroke="#b66a0b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#udp)"/>
<text x="600" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#b66a0b" text-anchor="middle">UDP → H1 数据口</text>
<polyline points="382,626 816.0,626.0" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ctl)" stroke-dasharray="8 6"/>
<polyline points="935,493 935.0,357.0" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ctl)" stroke-dasharray="8 6"/>
<text x="580" y="664" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#7e22ce" text-anchor="middle">H1 的 IGMP Report → R2</text>
<polyline points="910,645 910,730 370,730" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-dasharray="8 6"/>
<text x="600" y="717" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="middle">此分支不转发该组</text>
<rect x="36" y="840" width="1128" height="295" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="877" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">逐层查表 · 一个状态不能替代另一个状态</text>
<rect x="60" y="907" width="330" height="180" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="225.0" y="944" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">① R1 上联</text>
<text x="225.0" y="983" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">邻居 / 路由前缀</text>
<text x="225.0" y="1023" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">上游订阅、组流量</text>
<rect x="435" y="907" width="330" height="180" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="600.0" y="944" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">② R2 路由表</text>
<text x="600.0" y="983" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">(*,G) 或 (S,G)</text>
<text x="600.0" y="1023" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">RPF 入接口 / OIL</text>
<rect x="810" y="907" width="330" height="180" rx="12" fill="white" stroke="#7e22ce" stroke-width="2"/>
<text x="975.0" y="944" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">③ 交换机与 H1</text>
<text x="975.0" y="983" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">成员口 / router-port</text>
<text x="975.0" y="1023" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">NIC 收包 / 应用序号</text>
<rect x="36" y="1160" width="1128" height="133" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="1196" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">R1 / R2 若合为一台设备，就省去图中的内部 PIM 跳段。</text>
<text x="54" y="1231" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">上联若用 IGMP，须另配订阅；内部 PIM Join 不会自动变成 IGMP。</text>
<text x="54" y="1266" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">OIL 是组播出接口列表；UDP 端口由 ACL / 应用匹配，不属于 (S,G)。</text>
</svg>
