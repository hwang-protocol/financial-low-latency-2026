</defs><rect width="1200" height="100%" fill="white"/>
<text x="36" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#172b4d" text-anchor="start">01 · 国内接入：局域 A/B 与广域电路怎样分开</text>
<text x="36" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="start">上交所接入指引 + 上交所技术产品页；设备分组和连线布局为教学示意</text>
<rect x="36" y="125" width="1128" height="452" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="162" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">局域交付 · 机构在上交所数据中心使用交易局域接入</text>
<rect x="65" y="195" width="380" height="327" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="255.0" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">机构托管运行中心</text>
<text x="255.0" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">报盘 / 交易接入终端</text>
<rect x="265" y="300" width="180" height="60" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="355.0" y="338.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="middle">业务口 A</text>
