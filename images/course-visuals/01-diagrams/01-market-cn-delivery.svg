<rect x="65" y="887" width="290" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="210.0" y="924" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">运行中心乙</text>
<rect x="195" y="952" width="160" height="40" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="980.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="middle">交易端口</text>
<rect x="195" y="1004" width="160" height="40" rx="12" fill="#ffffff" stroke="#b66a0b" stroke-width="2"/>
<text x="275.0" y="1032.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#b66a0b" text-anchor="middle">行情端口</text>
<rect x="460" y="887" width="310" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="615.0" y="924" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">运营商乙</text>
