<text x="1010.0" y="924" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">上交所站点 B</text>
<rect x="890" y="952" width="115" height="40" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="947.5" y="980.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="middle">交易口</text>
