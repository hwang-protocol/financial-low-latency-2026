<text x="965.0" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">局域接入网络</text>
<rect x="800" y="398" width="330" height="118" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="965.0" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">上交所站点 B</text>
<text x="965.0" y="471" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">局域接入网络</text>
<polyline points="445,330 800,330" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<polyline points="445,455 800,455" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/>
<text x="622" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2563eb" text-anchor="middle">A 路局域网</text>
<text x="622" y="432" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2563eb" text-anchor="middle">B 路局域网</text>
<text x="600" y="556" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="middle">A/B 双路双活；该产品无需用户额外增加路由器互联。</text>
<rect x="36" y="607" width="1128" height="462" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="56" y="644" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="start">广域交付 · 灰线各代表一条独立业务电路；两中心互为备份</text>
<rect x="65" y="680" width="290" height="160" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="210.0" y="717" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#172b4d" text-anchor="middle">运行中心甲</text>
<rect x="195" y="745" width="160" height="40" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="773.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2563eb" text-anchor="middle">交易端口</text>
