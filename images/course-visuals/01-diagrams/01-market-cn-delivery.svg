<text x="615" y="1025" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#b66a0b" text-anchor="middle">独立 UDP 行情电路</text>
<polyline points="175,840 175,887" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="330" y="873" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#52647b" text-anchor="middle">中心互备</text>
<rect x="36" y="1090" width="1128" height="203" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="54" y="1126" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">官方要求：至少两个互备运行中心；不同运营商接入同城两个站点。</text>
<text x="54" y="1161" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">此图示意故障域与独立电路，不规定每中心的线路数量或全部连接组合。</text>
<text x="54" y="1196" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">UDP 行情使用独立业务线路；已具备规定线路时，交易线可承载备用 TCP 行情。</text>
<text x="54" y="1231" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">上交所通信网须与机构其他网络隔离；办公室管理不能直通市场专网。</text>
<text x="54" y="1266" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#172b4d" text-anchor="start">网络 A/B 冗余不表示订单双发；实际型号、端口编号与私网地址均未披露。</text>
</svg>
