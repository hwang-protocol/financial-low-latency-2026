<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">从收货口到主厨：网卡、PCIe 与驱动的分工</title>
<desc id="desc">厨房类比的一台接收主机。主机外的交换机把报文送到数据口。网卡框内标出PCIe设备身份，包括设备地址与型号；PCIe是网卡连接主机的总线。主机内，驱动先准备接收缓冲区，再把设备可访问的地址登记给网卡；紫色虚线表示准备关系。网卡像收货口的自动搬运车，经PCIe用DMA把报文写入主内存，CPU随后读取数据执行处理；绿色实线表示数据方向。驱动也是CPU执行的软件，不是独立硬件。底部把图中对象对应到本章三项检查：接线与接口名、PCIe设备身份、当前驱动。本图是职责示意，省略中断、协议栈、缓存和地址映射细节，不是完整收包流水线或真实机器布局。</desc>
