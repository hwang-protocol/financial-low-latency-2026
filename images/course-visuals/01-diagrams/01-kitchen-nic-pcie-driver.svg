<text id="text-14" x="761" y="631" font-size="27" font-weight="700" fill="#786a9f" text-anchor="middle">存货区</text>
<text id="text-15" x="761" y="670" font-size="22" font-weight="500" fill="#786a9f" text-anchor="middle">主内存 / 接收缓冲区</text>
