<text id="text-6" x="652" y="298" font-size="21" font-weight="500" fill="#744991" text-anchor="start">先备空间，再登记位置</text>
<text id="text-7" x="652" y="337" font-size="21" font-weight="500" fill="#8b73a0" text-anchor="start">由 CPU 执行的软件</text>
<rect id="network" x="32" y="420" width="180" height="280" rx="16" fill="#f0f5fb" stroke="#b9cce0" stroke-width="2"/>
