<text id="text-29" x="914" y="928" font-size="24" font-weight="600" fill="#805599" text-anchor="start">当前驱动</text>
<text id="text-30" x="36" y="1008" font-size="23" font-weight="500" fill="#64748b" text-anchor="start">网卡把报文写入内存后，后续处理仍由 CPU 执行。</text>
