<text id="text-10" x="122" y="670" font-size="22" font-weight="500" fill="#527391" text-anchor="middle">同一 VLAN</text>
<text id="text-11" x="393" y="631" font-size="23" font-weight="700" fill="#327e67" text-anchor="middle">收货口与搬运设备</text>
<text id="text-12" x="393" y="670" font-size="23" font-weight="500" fill="#327e67" text-anchor="middle">数据口 / 网卡 NIC</text>
<path d="M295 691H491" stroke="#d1e5dd" stroke-width="2"/>
