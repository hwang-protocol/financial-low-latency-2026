<text id="text-1" x="36" y="52" font-size="32" font-weight="750" fill="#20364a" text-anchor="start">从收货口到主厨：网卡、PCIe 与驱动的分工</text>
<text id="text-2" x="36" y="94" font-size="24" font-weight="500" fill="#64748b" text-anchor="start">先备好存放位置，再由网卡搬运，最后由 CPU 读取和处理。</text>
<rect id="host" x="240" y="145" width="936" height="657" rx="22" fill="#ffffff" stroke="#d5e0eb" stroke-width="2"/>
<text id="text-3" x="267" y="189" font-size="27" font-weight="700" fill="#3d647e" text-anchor="start">一台接收主机</text>
<text id="text-4" x="267" y="232" font-size="22" font-weight="500" fill="#8194a5" text-anchor="start">厨房里的设备与分工</text>
