<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc">
<title id="title">同一个网口，六种身份信息</title><desc id="desc">以 .1 Exchange 的数据口为例；硬件位置和编号、软件驱动和接口名、MAC和IP都对应同一个网卡功能单元。连线表示身份对应，不表示先后。</desc>
