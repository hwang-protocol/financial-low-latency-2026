<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Equinix 数据中心内的物理跳接</title>
  <desc id="desc">依据 Equinix Standard Cross Connects 官方原图中文重绘。同一个 IBX 数据中心内，客户 A 设备与客户 Z 设备通过一条无向物理连接相连。保留原图两个通用客户身份和唯一连接；机柜图标仅作视觉表现，不表示实际设备数量、型号或端口。来源：https://docs.equinix.com/cross-connect/ 。</desc>
  <defs>
    <linearGradient id="cabinet-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7edf4"/>
    </linearGradient>
    <linearGradient id="server-face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <g id="cabinet" fill="none" stroke-linejoin="round">
      <path d="M0 16 L16 0 H178 L194 16" fill="#d5dee9" stroke="#64748b" stroke-width="2"/>
      <rect x="0" y="16" width="194" height="190" rx="10" fill="url(#cabinet-face)" stroke="#64748b" stroke-width="2"/>
      <rect x="15" y="33" width="164" height="45" rx="5" fill="url(#server-face)" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="15" y="89" width="164" height="45" rx="5" fill="url(#server-face)" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="15" y="145" width="164" height="45" rx="5" fill="url(#server-face)" stroke="#94a3b8" stroke-width="1.5"/>
      <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
        <path d="M31 49 H79 M31 61 H79 M31 105 H79 M31 117 H79 M31 161 H79 M31 173 H79"/>
      </g>
      <g fill="#64748b">
        <circle cx="143" cy="55.5" r="4"/>
        <circle cx="157" cy="55.5" r="4"/>
        <circle cx="143" cy="111.5" r="4"/>
        <circle cx="157" cy="111.5" r="4"/>
        <circle cx="143" cy="167.5" r="4"/>
        <circle cx="157" cy="167.5" r="4"/>
      </g>
    </g>
    <style>
      text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1e293b; font-size:24px; }
      .heading { font-size:32px; font-weight:700; }
      .node-label { font-size:28px; font-weight:700; }
      .muted { fill:#64748b; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <g id="data-center" data-source-container="IBX Data Center">
    <rect x="32" y="26" width="1136" height="436" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="84" class="heading">Equinix 数据中心</text>
    <text x="1134" y="81" text-anchor="end" class="muted">同一机房</text>
    <g id="customer-a" data-source-node="Customer A">
      <text x="229" y="164" text-anchor="middle" class="node-label">客户A设备</text>
      <use href="#cabinet" x="132" y="194"/>
    </g>
    <g id="customer-z" data-source-node="Customer Z">
      <text x="971" y="164" text-anchor="middle" class="node-label">客户Z设备</text>
      <use href="#cabinet" x="874" y="194"/>
    </g>
    <g id="cross-connect" data-source-edge="Customer A--Customer Z" data-directed="false">
      <path id="physical-link" d="M326 296 H874" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="butt"/>
      <text x="600" y="265" text-anchor="middle" font-size="26">机房内物理跳接（Cross Connect）</text>
    </g>
  </g>
  <text x="600" y="502" text-anchor="middle" class="muted">Equinix 官方原图中文重绘 · 保留原图 A / Z 通用客户身份</text>
</svg>
