<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OUCH 5.0 三种消息：Enter Order、Order Accepted、Order Executed</title>
  <desc id="desc">O 带齐 UserRefNum、Side、Quantity、Symbol、Price 与 ClOrdID。A 回相同 UserRefNum 与 ClOrdID，并给出 Order Reference Number 和 Order State。E 回相同 UserRefNum，并给出这一次的 Quantity、Price 与 Match Number。</desc>
  <rect x="18" y="18" width="1164" height="684" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="68" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#475569">OUCH · MESSAGE BODY</text>
  <text x="64" y="110" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#0f172a">三种消息都从 Type 开始，靠 UserRefNum 串成一笔</text>

  <text x="64" y="158" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#6b21a8">O · Enter Order · 47B · client → Exchange</text>
  <rect x="64" y="172" width="80" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="144" y="172" width="160" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="304" y="172" width="80" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="384" y="172" width="120" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="504" y="172" width="110" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="614" y="172" width="90" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="704" y="172" width="56" height="72" rx="10" fill="#ddd6fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="760" y="172" width="160" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Type</text>
  <text x="104" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">O 1B</text>
  <text x="224" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">UserRefNum</text>
  <text x="224" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">4B</text>
  <text x="344" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">Side</text>
  <text x="344" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">1B</text>
  <text x="444" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">Quantity</text>
  <text x="444" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">4B</text>
  <text x="559" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">Symbol</text>
  <text x="559" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">8B</text>
  <text x="659" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">Price</text>
  <text x="659" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">8B</text>
  <text x="732" y="214" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#5b21b6">…</text>
  <text x="840" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#1e3a8a">ClOrdID</text>
  <text x="840" y="226" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#1e40af">14B</text>
  <text x="938" y="214" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">发出这一笔请求</text>

  <text x="64" y="292" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#047857">A · Order Accepted · 64B · Exchange → client</text>
  <rect x="64" y="306" width="80" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="144" y="306" width="130" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="274" y="306" width="160" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="434" y="306" width="56" height="72" rx="10" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/>
  <rect x="490" y="306" width="220" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="710" y="306" width="140" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="850" y="306" width="150" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="104" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Type</text>
  <text x="104" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">A 1B</text>
  <text x="209" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">Timestamp</text>
  <text x="209" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">8B</text>
  <text x="354" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">UserRefNum</text>
  <text x="354" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">4B</text>
  <text x="462" y="348" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#115e59">…</text>
  <text x="600" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="800" fill="#115e59">Order Reference</text>
  <text x="600" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="800" fill="#0f766e">Number 8B</text>
  <text x="780" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="800" fill="#115e59">Order State</text>
  <text x="780" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">1B</text>
  <text x="925" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">ClOrdID</text>
  <text x="925" y="360" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">14B</text>
  <text x="1018" y="348" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">收下了</text>

  <text x="64" y="426" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#0f766e">E · Order Executed · 36B · Exchange → client</text>
  <rect x="64" y="440" width="80" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="144" y="440" width="130" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="274" y="440" width="160" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="434" y="440" width="130" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="564" y="440" width="100" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="664" y="440" width="160" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="824" y="440" width="180" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="104" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Type</text>
  <text x="104" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">E 1B</text>
  <text x="209" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">Timestamp</text>
  <text x="209" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">8B</text>
  <text x="354" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">UserRefNum</text>
  <text x="354" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">4B</text>
  <text x="499" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">Quantity</text>
  <text x="499" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">4B</text>
  <text x="614" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="800" fill="#115e59">Price</text>
  <text x="614" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">8B</text>
  <text x="744" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="800" fill="#115e59">Liquidity Flag</text>
  <text x="744" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">1B</text>
  <text x="914" y="472" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="800" fill="#115e59">Match Number</text>
  <text x="914" y="494" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#0f766e">8B</text>
  <text x="1020" y="482" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">成交了</text>

  <rect x="64" y="548" width="1072" height="124" rx="12" fill="#e2e8f0"/>
  <text x="600" y="586" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#334155">OUCH 的代码字段叫 Symbol；ITCH 的同义字段叫 Stock。图上按各自规格写。</text>
  <text x="600" y="618" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#334155">UserRefNum 把 O / A / E 收成一笔；Order Reference Number 是 Exchange 另发的号。</text>
  <text x="600" y="650" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#334155">A 只证明收下了。E 才带这一次成交的 Quantity、Price 和 Match Number。</text>
</svg>
