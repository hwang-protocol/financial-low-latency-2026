<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mold 信封与 ITCH 内件的三层关系</title>
  <desc id="desc">第一张表是 Mold 20 字节头。第二张图用 Count 决定后面有没有 ITCH。第三张表打开一条 ITCH：共同 11 字节加上按类型变化的 Body。</desc>
  <rect x="18" y="18" width="1164" height="684" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="68" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#475569">LAYER · ENVELOPE THEN LETTER</text>
  <text x="64" y="110" font-family="Arial,'Noto Sans SC',sans-serif" font-size="32" font-weight="800" fill="#0f172a">三张表是一层套一层，不是三种并列格式</text>

  <rect x="64" y="140" width="1072" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="88" y="178" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#1d4ed8">第 1 层 · Mold 20 字节头 · 对应前面的字段表</text>
  <rect x="88" y="196" width="400" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="488" y="196" width="320" height="70" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <rect x="808" y="196" width="120" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="288" y="238" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#1e3a8a">Session 10B</text>
  <text x="648" y="238" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#155e75">Sequence 8B</text>
  <text x="868" y="238" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#92400e">Count 2B</text>
  <text x="980" y="238" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">只负责交付</text>

  <text x="600" y="328" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="800" fill="#0f172a">↓ Count = 1～65534 时才打开信封</text>

  <rect x="64" y="348" width="1072" height="132" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/>
  <text x="88" y="386" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#15803d">第 2 层 · 若干封内件 · 对应上面的包结构图</text>
  <rect x="88" y="404" width="70" height="54" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="158" y="404" width="240" height="54" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <rect x="418" y="404" width="70" height="54" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="488" y="404" width="240" height="54" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="123" y="438" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="800" fill="#14532d">Len</text>
  <text x="278" y="438" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#14532d">ITCH 消息</text>
  <text x="453" y="438" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="800" fill="#14532d">Len</text>
  <text x="608" y="438" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#14532d">ITCH 消息</text>
  <text x="780" y="438" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">Mold 不管里面是 A 还是 E</text>

  <text x="600" y="518" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="800" fill="#0f172a">↓ 打开其中一封绿色内件</text>

  <rect x="64" y="538" width="1072" height="132" rx="18" fill="#f5f3ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="88" y="576" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#6b21a8">第 3 层 · 一条 ITCH · 对应后面的五种事件表</text>
  <rect x="88" y="594" width="420" height="54" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="508" y="594" width="420" height="54" rx="8" fill="#ddd6fe" stroke="#7e22ce" stroke-width="2"/>
  <text x="298" y="628" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#5b21b6">共同 11B 头</text>
  <text x="718" y="628" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#5b21b6">按类型变化的 Body</text>
  <text x="950" y="628" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">这里才改订单簿</text>
</svg>
