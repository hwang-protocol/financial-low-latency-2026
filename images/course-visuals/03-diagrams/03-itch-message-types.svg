<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">五种 ITCH 事件的共同 11 字节头与 Body</title>
  <desc id="desc">A D E P U 都先读 Message Type、Stock Locate、Tracking Number、Timestamp 共 11 字节。A 创建展示订单状态；D 只带 Order Reference Number；E 带 Executed Shares 与 Match Number；P 报告非展示成交且不改展示簿，它的 Buy/Sell Indicator 固定为 B，不能表示真实 resting side；U 用 Original / New Order Reference Number 替换，并继承旧 Stock 与 Buy/Sell Indicator。</desc>
  <rect x="18" y="18" width="1164" height="924" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="68" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#475569">ITCH · MESSAGE BODY</text>
  <text x="64" y="110" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#0f172a">五种事件共用 11 字节头，Body 决定怎么改订单簿</text>

  <text x="64" y="154" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#0f172a">共同 11 字节，五种消息都从这里开始</text>
  <rect x="64" y="168" width="150" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="214" y="168" width="170" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="384" y="168" width="190" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="574" y="168" width="200" height="72" rx="10" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <text x="139" y="198" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Message Type</text>
  <text x="139" y="222" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">1B</text>
  <text x="299" y="198" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Stock Locate</text>
  <text x="299" y="222" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">2B</text>
  <text x="479" y="198" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Tracking Number</text>
  <text x="479" y="222" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">2B</text>
  <text x="674" y="198" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="800" fill="#5b21b6">Timestamp</text>
  <text x="674" y="222" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" fill="#6b21a8">6B</text>
  <text x="790" y="212" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#475569">下面每一行左边的紫块都是这 11 字节</text>

  <text x="64" y="278" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#047857">A · Add Order · 36B</text>
  <rect x="64" y="288" width="150" height="66" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="214" y="288" width="200" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="414" y="288" width="170" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="584" y="288" width="100" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="684" y="288" width="100" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="784" y="288" width="90" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="139" y="328" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#5b21b6">common 11B</text>
  <text x="314" y="316" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Order Reference</text>
  <text x="314" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Number 8</text>
  <text x="499" y="316" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Buy/Sell</text>
  <text x="499" y="338" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Indicator 1</text>
  <text x="634" y="328" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Shares 4</text>
  <text x="734" y="328" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Stock 8</text>
  <text x="829" y="328" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Price 4</text>
  <text x="888" y="328" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">保存这张新单</text>

  <text x="64" y="394" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#b45309">D · Order Delete · 19B</text>
  <rect x="64" y="404" width="150" height="66" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="214" y="404" width="200" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="139" y="444" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#5b21b6">common 11B</text>
  <text x="314" y="432" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#9a3412">Order Reference</text>
  <text x="314" y="454" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#9a3412">Number 8</text>
  <text x="430" y="444" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">没有 Stock，靠当初 A 记住的 Order Reference Number</text>

  <text x="64" y="510" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#0f766e">E · Order Executed · 31B</text>
  <rect x="64" y="520" width="150" height="66" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="214" y="520" width="200" height="66" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="414" y="520" width="180" height="66" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <rect x="594" y="520" width="170" height="66" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="139" y="560" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#5b21b6">common 11B</text>
  <text x="314" y="548" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">Order Reference</text>
  <text x="314" y="570" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">Number 8</text>
  <text x="504" y="548" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">Executed Shares</text>
  <text x="504" y="570" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">4</text>
  <text x="679" y="548" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">Match Number</text>
  <text x="679" y="570" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#115e59">8</text>
  <text x="780" y="560" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">同样没有 Stock</text>

  <text x="64" y="626" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#334155">P · Trade · 44B</text>
  <rect x="64" y="636" width="130" height="66" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="194" y="636" width="170" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="364" y="636" width="140" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="504" y="636" width="90" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="594" y="636" width="90" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="684" y="636" width="80" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="764" y="636" width="150" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="129" y="676" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#5b21b6">common 11B</text>
  <text x="279" y="664" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Order Reference</text>
  <text x="279" y="686" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Number 8</text>
  <text x="434" y="664" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Buy/Sell</text>
  <text x="434" y="686" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Indicator 1</text>
  <text x="549" y="676" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Shares 4</text>
  <text x="639" y="676" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Stock 8</text>
  <text x="724" y="676" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Price 4</text>
  <text x="839" y="664" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">Match Number</text>
  <text x="839" y="686" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#334155">8</text>
  <text x="928" y="676" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">固定 B · 不改展示簿</text>

  <text x="64" y="742" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#1d4ed8">U · Order Replace · 35B</text>
  <rect x="64" y="752" width="150" height="66" rx="8" fill="#ede9fe" stroke="#7e22ce" stroke-width="2"/>
  <rect x="214" y="752" width="200" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="414" y="752" width="200" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="614" y="752" width="100" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="714" y="752" width="90" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="139" y="792" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#5b21b6">common 11B</text>
  <text x="314" y="780" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Original Order</text>
  <text x="314" y="802" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Reference Number 8</text>
  <text x="514" y="780" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">New Order</text>
  <text x="514" y="802" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Reference Number 8</text>
  <text x="664" y="792" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Shares 4</text>
  <text x="759" y="792" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Price 4</text>
  <text x="818" y="792" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#334155">Stock / Buy/Sell Indicator 从旧单继承</text>

  <rect x="64" y="848" width="1072" height="70" rx="12" fill="#e2e8f0"/>
  <text x="600" y="878" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#334155">D / E 能改 AAPL 或 NVDA，是因为 Feed Handler 还留着当初 A 写入的 Order Reference Number。</text>
  <text x="600" y="902" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#334155">P 的 Indicator 固定为 B，不能判断真实 side；它也不改当前展示簿。</text>
</svg>
