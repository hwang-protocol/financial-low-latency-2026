<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">真实手工IOC的SoupBinTCP与OUCH消息链</title>
  <desc id="desc">AUTO和MANUAL分别保有一条TCP长连接。一次手工IOC在MANUAL连接中以SoupBinTCP U携带OUCH O，Exchange用SoupBinTCP S分别携带OUCH A和E。</desc>
  <defs>
    <marker id="purple" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="16" markerHeight="12" orient="auto" overflow="visible"><path d="M0 1 L14 6 L0 11 Z" fill="#7e22ce"/></marker>
    <marker id="green" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="16" markerHeight="12" orient="auto" overflow="visible"><path d="M0 1 L14 6 L0 11 Z" fill="#059669"/></marker>
  </defs>
  <rect x="18" y="18" width="1164" height="544" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="72" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#475569">ORDER SESSION</text>
  <text x="64" y="114" font-family="Arial,'Noto Sans SC',sans-serif" font-size="33" font-weight="800" fill="#0f172a">一笔 IOC 不是一个 TCP 包，而是一条可关联的状态链</text>

  <rect x="70" y="160" width="260" height="310" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="200" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="800" fill="#065f46">.2 Trader</text>
  <rect x="96" y="232" width="208" height="74" rx="14" fill="#fff" stroke="#94a3b8"/>
  <text x="200" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800">AUTO session</text>
  <text x="200" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">独立 TCP 长连接</text>
  <rect x="96" y="334" width="208" height="104" rx="14" fill="#f5f3ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="200" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#6b21a8">MANUAL session</text>
  <text x="200" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">本卡抓取的 IOC</text>
  <text x="200" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">UserRefNum / ClOrdID</text>

  <rect x="870" y="160" width="260" height="310" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="1000" y="204" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="800" fill="#9a3412">.1 Exchange</text>
  <text x="1000" y="258" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#334155">Order Port :43120</text>
  <text x="1000" y="300" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#475569">读取当前历史盘口</text>
  <text x="1000" y="336" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#475569">写入纸面 ledger</text>
  <text x="1000" y="372" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#475569">返回 Accepted / Executed</text>

  <line x1="342" y1="258" x2="850" y2="258" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="596" y="243" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#64748b">AUTO 会话并行存在，本卡不停止它</text>

  <line x1="342" y1="340" x2="856" y2="340" stroke="#7e22ce" stroke-width="6" marker-end="url(#purple)"/>
  <text x="596" y="325" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#6b21a8">Soup U → OUCH O · Enter Order</text>
  <line x1="850" y1="392" x2="343" y2="392" stroke="#059669" stroke-width="6" marker-end="url(#green)"/>
  <text x="596" y="381" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#047857">Soup S → OUCH A · Accepted</text>
  <line x1="850" y1="444" x2="343" y2="444" stroke="#059669" stroke-width="6" marker-end="url(#green)"/>
  <text x="596" y="433" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#047857">Soup S → OUCH E · Executed</text>

  <rect x="70" y="500" width="1060" height="38" rx="12" fill="#e2e8f0"/>
  <text x="600" y="526" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#334155">O / A / E 通过相同 UserRefNum 关联；ClOrdID 在 O 与 A 中保持一致</text>
</svg>
