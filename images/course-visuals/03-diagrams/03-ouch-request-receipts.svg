<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc">
<title id="title">一次下单：O 请求、A 受理、E 成交</title>
<desc id="desc">依据20260910T085551Z-03-live-order的原始pcap，展示MANUAL连接的O下单请求、A受理回报、E成交回报。连接已建立，三条消息的UserRefNum均为2100000001；本例各占一个TCP包，纯ACK及另一条AUTO连接未画入。三个箭头表示业务消息，不表示TCP固定包数。</desc>
<style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#475569}.title{font-size:32px;font-weight:600}.head{font-size:26px;font-weight:600}.label{font-size:25px;font-weight:600}.body{font-size:23px}.note{font-size:21px;fill:#64748b}</style>
<defs>
<marker id="request" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto"><path d="M0 -6L12 0L0 6Z" fill="#648aaa"/></marker>
<marker id="reply" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto"><path d="M0 -6L12 0L0 6Z" fill="#61947d"/></marker>
</defs><rect width="1200" height="635" fill="#fff"/>
<text x="40" y="54" class="title">一次下单：请求 → 受理 → 成交</text>
<text x="40" y="94" class="note">同一条已登录的 TCP 连接：客户端发一次请求，Exchange 返回两条业务回报。</text>
<rect x="40" y="124" width="270" height="92" rx="14" fill="#edf4f9" stroke="#cbd5e1"/>
<rect x="890" y="124" width="270" height="92" rx="14" fill="#edf6f1" stroke="#cbd5e1"/>
<g fill="none" stroke="#7890a4" stroke-width="2"><rect x="60" y="150" width="34" height="25" rx="3"/><path d="M77 175V184 M65 184H89"/><rect x="910" y="148" width="32" height="38" rx="3"/><path d="M916 158H936 M916 169H936 M916 180H936"/></g>
<text x="108" y="164" class="head">MANUAL · .2</text><text x="108" y="197" class="note">客户端端口 55407</text>
<text x="957" y="164" class="head">Exchange · .1</text><text x="957" y="197" class="note">订单端口 43120</text>
<text x="600" y="169" class="body" text-anchor="middle">请求 → 本地检查与撮合 → 回报</text>
<path d="M175 230V533 M1025 230V533" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 7"/>
<text x="252" y="254" class="label">① O · 下单请求</text>
<path d="M187 275H1001" fill="none" stroke="#648aaa" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#request)"/>
<text x="252" y="310" class="body">AAPL · 卖 1 股 · 限价 291.6300</text>
<text x="252" y="359" class="label">② A · 受理回报</text>
<path d="M1013 380H199" fill="none" stroke="#61947d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#reply)"/>
<text x="252" y="415" class="body">订单已受理 · 订单引用号 100022</text>
<text x="252" y="464" class="label">③ E · 成交回报</text>
<path d="M1013 485H199" fill="none" stroke="#61947d" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#reply)"/>
<text x="252" y="520" class="body">成交 1 股 · 价格 296.6300 · 成交编号 900022</text>
<rect x="40" y="556" width="1120" height="51" rx="10" fill="#f1f5f9"/>
<text x="62" y="589" class="body">O / A / E 共用客户端编号 2100000001；A 表示受理，E 才报告成交。</text>
</svg>
