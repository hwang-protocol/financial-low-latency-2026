<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">两条业务链：行情与订单</title>
  <desc id="desc">行情通道：UDP 上由 MoldUDP64 封装 TotalView-ITCH 5.0。订单通道：每个 Trader 各用一条 TCP 连接，由 SoupBinTCP 封装 OUCH 5.0 请求与回报。信封负责编号、长度和边界，信件才是业务内容。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans SC", Arial, sans-serif; letter-spacing: 0; }
  </style>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="36" y="48" font-size="32" font-weight="700" fill="#475569">两条业务链：行情与订单</text>
  <text x="36" y="86" font-size="22" fill="#64748b">外层封装划分消息，内层协议描述行情事件或订单业务。</text>

  <rect x="36" y="118" width="546" height="520" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="160" font-size="26" font-weight="700" fill="#2563eb">行情通道 · UDP</text>
  <text x="60" y="196" font-size="20" fill="#334155">Exchange .1 发给 .2 行情接收器</text>

  <rect x="60" y="220" width="498" height="390" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="84" y="262" font-size="18" font-weight="700" fill="#2563eb">封装</text>
  <text x="84" y="300" font-size="26" font-weight="700" fill="#475569">MoldUDP64</text>
  <text x="84" y="338" font-size="20" fill="#334155">标明会话 Session、消息序号</text>
  <text x="84" y="368" font-size="20" fill="#334155">和每条消息的长度</text>

  <rect x="84" y="396" width="450" height="186" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/>
  <text x="108" y="438" font-size="18" font-weight="700" fill="#15803d">业务协议</text>
  <text x="108" y="476" font-size="26" font-weight="700" fill="#14532d">TotalView-ITCH 5.0</text>
  <text x="108" y="516" font-size="20" fill="#14532d">行情事件类型、股票身份</text>
  <text x="108" y="546" font-size="20" fill="#14532d">与订单字段</text>

  <rect x="618" y="118" width="546" height="520" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="642" y="160" font-size="26" font-weight="700" fill="#7e22ce">订单通道 · TCP</text>
  <text x="642" y="196" font-size="20" fill="#334155">每个 .2 Trader 各用一条到 .1 的连接</text>

  <rect x="642" y="220" width="498" height="390" rx="14" fill="#ffffff" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="666" y="262" font-size="18" font-weight="700" fill="#7e22ce">封装</text>
  <text x="666" y="300" font-size="26" font-weight="700" fill="#475569">SoupBinTCP</text>
  <text x="666" y="338" font-size="20" fill="#334155">完成登录，并在字节流里</text>
  <text x="666" y="368" font-size="20" fill="#334155">标出每条消息的边界</text>

  <rect x="666" y="396" width="450" height="186" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/>
  <text x="690" y="438" font-size="18" font-weight="700" fill="#15803d">业务协议</text>
  <text x="690" y="476" font-size="26" font-weight="700" fill="#14532d">OUCH 5.0</text>
  <text x="690" y="516" font-size="20" fill="#14532d">下单、受理、成交与拒绝</text>
  <text x="690" y="546" font-size="20" fill="#14532d">请求与回报都走这一层</text>

  <text x="36" y="674" font-size="20" fill="#64748b">拆包从外往里读：UDP 先拆 Mold 再读 ITCH，TCP 先拆 Soup 再读 OUCH。</text>
</svg>
