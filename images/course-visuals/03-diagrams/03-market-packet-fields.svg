<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1624" viewBox="0 0 1200 1624" role="img" aria-labelledby="title desc" data-itch-type="A" data-message-bytes="36">
  <title id="title">ITCH A：新增展示订单，36 字节</title>
  <desc id="desc">Add Order 的逐字段字节布局。偏移从 ITCH 起点 0 计算；字段解释按起点对应字节条。下方订单簿变化仅用演示值，不是抓包回执。</desc>
  <style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#243340;font-size:24px;letter-spacing:0}.title{font-size:34px;font-weight:700}.heading{font-size:26px;font-weight:700}.field{font-size:23px;font-weight:700}.small{font-size:22px}.ruler{font-size:20px}.muted{fill:#546671}.white{fill:white}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6L0 12Z" fill="#317356"/></marker></defs>
  <rect width="1200" height="1624" fill="#ffffff"/>
  <text x="40" y="52" class="title" >ITCH A · 新增展示订单 · 36 字节</text>
  <text x="40" y="91" class="small muted" >Add Order；偏移从 ITCH 起点 0 重新计算。</text>
<rect x="40" y="112" width="176" height="86" fill="#edf3f8" stroke="white" stroke-width="2"/>
  <text x="52" y="142" class="small" >Ethernet</text>
  <text x="52" y="178" class="small" >14 字节</text>
<rect x="216" y="112" width="176" height="86" fill="#edf3f8" stroke="white" stroke-width="2"/>
  <text x="228" y="142" class="small" >IPv4</text>
  <text x="228" y="178" class="small" >20 字节</text>
<rect x="392" y="112" width="160" height="86" fill="#edf3f8" stroke="white" stroke-width="2"/>
  <text x="404" y="142" class="small" >UDP</text>
  <text x="404" y="178" class="small" >8 字节</text>
<rect x="552" y="112" width="180" height="86" fill="#edf3f8" stroke="white" stroke-width="2"/>
  <text x="564" y="142" class="small" >Mold 头</text>
  <text x="564" y="178" class="small" >20 字节</text>
<rect x="732" y="112" width="120" height="86" fill="#edf3f8" stroke="white" stroke-width="2"/>
  <text x="744" y="142" class="small" >长度</text>
  <text x="744" y="178" class="small" >2 字节</text>
<rect x="852" y="112" width="308" height="86" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="864" y="142" class="small" >ITCH A</text>
  <text x="864" y="178" class="small" >36 字节</text>
  <text x="40" y="234" class="small muted" >封装示意不按比例：无 VLAN 标签、IPv4 选项或分片；合计 100 字节，不含帧尾校验。</text>
  <text x="40" y="300" class="small muted" >字节条按宽度比例绘制；上方数字是字段起点，末端数字是总长度。</text>
<rect data-byte-start="0" data-byte-width="1" x="40" y="350" width="31.11111111111111" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="40" y="338" class="ruler" >0</text>
<rect data-byte-start="1" data-byte-width="2" x="71.11111111111111" y="350" width="62.22222222222222" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="71.11111111111111" y="338" class="ruler" >1</text>
<rect data-byte-start="3" data-byte-width="2" x="133.33333333333331" y="350" width="62.22222222222222" height="44" fill="#edf1f4" stroke="white" stroke-width="2"/>
  <text x="133.33333333333331" y="338" class="ruler" >3</text>
<rect data-byte-start="5" data-byte-width="6" x="195.55555555555554" y="350" width="186.66666666666666" height="44" fill="#edf1f4" stroke="white" stroke-width="2"/>
  <text x="195.55555555555554" y="338" class="ruler" >5</text>
<rect data-byte-start="11" data-byte-width="8" x="382.22222222222223" y="350" width="248.88888888888889" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="382.22222222222223" y="338" class="ruler" >11</text>
<rect data-byte-start="19" data-byte-width="1" x="631.1111111111111" y="350" width="31.11111111111111" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="631.1111111111111" y="338" class="ruler" >19</text>
<rect data-byte-start="20" data-byte-width="4" x="662.2222222222222" y="350" width="124.44444444444444" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="662.2222222222222" y="338" class="ruler" >20</text>
<rect data-byte-start="24" data-byte-width="8" x="786.6666666666666" y="350" width="248.88888888888889" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="786.6666666666666" y="338" class="ruler" >24</text>
<rect data-byte-start="32" data-byte-width="4" x="1035.5555555555557" y="350" width="124.44444444444444" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="1035.5555555555557" y="338" class="ruler" >32</text>
  <text x="1160" y="338" class="ruler" text-anchor="end">36</text>
  <text x="40" y="430" class="small muted" >黄色：类型 / 股票身份    灰色：辅助信息    绿色：业务内容    蓝色：附加标识</text>
<g data-field="Message Type" data-offset="0" data-width="1"><rect data-field-strip="true" x="40" y="456" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="494" class="small muted" >偏移 0</text>
  <text x="58" y="530" class="small muted" >1 字节</text>
  <text x="250" y="494" class="field" >Message Type</text>
  <text x="660" y="494" class="small" >消息类型：A</text>
</g>
<g data-field="Stock Locate" data-offset="1" data-width="2"><rect data-field-strip="true" x="40" y="558" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="596" class="small muted" >偏移 1-2</text>
  <text x="58" y="632" class="small muted" >2 字节</text>
  <text x="250" y="596" class="field" >Stock Locate</text>
  <text x="660" y="596" class="small" >当天的证券索引</text>
  <text x="660" y="632" class="small" >本课 NVDA 为 8095</text>
</g>
<g data-field="Tracking Number" data-offset="3" data-width="2"><rect data-field-strip="true" x="40" y="660" width="1120" height="96" fill="#edf1f4"/>
  <text x="58" y="698" class="small muted" >偏移 3-4</text>
  <text x="58" y="734" class="small muted" >2 字节</text>
  <text x="250" y="698" class="field" >Tracking Number</text>
  <text x="660" y="698" class="small" >Nasdaq 内部跟踪号</text>
  <text x="660" y="734" class="small" >不是 Mold 消息序号</text>
</g>
<g data-field="Timestamp" data-offset="5" data-width="6"><rect data-field-strip="true" x="40" y="762" width="1120" height="96" fill="#edf1f4"/>
  <text x="58" y="800" class="small muted" >偏移 5-10</text>
  <text x="58" y="836" class="small muted" >6 字节</text>
  <text x="250" y="800" class="field" >Timestamp</text>
  <text x="660" y="800" class="small" >距源交易日午夜的纳秒数</text>
  <text x="660" y="836" class="small" >不是本机抓包时间</text>
</g>
<g data-field="Order Reference Number" data-offset="11" data-width="8"><rect data-field-strip="true" x="40" y="864" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="902" class="small muted" >偏移 11-18</text>
  <text x="58" y="938" class="small muted" >8 字节</text>
  <text x="250" y="902" class="field" >Order Reference</text>
  <text x="250" y="938" class="field" >Number</text>
  <text x="660" y="902" class="small" >挂单引用号，后续凭它找单</text>
  <text x="660" y="938" class="small" >示意：1001</text>
</g>
<g data-field="Buy/Sell Indicator" data-offset="19" data-width="1"><rect data-field-strip="true" x="40" y="966" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="1004" class="small muted" >偏移 19</text>
  <text x="58" y="1040" class="small muted" >1 字节</text>
  <text x="250" y="1004" class="field" >Buy/Sell Indicator</text>
  <text x="660" y="1004" class="small" >展示挂单方向</text>
  <text x="660" y="1040" class="small" >B：买；S：卖</text>
</g>
<g data-field="Shares" data-offset="20" data-width="4"><rect data-field-strip="true" x="40" y="1068" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="1106" class="small muted" >偏移 20-23</text>
  <text x="58" y="1142" class="small muted" >4 字节</text>
  <text x="250" y="1106" class="field" >Shares</text>
  <text x="660" y="1106" class="small" >挂单股数</text>
  <text x="660" y="1142" class="small" >示意：200 就是 200 股</text>
</g>
<g data-field="Stock" data-offset="24" data-width="8"><rect data-field-strip="true" x="40" y="1170" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="1208" class="small muted" >偏移 24-31</text>
  <text x="58" y="1244" class="small muted" >8 字节</text>
  <text x="250" y="1208" class="field" >Stock</text>
  <text x="660" y="1208" class="small" >股票代码，右侧补空格</text>
  <text x="660" y="1244" class="small" >NVDA 后补 4 个空格</text>
</g>
<g data-field="Price" data-offset="32" data-width="4"><rect data-field-strip="true" x="40" y="1272" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="1310" class="small muted" >偏移 32-35</text>
  <text x="58" y="1346" class="small muted" >4 字节</text>
  <text x="250" y="1310" class="field" >Price</text>
  <text x="660" y="1310" class="small" >价格整数除以 10000</text>
  <text x="660" y="1346" class="small" >示意：2044800 = 204.4800</text>
</g>
  <text x="40" y="1398" class="heading" >这条行情改变什么（下面的数值仅为演示）</text>
<rect x="40" y="1420" width="430" height="94" rx="6" fill="#f1f4f6" stroke="#91a3ad"/>
<rect x="730" y="1420" width="430" height="94" rx="6" fill="#e2f3ea" stroke="#6c9e87"/>
  <text x="60" y="1455" class="small" >尚无引用号 1001</text>
  <text x="60" y="1491" class="small" >该演示档位为空</text>
  <text x="750" y="1455" class="small" >1001：NVDA 买单 200 股</text>
  <text x="750" y="1491" class="small" >价格 204.4800</text>
  <text x="600" y="1452" class="small" text-anchor="middle">新增挂单</text>
<path data-arrow="effect" d="M482 1468H706" fill="none" stroke="#317356" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="40" y="1555" class="small" >这是行情通知，不是本机下单；后续事件通过挂单引用号更新已有订单。</text>
  <text x="40" y="1594" class="small muted" >数值字段按大端读取；类型、方向、股票代码及参与者标识按 ASCII 字符读取。</text>
</svg>
