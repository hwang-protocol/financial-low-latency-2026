<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1566" viewBox="0 0 1200 1566" role="img" aria-labelledby="title desc" data-itch-type="F" data-message-bytes="40">
  <title id="title">ITCH F：带参与者标识的新增订单，40 字节</title>
  <desc id="desc">Add Order with Attribution 的逐字段字节布局。偏移从 ITCH 起点 0 计算；字段解释按起点对应字节条。下方订单簿变化仅用演示值，不是抓包回执。</desc>
  <style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#243340;font-size:24px;letter-spacing:0}.title{font-size:34px;font-weight:700}.heading{font-size:26px;font-weight:700}.field{font-size:23px;font-weight:700}.small{font-size:22px}.ruler{font-size:20px}.muted{fill:#546671}.white{fill:white}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6L0 12Z" fill="#317356"/></marker></defs>
  <rect width="1200" height="1566" fill="#ffffff"/>
  <text x="40" y="52" class="title" >ITCH F · 带参与者标识的新增订单 · 40 字节</text>
  <text x="40" y="91" class="small muted" >Add Order with Attribution；偏移从 ITCH 起点 0 重新计算。</text>
  <text x="40" y="140" class="small muted" >字节条按宽度比例绘制；上方数字是字段起点，末端数字是总长度。</text>
<rect data-byte-start="0" data-byte-width="1" x="40" y="190" width="28" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="40" y="178" class="ruler" >0</text>
<rect data-byte-start="1" data-byte-width="2" x="68" y="190" width="56" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="68" y="178" class="ruler" >1</text>
<rect data-byte-start="3" data-byte-width="2" x="124" y="190" width="56" height="44" fill="#edf1f4" stroke="white" stroke-width="2"/>
  <text x="124" y="178" class="ruler" >3</text>
<rect data-byte-start="5" data-byte-width="6" x="180" y="190" width="168" height="44" fill="#edf1f4" stroke="white" stroke-width="2"/>
  <text x="180" y="178" class="ruler" >5</text>
<rect data-byte-start="11" data-byte-width="8" x="348" y="190" width="224" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="348" y="178" class="ruler" >11</text>
<rect data-byte-start="19" data-byte-width="1" x="572" y="190" width="28" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="572" y="178" class="ruler" >19</text>
<rect data-byte-start="20" data-byte-width="4" x="600" y="190" width="112" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="600" y="178" class="ruler" >20</text>
<rect data-byte-start="24" data-byte-width="8" x="712" y="190" width="224" height="44" fill="#fff0c6" stroke="white" stroke-width="2"/>
  <text x="712" y="178" class="ruler" >24</text>
<rect data-byte-start="32" data-byte-width="4" x="936" y="190" width="112" height="44" fill="#e2f3ea" stroke="white" stroke-width="2"/>
  <text x="936" y="178" class="ruler" >32</text>
<rect data-byte-start="36" data-byte-width="4" x="1048" y="190" width="112" height="44" fill="#e5effb" stroke="white" stroke-width="2"/>
  <text x="1048" y="178" class="ruler" >36</text>
  <text x="1160" y="178" class="ruler" text-anchor="end">40</text>
  <text x="40" y="270" class="small muted" >黄色：类型 / 股票身份    灰色：辅助信息    绿色：业务内容    蓝色：附加标识</text>
<g data-field="Message Type" data-offset="0" data-width="1"><rect data-field-strip="true" x="40" y="296" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="334" class="small muted" >偏移 0</text>
  <text x="58" y="370" class="small muted" >1 字节</text>
  <text x="250" y="334" class="field" >Message Type</text>
  <text x="660" y="334" class="small" >消息类型：F</text>
</g>
<g data-field="Stock Locate" data-offset="1" data-width="2"><rect data-field-strip="true" x="40" y="398" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="436" class="small muted" >偏移 1-2</text>
  <text x="58" y="472" class="small muted" >2 字节</text>
  <text x="250" y="436" class="field" >Stock Locate</text>
  <text x="660" y="436" class="small" >当天的证券索引</text>
  <text x="660" y="472" class="small" >本课 NVDA 为 8095</text>
</g>
<g data-field="Tracking Number" data-offset="3" data-width="2"><rect data-field-strip="true" x="40" y="500" width="1120" height="96" fill="#edf1f4"/>
  <text x="58" y="538" class="small muted" >偏移 3-4</text>
  <text x="58" y="574" class="small muted" >2 字节</text>
  <text x="250" y="538" class="field" >Tracking Number</text>
  <text x="660" y="538" class="small" >Nasdaq 内部跟踪号</text>
  <text x="660" y="574" class="small" >不是 Mold 消息序号</text>
</g>
<g data-field="Timestamp" data-offset="5" data-width="6"><rect data-field-strip="true" x="40" y="602" width="1120" height="96" fill="#edf1f4"/>
  <text x="58" y="640" class="small muted" >偏移 5-10</text>
  <text x="58" y="676" class="small muted" >6 字节</text>
  <text x="250" y="640" class="field" >Timestamp</text>
  <text x="660" y="640" class="small" >距源交易日午夜的纳秒数</text>
  <text x="660" y="676" class="small" >不是本机抓包时间</text>
</g>
<g data-field="Order Reference Number" data-offset="11" data-width="8"><rect data-field-strip="true" x="40" y="704" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="742" class="small muted" >偏移 11-18</text>
  <text x="58" y="778" class="small muted" >8 字节</text>
  <text x="250" y="742" class="field" >Order Reference</text>
  <text x="250" y="778" class="field" >Number</text>
  <text x="660" y="742" class="small" >挂单引用号，后续凭它找单</text>
  <text x="660" y="778" class="small" >示意：1001</text>
</g>
<g data-field="Buy/Sell Indicator" data-offset="19" data-width="1"><rect data-field-strip="true" x="40" y="806" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="844" class="small muted" >偏移 19</text>
  <text x="58" y="880" class="small muted" >1 字节</text>
  <text x="250" y="844" class="field" >Buy/Sell Indicator</text>
  <text x="660" y="844" class="small" >展示挂单方向</text>
  <text x="660" y="880" class="small" >B：买；S：卖</text>
</g>
<g data-field="Shares" data-offset="20" data-width="4"><rect data-field-strip="true" x="40" y="908" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="946" class="small muted" >偏移 20-23</text>
  <text x="58" y="982" class="small muted" >4 字节</text>
  <text x="250" y="946" class="field" >Shares</text>
  <text x="660" y="946" class="small" >挂单股数</text>
  <text x="660" y="982" class="small" >示意：200 就是 200 股</text>
</g>
<g data-field="Stock" data-offset="24" data-width="8"><rect data-field-strip="true" x="40" y="1010" width="1120" height="96" fill="#fff0c6"/>
  <text x="58" y="1048" class="small muted" >偏移 24-31</text>
  <text x="58" y="1084" class="small muted" >8 字节</text>
  <text x="250" y="1048" class="field" >Stock</text>
  <text x="660" y="1048" class="small" >股票代码，右侧补空格</text>
  <text x="660" y="1084" class="small" >NVDA 后补 4 个空格</text>
</g>
<g data-field="Price" data-offset="32" data-width="4"><rect data-field-strip="true" x="40" y="1112" width="1120" height="96" fill="#e2f3ea"/>
  <text x="58" y="1150" class="small muted" >偏移 32-35</text>
  <text x="58" y="1186" class="small muted" >4 字节</text>
  <text x="250" y="1150" class="field" >Price</text>
  <text x="660" y="1150" class="small" >价格整数除以 10000</text>
  <text x="660" y="1186" class="small" >示意：2044800 = 204.4800</text>
</g>
<g data-field="Attribution" data-offset="36" data-width="4"><rect data-field-strip="true" x="40" y="1214" width="1120" height="96" fill="#e5effb"/>
  <text x="58" y="1252" class="small muted" >偏移 36-39</text>
  <text x="58" y="1288" class="small muted" >4 字节</text>
  <text x="250" y="1252" class="field" >Attribution</text>
  <text x="660" y="1252" class="small" >参与者标识，4 个字符</text>
  <text x="660" y="1288" class="small" >示意：ABCD；不是股票代码</text>
</g>
  <text x="40" y="1340" class="heading" >这条行情改变什么（下面的数值仅为演示）</text>
<rect x="40" y="1362" width="430" height="94" rx="6" fill="#f1f4f6" stroke="#91a3ad"/>
<rect x="730" y="1362" width="430" height="94" rx="6" fill="#e2f3ea" stroke="#6c9e87"/>
  <text x="60" y="1397" class="small" >尚无引用号 1001</text>
  <text x="60" y="1433" class="small" >该演示档位为空</text>
  <text x="750" y="1397" class="small" >1001：NVDA 买单 200 股</text>
  <text x="750" y="1433" class="small" >参与者标识 ABCD（示意）</text>
  <text x="600" y="1394" class="small" text-anchor="middle">新增挂单</text>
<path data-arrow="effect" d="M482 1410H706" fill="none" stroke="#317356" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="40" y="1497" class="small" >与 A 的主体布局相同，但类型字节为 F，末尾多出 4 字节 Attribution。</text>
  <text x="40" y="1536" class="small muted" >数值字段按大端读取；类型、方向、股票代码及参与者标识按 ASCII 字符读取。</text>
</svg>
