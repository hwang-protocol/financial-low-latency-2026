<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">同价订单按时间优先成交</title>
  <desc id="desc">卖价一百点零二的队列中，S1比S2更早到达。买单B1数量一百五十先与S1成交一百，再与S2成交五十，最后S2剩余一百五十。</desc>
  <defs>
    <style>
      .title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .head{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .label{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .result{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14532d}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="500" rx="18" fill="#fff"/>
  <text x="560" y="44" text-anchor="middle" class="title">同一价格：先到的订单先成交</text>

  <text x="80" y="96" class="head">卖价 100.02 的既有队列</text>
  <rect x="80" y="116" width="270" height="92" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="215" y="153" text-anchor="middle" class="label">S1 · 100 股</text>
  <text x="215" y="184" text-anchor="middle" class="small">t1 先到 · 排在前面</text>
  <line x1="365" y1="162" x2="433" y2="162" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="450" y="116" width="270" height="92" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="585" y="153" text-anchor="middle" class="label">S2 · 200 股</text>
  <text x="585" y="184" text-anchor="middle" class="small">t2 后到 · 排在后面</text>
  <rect x="790" y="116" width="250" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="915" y="153" text-anchor="middle" class="label">时间顺序</text>
  <text x="915" y="184" text-anchor="middle" class="small">t1 → t2</text>

  <text x="80" y="266" class="head">可成交买单进入后</text>
  <rect x="80" y="288" width="250" height="104" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="205" y="330" text-anchor="middle" class="label">B1 · 买 150 股</text>
  <text x="205" y="365" text-anchor="middle" class="small">限价 100.02</text>
  <line x1="345" y1="340" x2="405" y2="340" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="422" y="288" width="270" height="104" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="557" y="325" text-anchor="middle" class="label">① 先成交 S1 的 100</text>
  <text x="557" y="359" text-anchor="middle" class="small">S1 完成 · B1 还需 50</text>
  <line x1="707" y1="340" x2="767" y2="340" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="784" y="288" width="256" height="104" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="912" y="325" text-anchor="middle" class="label">② 再成交 S2 的 50</text>
  <text x="912" y="359" text-anchor="middle" class="small">B1 完成 · S2 剩 150</text>

  <rect x="80" y="425" width="960" height="48" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="560" y="457" text-anchor="middle" class="result">100 + 50 = 150；价格相同，所以时间顺序决定谁先成交</text>
</svg>
