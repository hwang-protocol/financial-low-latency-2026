<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Nasdaq INET Nordic：真实组播端点与跨设备分发机制</title>
  <desc id="desc">采用 Nasdaq 2025-09-09 v4.0 公布的 Direct Connect A 路：源159.79.85.1，组233.74.125.32，UDP目的端口31032，RP159.79.85.252。橙色为行情方向，蓝色虚线为朝向RP的PIM建树方向。中间设备与接收者是机制示意，未公开地址不编造。接入交换机在成员表有效时向已加入的两个普通主机端口复制行情。不是生产逐跳抓包或本地实测。
  </desc>
  <defs>
    <marker id="udp" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#b66a0b"/></marker>
    <marker id="control" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto"><path d="M0,-6 L12,0 L0,6 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20305b}
      .title{font-size:34px;font-weight:800}.head{font-size:26px;font-weight:700}.body{font-size:23px}.note{font-size:21px;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.8}.data{fill:none;stroke:#b66a0b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#udp)}
      .label{font-size:22px;fill:#b66a0b;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <text x="40" y="46" class="note">REAL ENDPOINTS · ROUTING MECHANISM</text>
  <text x="40" y="96" class="title">一份行情，怎样送到多个接收端？</text>
  <text x="40" y="135" class="body">Nasdaq INET Nordic · Direct Connect · Equities &amp; Warrants · A 路</text>

  <rect x="390" y="165" width="420" height="110" rx="18" class="node"/>
  <text x="600" y="205" text-anchor="middle" class="head">交易所行情发布程序</text>
  <text x="600" y="245" text-anchor="middle" class="body">源 S：159.79.85.1</text>
  <path d="M600 287 V341" class="data"/>
  <text x="625" y="318" class="label">UDP → 233.74.125.32:31032</text>

  <rect x="390" y="365" width="420" height="110" rx="18" class="node"/>
  <text x="600" y="405" text-anchor="middle" class="head">交易所组播路由网络</text>
  <text x="600" y="445" text-anchor="middle" class="body">沿已建立的组播树转发</text>
  <path d="M600 487 V546" class="data"/>
  <text x="625" y="524" class="label">Direct Connect 接入链路</text>

  <rect x="40" y="370" width="300" height="155" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="190" y="410" text-anchor="middle" class="head">RP · 汇合点</text>
  <text x="190" y="449" text-anchor="middle" class="body">159.79.85.252</text>
  <text x="190" y="491" text-anchor="middle" class="note">为该组建立共享树</text>
  <path d="M378 625 H190 V549" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="butt" stroke-dasharray="8 6" marker-end="url(#control)"/>
  <text x="45" y="669" font-size="22" fill="#2563eb">PIM Join 逐跳朝向 RP</text>
  <text x="45" y="704" class="note">虚线表示建树方向</text>
  <text x="45" y="737" class="note">不是直连线或 TCP 连接</text>

  <rect x="390" y="570" width="420" height="110" rx="18" class="node"/>
  <text x="600" y="610" text-anchor="middle" class="head">参与方组播路由器</text>
  <text x="600" y="650" text-anchor="middle" class="body">PIM-SM · 按下游需求转发</text>
  <path d="M600 692 V756" class="data"/>
  <text x="625" y="732" class="label">源 IP、组地址、UDP 端口保持</text>

  <rect x="390" y="780" width="420" height="110" rx="18" class="node"/>
  <text x="600" y="820" text-anchor="middle" class="head">接入交换机</text>
  <text x="600" y="860" text-anchor="middle" class="body">IGMP Snooping · 按成员端口复制</text>
  <path d="M540 902 V960 H215 V1016" class="data"/>
  <path d="M600 902 V1016" class="data"/>
  <text x="635" y="956" class="note">图示条件：成员表有效；</text>
  <text x="635" y="990" class="note">C 是未加组的普通主机端口</text>

  <rect x="60" y="1040" width="310" height="100" rx="18" fill="#ecfdf5" stroke="#86bfa9" stroke-width="1.8"/>
  <text x="215" y="1078" text-anchor="middle" class="head">接收端 A · 已加组</text>
  <text x="215" y="1114" text-anchor="middle" class="body">接收完整行情 · UDP 31032</text>
  <rect x="445" y="1040" width="310" height="100" rx="18" fill="#ecfdf5" stroke="#86bfa9" stroke-width="1.8"/>
  <text x="600" y="1078" text-anchor="middle" class="head">接收端 B · 已加组</text>
  <text x="600" y="1114" text-anchor="middle" class="body">接收完整行情 · UDP 31032</text>
  <rect x="830" y="1040" width="310" height="100" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="985" y="1078" text-anchor="middle" class="head">接收端 C · 未加组</text>
  <text x="985" y="1114" text-anchor="middle" class="body">本图条件下不转发该行情</text>
  <text x="40" y="1180" class="note">地址取自官方接入表；中间设备与客户端为机制示意，未公开的接口 IP 不编造。</text>
</svg>
