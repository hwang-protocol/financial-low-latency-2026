<symbol id="gear" viewBox="0 0 64 64"><path d="M25 6h14l2 10 9-3 7 12-8 7 8 7-7 12-9-3-2 10H25l-2-10-9 3-7-12 8-7-8-7 7-12 9 3z"/><circle cx="32" cy="32" r="10"/></symbol>
<symbol id="screen" viewBox="0 0 64 64"><rect x="4" y="8" width="56" height="39" rx="5"/><path d="M32 47v10M18 58h28M12 37l10-9 9 5 18-16"/></symbol>
</defs><rect width="1200" height="100%" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" fill="#172338" font-weight="700" text-anchor="start">先启动系统，再下一笔订单</text>
<text x="36" y="94" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">运行①完成预检、构建、分发和服务验收；运行②才提交首笔纸面交易。</text>
<rect x="35" y="155" width="340" height="205" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#gear" x="53" y="173" width="58" height="58" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="123" y="208" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">① 构建文件</text>
<text x="57" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">管理机把源码送到 .101</text>
<text x="57" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">g++ 编译并检查程序</text>
<text x="57" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">得到 Linux 可执行文件</text>
<rect x="430" y="155" width="340" height="205" rx="15" fill="#fff" stroke="#7e22ce" stroke-width="1.6"/>
<use href="#box" x="448" y="173" width="58" height="58" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="518" y="208" font-size="26" fill="#7e22ce" font-weight="700" text-anchor="start">② 分发并启动</text>
<text x="452" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">Exchange → .1</text>
<text x="452" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">接收器与客户端 → .2</text>
<text x="452" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">网页 Gateway → .101</text>
<rect x="825" y="155" width="340" height="205" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#screen" x="843" y="173" width="58" height="58" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="913" y="208" font-size="26" fill="#15803d" font-weight="700" text-anchor="start">③ 确认在线</text>
<text x="847" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">四项服务正常</text>
<text x="847" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">行情开始刷新</text>
<text x="847" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">网页可以访问</text>
<path d="M387,255 L406.00,255.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<path d="M782,255 L801.00,255.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<rect x="35" y="415" width="1130" height="133" rx="15" fill="#fff8ee" stroke="#c76a08" stroke-width="1.6"/>
<use href="#packet" x="55" y="439" width="58" height="58" fill="none" stroke="#c76a08" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="140" y="460" font-size="26" fill="#172338" font-weight="700" text-anchor="start">运行②：下一笔 1 股订单，按这笔订单的编号找回执。</text>
<text x="140" y="504" font-size="25" fill="#172338" font-weight="400" text-anchor="start">Accepted = 收下请求；Executed = 已成交。两者要分开看。</text>
<text x="36" y="610" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">文件复制只是交付程序；进程启动、行情刷新和订单成交，分别验证不同阶段。</text>
</g></svg>