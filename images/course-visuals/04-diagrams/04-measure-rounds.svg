<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">一次测量从左往右走</title>
<desc id="desc">按 20 ms 下一单。先整体热身 1000 笔；同一套交棒再连做 8 轮。第 1 轮用斜线放大：先预热 40 笔，再正式 400 笔。只有正式样本进入摘要。图示为机制说明，不含新增实测结果。</desc>
<defs>
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#475569}
.label{fill:#35688c;font-weight:600}
.num{fill:#35688c;font-weight:700}
</style>
<clipPath id="track">
<rect x="40" y="132" width="1120" height="84" rx="42"/>
</clipPath>
<clipPath id="zoom">
<rect x="160" y="318" width="880" height="88" rx="16"/>
</clipPath>
</defs>
<rect width="1200" height="520" rx="18" fill="#f8fafc"/>
<text x="40" y="46" font-size="32" class="label">一次测量从左往右走</text>
<text x="40" y="84" font-size="22">按 20 ms 下一单。灰色不算成绩，蓝色才进摘要。</text>

<text x="154" y="118" font-size="20" class="label" text-anchor="middle">开始</text>
<text x="722" y="118" font-size="20" class="label" text-anchor="middle">中间：同一套连做 8 轮</text>

<rect x="40" y="132" width="1120" height="84" rx="42" fill="#e2e8f0"/>
<g clip-path="url(#track)">
<rect x="40" y="132" width="228" height="84" fill="#dbe3ec"/>
<rect x="274" y="132" width="111" height="84" fill="#8eb6d4"/>
<rect x="385" y="132" width="111" height="84" fill="#c5dceb"/>
<rect x="496" y="132" width="111" height="84" fill="#b7d2e4"/>
<rect x="607" y="132" width="111" height="84" fill="#c5dceb"/>
<rect x="718" y="132" width="111" height="84" fill="#b7d2e4"/>
<rect x="829" y="132" width="111" height="84" fill="#c5dceb"/>
<rect x="940" y="132" width="111" height="84" fill="#b7d2e4"/>
<rect x="1051" y="132" width="109" height="84" fill="#c5dceb"/>
<rect x="268" y="132" width="6" height="84" fill="#f8fafc"/>
<rect x="385" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="496" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="607" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="718" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="829" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="940" y="132" width="2" height="84" fill="#f8fafc"/>
<rect x="1051" y="132" width="2" height="84" fill="#f8fafc"/>
</g>
<rect x="40" y="132" width="1120" height="84" rx="42" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

<text x="154" y="170" font-size="22" class="label" text-anchor="middle">整体热身</text>
<text x="154" y="198" font-size="22" text-anchor="middle">1000 笔</text>
<text x="329.5" y="186" font-size="26" class="num" text-anchor="middle">1</text>
<text x="440.5" y="186" font-size="26" class="num" text-anchor="middle">2</text>
<text x="551.5" y="186" font-size="26" class="num" text-anchor="middle">3</text>
<text x="662.5" y="186" font-size="26" class="num" text-anchor="middle">4</text>
<text x="773.5" y="186" font-size="26" class="num" text-anchor="middle">5</text>
<text x="884.5" y="186" font-size="26" class="num" text-anchor="middle">6</text>
<text x="995.5" y="186" font-size="26" class="num" text-anchor="middle">7</text>
<text x="1105.5" y="186" font-size="26" class="num" text-anchor="middle">8</text>

<path d="M274 216 L160 318 L1040 318 L385 216 Z" fill="#edf5fb" stroke="none"/>
<path d="M274 216 L160 318" fill="none" stroke="#7694ab" stroke-width="2" stroke-linecap="butt"/>
<path d="M385 216 L1040 318" fill="none" stroke="#7694ab" stroke-width="2" stroke-linecap="butt"/>

<text x="600" y="300" font-size="20" class="label" text-anchor="middle">第 1 轮放大</text>
<g clip-path="url(#zoom)">
<rect x="160" y="318" width="240" height="88" fill="#e8edf3"/>
<rect x="400" y="318" width="640" height="88" fill="#c5dceb"/>
</g>
<rect x="160" y="318" width="880" height="88" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="280" y="372" font-size="28" class="label" text-anchor="middle">预热 40</text>
<text x="720" y="372" font-size="28" class="label" text-anchor="middle">正式 400</text>

<rect x="40" y="430" width="1120" height="58" rx="14" fill="#edf5fb" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="600" y="466" font-size="20" text-anchor="middle">结束以后：先确认样本有效　·　再看交接段　·　最后看整段</text>
</svg>
