<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#ea580c"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei","Noto Sans SC",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:800}.s{font-size:16px;fill:#475569}</style>
  </defs>

  <rect x="12" y="12" width="1176" height="796" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="52">队列存储：运行中管理内存块，或提前分配后复用</text>
  <text class="t s" x="52" y="82">上方每个框是一块内存；下方是提前分配的格子。锁与条件变量保持不变。</text>

  <rect x="40" y="104" width="1120" height="220" rx="18" fill="#fff"/>
  <rect x="40" y="104" width="1120" height="48" rx="18" fill="#f1f5f9"/>
  <path d="M40 134h1120v18H40z" fill="#f1f5f9"/>
  <text class="t k" x="600" y="136" text-anchor="middle">以前 · deque 使用已有空间，也可能申请和释放内存块</text>

  <rect x="176" y="176" width="240" height="88" rx="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t k" x="296" y="228" text-anchor="middle">第一截</text>
  <path d="M416 220H448" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="464" y="176" width="240" height="88" rx="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t k" x="584" y="228" text-anchor="middle">第二截</text>
  <path d="M704 220H736" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <rect x="752" y="176" width="240" height="88" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="t k" x="872" y="228" text-anchor="middle">新申请的一截</text>

  <text class="t s" x="600" y="300" text-anchor="middle">本课 GCC 实现：写到块边界会申请新块，取空的旧块会释放；队列未变长也可能发生。</text>
  <rect x="40" y="104" width="1120" height="220" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="40" y="372" width="1120" height="328" rx="18" fill="#fff"/>
  <rect x="40" y="372" width="1120" height="48" rx="18" fill="#ffedd5"/>
  <path d="M40 402h1120v18H40z" fill="#ffedd5"/>
  <text class="t k" x="600" y="404" text-anchor="middle">现在 · 启动时一次摆好 1024 格</text>

  <rect x="294" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="326" y="480" text-anchor="middle" font-size="16" font-weight="800">1</text>
  <rect x="366" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="398" y="480" text-anchor="middle" font-size="16" font-weight="800">2</text>
  <rect x="438" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="470" y="480" text-anchor="middle" font-size="16" font-weight="800">3</text>
  <rect x="510" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="542" y="480" text-anchor="middle" font-size="16" font-weight="800">4</text>
  <text class="t k" x="592" y="482" text-anchor="middle">…</text>
  <rect x="610" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="642" y="480" text-anchor="middle" font-size="13" font-weight="800">1021</text>
  <rect x="682" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="714" y="480" text-anchor="middle" font-size="13" font-weight="800">1022</text>
  <rect x="754" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="786" y="480" text-anchor="middle" font-size="13" font-weight="800">1023</text>
  <rect x="826" y="448" width="64" height="50" rx="8" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="858" y="480" text-anchor="middle" font-size="13" font-weight="800">1024</text>

  <path d="M858 498V592H326V514" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="t k" x="600" y="556" text-anchor="middle">写到末尾，再回到开头循环使用</text>

  <text class="t s" x="600" y="636" text-anchor="middle">图中省略了中间的格子；整组存储提前准备好，运行中不再扩容。</text>
  <text class="t s" x="600" y="668" text-anchor="middle">订单被下单线程取走后，空出的格子才能放新订单。</text>
  <rect x="40" y="372" width="1120" height="328" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="40" y="748" width="1120" height="36" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="600" y="772" font-size="16" font-weight="800" text-anchor="middle">固定存储避免交接过程中的队列内存分配与释放；实际效果看本步测量。</text>
</svg>
