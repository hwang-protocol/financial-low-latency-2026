<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:800}.s{font-size:15px;fill:#475569}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="416" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="58">现在的交棒方式：可伸缩储物格 + 一把钥匙 + 喊一声</text>
  <text class="t s" x="52" y="90">管理线程放进棒后叫醒下单线程；下单线程没棒可接时先睡，不空转占核。</text>

  <rect x="52" y="122" width="300" height="228" rx="18" fill="#fff"/>
  <rect x="52" y="122" width="300" height="44" rx="18" fill="#f1f5f9"/>
  <path d="M52 148h300v18H52z" fill="#f1f5f9"/>
  <text class="t k" x="202" y="152" text-anchor="middle">1. 储物格</text>
  <text class="t k" x="202" y="208" text-anchor="middle">deque</text>
  <text class="t s" x="202" y="244" text-anchor="middle">两头都能放进、取出</text>
  <text class="t s" x="202" y="274" text-anchor="middle">格子不够就自动加一截</text>
  <text class="t s" x="202" y="304" text-anchor="middle">棒暂时放在这里</text>
  <rect x="52" y="122" width="300" height="228" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M368 236H412" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="428" y="122" width="300" height="228" rx="18" fill="#eff6ff"/>
  <rect x="428" y="122" width="300" height="44" rx="18" fill="#dbeafe"/>
  <path d="M428 148h300v18H428z" fill="#dbeafe"/>
  <text class="t k" x="578" y="152" text-anchor="middle">2. 钥匙</text>
  <text class="t k" x="578" y="208" text-anchor="middle">mutex</text>
  <text class="t s" x="578" y="244" text-anchor="middle">同时只许一个人摸格子</text>
  <text class="t s" x="578" y="274" text-anchor="middle">另一人要等钥匙交回来</text>
  <text class="t s" x="578" y="304" text-anchor="middle">防止两个人同时改同一格</text>
  <rect x="428" y="122" width="300" height="228" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M744 236H788" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="804" y="122" width="300" height="228" rx="18" fill="#fff"/>
  <rect x="804" y="122" width="300" height="44" rx="18" fill="#f1f5f9"/>
  <path d="M804 148h300v18H804z" fill="#f1f5f9"/>
  <text class="t k" x="954" y="152" text-anchor="middle">3. 喊一声</text>
  <text class="t k" x="954" y="208" text-anchor="middle">condition_variable</text>
  <text class="t s" x="954" y="244" text-anchor="middle">没棒时下单线程先睡</text>
  <text class="t s" x="954" y="274" text-anchor="middle">放进棒后 notify 叫醒</text>
  <text class="t s" x="954" y="304" text-anchor="middle">醒来还要再拿回钥匙</text>
  <rect x="804" y="122" width="300" height="228" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="52" y="372" width="1052" height="36" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="578" y="397" font-size="16" font-weight="800" text-anchor="middle">程序把这三件合在一起的名字叫 DEQUE_CV；本步先量它，还不改它</text>
</svg>
