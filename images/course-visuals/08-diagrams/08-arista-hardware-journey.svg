<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Arista 真机：六步完成同一过滤任务</title><desc>教学设计路线，装载成功、数据经过、规则命中与业务恢复分别验证</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#475569}.label{font-size:26px;font-weight:700}.body{font-size:23px}</style><rect width="1200" height="680" rx="20" fill="#fff"/><text x="40" y="55" class="title">Arista 真机：六步完成同一过滤任务</text><text x="40" y="94" class="sub">先接好工位，再装检验程序，最后让真实报文通过；各步产物不能互相替代。</text>
<rect x="40" y="150" width="330" height="155" rx="14" fill="#eef2ff" stroke="#cbd5e1"/><text x="60" y="190" class="label">① 查资料</text><text x="60" y="232" class="body">型号 → FDK / EOS</text><text x="60" y="270" class="body">确认板型与恢复包</text>
<path d="M370 225H430" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="150" width="330" height="155" rx="14" fill="#eef2ff" stroke="#cbd5e1"/><text x="450" y="190" class="label">② 查连接</text><text x="450" y="232" class="body">前面板 ↔ 应用 FPGA</text><text x="450" y="270" class="body">先核矩阵，再切原帧</text>
<path d="M760 225H820" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="820" y="150" width="330" height="155" rx="14" fill="#eef2ff" stroke="#cbd5e1"/><text x="840" y="190" class="label">③ 跑 null</text><text x="840" y="232" class="body">构建 → SWIX → 装载</text><text x="840" y="270" class="body">只验证镜像与管理</text>
<rect x="40" y="380" width="330" height="155" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="60" y="420" class="label">④ 造过滤器</text><text x="60" y="462" class="body">MAC → 缓存 → RTL</text><text x="60" y="500" class="body">补原帧出口与寄存器</text>
<path d="M370 455H430" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="380" width="330" height="155" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="450" y="420" class="label">⑤ 定规则接口</text><text x="450" y="462" class="body">字段、额度、期限</text><text x="450" y="500" class="body">写规则不必重烧镜像</text>
<path d="M760 455H820" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="820" y="380" width="330" height="155" rx="14" fill="#e0f2fe" stroke="#cbd5e1"/><text x="840" y="420" class="label">⑥ 装载与验收</text><text x="840" y="462" class="body">新应用 → GAP → 恢复</text><text x="840" y="500" class="body">最后才测性能与持久化</text>
<path d="M985 305V342H205V380" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="602" class="sub">相同任务：Type A + Locate 8095 + 完整 NVDA 字段，只丢一次。</text><text x="40" y="641" class="sub">真机成败看入口、出口、板上审计与 Feed 是否指向同一 Session / Sequence。</text></svg>
