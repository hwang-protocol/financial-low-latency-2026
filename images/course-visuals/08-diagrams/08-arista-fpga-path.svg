<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1750" viewBox="0 0 1200 1750" role="img" aria-labelledby="title desc"><title id="title">从安装 App 到配置 FPGA 电路</title><desc id="desc">开发机将硬件代码编译为bit并与Python管理代码打包。install app把文件安装到7130存储中；app ntps下no shutdown调用program_fpga与load_image，由厂商接口装载bit配置FPGA。图中展示收发缓存、协议解析、NTP时间戳回复、时钟、寄存器和NTS认证电路；仅主路径画普通NTP请求。CPU管理与FPGA数据路径分开，未指定底层配置总线。</desc><defs>
