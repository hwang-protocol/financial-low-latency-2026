<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">U250 报文格式检查、ITCH 字段提取和目标匹配</title><desc id="desc">本例从以太网头起算字节偏移：以太网零至十三，IPv4 十四至三十三，UDP 三十四至四十一，MoldUDP64 四十二至六十一，消息长度六十二至六十三，ITCH 消息六十四至九十九。profile_ok 确认无 VLAN 固定 IPv4 UDP 格式及地址端口长度校验和与单条三十六字节消息。随后 market_filter 判断 Type A、Locate 8095、Stock NVDA 加四空格及剩余丢弃额度大于零。</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="teal" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker><marker id="purple" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker><symbol id="network" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="8" width="38" height="28" rx="4"/><path d="M12 36v6h24v-6M14 15v12m7-12v12m7-12v12m7-12v12"/></g></symbol><symbol id="chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="11" y="11" width="26" height="26" rx="4"/><path d="M17 4v7m7-7v7m7-7v7M17 37v7m7-7v7m7-7v7M4 17h7m-7 7h7m-7 7h7M37 17h7m-7 7h7m-7 7h7M18 18h12v12H18z"/></g></symbol><symbol id="host" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="4" y="7" width="40" height="28" rx="4"/><path d="M24 35v8M14 43h20M12 17h10m-10 7h22"/></g></symbol><symbol id="eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 24q21-28 42 0Q24 52 3 24z"/><circle cx="24" cy="24" r="7"/></g></symbol><symbol id="check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 24l7 7 14-15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M10 3h19l10 10v32H10zM29 3v11h10M17 23h15m-15 8h15m-15 7h10"/></g></symbol></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354f}.title{font-size:34px;font-weight:800}.head{font-size:27px;font-weight:750}.body{font-size:23px}.small{font-size:21px;fill:#586b84}.code{font-size:21px;font-weight:650}.label{font-size:24px;font-weight:700}.arrow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style><rect width="1200" height="850" fill="#fff" rx="20"/><text x="40" y="55" class="title" text-anchor="start">先看报文格式，再判断是不是目标行情</text><text x="40" y="96" class="body" text-anchor="start">本例格式：未带 VLAN 的 IPv4 / UDP，每包一条 36 字节 ITCH 新增订单。</text><rect x="40" y="143" width="160" height="96" rx="0" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/><text x="120.0" y="179" class="label" text-anchor="middle">以太网</text><text x="120.0" y="216" class="small" text-anchor="middle">0–13</text><rect x="200" y="143" width="160" height="96" rx="0" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/><text x="280.0" y="179" class="label" text-anchor="middle">IPv4</text><text x="280.0" y="216" class="small" text-anchor="middle">14–33</text><rect x="360" y="143" width="140" height="96" rx="0" fill="#ecfeff" stroke="#cbd5e1" stroke-width="2"/><text x="430.0" y="179" class="label" text-anchor="middle">UDP</text><text x="430.0" y="216" class="small" text-anchor="middle">34–41</text><rect x="500" y="143" width="200" height="96" rx="0" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2"/><text x="600.0" y="179" class="label" text-anchor="middle">MoldUDP64</text><text x="600.0" y="216" class="small" text-anchor="middle">42–61</text><rect x="700" y="143" width="120" height="96" rx="0" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/><text x="760.0" y="179" class="label" text-anchor="middle">消息长</text><text x="760.0" y="216" class="small" text-anchor="middle">62–63</text><rect x="820" y="143" width="340" height="96" rx="0" fill="#faf5ff" stroke="#cbd5e1" stroke-width="2"/><text x="990.0" y="179" class="label" text-anchor="middle">ITCH Type A</text><text x="990.0" y="216" class="small" text-anchor="middle">64–99</text><text x="40" y="273" class="small" text-anchor="start">字节偏移从以太网头起算；框宽仅作分组示意。</text><g class="node"><rect x="40" y="330" width="340" height="361" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="210.0" y="375" class="head" text-anchor="middle">① profile_ok</text><text x="210.0" y="419" class="label" text-anchor="middle">确认固定报文格式</text><text x="210.0" y="467" class="small" text-anchor="middle">IPv4 首部 20 B、无分片</text><text x="210.0" y="506" class="small" text-anchor="middle">源 / 目的地址与 UDP 端口</text><text x="210.0" y="545" class="small" text-anchor="middle">报文长度与校验和</text><text x="210.0" y="584" class="small" text-anchor="middle">Mold：1 条消息，长 36 B</text><text x="210.0" y="643" class="small" text-anchor="middle">符合格式才送去匹配</text></g><g class="node"><rect x="440" y="330" width="280" height="361" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><text x="580.0" y="375" class="head" text-anchor="middle">② 提取字段</text><text x="580.0" y="419" class="small" text-anchor="middle">s_itch：36 字节消息</text><text x="580.0" y="477" class="body" text-anchor="middle">Type：字节 64</text><text x="580.0" y="522" class="body" text-anchor="middle">Locate：65–66</text><text x="580.0" y="567" class="body" text-anchor="middle">Stock：88–95</text><text x="580.0" y="632" class="small" text-anchor="middle">另取 Mold 消息序号</text></g><g class="node"><rect x="780" y="330" width="380" height="361" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="970.0" y="375" class="head" text-anchor="middle">③ market_filter</text><text x="970.0" y="419" class="label" text-anchor="middle">目标身份 + 剩余额度</text><text x="970.0" y="477" class="body" text-anchor="middle">Type = A（新增订单）</text><text x="970.0" y="522" class="body" text-anchor="middle">Locate = 8095</text><text x="970.0" y="567" class="body" text-anchor="middle">Stock = NVDA + 4 个空格</text><text x="970.0" y="632" class="code" text-anchor="middle">remaining_drops &gt; 0</text></g><path d="M190 285V306" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M392 509H416" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M732 509H756" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><rect x="40" y="727" width="1120" height="89" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><use href="#check" x="57" y="749" width="42" height="42" style="color:#0f766e"/><text x="115" y="763" class="label" text-anchor="start">满足目标匹配且有额度：丢弃整帧，额度减 1。</text><text x="115" y="798" class="small" text-anchor="start">其他报文继续放行；Locate 是行情协议中的股票定位编号。</text></svg>
