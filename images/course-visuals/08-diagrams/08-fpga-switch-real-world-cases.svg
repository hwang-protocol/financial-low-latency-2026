<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380" role="img" aria-labelledby="title desc">
<title id="title">交换机里的 FPGA：三个真实应用</title><desc id="desc">上：Enyx nxLink Secure 在 Arista 7130 上为专用微波与光纤冗余路径提供报文仲裁与去重；微波争取低时延，光纤保障连续性。中：德交所用 7130 MetaWatch 对监测副本加时间戳并汇聚。下：Netnod 把 NTP/NTS 服务做到 7130 FPGA，图示普通 NTP 请求与回复。均根据原始案例简化。</desc>
<style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><defs>
<marker id="slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ea580c"/></marker>
<marker id="green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#15803d"/></marker>
<marker id="purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="1380" rx="22" fill="white" stroke="none" stroke-width="2"/>
<text x="36" y="54" font-size="36" fill="#0f172a" font-weight="800" text-anchor="start">交换机里的 FPGA：三个真实应用</text>
<text x="36" y="95" font-size="25" fill="#64748b" font-weight="400" text-anchor="start">交易链路选择  ·  交易所报文监测  ·  硬件报时</text>
<rect x="24" y="124" width="1152" height="360" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="48" y="146" width="42" height="42" rx="13" fill="#2563eb" stroke="none" stroke-width="2"/>
