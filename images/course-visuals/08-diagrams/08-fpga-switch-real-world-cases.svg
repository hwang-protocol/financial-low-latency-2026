<text x="1068" y="174" font-size="20" fill="#2563eb" font-weight="700" text-anchor="middle">厂商部署案例</text>
<text x="50" y="216" font-size="24" fill="#334155" font-weight="400" text-anchor="start">跨城交易：专用微波争取低时延，光纤冗余保障连续性。</text>
