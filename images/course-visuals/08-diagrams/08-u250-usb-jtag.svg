<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">U250 USB-JTAG 接头位置</title>
<desc id="desc">开发电脑用普通 USB Type-A 通过 USB-A 转 Micro-USB 线接到 U250 自带 I/O 挡板上的 Micro-AB 维护口。挡板是卡的一部分，不是机箱零件。同一挡板上还有两个 QSFP28 网口，不走配置线。FPGA 芯片在散热外壳下面，从挡板上看不见。</desc>
<defs>
<marker id="blue" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker>
</defs>
<style>
text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354f}
.title{font-size:32px;font-weight:800}
.body{font-size:22px}
.small{font-size:20px;fill:#586b84}
.label{font-size:22px;font-weight:700}
.arrow{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}
</style>
<rect width="1200" height="620" fill="#fff" rx="20"/>
<text x="40" y="52" class="title">配置线接在挡板的小 USB 口上</text>
<text x="40" y="90" class="body">图 1-1 是卡的顶面；USB 在卡自带的金属挡板上，不是机箱零件。</text>
<rect x="60" y="150" width="300" height="300" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="210" y="198" class="label" text-anchor="middle">开发电脑</text>
<text x="210" y="232" class="small" text-anchor="middle">Vivado Hardware Manager</text>
<rect x="318" y="278" width="42" height="28" rx="4" fill="#1e3a8a"/>
<rect x="324" y="284" width="22" height="16" rx="2" fill="#93c5fd"/>
<text x="210" y="360" class="small" text-anchor="middle">电脑侧：普通 USB Type-A</text>
<text x="210" y="390" class="small" text-anchor="middle">只有 USB-C 时换对应转接线</text>
<path d="M372 292H708" class="arrow" marker-end="url(#blue)"/>
<text x="540" y="268" class="label" text-anchor="middle" style="fill:#2563eb">USB-A 转 Micro-USB</text>
<text x="540" y="328" class="small" text-anchor="middle">这条线只做 JTAG 配置</text>
<rect x="732" y="140" width="408" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="936" y="180" class="label" text-anchor="middle">U250 I/O 挡板</text>
<rect x="860" y="200" width="152" height="272" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
<rect x="878" y="220" width="116" height="72" rx="6" fill="#0f172a"/>
<text x="936" y="262" class="small" text-anchor="middle" style="fill:#e2e8f0">QSFP28</text>
<rect x="878" y="308" width="116" height="72" rx="6" fill="#0f172a"/>
<text x="936" y="350" class="small" text-anchor="middle" style="fill:#e2e8f0">QSFP28</text>
<rect x="900" y="404" width="72" height="28" rx="3" fill="#1e3a8a" stroke="#2563eb" stroke-width="2"/>
<text x="936" y="456" class="small" text-anchor="middle">卡侧：Micro-AB</text>
<text x="936" y="482" class="small" text-anchor="middle">micro-USB 维护口</text>
<text x="40" y="560" class="body">两个大口是 100G 网口，不走配置。FPGA 芯片在散热外壳下面，挡板上只看见这些接头。</text>
<text x="40" y="596" class="small">依据 UG1289 / UG1301 / DS962：Micro-AB（USB）JTAG 配置口，位于 I/O 挡板，出厂常带防尘盖。</text>
</svg>
