<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Vivado 导航：像搭乐高分拣机一样构建过滤电路</title>
<desc id="desc">从导入代码到仿真、综合得到网表、实现、生成配置、观察电路、装载与实卡验收，共八步，按行从左到右阅读。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1040" fill="#ffffff"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="30" y="43" font-size="30" font-weight="800" fill="#0f172a">Vivado：搭一台“乐高分拣机”</text>
<text x="30" y="80" font-size="22" fill="#475569">按行从左到右读：先模拟功能，再精细设计与拼装，最后写入硬件。</text>
<rect x="20" y="103" width="1160" height="204" rx="14" fill="#e0f2fe"/>
<text x="40" y="133" font-size="23" font-weight="700" fill="#334155">准备与试验｜电脑里的设计</text>
<rect x="40" y="146" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="56" y="175" font-size="25" font-weight="800" fill="#0f172a">1. 接入代码 · 3.2</text>
<text x="56" y="205" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：放入搭建说明</text>
<text x="56" y="234" font-size="22" fill="#334155">Add Sources</text>
<text x="56" y="262" font-size="22" fill="#334155">得到：完整的源码层级</text>
<rect x="620" y="146" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="636" y="175" font-size="25" font-weight="800" fill="#0f172a">2. 行为仿真 · 3.3</text>
<text x="636" y="205" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：模拟模型，检查功能</text>
<text x="636" y="234" font-size="22" fill="#334155">Run Behavioral Simulation</text>
<text x="636" y="262" font-size="22" fill="#334155">得到：测试结果与波形</text>
<path d="M588 221 H596" stroke="#64748b" stroke-width="2" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<rect x="20" y="329" width="1160" height="204" rx="14" fill="#eef2ff"/>
<text x="40" y="359" font-size="23" font-weight="700" fill="#334155">构建电路｜网表到布局布线</text>
<rect x="40" y="372" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="56" y="401" font-size="25" font-weight="800" fill="#0f172a">3. 综合 → 网表 · 3.4</text>
<text x="56" y="431" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：细化到组件与接法</text>
<text x="56" y="460" font-size="22" fill="#334155">Run Synthesis</text>
<text x="56" y="488" font-size="22" fill="#334155">得到：综合网表</text>
<rect x="620" y="372" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="636" y="401" font-size="25" font-weight="800" fill="#0f172a">4. 实现：布局布线 · 3.5</text>
<text x="636" y="431" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：在电脑里完整拼装并检查</text>
<text x="636" y="460" font-size="22" fill="#334155">Run Implementation</text>
<text x="636" y="488" font-size="22" fill="#334155">得到：布局布线结果</text>
<path d="M588 447 H596" stroke="#64748b" stroke-width="2" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<rect x="20" y="555" width="1160" height="204" rx="14" fill="#f3e8ff"/>
<text x="40" y="585" font-size="23" font-weight="700" fill="#334155">输出与观察｜完成本课电脑主线</text>
<rect x="40" y="598" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="56" y="627" font-size="25" font-weight="800" fill="#0f172a">5. 生成 .bit · 3.6</text>
<text x="56" y="657" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：输出详细配置方案</text>
<text x="56" y="686" font-size="22" fill="#334155">Generate Bitstream</text>
<text x="56" y="714" font-size="22" fill="#334155">得到：open_nic_shell.bit</text>
<rect x="620" y="598" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="636" y="627" font-size="25" font-weight="800" fill="#0f172a">6. 观察电路 · 3.6</text>
<text x="636" y="657" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：查看接法与摆放图</text>
<text x="636" y="686" font-size="22" fill="#334155">Schematic / Device</text>
<text x="636" y="714" font-size="22" fill="#334155">得到：对电路结构的直观理解</text>
<path d="M588 673 H596" stroke="#64748b" stroke-width="2" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<rect x="20" y="781" width="1160" height="204" rx="14" fill="#fff7ed"/>
<text x="40" y="811" font-size="23" font-weight="700" fill="#334155">装载与使用｜需要真实板卡及配套工具</text>
<rect x="40" y="824" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="56" y="853" font-size="25" font-weight="800" fill="#0f172a">7. 装载到 FPGA · 3.7</text>
<text x="56" y="883" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：按方案在真实硬件上实施</text>
<text x="56" y="912" font-size="22" fill="#334155">Hardware Manager → Program Device</text>
<text x="56" y="940" font-size="22" fill="#334155">得到：已配置的 FPGA</text>
<rect x="620" y="824" width="540" height="147" rx="10" fill="white" stroke="#94a3b8"/>
<text x="636" y="853" font-size="25" font-weight="800" fill="#0f172a">8. 实卡应用与验收 · 3.8</text>
<text x="636" y="883" font-size="24" font-weight="700" fill="#7e22ce">乐高比喻：用真货检查分拣机</text>
<text x="636" y="912" font-size="22" fill="#334155">主机控制与收发工具</text>
<text x="636" y="940" font-size="22" fill="#334155">前提：板卡与主机工具就绪</text>
<path d="M588 899 H596" stroke="#64748b" stroke-width="2" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"/>
<text x="30" y="1030" font-size="22" fill="#475569">网表是综合的产物；观察电路不重新构建。实卡联调另需板卡与主机工具。</text>
</g></svg>