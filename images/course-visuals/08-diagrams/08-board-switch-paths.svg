<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc"><title id="title">U250 板卡与 Arista 交换机的运行路径</title><desc id="desc">U250 插在服务器内，网口帧经过 FPGA 过滤，再由 PCIe 交给同一服务器的接收应用，主机管理程序控制 FPGA。Arista 交换机内，入口帧经过 FPGA 过滤由网络出口发出，交换机内 EOS 管理 CPU 加载应用与读写寄存器。观察点分别为服务器接收应用与交换机出口接收端。</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="teal" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker><marker id="purple" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker><symbol id="network" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="8" width="38" height="28" rx="4"/><path d="M12 36v6h24v-6M14 15v12m7-12v12m7-12v12m7-12v12"/></g></symbol><symbol id="chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="11" y="11" width="26" height="26" rx="4"/><path d="M17 4v7m7-7v7m7-7v7M17 37v7m7-7v7m7-7v7M4 17h7m-7 7h7m-7 7h7M37 17h7m-7 7h7m-7 7h7M18 18h12v12H18z"/></g></symbol><symbol id="host" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="4" y="7" width="40" height="28" rx="4"/><path d="M24 35v8M14 43h20M12 17h10m-10 7h22"/></g></symbol><symbol id="eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 24q21-28 42 0Q24 52 3 24z"/><circle cx="24" cy="24" r="7"/></g></symbol><symbol id="check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 24l7 7 14-15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M10 3h19l10 10v32H10zM29 3v11h10M17 23h15m-15 8h15m-15 7h10"/></g></symbol></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354f}.title{font-size:34px;font-weight:800}.head{font-size:27px;font-weight:750}.body{font-size:23px}.small{font-size:21px;fill:#586b84}.code{font-size:21px;font-weight:650}.label{font-size:24px;font-weight:700}.arrow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style><rect width="1200" height="890" fill="#fff" rx="20"/><text x="40" y="55" class="title" text-anchor="start">同一个过滤思路，两种数据出口</text><text x="40" y="96" class="body" text-anchor="start">U250 把放行帧交给主机；交换机把放行帧送到网络出口。</text><rect x="220" y="135" width="940" height="285" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><use href="#host" x="243" y="151" width="40" height="40" style="color:#2563eb"/><text x="296" y="182" class="head" text-anchor="start">服务器：U250 板卡 + 主机软件</text><rect x="250" y="205" width="565" height="175" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="270" y="236" class="label" text-anchor="start" style="fill:#2563eb">U250 板卡</text><g class="node"><rect x="40" y="266" width="125" height="82" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="102.5" y="299" class="label" text-anchor="middle">行情源</text><text x="102.5" y="331" class="small" text-anchor="middle">发送报文</text></g><g class="node"><rect x="275" y="266" width="120" height="82" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="335.0" y="300" class="label" text-anchor="middle">网口</text><text x="335.0" y="331" class="small" text-anchor="middle">接收</text></g><g class="node"><rect x="455" y="266" width="190" height="82" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><text x="550.0" y="300" class="label" text-anchor="middle">FPGA 过滤</text><text x="550.0" y="331" class="small" text-anchor="middle">按规则放行</text></g><g class="node"><rect x="695" y="266" width="90" height="82" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="740.0" y="314" class="label" text-anchor="middle">PCIe</text></g><g class="node"><rect x="875" y="253" width="260" height="108" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="1005.0" y="288" class="label" text-anchor="middle">主机软件</text><text x="1005.0" y="322" class="small" text-anchor="middle">接收应用 + 管理程序</text><text x="1005.0" y="349" class="small" text-anchor="middle">核对序号 / 读写寄存器</text></g><path d="M177 307H251" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M407 307H431" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M657 307H671" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M797 307H851" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M1005 373V394H550V372" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><text x="692" y="412" class="small" text-anchor="middle" style="fill:#7c3aed">控制读写</text><use href="#eye" x="893" y="180" width="33" height="33" style="color:#0f766e"/><text x="936" y="205" class="small" text-anchor="start" style="fill:#0f766e">观察：主机接收</text><rect x="220" y="470" width="710" height="338" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><use href="#network" x="243" y="487" width="40" height="40" style="color:#0f766e"/><text x="296" y="518" class="head" text-anchor="start">Arista FPGA 交换机</text><g class="node"><rect x="435" y="551" width="440" height="82" rx="14" fill="#fff" stroke="#d8b4fe" stroke-width="2"/><text x="655.0" y="584" class="label" text-anchor="middle">EOS 管理 CPU</text><text x="655.0" y="616" class="small" text-anchor="middle">加载应用、配置规则、读取计数</text></g><g class="node"><rect x="40" y="694" width="125" height="82" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="102.5" y="727" class="label" text-anchor="middle">行情源</text><text x="102.5" y="759" class="small" text-anchor="middle">发送报文</text></g><g class="node"><rect x="275" y="694" width="120" height="82" rx="14" fill="#fff" stroke="#5eead4" stroke-width="2"/><text x="335.0" y="728" class="label" text-anchor="middle">入口</text><text x="335.0" y="759" class="small" text-anchor="middle">网络接收</text></g><g class="node"><rect x="455" y="694" width="240" height="82" rx="14" fill="#fff" stroke="#5eead4" stroke-width="2"/><text x="575.0" y="728" class="label" text-anchor="middle">FPGA 过滤</text><text x="575.0" y="759" class="small" text-anchor="middle">按规则放行</text></g><g class="node"><rect x="775" y="694" width="120" height="82" rx="14" fill="#fff" stroke="#5eead4" stroke-width="2"/><text x="835.0" y="728" class="label" text-anchor="middle">出口</text><text x="835.0" y="759" class="small" text-anchor="middle">网络发送</text></g><g class="node"><rect x="990" y="681" width="170" height="108" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1075.0" y="716" class="label" text-anchor="middle">接收端</text><text x="1075.0" y="753" class="small" text-anchor="middle">核对行情序号</text></g><path d="M177 735H251" class="arrow" stroke="#0f766e" marker-end="url(#teal)"/><path d="M407 735H431" class="arrow" stroke="#0f766e" marker-end="url(#teal)"/><path d="M707 735H751" class="arrow" stroke="#0f766e" marker-end="url(#teal)"/><path d="M907 735H966" class="arrow" stroke="#0f766e" marker-end="url(#teal)"/><path d="M575 645V670" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><text x="599" y="672" class="small" text-anchor="start" style="fill:#7c3aed">控制读写</text><use href="#eye" x="987" y="598" width="33" height="33" style="color:#0f766e"/><text x="1028" y="624" class="small" text-anchor="start" style="fill:#0f766e">观察：出口接收</text><text x="40" y="856" class="small" text-anchor="start">蓝 / 绿色箭头传行情；紫色箭头发控制请求，结果沿原路径返回。</text></svg>
