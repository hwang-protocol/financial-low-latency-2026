<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">U250 的行情数据与控制读写路径</title><desc id="desc">U250 板内网口接收适配经过 flle_rx_port 中的 flle_rx_filter 与 market_filter 决策，放行帧经 QDMA 和 PCIe 到主机应用。管理程序从主机经 PCIe、AXI-Lite、跨时钟 IP 访问控制寄存器，控制寄存器连接过滤器，回读沿原控制路径返回。USB 下载不在此运行路径图中。</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker><marker id="teal" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker><marker id="purple" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#7c3aed"/></marker><symbol id="network" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="8" width="38" height="28" rx="4"/><path d="M12 36v6h24v-6M14 15v12m7-12v12m7-12v12m7-12v12"/></g></symbol><symbol id="chip" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="11" y="11" width="26" height="26" rx="4"/><path d="M17 4v7m7-7v7m7-7v7M17 37v7m7-7v7m7-7v7M4 17h7m-7 7h7m-7 7h7M37 17h7m-7 7h7m-7 7h7M18 18h12v12H18z"/></g></symbol><symbol id="host" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="4" y="7" width="40" height="28" rx="4"/><path d="M24 35v8M14 43h20M12 17h10m-10 7h22"/></g></symbol><symbol id="eye" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 24q21-28 42 0Q24 52 3 24z"/><circle cx="24" cy="24" r="7"/></g></symbol><symbol id="check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 24l7 7 14-15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="file" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M10 3h19l10 10v32H10zM29 3v11h10M17 23h15m-15 8h15m-15 7h10"/></g></symbol></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354f}.title{font-size:34px;font-weight:800}.head{font-size:27px;font-weight:750}.body{font-size:23px}.small{font-size:21px;fill:#586b84}.code{font-size:21px;font-weight:650}.label{font-size:24px;font-weight:700}.arrow{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style><rect width="1200" height="820" fill="#fff" rx="20"/><text x="40" y="55" class="title" text-anchor="start">U250：行情向主机走，控制从主机来</text><text x="40" y="96" class="body" text-anchor="start">OpenNIC 提供网口与 PCIe 接口；课程逻辑接在接收路径中。</text><rect x="40" y="140" width="880" height="595" rx="20" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/><rect x="950" y="140" width="210" height="595" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><use href="#chip" x="61" y="155" width="40" height="40" style="color:#2563eb"/><text x="114" y="186" class="head" text-anchor="start">Alveo U250 · OpenNIC 工程</text><use href="#host" x="970" y="155" width="40" height="40" style="color:#2563eb"/><text x="1020" y="186" class="head" text-anchor="start">主机</text><rect x="275" y="225" width="435" height="453" rx="16" fill="#fff" stroke="#a5b4fc" stroke-width="2"/><text x="298" y="261" class="label" text-anchor="start">flle_rx_port：接收端口封装</text><text x="66" y="268" class="label" text-anchor="start" style="fill:#2563eb">行情数据</text><g class="node"><rect x="65" y="302" width="160" height="118" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="145.0" y="347" class="label" text-anchor="middle">网口 / MAC</text><text x="145.0" y="386" class="body" text-anchor="middle">接收适配</text></g><rect x="300" y="302" width="385" height="174" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="322" y="339" class="label" text-anchor="start">flle_rx_filter</text><text x="322" y="374" class="small" text-anchor="start">缓存、检查，再按判定处理整帧</text><g class="node"><rect x="500" y="384" width="167" height="80" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><text x="583.5" y="419" class="code" text-anchor="middle">market_filter</text><text x="583.5" y="448" class="small" text-anchor="middle">返回丢 / 放判定</text></g><text x="320" y="434" class="small" text-anchor="start">提取字段</text><path d="M424 428H476" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><g class="node"><rect x="765" y="302" width="120" height="118" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="825.0" y="344" class="label" text-anchor="middle">QDMA</text><text x="825.0" y="382" class="small" text-anchor="middle">数据传输</text></g><g class="node"><rect x="970" y="302" width="170" height="118" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="1055.0" y="346" class="label" text-anchor="middle">接收应用</text><text x="1055.0" y="385" class="small" text-anchor="middle">读取行情</text></g><path d="M237 362H276" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M697 362H741" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><path d="M897 362H946" class="arrow" stroke="#2563eb" marker-end="url(#blue)"/><text x="927" y="290" class="small" text-anchor="middle" style="fill:#2563eb">PCIe</text><text x="67" y="510" class="label" text-anchor="start" style="fill:#7c3aed">控制读写</text><g class="node"><rect x="300" y="548" width="180" height="118" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="390.0" y="592" class="label" text-anchor="middle">控制寄存器</text><text x="390.0" y="631" class="small" text-anchor="middle">命令、额度、计数</text></g><g class="node"><rect x="530" y="548" width="155" height="118" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/><text x="607.5" y="592" class="label" text-anchor="middle">跨时钟 IP</text><text x="607.5" y="631" class="small" text-anchor="middle">安全传递读写</text></g><g class="node"><rect x="765" y="548" width="120" height="118" rx="14" fill="#fff" stroke="#d8b4fe" stroke-width="2"/><text x="825.0" y="592" class="code" text-anchor="middle">AXI-Lite</text><text x="825.0" y="631" class="small" text-anchor="middle">控制总线</text></g><g class="node"><rect x="970" y="548" width="170" height="118" rx="14" fill="#fff" stroke="#d8b4fe" stroke-width="2"/><text x="1055.0" y="592" class="label" text-anchor="middle">管理程序</text><text x="1055.0" y="631" class="small" text-anchor="middle">授权、读计数</text></g><path d="M958 608H909" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><path d="M753 608H709" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><path d="M518 608H504" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><path d="M390 536V500" class="arrow" stroke="#7c3aed" marker-end="url(#purple)"/><text x="402" y="521" class="small" text-anchor="start" style="fill:#7c3aed">授权 / 回读</text><text x="928" y="536" class="small" text-anchor="middle" style="fill:#7c3aed">PCIe</text><text x="61" y="716" class="small" text-anchor="start">AXI-Lite：轻量寄存器读写接口；读回的数据沿控制路径返回主机。</text><use href="#eye" x="47" y="758" width="36" height="36" style="color:#0f766e"/><text x="94" y="785" class="body" text-anchor="start">观察结果：主机收到哪些序号，以及板卡记录的放行数、丢弃数。</text></svg>
