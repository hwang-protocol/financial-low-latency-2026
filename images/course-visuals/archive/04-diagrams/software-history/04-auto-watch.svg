<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:800}.s{font-size:15px;fill:#475569}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="396" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="56">AUTO 跟着跑，是为了看现场有没有自己变</text>
  <text class="t s" x="52" y="88">本步不改它的交棒。它变了很多，这一轮就不可信。</text>

  <rect x="52" y="122" width="320" height="200" rx="18" fill="#fff"/>
  <rect x="52" y="122" width="320" height="48" rx="18" fill="#f1f5f9"/>
  <path d="M52 152h320v18H52z" fill="#f1f5f9"/>
  <text class="t k" x="212" y="154" text-anchor="middle">1. 现场自己变了</text>
  <text class="t s" x="212" y="210" text-anchor="middle">机器忙了</text>
  <text class="t s" x="212" y="244" text-anchor="middle">行情或交换机抖了</text>
  <rect x="52" y="122" width="320" height="200" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M372 222H404" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="420" y="122" width="320" height="200" rx="18" fill="#fff"/>
  <rect x="420" y="122" width="320" height="48" rx="18" fill="#dcfce7"/>
  <path d="M420 152h320v18H420z" fill="#dcfce7"/>
  <text class="t k" x="580" y="154" text-anchor="middle">2. AUTO 跟着跳</text>
  <text class="t s" x="580" y="210" text-anchor="middle">交棒规则没改</text>
  <text class="t s" x="580" y="244" text-anchor="middle">往返时间却自己变了</text>
  <rect x="420" y="122" width="320" height="200" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M740 222H772" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="788" y="122" width="360" height="200" rx="18" fill="#fff"/>
  <rect x="788" y="122" width="360" height="48" rx="18" fill="#ffedd5"/>
  <path d="M788 152h360v18H788z" fill="#ffedd5"/>
  <text class="t k" x="968" y="154" text-anchor="middle">3. 这一轮不可信</text>
  <text class="t s" x="968" y="210" text-anchor="middle">保留记录，不作性能基线</text>
  <text class="t s" x="968" y="244" text-anchor="middle">不是把 AUTO 关掉</text>
  <rect x="788" y="122" width="360" height="200" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="52" y="348" width="1096" height="36" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="600" y="372" font-size="16" font-weight="800" text-anchor="middle">先看 AUTO 环境检查，再读 MANUAL 的差异</text>
</svg>
