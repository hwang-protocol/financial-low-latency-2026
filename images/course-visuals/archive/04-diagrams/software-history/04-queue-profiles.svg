<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <marker id="blue" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:900}.s{font-size:15px;fill:#475569}.m{font-family:monospace;font-size:14px;font-weight:700}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="576" rx="26" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t h" x="52" y="62">三种队列只改线程交接，不换交易协议</text>
  <text class="t s" x="52" y="92">producer 是 MANUAL 管理线程，consumer 是 order thread；两者仍发送同一条 OUCH 订单。</text>

  <rect x="50" y="130" width="340" height="390" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="430" y="130" width="340" height="390" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="810" y="130" width="340" height="390" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="t k" x="74" y="170">① DEQUE_CV · 原始基线</text>
  <text class="t k" x="454" y="170">② FIXED_CV · 只换储存</text>
  <text class="t k" x="834" y="170">③ SPSC_SPIN · 再换同步</text>

  <rect x="76" y="220" width="100" height="58" rx="12" fill="#dbeafe" stroke="#2563eb"/><text class="t s" x="126" y="254" text-anchor="middle">producer</text>
  <rect x="264" y="220" width="100" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/><text class="t s" x="314" y="254" text-anchor="middle">consumer</text>
  <path d="M176 249H248" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <rect x="161" y="320" width="120" height="54" rx="10" fill="#f1f5f9" stroke="#64748b"/><text class="t m" x="221" y="352" text-anchor="middle">std::deque</text>
  <text class="t s" x="221" y="407" text-anchor="middle">mutex 保护 push / pop</text><text class="t s" x="221" y="434" text-anchor="middle">condition_variable 唤醒</text><text class="t s" x="221" y="476" text-anchor="middle">储存可增长；线程会睡眠</text>

  <rect x="456" y="220" width="100" height="58" rx="12" fill="#dbeafe" stroke="#2563eb"/><text class="t s" x="506" y="254" text-anchor="middle">producer</text>
  <rect x="644" y="220" width="100" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/><text class="t s" x="694" y="254" text-anchor="middle">consumer</text>
  <path d="M556 249H628" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <rect x="531" y="320" width="140" height="54" rx="10" fill="#ffedd5" stroke="#ea580c"/><text class="t m" x="601" y="352" text-anchor="middle">array[1024]</text>
  <text class="t s" x="601" y="407" text-anchor="middle">仍有 mutex + CV</text><text class="t s" x="601" y="434" text-anchor="middle">只去掉队列节点增长</text><text class="t s" x="601" y="476" text-anchor="middle">不是“无锁”；不是全 App 预分配</text>

  <rect x="836" y="220" width="100" height="58" rx="12" fill="#dbeafe" stroke="#2563eb"/><text class="t s" x="886" y="254" text-anchor="middle">producer</text>
  <rect x="1024" y="220" width="100" height="58" rx="12" fill="#dcfce7" stroke="#16a34a"/><text class="t s" x="1074" y="254" text-anchor="middle">consumer</text>
  <path d="M936 249H1008" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
  <rect x="903" y="320" width="156" height="54" rx="10" fill="#cffafe" stroke="#0891b2"/><text class="t m" x="981" y="352" text-anchor="middle">head / tail</text>
  <text class="t s" x="981" y="407" text-anchor="middle">release / acquire 交接</text><text class="t s" x="981" y="434" text-anchor="middle">PAUSE 忙轮询，不让出 CPU</text><text class="t s" x="981" y="476" text-anchor="middle">只适合恰好 1P / 1C + 专用核</text>
  <rect x="50" y="544" width="1100" height="30" rx="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="600" y="565" text-anchor="middle" font-size="15" font-weight="800">每个 profile：8 轮 × 400 笔 measured IOC；相同 OUCH、相同行情、AUTO 策略继续运行</text>
</svg>
