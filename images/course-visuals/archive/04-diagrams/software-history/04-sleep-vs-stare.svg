<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei","Noto Sans SC",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:800}.s{font-size:16px;fill:#475569}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="524" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="56">改变交棒规则：锁与唤醒，或 SPSC 忙轮询</text>
  <text class="t s" x="52" y="88">格子还是运行 ② 那 1024 格。座位还没改。</text>

  <rect x="52" y="118" width="500" height="280" rx="18" fill="#fff"/>
  <rect x="52" y="118" width="500" height="48" rx="18" fill="#f1f5f9"/>
  <path d="M52 148h500v18H52z" fill="#f1f5f9"/>
  <text class="t k" x="302" y="150" text-anchor="middle">运行 ② 还在用 · 睡着叫醒</text>
  <text class="t s" x="302" y="204" text-anchor="middle">交接区空了，下单线程就睡觉</text>
  <text class="t s" x="302" y="238" text-anchor="middle">管理线程放进订单，再喊一声</text>
  <text class="t s" x="302" y="272" text-anchor="middle">操作系统再去叫醒下单线程</text>
  <text class="t s" x="302" y="312" text-anchor="middle">省核，但中间多一趟「去叫人」</text>
  <rect x="52" y="118" width="500" height="280" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M552 258H580" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="596" y="118" width="552" height="280" rx="18" fill="#fff"/>
  <rect x="596" y="118" width="552" height="48" rx="18" fill="#ffedd5"/>
  <path d="M596 148h552v18H596z" fill="#ffedd5"/>
  <text class="t k" x="872" y="150" text-anchor="middle">本步要换上 · 一直盯着</text>
  <text class="t s" x="872" y="204" text-anchor="middle">下单线程不睡，眼睛盯着交接区</text>
  <text class="t s" x="872" y="238" text-anchor="middle">轮询发现订单后取出</text>
  <text class="t s" x="872" y="272" text-anchor="middle">不必每次睡眠、等待唤醒</text>
  <text class="t s" x="872" y="312" text-anchor="middle">减少唤醒等待，持续消耗 CPU</text>
  <rect x="596" y="118" width="552" height="280" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="52" y="454" width="1096" height="36" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="600" y="478" font-size="16" font-weight="800" text-anchor="middle">右边浅橙色标题才是本步要换上的。MANUAL 仍独占 CPU 2，AUTO 仍坐 CPU 3</text>
