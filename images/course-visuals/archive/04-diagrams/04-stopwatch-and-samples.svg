<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>订单往返：秒表从哪里开始，到哪里结束</title><desc>计时由同一 C++ 程序读取单调时钟；网页和绘图工具不替订单按秒表。</desc><defs>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#7e22ce"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#15803d"/></marker>
<marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#c76a08"/></marker>
<marker id="arr-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#64748b"/></marker>
<marker id="arr-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#172338"/></marker>
<symbol id="chip" viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="6"/><rect x="23" y="23" width="18" height="18" rx="2"/><path d="M20 4v8m12-8v8m12-8v8M20 52v8m12-8v8m12-8v8M4 20h8m-8 12h8m-8 12h8m40-24h8m-8 12h8m-8 12h8"/></symbol>
<symbol id="file" viewBox="0 0 64 64"><path d="M16 5h23l12 12v42H16zM39 5v14h12M24 29h19M24 38h19M24 47h13"/></symbol>
<symbol id="packet" viewBox="0 0 64 64"><rect x="6" y="13" width="52" height="38" rx="5"/><path d="m7 15 25 20 25-20M7 49l16-15m34 15L41 34"/></symbol>
<symbol id="box" viewBox="0 0 64 64"><path d="m6 19 26-13 26 13v29L32 60 6 48zM6 19l26 13 26-13M32 32v28M19 12l26 13v12"/></symbol>
<symbol id="server" viewBox="0 0 64 64"><rect x="12" y="5" width="40" height="54" rx="5"/><path d="M13 23h38M13 41h38M31 14h12M31 32h12M31 50h12"/><circle cx="22" cy="14" r="2"/><circle cx="22" cy="32" r="2"/><circle cx="22" cy="50" r="2"/></symbol>
<symbol id="cache" viewBox="0 0 64 64"><rect x="6" y="9" width="52" height="46" rx="5"/><path d="M7 32h50M24 20h16M24 43h16"/></symbol>
<symbol id="ram" viewBox="0 0 64 64"><rect x="3" y="16" width="58" height="30" rx="4"/><path d="M10 46v9m9-9v9m9-9v9m9-9v9m9-9v9m9-9v9"/><rect x="11" y="23" width="14" height="15"/><rect x="36" y="23" width="14" height="15"/></symbol>
<symbol id="clock" viewBox="0 0 64 64"><circle cx="32" cy="35" r="23"/><path d="M32 12V5m-9 0h18m10 8 6 6M32 21v15l12 7"/></symbol>
<symbol id="eye" viewBox="0 0 64 64"><path d="M3 32s11-18 29-18 29 18 29 18-11 18-29 18S3 32 3 32z"/><circle cx="32" cy="32" r="9"/></symbol>
<symbol id="check" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="m17 32 10 10 22-23"/></symbol>
<symbol id="queue" viewBox="0 0 64 64"><rect x="4" y="22" width="13" height="22" rx="2"/><rect x="22" y="22" width="13" height="22" rx="2"/><rect x="40" y="22" width="13" height="22" rx="2"/><path d="M60 9v46M3 51h50"/></symbol>
<symbol id="gate" viewBox="0 0 64 64"><path d="M7 57V12h50v45M7 22h50M25 23v34M39 23v34M2 57h60"/></symbol>
<symbol id="key" viewBox="0 0 64 64"><circle cx="21" cy="25" r="13"/><path d="m30 34 24 24m-13-13 7-7m-1 13 7-7"/></symbol>
<symbol id="gear" viewBox="0 0 64 64"><path d="M25 6h14l2 10 9-3 7 12-8 7 8 7-7 12-9-3-2 10H25l-2-10-9 3-7-12 8-7-8-7 7-12 9 3z"/><circle cx="32" cy="32" r="10"/></symbol>
<symbol id="screen" viewBox="0 0 64 64"><rect x="4" y="8" width="56" height="39" rx="5"/><path d="M32 47v10M18 58h28M12 37l10-9 9 5 18-16"/></symbol>
</defs><rect width="1200" height="100%" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" fill="#172338" font-weight="700" text-anchor="start">订单往返：秒表从哪里开始，到哪里结束</text>
<text x="36" y="94" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">计时由同一 C++ 程序读取单调时钟；网页和绘图工具不替订单按秒表。</text>
<rect x="40" y="160" width="300" height="185" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#clock" x="58" y="178" width="58" height="58" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="128" y="213" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">开始 t0</text>
<text x="62" y="265" font-size="23" fill="#172338" font-weight="400" text-anchor="start">发送订单 O</text>
<text x="62" y="300" font-size="23" fill="#172338" font-weight="400" text-anchor="start">记录本笔起点</text>
<rect x="450" y="160" width="300" height="185" rx="15" fill="#fff" stroke="#c76a08" stroke-width="1.6"/>
<use href="#packet" x="468" y="178" width="58" height="58" fill="none" stroke="#c76a08" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="538" y="213" font-size="26" fill="#c76a08" font-weight="700" text-anchor="start">中间状态</text>
<text x="472" y="265" font-size="23" fill="#172338" font-weight="400" text-anchor="start">若收到 Accepted A</text>
<text x="472" y="300" font-size="23" fill="#172338" font-weight="400" text-anchor="start">表示收下，还不停表</text>
<rect x="860" y="160" width="300" height="185" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#check" x="878" y="178" width="58" height="58" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="948" y="213" font-size="26" fill="#15803d" font-weight="700" text-anchor="start">结束 t1</text>
<text x="882" y="265" font-size="23" fill="#172338" font-weight="400" text-anchor="start">收到最终 E 或 J</text>
<text x="882" y="300" font-size="23" fill="#172338" font-weight="400" text-anchor="start">成交或拒绝后记终点</text>
<path d="M352,250 L426.00,250.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<path d="M762,250 L836.00,250.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<text x="600" y="400" font-size="30" fill="#7e22ce" font-weight="700" text-anchor="middle">本笔 order_rtt_ns = t1 − t0</text>
<rect x="40" y="446" width="340" height="100" rx="15" fill="#edf1f5" stroke="#64748b" stroke-width="1.6"/>
<text x="64" y="485" font-size="26" fill="#64748b" font-weight="700" text-anchor="start">先预热 20 笔</text>
<text x="64" y="522" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">写 CSV，不进入摘要</text>
<rect x="440" y="446" width="720" height="100" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="466" y="485" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">再统计 200 笔 · 目标间隔 20 ms</text>
<text x="466" y="522" font-size="23" fill="#172338" font-weight="400" text-anchor="start">保留逐笔值 → 排序 → 计算 p50 / p99 / max</text>
<text x="36" y="610" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">同一批样本、同一起止点，才可以核对原始文件、指标摘要和看板上的数。</text>
</g></svg>