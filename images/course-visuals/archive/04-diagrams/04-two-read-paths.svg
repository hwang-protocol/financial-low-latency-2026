<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">课堂计时单与驾驶舱摘要是两条旁路</title>
  <desc id="desc">C++把逐笔RTT留在.2内存。运行1时.111 helper用TCP管理口发送MEASUREMENT_SAMPLES，收到JSON后在本机写成CSV。Gateway每秒用同一类TCP管理口发送STATE，收到摘要JSON后渲染/metrics，Prometheus再HTTP刮取。</desc>
  <defs>
    <marker id="green" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#059669"/></marker>
    <marker id="slate" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#64748b"/></marker>
    <marker id="cyan" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#0891b2"/></marker>
  </defs>
  <rect x="18" y="18" width="1164" height="624" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="68" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700" fill="#475569">TWO READ PATHS · SAME C++ CLOCK</text>
  <text x="62" y="108" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" font-weight="800" fill="#0f172a">CSV 在 .111 本地写成，Gateway 问的是 STATE</text>

  <rect x="56" y="148" width="300" height="430" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="206" y="196" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" font-weight="800" fill="#065f46">.2 MANUAL · C++</text>
  <text x="86" y="252" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">内存：逐笔 order_rtt_ns</text>
  <text x="86" y="290" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">内存：p50 / p99 / max</text>
  <text x="86" y="328" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" fill="#334155">管理口 TCP :48122</text>
  <text x="86" y="384" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#047857">样本只在内存里</text>
  <text x="86" y="422" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#64748b">谁来问，就回一行 JSON</text>
  <text x="86" y="520" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">AUTO :48121</text>
  <text x="86" y="548" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">Exchange :48120</text>

  <rect x="430" y="148" width="300" height="168" rx="20" fill="#fff" stroke="#059669" stroke-width="3"/>
  <text x="580" y="192" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="800" fill="#065f46">1 课堂计时单</text>
  <text x="580" y="232" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#334155">.111 helper</text>
  <text x="580" y="268" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">本机写成 raw CSV</text>
  <text x="580" y="298" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#047857">helper 本机落盘</text>
  <line x1="414" y1="216" x2="372" y2="216" stroke="#059669" stroke-width="4" marker-end="url(#green)"/>
  <text x="385" y="199" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#047857">请求</text>
  <line x1="356" y1="258" x2="414" y2="258" stroke="#059669" stroke-width="4" marker-end="url(#green)"/>
  <text x="385" y="283" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#047857">逐笔 JSON</text>

  <rect x="760" y="148" width="372" height="168" rx="20" fill="#ecfdf5" stroke="#059669"/>
  <text x="946" y="192" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#065f46">本卡命令与回执</text>
  <text x="946" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#0f172a">MEASUREMENT_SAMPLES</text>
  <text x="946" y="268" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">请求向左 · 20+200 笔 JSON 向右</text>
  <text x="946" y="298" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">helper 在 .111 落盘</text>

  <rect x="430" y="360" width="300" height="218" rx="20" fill="#fff" stroke="#64748b" stroke-width="3"/>
  <text x="580" y="404" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" font-weight="800" fill="#334155">2 驾驶舱摘要</text>
  <text x="580" y="444" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#334155">.101 Gateway :8088</text>
  <text x="580" y="480" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">每秒问 STATE</text>
  <text x="580" y="512" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#334155">渲染成本机 /metrics</text>
  <text x="580" y="548" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#64748b">只吃 STATE 摘要</text>
  <line x1="414" y1="440" x2="372" y2="440" stroke="#64748b" stroke-width="4" marker-end="url(#slate)"/>
  <text x="385" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">STATE</text>
  <line x1="356" y1="488" x2="414" y2="488" stroke="#64748b" stroke-width="4" marker-end="url(#slate)"/>
  <text x="385" y="513" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#475569">摘要 JSON</text>

  <rect x="760" y="360" width="372" height="100" rx="18" fill="#fff" stroke="#64748b"/>
  <text x="946" y="400" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700" fill="#334155">Gateway 每秒轮询</text>
  <text x="946" y="436" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="800" fill="#0f172a">STATE 向左 · 摘要 JSON 向右</text>

  <rect x="800" y="478" width="332" height="100" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="966" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#9f1239">.101 Prometheus</text>
  <text x="966" y="552" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#64748b">HTTP 刮 10.1.1.101:8088/metrics</text>
  <line x1="800" y1="528" x2="746" y2="528" stroke="#0891b2" stroke-width="4" marker-end="url(#cyan)"/>

  <rect x="56" y="596" width="1088" height="34" rx="12" fill="#e2e8f0"/>
  <text x="600" y="619" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#334155">管理口是一行 ASCII 命令加一行 JSON；helper 本机写 CSV，Gateway 问 STATE</text>
</svg>
