<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc">
<title id="title">从程序地址找到数据：七条编号箭头</title>
<desc id="desc">从1查询TLB开始。有可用记录经2访问主内存；未命中经3查页表，查到可用记录经4保存翻译结果并继续2；需要处理时经5交给内核，修复后经6重试访问，无法恢复经7报告错误。页表也存放在主内存中，图中单独画出用于讲解。</desc>
<defs>
 <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#bda1f8"/><stop offset="1" stop-color="#7149b8"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#9ab9ef"/><stop offset="1" stop-color="#42669b"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#dce5f0"/><stop offset="1" stop-color="#879bad"/></linearGradient>
 <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#537aa6"/><stop offset="1" stop-color="#18334f"/></linearGradient>
 <linearGradient id="page" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9eef8"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#203453" flood-opacity=".13"/></filter>

