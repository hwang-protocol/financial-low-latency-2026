 <path d="M37 35 L64 63 M64 35 L37 63" stroke="#bc4651" stroke-width="7" stroke-linecap="round"/>
</symbol>
</defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24354e} .h{font-size:25px;font-weight:750} .body{font-size:22px} .small{font-size:20px} .muted{fill:#5e7088} .edge{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style>
<rect width="1200" height="1270" fill="#f7f9fd"/>
<rect x="24" y="20" width="1152" height="1230" rx="24" fill="#fff" stroke="#e1e7f0"/>
<text x="52" y="70" font-size="34" font-weight="800">从程序地址找到数据</text>
<text x="52" y="110" class="body muted">从①开始，按条件沿箭头走；每个编号对应图下的一行说明。</text>

<rect id="node-start" x="40" y="160" width="250" height="200" rx="18" fill="#f8f5ff" stroke="#cfbee9" stroke-width="2"/>
<text x="165" y="197" class="h" text-anchor="middle">程序使用虚拟地址</text>
<use href="#terminal" x="97" y="211" width="136" height="102" filter="url(#shadow)"/>
<text x="165" y="337" class="small" text-anchor="middle">从库存编号出发</text>
<rect id="node-tlb" x="430" y="160" width="330" height="200" rx="18" fill="#f8f5ff" stroke="#c6b5e4" stroke-width="2"/>
<text x="450" y="196" class="h">TLB · 常用地址记录</text>
<use href="#tlb" x="445" y="213" width="108" height="112" filter="url(#shadow)"/>
<text x="574" y="254" class="h">小纸条</text>
<text x="574" y="293" class="small">有可用记录？</text>
<rect id="node-memory" x="940" y="160" width="220" height="400" rx="18" fill="#f2f9f6" stroke="#bad9c9" stroke-width="2"/>
<text x="1050" y="200" class="h" text-anchor="middle">主内存</text>
<use href="#memory" x="978" y="220" width="146" height="222" filter="url(#shadow)"/>
<text x="1050" y="484" class="body" text-anchor="middle">按物理地址</text>
<text x="1050" y="521" class="body" text-anchor="middle">读写目标数据</text>
<rect id="node-table" x="430" y="560" width="330" height="200" rx="18" fill="#f3f7ff" stroke="#bbcee9" stroke-width="2"/>
<text x="450" y="596" class="h">页表 · 地址对应关系</text>
<use href="#book" x="438" y="608" width="119" height="119" filter="url(#shadow)"/>
<text x="574" y="653" class="h">账本</text>
<text x="574" y="692" class="small">记录能直接用？</text>
<rect id="node-kernel" x="430" y="950" width="330" height="200" rx="18" fill="#fff8ee" stroke="#e7caaa" stroke-width="2"/>
<text x="450" y="987" class="h">内核 · 处理缺页</text>
<use href="#workshop" x="440" y="999" width="112" height="105" filter="url(#shadow)"/>
<text x="578" y="1044" class="body">准备页面</text>
<text x="578" y="1080" class="body">补好映射</text>
<rect id="node-error" x="940" y="950" width="220" height="200" rx="18" fill="#fff5f5" stroke="#e5bdc3" stroke-width="2"/>
<text x="1050" y="987" class="h" text-anchor="middle">访问无法继续</text>
<use href="#error" x="1013" y="1004" width="74" height="74" filter="url(#shadow)"/>
<text x="1050" y="1123" class="small" text-anchor="middle">向程序报告错误</text>
<rect id="reading-guide" x="48" y="490" width="285" height="350" rx="18" fill="#f8fafc" stroke="#e0e7f0" stroke-width="2"/>
<text x="70" y="531" class="h">先读这三条路线</text>
<text x="70" y="577" class="small">小纸条已有记录</text>
<text x="70" y="608" class="body" style="fill:#7752b7">① → ②</text>
<text x="70" y="661" class="small">需要查账本</text>
<text x="70" y="692" class="body" style="fill:#7752b7">① → ③ → ④ → ②</text>
<text x="70" y="745" class="small">需要先准备页面</text>
<text x="70" y="776" class="body" style="fill:#7752b7">① → ③ → ⑤ → ⑥</text>
<text x="70" y="810" class="small muted">修复后，再从①开始</text>
<path id="edge-1" data-source="node-start" data-target="node-tlb" data-tip="418,260" class="edge" d="M302 260 H406" stroke="#7752b7" marker-end="url(#arrow-purple)"/>
<circle cx="356" cy="260" r="18" fill="#7752b7" stroke="#fff" stroke-width="3"/>
<text x="356" y="268" class="h" text-anchor="middle" style="fill:#fff">1</text>
<text x="356" y="225" class="small" text-anchor="middle" style="fill:#7752b7">查询小纸条</text>
<path id="edge-2" data-source="node-tlb" data-target="node-memory" data-tip="928,260" class="edge" d="M772 260 H916" stroke="#238453" marker-end="url(#arrow-green)"/>
<circle cx="850" cy="260" r="18" fill="#238453" stroke="#fff" stroke-width="3"/>
<text x="850" y="268" class="h" text-anchor="middle" style="fill:#fff">2</text>
<text x="850" y="225" class="small" text-anchor="middle" style="fill:#238453">结果可用</text>
<path id="edge-3" data-source="node-tlb" data-target="node-table" data-tip="510,548" class="edge" d="M510 372 V536" stroke="#7752b7" marker-end="url(#arrow-purple)"/>
<circle cx="510" cy="447" r="18" fill="#7752b7" stroke="#fff" stroke-width="3"/>
<text x="510" y="455" class="h" text-anchor="middle" style="fill:#fff">3</text>
<text x="480" y="433" class="small" text-anchor="end" style="fill:#7752b7">未命中</text>
<text x="480" y="465" class="small" text-anchor="end" style="fill:#7752b7">查页表</text>
<path id="edge-4" data-source="node-table" data-target="node-tlb" data-tip="710,372" class="edge" d="M710 548 V384" stroke="#238453" marker-end="url(#arrow-green)"/>
<circle cx="710" cy="447" r="18" fill="#238453" stroke="#fff" stroke-width="3"/>
<text x="710" y="455" class="h" text-anchor="middle" style="fill:#fff">4</text>
<text x="740" y="433" class="small" text-anchor="start" style="fill:#238453">查到记录</text>
<text x="740" y="465" class="small" text-anchor="start" style="fill:#238453">保存结果</text>
<path id="edge-5" data-source="node-table" data-target="node-kernel" data-tip="590,938" class="edge" d="M590 772 V926" stroke="#b66328" marker-end="url(#arrow-orange)"/>
<circle cx="590" cy="849" r="18" fill="#b66328" stroke="#fff" stroke-width="3"/>
<text x="590" y="857" class="h" text-anchor="middle" style="fill:#fff">5</text>
<text x="620" y="835" class="small" text-anchor="start" style="fill:#b66328">映射或权限</text>
<text x="620" y="867" class="small" text-anchor="start" style="fill:#b66328">需要处理</text>
<path id="edge-6" data-source="node-kernel" data-target="node-start" data-tip="165,372" class="edge" d="M418 1050 H365 V408 Q365 400 357 400 H173 Q165 400 165 392 V384" stroke="#b66328" marker-end="url(#arrow-orange)"/>
<circle cx="365" cy="934" r="18" fill="#b66328" stroke="#fff" stroke-width="3"/>
<text x="365" y="942" class="h" text-anchor="middle" style="fill:#fff">6</text>
<text x="335" y="921" class="small" text-anchor="end" style="fill:#b66328">修复后</text>
<text x="335" y="953" class="small" text-anchor="end" style="fill:#b66328">重新访问</text>
<path id="edge-7" data-source="node-kernel" data-target="node-error" data-tip="928,1050" class="edge" d="M772 1050 H916" stroke="#bc4651" marker-end="url(#arrow-red)"/>
<circle cx="850" cy="1050" r="18" fill="#bc4651" stroke="#fff" stroke-width="3"/>
<text x="850" y="1058" class="h" text-anchor="middle" style="fill:#fff">7</text>
<text x="850" y="1015" class="small" text-anchor="middle" style="fill:#bc4651">无法恢复</text>
<text x="52" y="1199" class="small" style="fill:#5e7088">页表保存在主内存中；图中单独画出，便于看清查找和更新。</text>
<text x="52" y="1231" class="small" style="fill:#5e7088">框表示不同职责，编号帮助定位分支；实际访问按所遇到的条件继续。</text>
</svg>
