<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">普通收包：从收货口到主厨</title><desc id="desc">①网卡把报文写入主内存；②中断如铃声通知有报文；③驱动按NAPI机制调用poll批量处理已到内存的报文，网络栈处理协议；④接收数据进入Socket 接收队列；⑤应用线程读取。厨房角色对应技术职责，不表示独立硬件处理器。</desc>
<defs>
<symbol id="nic" viewBox="0 0 140 100">
<rect x="10" y="20" width="120" height="64" rx="7" fill="#d7e8eb" stroke="#3e7b88" stroke-width="3"/>
<path d="M10 13 V92 M32 84 V92 M45 84 V92 M58 84 V92 M71 84 V92 M84 84 V92 M97 84 V92" stroke="#3e7b88" stroke-width="3"/>
<rect x="23" y="35" width="36" height="32" rx="4" fill="#497f8d"/>
<path d="M71 41 H111 M71 52 H111 M71 63 H94" stroke="#77a0ab" stroke-width="3"/>
<rect x="106" y="31" width="25" height="18" rx="2" fill="#fff" stroke="#3e7b88" stroke-width="2"/>
</symbol>
<symbol id="stack" viewBox="0 0 100 100">
<rect x="13" y="12" width="74" height="21" rx="5" fill="#d8e1f0" stroke="#58769e" stroke-width="2.5"/>
<rect x="13" y="40" width="74" height="21" rx="5" fill="#c3d3e8" stroke="#58769e" stroke-width="2.5"/>
<rect x="13" y="68" width="74" height="21" rx="5" fill="#a6bedc" stroke="#58769e" stroke-width="2.5"/>
<path d="M26 23 H51 M26 51 H51 M26 79 H51" stroke="#58769e" stroke-width="3"/>
<circle cx="74" cy="23" r="3" fill="#58769e"/><circle cx="74" cy="51" r="3" fill="#58769e"/><circle cx="74" cy="79" r="3" fill="#58769e"/>
</symbol>
<symbol id="app" viewBox="0 0 120 100">
<rect x="9" y="9" width="102" height="79" rx="7" fill="#fff" stroke="#568676" stroke-width="3"/>
<path d="M9 29 H111" stroke="#568676" stroke-width="2"/>
<circle cx="20" cy="20" r="3" fill="#b6cfc5"/><circle cx="31" cy="20" r="3" fill="#b6cfc5"/>
<path d="M26 70 V59 H42 V65 H58 V48 H74 V54 H95" stroke="#3b9177" stroke-width="4" fill="none" stroke-linejoin="round"/>
</symbol>
<symbol id="memory" viewBox="0 0 140 100">
<rect x="8" y="21" width="124" height="61" rx="5" fill="#e5edf3" stroke="#617f98" stroke-width="3"/>
<rect x="19" y="32" width="26" height="33" rx="3" fill="#c1d3e1"/><rect x="57" y="32" width="26" height="33" rx="3" fill="#9dbed3"/><rect x="95" y="32" width="26" height="33" rx="3" fill="#c1d3e1"/>
<path d="M22 82 V91 M36 82 V91 M50 82 V91 M64 82 V91 M78 82 V91 M92 82 V91 M106 82 V91 M120 82 V91" stroke="#b29356" stroke-width="4"/>
</symbol>
<symbol id="cpu" viewBox="0 0 100 100">
<path d="M30 8 V20 M50 8 V20 M70 8 V20 M30 80 V92 M50 80 V92 M70 80 V92 M8 30 H20 M8 50 H20 M8 70 H20 M80 30 H92 M80 50 H92 M80 70 H92" stroke="#8ea2b9" stroke-width="4"/>
<rect x="20" y="20" width="60" height="60" rx="6" fill="#304c66"/><rect x="29" y="29" width="42" height="42" rx="4" fill="#a7c1d7"/>
</symbol>
<symbol id="bell" viewBox="0 0 100 100">
<path d="M25 69 V45 Q25 19 50 19 Q75 19 75 45 V69 L84 79 H16Z" fill="#fff2d9" stroke="#b18a47" stroke-width="3" stroke-linejoin="round"/>
<path d="M42 86 Q50 96 58 86 M50 10 V18 M11 31 L6 23 M89 31 L94 23" stroke="#b18a47" stroke-width="3" fill="none" stroke-linecap="round"/>
</symbol>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#5a7fa9"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#398c76"/></marker>
<marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#b18a47"/></marker>
<marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#8796a8"/></marker>
</defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263c51}.head{font-size:27px;font-weight:750}.body{font-size:23px}.small{font-size:21px;fill:#61778c}.edge{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style>
<rect width="1200" height="1140" fill="#f7f9fc"/>
<rect x="24" y="20" width="1152" height="1100" rx="24" fill="white" stroke="#e1e8ef"/>
<defs><symbol id="list" viewBox="0 0 100 110"><rect x="17" y="13" width="68" height="88" rx="7" fill="#fff6e5" stroke="#ac8b50" stroke-width="3"/><rect x="33" y="7" width="36" height="15" rx="5" fill="#dac598"/><path d="M29 40 H39 M48 40 H72 M29 59 H39 M48 59 H72 M29 78 H39 M48 78 H72" stroke="#ac8b50" stroke-width="3"/></symbol><symbol id="tray" viewBox="0 0 120 90"><rect x="18" y="25" width="24" height="31" rx="4" fill="#b8d6c7"/><rect x="48" y="19" width="24" height="37" rx="4" fill="#89bba5"/><rect x="78" y="25" width="24" height="31" rx="4" fill="#b8d6c7"/><path d="M8 51 L18 72 H102 L112 51" fill="none" stroke="#568676" stroke-width="4" stroke-linejoin="round"/></symbol></defs>
<text x="56" y="76" class="head" text-anchor="start">普通收包：从收货口到主厨</text>
<text x="56" y="117" class="body" text-anchor="start">先看①放好报文，再沿②③④⑤看它怎样交到程序手里。</text>
<rect id="nic" x="60" y="270" width="230" height="230" rx="14" fill="#f3f8fa" stroke="#b9d5de" stroke-width="2"/>
<text x="175" y="311" class="head" text-anchor="middle">收货口 · 网卡</text>
<use href="#nic" x="105" y="330" width="140" height="100"/>
<text x="175" y="468" class="body" text-anchor="middle">收到网络报文</text>
<rect id="memory" x="430" y="230" width="320" height="170" rx="14" fill="#f2f5fc" stroke="#cbd8e7" stroke-width="2"/>
<use href="#memory" x="455" y="262" width="97" height="82"/>
<text x="637" y="270" class="body" text-anchor="middle">临时存货区</text>
<text x="637" y="307" class="head" text-anchor="middle">主内存</text>
<text x="590" y="369" class="small" text-anchor="middle">接收缓冲区 · 暂存报文</text>
<rect x="390" y="485" width="400" height="570" rx="14" fill="#f2f5fc" stroke="#d8e1ee" stroke-width="2"/>
<text x="460" y="525" class="head" text-anchor="middle">内核</text>
<rect id="poll" x="430" y="560" width="320" height="220" rx="14" fill="#fff" stroke="#b9cddd" stroke-width="2"/>
<use href="#list" x="452" y="580" width="57" height="68"/>
<text x="625" y="603" class="head" text-anchor="middle">验收员</text>
<text x="625" y="642" class="small" text-anchor="middle">批量收包（NAPI）</text>
<text x="590" y="690" class="small" text-anchor="middle">驱动 poll 查看已到报文</text>
<text x="590" y="740" class="small" text-anchor="middle">网络栈处理 TCP / UDP</text>
<rect id="queue" x="430" y="890" width="320" height="135" rx="14" fill="#fff" stroke="#b7d6c7" stroke-width="2"/>
<use href="#tray" x="450" y="921" width="70" height="58"/>
<text x="628" y="934" class="head" text-anchor="middle">备菜台</text>
<text x="628" y="973" class="small" text-anchor="middle">套接字（Socket）</text>
<text x="628" y="1009" class="small" text-anchor="middle">接收队列</text>
<rect id="app" x="900" y="890" width="240" height="135" rx="14" fill="#f1f8f4" stroke="#b7d6c7" stroke-width="2"/>
<use href="#app" x="922" y="927" width="64" height="58"/>
<text x="1060" y="933" class="head" text-anchor="middle">主厨</text>
<text x="1060" y="966" class="small" text-anchor="middle">应用线程</text>
<text x="1020" y="1000" class="small" text-anchor="middle">通过套接字读取</text>
<path id="edge-1" class="edge" d="M302 337 H406" stroke="#5a7fa9" marker-end="url(#arrow-blue)" data-source="nic" data-target="memory" data-tip="418,337"/>
<text x="355" y="310" class="small" text-anchor="middle">① 写入</text>
<path id="edge-2" class="edge" d="M175 512 V665 H406" stroke="#b18a47" marker-end="url(#arrow-amber)" data-source="nic" data-target="poll" data-tip="418,665"/>
<use href="#bell" x="210" y="548" width="48" height="48"/>
<text x="315" y="625" class="small" text-anchor="middle">② 中断（IRQ）</text>
<path id="edge-3" class="edge" d="M590 412 V536" stroke="#5a7fa9" marker-end="url(#arrow-blue)" data-source="memory" data-target="poll" data-tip="590,548"/>
<text x="696" y="454" class="small" text-anchor="middle">③ 批量收包</text>
<path id="edge-4" class="edge" d="M590 792 V866" stroke="#5a7fa9" marker-end="url(#arrow-blue)" data-source="poll" data-target="queue" data-tip="590,878"/>
<text x="680" y="836" class="small" text-anchor="middle">④ 等待读取</text>
<path id="edge-5" class="edge" d="M762 958 H876" stroke="#398c76" marker-end="url(#arrow-green)" data-source="queue" data-target="app" data-tip="888,958"/>
<text x="824" y="927" class="small" text-anchor="middle">⑤ 读取</text>
<use href="#cpu" x="76" y="912" width="62" height="62"/>
<text x="244" y="932" class="small" text-anchor="middle">验收和业务代码</text>
<text x="244" y="970" class="small" text-anchor="middle">都由 CPU 执行</text>
<text x="600" y="1093" class="body" text-anchor="middle">网卡收到、CPU 开始处理、应用读到，是三个不同的时刻。</text>
</svg>
