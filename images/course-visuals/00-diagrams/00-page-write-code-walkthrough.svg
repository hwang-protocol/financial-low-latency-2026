<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#24354e} .h{font-size:25px;font-weight:750} .body{font-size:22px} .small{font-size:20px} .code{font-family:'DejaVu Sans Mono',monospace;font-size:19px;fill:#405275} .muted{fill:#5e7088} .edge{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style>
<rect width="1200" height="1690" fill="#f7f9fd"/>
<rect x="24" y="20" width="1152" height="1650" rx="24" fill="#fff" stroke="#e1e7f0"/>
<text x="52" y="70" font-size="33" font-weight="800">首次写入实验：代码怎样准备内存</text>
<text x="52" y="111" class="body muted">从上往下读 A → B → C → D → E；C 步对应前图的⑤与⑥。</text>
<text x="62" y="158" class="h">代码动作</text><text x="702" y="158" class="h">内存与计数怎样变化</text>

<rect id="code-A" x="40" y="185" width="490" height="225" rx="17" fill="#f8f5ff" stroke="#d2c4e8" stroke-width="2"/>
<rect id="effect-A" x="680" y="185" width="480" height="225" rx="17" fill="#f8f5ff" stroke="#d2c4e8" stroke-width="2"/>
<path id="edge-A" data-source="code-A" data-target="effect-A" data-tip="668,297.5" class="edge" d="M542 297.5 H656" stroke="#7752b7" marker-end="url(#arrow-purple)"/>
<circle cx="600" cy="297.5" r="19" fill="#7752b7" stroke="#fff" stroke-width="3"/>
<text x="600" y="305.5" class="h" text-anchor="middle" style="fill:#fff">A</text>
<rect id="code-B" x="40" y="455" width="490" height="180" rx="17" fill="#f2f9f6" stroke="#bad9c9" stroke-width="2"/>
<rect id="effect-B" x="680" y="455" width="480" height="180" rx="17" fill="#f2f9f6" stroke="#bad9c9" stroke-width="2"/>
<path id="edge-B" data-source="code-B" data-target="effect-B" data-tip="668,545.0" class="edge" d="M542 545.0 H656" stroke="#238453" marker-end="url(#arrow-green)"/>
<circle cx="600" cy="545.0" r="19" fill="#238453" stroke="#fff" stroke-width="3"/>
<text x="600" y="553.0" class="h" text-anchor="middle" style="fill:#fff">B</text>
<rect id="code-C" x="40" y="680" width="490" height="410" rx="17" fill="#fff8ee" stroke="#e7caaa" stroke-width="2"/>
<rect id="effect-C" x="680" y="680" width="480" height="410" rx="17" fill="#fff8ee" stroke="#e7caaa" stroke-width="2"/>
<path id="edge-C" data-source="code-C" data-target="effect-C" data-tip="668,885.0" class="edge" d="M542 885.0 H656" stroke="#b66328" marker-end="url(#arrow-orange)"/>
<circle cx="600" cy="885.0" r="19" fill="#b66328" stroke="#fff" stroke-width="3"/>
<text x="600" y="893.0" class="h" text-anchor="middle" style="fill:#fff">C</text>
<rect id="code-D" x="40" y="1135" width="490" height="180" rx="17" fill="#f2f9f6" stroke="#bad9c9" stroke-width="2"/>
<rect id="effect-D" x="680" y="1135" width="480" height="180" rx="17" fill="#f2f9f6" stroke="#bad9c9" stroke-width="2"/>
<path id="edge-D" data-source="code-D" data-target="effect-D" data-tip="668,1225.0" class="edge" d="M542 1225.0 H656" stroke="#238453" marker-end="url(#arrow-green)"/>
<circle cx="600" cy="1225.0" r="19" fill="#238453" stroke="#fff" stroke-width="3"/>
<text x="600" y="1233.0" class="h" text-anchor="middle" style="fill:#fff">D</text>
<rect id="code-E" x="40" y="1360" width="490" height="235" rx="17" fill="#f3f7ff" stroke="#bbcee9" stroke-width="2"/>
<rect id="effect-E" x="680" y="1360" width="480" height="235" rx="17" fill="#f3f7ff" stroke="#bbcee9" stroke-width="2"/>
<path id="edge-E" data-source="code-E" data-target="effect-E" data-tip="668,1477.5" class="edge" d="M542 1477.5 H656" stroke="#7752b7" marker-end="url(#arrow-purple)"/>
<circle cx="600" cy="1477.5" r="19" fill="#7752b7" stroke="#fff" stroke-width="3"/>
<text x="600" y="1485.5" class="h" text-anchor="middle" style="fill:#fff">E</text>
<text x="62" y="224" class="h">先申请 128 页的地址范围</text>
<text x="62" y="270" class="code">page = os.sysconf(&quot;SC_PAGE_SIZE&quot;)</text>
<text x="62" y="305" class="code">size = page * 128</text>
<text x="62" y="340" class="code">buf = mmap.mmap(-1, size, ...)</text>
<text x="62" y="382" class="small">page 是页大小；size 是申请的总字节数</text>
<use href="#book" x="695" y="238" width="120" height="120" filter="url(#shadow)"/>
<text x="836" y="242" class="body">先登记可用的地址范围</text>
<text x="836" y="280" class="small">共 128 页，允许读写</text>
<text x="836" y="318" class="small">物理页在首次写入时准备</text>
<text x="702" y="386" class="small">像先领到一段库存编号，存放位置随后安排。</text>
<text x="62" y="494" class="h">记下写入前的计数</text>
<text x="62" y="538" class="code">before = resource.getrusage(</text>
<text x="62" y="569" class="code">    resource.RUSAGE_SELF</text>
<text x="62" y="600" class="code">).ru_minflt</text>
<use href="#counter" x="699" y="506" width="122" height="112" filter="url(#shadow)"/>
<text x="838" y="532" class="h">保存为 before</text>
<text x="838" y="569" class="small">本进程累计的次缺页次数</text>
<text x="838" y="605" class="small">此时还没开始逐页写入</text>
<text x="62" y="1174" class="h">再读一次写入后的计数</text>
<text x="62" y="1218" class="code">after = resource.getrusage(</text>
<text x="62" y="1249" class="code">    resource.RUSAGE_SELF</text>
<text x="62" y="1280" class="code">).ru_minflt</text>
<use href="#counter" x="699" y="1186" width="122" height="112" filter="url(#shadow)"/>
<text x="838" y="1212" class="h">保存为 after</text>
<text x="838" y="1249" class="small">本进程累计的次缺页次数</text>
<text x="838" y="1285" class="small">此时逐页写入已经结束</text>
<text x="62" y="721" class="h">每页的第一个字节写入 1</text>
<text x="62" y="769" class="code">for offset in range(0, size, page):</text>
<text x="62" y="805" class="code">    buf[offset] = 1</text>
<text x="62" y="858" class="small">offset 从 0 开始，每次增加 page</text>
<rect x="66" y="887" width="94" height="100" rx="8" fill="#fff" stroke="#d4b68f" stroke-width="2"/>
<rect x="78" y="901" width="18" height="18" rx="3" fill="#e8a55e"/>
<path d="M78 936 H146 M78 953 H146" stroke="#e0d5c5" stroke-width="3"/>
<text x="113" y="981" class="small" text-anchor="middle">第 1 页</text>
<text x="113" y="1022" class="small" text-anchor="middle">0</text>
<rect x="175" y="887" width="94" height="100" rx="8" fill="#fff" stroke="#d4b68f" stroke-width="2"/>
<rect x="187" y="901" width="18" height="18" rx="3" fill="#e8a55e"/>
<path d="M187 936 H255 M187 953 H255" stroke="#e0d5c5" stroke-width="3"/>
<text x="222" y="981" class="small" text-anchor="middle">第 2 页</text>
<text x="222" y="1022" class="small" text-anchor="middle">page</text>
<rect x="365" y="887" width="94" height="100" rx="8" fill="#fff" stroke="#d4b68f" stroke-width="2"/>
<rect x="377" y="901" width="18" height="18" rx="3" fill="#e8a55e"/>
<path d="M377 936 H445 M377 953 H445" stroke="#e0d5c5" stroke-width="3"/>
<text x="412" y="981" class="small" text-anchor="middle">第 128 页</text>
<text x="412" y="1022" class="small" text-anchor="middle">127 × page</text>
<text x="309" y="944" class="h" text-anchor="middle">…</text>
<text x="62" y="1060" class="small">橙色小格表示本页第一次写入的位置。</text>
<text x="702" y="721" class="h">第一次写到这一页时</text>
<use href="#workshop" x="698" y="743" width="112" height="106" filter="url(#shadow)"/>
<text x="837" y="780" class="body">上图⑤：处理次缺页</text>
<text x="837" y="817" class="small">准备物理页，补好页表记录</text>
<path d="M706 867 H1134" stroke="#ead7bc" stroke-width="2"/>
<use href="#book" x="700" y="888" width="106" height="106" filter="url(#shadow)"/>
<text x="837" y="923" class="body">上图⑥：重试刚才的写入</text>
<text x="837" y="960" class="small">这一页准备好，写入完成</text>
<text x="702" y="1056" class="small">循环继续到下一页，共写过 128 页。</text>
<text x="62" y="1400" class="h">输出三项结果，再释放这段内存</text>
<text x="62" y="1441" class="code">print(&quot;page_size=%d&quot; % page)</text>
<text x="62" y="1470" class="code">print(&quot;touched_pages=%d&quot; % ...)</text>
<text x="62" y="1499" class="code">print(&quot;minor_fault_delta=%d&quot; %</text>
<text x="62" y="1528" class="code">      (after - before))</text>
<text x="62" y="1564" class="code">buf.close()</text>
<use href="#terminal" x="692" y="1416" width="128" height="99" filter="url(#shadow)"/>
<text x="837" y="1437" class="body">页大小、写过的页数</text>
<text x="837" y="1476" class="small">次缺页增量：after − before</text>
<text x="702" y="1540" class="small">buf.close() 释放本次申请的内存映射</text>
<text x="702" y="1575" class="small">实际输出见下面运行代码后的结果。</text>
<text x="52" y="1631" class="small" style="fill:#5e7088">计数比较的是 B 到 D 之间的变化，也包含这段时间内 Python 自身发生的次缺页。</text>
</svg>
