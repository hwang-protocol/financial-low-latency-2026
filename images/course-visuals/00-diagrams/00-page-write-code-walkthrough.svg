<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1690" viewBox="0 0 1200 1690" role="img" aria-labelledby="title desc">
<title id="title">首次写入实验：从代码到内存准备</title>
<desc id="desc">从上到下按A到E阅读。A查询页大小并用mmap申请128页匿名地址范围；B读取进程次缺页累计次数记为before；C按页步进，每页首字节写1，联系前图5处理缺页和6重试；D读after；E输出三项结果和计数差，再关闭映射。箭头字母与代码阶段相同。</desc>
