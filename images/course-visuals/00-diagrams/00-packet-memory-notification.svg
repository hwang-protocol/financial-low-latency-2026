<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc"><title id="title">四个等待点回到同一条行情路径</title><desc id="desc">常见中断驱动路径：①网卡按描述符把报文写入已备好的主内存缓冲区；②中断通知CPU；③④处理器经缓存读取并处理数据；⑤应用线程读取并解析行情。通知与数据线独立。A取数据在主内存与缓存之间；B准备内存在申请和首次访问时，收包缓冲区提前备好；C等CPU执行在处理器入口；D收包交给程序覆盖从通知到应用读取。</desc>
<defs>
<symbol id="nic" viewBox="0 0 140 100">
<rect x="10" y="20" width="120" height="64" rx="7" fill="#d7e8eb" stroke="#3e7b88" stroke-width="3"/>
<path d="M10 13 V92 M32 84 V92 M45 84 V92 M58 84 V92 M71 84 V92 M84 84 V92 M97 84 V92" stroke="#3e7b88" stroke-width="3"/>
<rect x="23" y="35" width="36" height="32" rx="4" fill="#497f8d"/>
<path d="M71 41 H111 M71 52 H111 M71 63 H94" stroke="#77a0ab" stroke-width="3"/>
<rect x="106" y="31" width="25" height="18" rx="2" fill="#fff" stroke="#3e7b88" stroke-width="2"/>
</symbol>
<symbol id="stack" viewBox="0 0 100 100">
<rect x="13" y="12" width="74" height="21" rx="5" fill="#d8e1f0" stroke="#58769e" stroke-width="2.5"/>
<rect x="13" y="40" width="74" height="21" rx="5" fill="#c3d3e8" stroke="#58769e" stroke-width="2.5"/>
<rect x="13" y="68" width="74" height="21" rx="5" fill="#a6bedc" stroke="#58769e" stroke-width="2.5"/>
<path d="M26 23 H51 M26 51 H51 M26 79 H51" stroke="#58769e" stroke-width="3"/>
<circle cx="74" cy="23" r="3" fill="#58769e"/><circle cx="74" cy="51" r="3" fill="#58769e"/><circle cx="74" cy="79" r="3" fill="#58769e"/>
</symbol>
<symbol id="app" viewBox="0 0 120 100">
<rect x="9" y="9" width="102" height="79" rx="7" fill="#fff" stroke="#568676" stroke-width="3"/>
<path d="M9 29 H111" stroke="#568676" stroke-width="2"/>
<circle cx="20" cy="20" r="3" fill="#b6cfc5"/><circle cx="31" cy="20" r="3" fill="#b6cfc5"/>
<path d="M26 70 V59 H42 V65 H58 V48 H74 V54 H95" stroke="#3b9177" stroke-width="4" fill="none" stroke-linejoin="round"/>
</symbol>
<symbol id="memory" viewBox="0 0 140 100">
<rect x="8" y="21" width="124" height="61" rx="5" fill="#e5edf3" stroke="#617f98" stroke-width="3"/>
<rect x="19" y="32" width="26" height="33" rx="3" fill="#c1d3e1"/><rect x="57" y="32" width="26" height="33" rx="3" fill="#9dbed3"/><rect x="95" y="32" width="26" height="33" rx="3" fill="#c1d3e1"/>
<path d="M22 82 V91 M36 82 V91 M50 82 V91 M64 82 V91 M78 82 V91 M92 82 V91 M106 82 V91 M120 82 V91" stroke="#b29356" stroke-width="4"/>
</symbol>
<symbol id="cpu" viewBox="0 0 100 100">
<path d="M30 8 V20 M50 8 V20 M70 8 V20 M30 80 V92 M50 80 V92 M70 80 V92 M8 30 H20 M8 50 H20 M8 70 H20 M80 30 H92 M80 50 H92 M80 70 H92" stroke="#8ea2b9" stroke-width="4"/>
<rect x="20" y="20" width="60" height="60" rx="6" fill="#304c66"/><rect x="29" y="29" width="42" height="42" rx="4" fill="#a7c1d7"/>
</symbol>
<symbol id="bell" viewBox="0 0 100 100">
<path d="M25 69 V45 Q25 19 50 19 Q75 19 75 45 V69 L84 79 H16Z" fill="#fff2d9" stroke="#b18a47" stroke-width="3" stroke-linejoin="round"/>
<path d="M42 86 Q50 96 58 86 M50 10 V18 M11 31 L6 23 M89 31 L94 23" stroke="#b18a47" stroke-width="3" fill="none" stroke-linecap="round"/>
</symbol>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#5a7fa9"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#398c76"/></marker>
<marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#b18a47"/></marker>
<marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#8796a8"/></marker>
</defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#263c51}.head{font-size:27px;font-weight:750}.body{font-size:23px}.small{font-size:21px;fill:#61778c}.edge{fill:none;stroke-width:3;stroke-linecap:butt;stroke-linejoin:round}</style>
<rect width="1200" height="1370" fill="#f7f9fc"/>
<rect x="24" y="20" width="1152" height="1330" rx="24" fill="white" stroke="#e1e8ef"/>
<defs><symbol id="list" viewBox="0 0 100 110"><rect x="17" y="13" width="68" height="88" rx="7" fill="#fff6e5" stroke="#ac8b50" stroke-width="3"/><rect x="33" y="7" width="36" height="15" rx="5" fill="#dac598"/><path d="M29 40 H39 M48 40 H72 M29 59 H39 M48 59 H72 M29 78 H39 M48 78 H72" stroke="#ac8b50" stroke-width="3"/></symbol><symbol id="tray" viewBox="0 0 120 90"><rect x="18" y="25" width="24" height="31" rx="4" fill="#b8d6c7"/><rect x="48" y="19" width="24" height="37" rx="4" fill="#89bba5"/><rect x="78" y="25" width="24" height="31" rx="4" fill="#b8d6c7"/><path d="M8 51 L18 72 H102 L112 51" fill="none" stroke="#568676" stroke-width="4" stroke-linejoin="round"/></symbol></defs>
<text x="56" y="76" class="head" text-anchor="start">同一条行情路径，四个地方可能等待</text>
<text x="56" y="117" class="body" text-anchor="start">先看①写入、②通知，再沿③④⑤读；A～D 对应下方四行。</text>
<rect id="wait-b" x="370" y="160" width="370" height="145" rx="14" fill="#f4effb" stroke="#cebfe4" stroke-width="2"/>
<text x="555" y="198" class="head" text-anchor="middle" style="fill:#8063a6">B · 准备内存</text>
<text x="555" y="234" class="small" text-anchor="middle">申请、首次访问时准备页与映射</text>
<text x="555" y="274" class="small" text-anchor="middle">收包缓冲区先备好，再供网卡写入</text>
<rect id="wait-a" x="804" y="191" width="336" height="110" rx="14" fill="#edf5fc" stroke="#b5cfe4" stroke-width="2"/>
<text x="972" y="231" class="head" text-anchor="middle" style="fill:#4c7fa4">A · 取数据</text>
<text x="972" y="272" class="small" text-anchor="middle">手边没有，还要去取</text>
<rect id="nic" x="60" y="350" width="230" height="210" rx="14" fill="#f3f8fa" stroke="#b9d5de" stroke-width="2"/>
<text x="175" y="394" class="head" text-anchor="middle">收货口 · 网卡</text>
<use href="#nic" x="107" y="413" width="136" height="89"/>
<text x="175" y="532" class="small" text-anchor="middle">收到行情报文</text>
<rect id="memory" x="390" y="350" width="370" height="250" rx="14" fill="#f2f5fc" stroke="#cbd8e7" stroke-width="2"/>
<text x="575" y="392" class="head" text-anchor="middle">存货区 · 主内存</text>
<use href="#list" x="405" y="420" width="60" height="83"/>
<use href="#memory" x="627" y="421" width="115" height="80"/>
<text x="549" y="437" class="small" text-anchor="middle">接收描述符</text>
<text x="549" y="476" class="small" text-anchor="middle">存放位置清单</text>
<text x="575" y="555" class="body" text-anchor="middle">接收缓冲区 · 暂存报文</text>
<rect id="cache" x="900" y="350" width="240" height="210" rx="14" fill="#f1f8f4" stroke="#b7d6c7" stroke-width="2"/>
<text x="1020" y="394" class="head" text-anchor="middle">手边台面</text>
<use href="#tray" x="972" y="414" width="96" height="73"/>
<text x="1020" y="532" class="body" text-anchor="middle">缓存</text>
<path id="edge-1" class="edge" d="M302 461 H366" stroke="#5a7fa9" marker-end="url(#arrow-blue)" data-source="nic" data-target="memory" data-tip="378,461"/>
<text x="338" y="418" class="small" text-anchor="middle">① DMA</text>
<path id="edge-3" class="edge" d="M772 461 H876" stroke="#5a7fa9" marker-end="url(#arrow-blue)" data-source="memory" data-target="cache" data-tip="888,461"/>
<text x="824" y="420" class="small" text-anchor="middle">③ 取数据</text>
<path d="M555 305 V338" fill="none" stroke="#a592bd" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M830 301 V434" fill="none" stroke="#7dabc9" stroke-width="2" stroke-dasharray="5 5"/>
<rect id="wait-c" x="744" y="657" width="396" height="105" rx="14" fill="#fff5e4" stroke="#e1c998" stroke-width="2"/>
<text x="942" y="696" class="head" text-anchor="middle" style="fill:#ac813a">C · 等 CPU 执行</text>
<text x="942" y="735" class="small" text-anchor="middle">任务备齐，也要等排班</text>
<rect id="cpu" x="390" y="800" width="770" height="325" rx="14" fill="#f8fafc" stroke="#bfcfdf" stroke-width="2"/>
<use href="#cpu" x="414" y="816" width="54" height="54"/>
<text x="792" y="857" class="head" text-anchor="middle">处理器 · 执行内核与应用代码</text>
<rect id="kernel" x="430" y="910" width="320" height="180" rx="14" fill="#f2f5fc" stroke="#b9cddd" stroke-width="2"/>
<text x="590" y="952" class="head" text-anchor="middle">验收与整理</text>
<text x="590" y="993" class="body" text-anchor="middle">批量收包（NAPI）</text>
<text x="590" y="1040" class="small" text-anchor="middle">网络栈 / 接收队列</text>
<rect id="app" x="890" y="910" width="240" height="180" rx="14" fill="#f1f8f4" stroke="#b7d6c7" stroke-width="2"/>
<text x="1010" y="952" class="body" text-anchor="middle">主厨 · 应用线程</text>
<use href="#app" x="906" y="971" width="68" height="58"/>
<text x="1042" y="1008" class="body" text-anchor="middle">解析行情</text>
<text x="1010" y="1058" class="small" text-anchor="middle">读取价格、数量</text>
<path id="edge-4" class="edge" d="M1020 572 V622 H672 V776" stroke="#398c76" marker-end="url(#arrow-green)" data-source="cache" data-target="cpu" data-tip="672,788"/>
<text x="540" y="704" class="small" text-anchor="middle">④ 执行代码时读取</text>
<path id="edge-5" class="edge" d="M762 1000 H866" stroke="#398c76" marker-end="url(#arrow-green)" data-source="kernel" data-target="app" data-tip="878,1000"/>
<text x="820" y="964" class="small" text-anchor="middle">⑤ 读取</text>
<path id="edge-2" class="edge" d="M175 572 V1000 H406" stroke="#b18a47" marker-end="url(#arrow-amber)" data-source="nic" data-target="kernel" data-tip="418,1000"/>
<use href="#bell" x="196" y="884" width="49" height="49"/>
<text x="291" y="960" class="small" text-anchor="middle">② 中断（IRQ）</text>
<path d="M942 762 V788" fill="none" stroke="#c6a96f" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M175 1070 V1168 H1010 V1140" fill="none" stroke="#4b978d" stroke-width="2"/>
<rect id="wait-d" x="284" y="1205" width="780" height="100" rx="14" fill="#edf8f5" stroke="#a8d0c6" stroke-width="2"/>
<text x="674" y="1245" class="head" text-anchor="middle" style="fill:#338776">D · 收包交给程序</text>
<text x="674" y="1283" class="small" text-anchor="middle">从铃响到主厨读到数据，中间的处理与等待都需要时间</text>
<path d="M674 1168 V1205" fill="none" stroke="#4b978d" stroke-width="2" stroke-dasharray="5 5"/>
<text x="600" y="1335" class="small" text-anchor="middle">A～D 是四个观察位置，会相互影响；实际等待需要分别观察。</text>
</svg>
