<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">线程准备好以后，等待调度器安排执行</title>
<desc id="desc">全图统一平面正视构图。左侧为已准备好的候选线程，仍需等待执行机会；中间为内核调度器，右侧为两个逻辑处理器。①选择，②③安排执行为主线；④执行中等待数据而暂停，⑤条件满足后回到候选线程等待安排为次要路径。全部图形采用纯色和统一描边。</desc>
<defs>
<marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#b78330"/></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#3d907d"/></marker>
<marker id="arrow-rust" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6Z" fill="#b16d53"/></marker>
</defs>
