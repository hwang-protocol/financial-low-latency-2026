<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">一次下单反应经过五段，后面各章分别处理哪一段</title>
<desc id="desc">第1、4段是网络：第06章讲固定转发、出口排队与PTP对时，第07、08章在网络路径上提前处理报文。第2、3段在主机内：第04章讲缓存、预分配、忙轮询与CPU隔离，第05章比较四条出站收发路径。第01至03章先认环境、装平台、读报文；本章建立四个等待点。第5段是交易所自己的处理。图示章节归属，不给出耗时。</desc>
<defs><symbol id="switchico" viewBox="0 0 64 64"><rect x="6" y="20" width="52" height="24" rx="4"/><circle cx="18" cy="32" r="3"/><circle cx="30" cy="32" r="3"/><circle cx="42" cy="32" r="3"/><path d="M20 20V10m24 10V10M20 44v10m24-10v10"/></symbol>
<symbol id="code" viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="5"/><path d="M22 24l-8 8 8 8m20-16 8 8-8 8M36 22l-8 20"/></symbol>
<symbol id="chip" viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="6"/><rect x="23" y="23" width="18" height="18" rx="2"/><path d="M20 4v8m12-8v8m12-8v8M20 52v8m12-8v8m12-8v8M4 20h8m-8 12h8m-8 12h8m40-24h8m-8 12h8m-8 12h8"/></symbol>
<symbol id="lane" viewBox="0 0 64 64"><path d="M6 20h52M6 44h52M18 32h10m8 0h10"/><path d="M4 12v40M60 12v40"/></symbol>
<symbol id="card" viewBox="0 0 64 64"><rect x="5" y="14" width="54" height="36" rx="4"/><path d="M5 26h54M14 38h14"/></symbol>
<symbol id="board" viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="44" rx="4"/><rect x="22" y="22" width="20" height="20" rx="2"/><path d="M32 10V4M32 60v-6M10 32H4M60 32h-6"/></symbol></defs>
<rect width="1200" height="880" fill="#f7f9fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" font-weight="700">这条链路，后面各章分别处理哪一段</text>
<text x="36" y="90" font-size="23" fill="#64748b">网络快，只能缩短其中一段。先看五段的位置，再看各章落在哪里。</text>

<rect x="36" y="126" width="204" height="86" rx="12" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
<text x="138" y="162" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">1 · 行情网络</text>
<text x="138" y="192" font-size="20" fill="#475569" text-anchor="middle">网络这一段</text>
<rect x="267" y="126" width="204" height="86" rx="12" fill="#fff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="369" y="162" font-size="21" font-weight="700" fill="#7e22ce" text-anchor="middle">2 · 接收与计算</text>
<text x="369" y="192" font-size="20" fill="#475569" text-anchor="middle">主机这一段</text>
<rect x="498" y="126" width="204" height="86" rx="12" fill="#fff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="600" y="162" font-size="21" font-weight="700" fill="#7e22ce" text-anchor="middle">3 · 下单前风控</text>
<text x="600" y="192" font-size="20" fill="#475569" text-anchor="middle">主机这一段</text>
<rect x="729" y="126" width="204" height="86" rx="12" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
<text x="831" y="162" font-size="21" font-weight="700" fill="#0f766e" text-anchor="middle">4 · 订单网络</text>
<text x="831" y="192" font-size="20" fill="#475569" text-anchor="middle">网络这一段</text>
<rect x="960" y="126" width="204" height="86" rx="12" fill="#fff" stroke="#15803d" stroke-width="1.8"/>
<text x="1062" y="162" font-size="21" font-weight="700" fill="#15803d" text-anchor="middle">5 · 交易所处理</text>
<text x="1062" y="192" font-size="20" fill="#475569" text-anchor="middle">对方的时间</text>

<rect x="36" y="248" width="546" height="452" rx="15" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="56" y="292" font-size="25" font-weight="700" fill="#0f766e">网络这一段 · 第 1、4 段</text>
<circle cx="78" cy="338" r="22" fill="#0f766e"/>
<text x="78" y="346" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">06</text>
<use href="#switchico" x="114" y="316" width="44" height="44" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="172" y="334" font-size="22" font-weight="700" fill="#0f766e">交换机上的时间</text>
<text x="172" y="360" font-size="21">固定转发、出口排队、PTP 对时</text>
<circle cx="78" cy="422" r="22" fill="#0f766e"/>
<text x="78" y="430" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">07</text>
<use href="#code" x="114" y="400" width="44" height="44" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="172" y="418" font-size="22" font-weight="700" fill="#0f766e">XDP 提前处理</text>
<text x="172" y="444" font-size="21">报文刚进主机就先过滤</text>
<circle cx="78" cy="506" r="22" fill="#0f766e"/>
<text x="78" y="514" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">08</text>
<use href="#lane" x="114" y="484" width="44" height="44" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="172" y="502" font-size="22" font-weight="700" fill="#0f766e">FPGA：U250 板卡</text>
<text x="172" y="528" font-size="21">用 Vivado 仿真、构建配置</text>
<circle cx="78" cy="590" r="22" fill="#0f766e"/>
<text x="78" y="598" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">08</text>
<use href="#board" x="114" y="568" width="44" height="44" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="172" y="586" font-size="22" font-weight="700" fill="#0f766e">FPGA：交换机</text>
<text x="172" y="612" font-size="21">适配厂商工程与部署流程</text>
<text x="56" y="672" font-size="21" fill="#475569">出口排队是这一段的主要变动项。</text>

<rect x="618" y="248" width="546" height="452" rx="15" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="638" y="292" font-size="25" font-weight="700" fill="#7e22ce">主机这一段 · 第 2、3 段</text>
<circle cx="660" cy="338" r="22" fill="#7e22ce"/>
<text x="660" y="346" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">04</text>
<use href="#chip" x="696" y="316" width="44" height="44" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="754" y="334" font-size="22" font-weight="700" fill="#7e22ce">C++ 软件热路径</text>
<text x="754" y="360" font-size="21">队列交棒、忙轮询、CPU 隔离</text>
<text x="754" y="404" font-size="21">让这段代码稳定地被执行</text>
<circle cx="660" cy="458" r="22" fill="#7e22ce"/>
<text x="660" y="466" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">05</text>
<use href="#lane" x="696" y="436" width="44" height="44" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="754" y="454" font-size="22" font-weight="700" fill="#7e22ce">四条出站路径</text>
<text x="754" y="480" font-size="21">内核、Onload、TCPDirect、DPDK</text>
<text x="754" y="524" font-size="21">各自少走一段内核处理</text>
<text x="638" y="596" font-size="22" font-weight="700" fill="#7e22ce">本章（第 00 章）</text>
<text x="638" y="628" font-size="21">先认清主机内部的四个等待点：</text>
<text x="638" y="662" font-size="21">取数据、准备内存、等 CPU 执行、收包交给程序。</text>

<rect x="36" y="726" width="1128" height="122" rx="15" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.8"/>
<use href="#card" x="60" y="752" width="46" height="46" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="124" y="770" font-size="22" font-weight="700">先备好基础：第 01～03 章</text>
<text x="124" y="802" font-size="21">认环境与网卡接线、部署交易平台、读懂真实报文。</text>
<text x="124" y="832" font-size="21" fill="#475569">图示章节归属与位置，不写耗时；具体数字由第 04 章开始测量。</text>
</g>
</svg>
