<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">收到行情后决定下单：一次反应经过五段</title>
<desc id="desc">行情沿网络到达本机程序，程序计算后经过下单前风控，再由订单网络送到交易所处理。图示职责顺序，不表示每笔交易都采用同一套实现，也不给出耗时。</desc>
<defs>
<marker id="arr-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#0f766e"/></marker>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#1d4ed8"/></marker>
<marker id="arr-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#b45309"/></marker>
<marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#c2410c"/></marker>
<symbol id="ico-building" viewBox="0 0 80 80">
<polygon points="8,28 40,8 72,28" fill="#5b8a96"/>
<rect x="14" y="26" width="52" height="46" rx="3" fill="#d7e8eb" stroke="#3e7b88" stroke-width="2.4"/>
<rect x="22" y="34" width="9" height="9" rx="1" fill="#fff"/>
<rect x="35.5" y="34" width="9" height="9" rx="1" fill="#fff"/>
<rect x="49" y="34" width="9" height="9" rx="1" fill="#fff"/>
<rect x="22" y="47" width="9" height="9" rx="1" fill="#fff"/>
<rect x="49" y="47" width="9" height="9" rx="1" fill="#fff"/>
<rect x="34" y="52" width="12" height="20" fill="#3e7b88"/>
</symbol>
<symbol id="ico-packets" viewBox="0 0 80 40">
<rect x="4" y="10" width="20" height="16" rx="3" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
<rect x="30" y="10" width="20" height="16" rx="3" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
<rect x="56" y="10" width="20" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/>
<path d="M24 18h6M50 18h6" stroke="#0f766e" stroke-width="2"/>
</symbol>
<symbol id="ico-switch" viewBox="0 0 80 36">
<rect x="6" y="6" width="68" height="24" rx="5" fill="#334155" stroke="#0f172a" stroke-width="2"/>
<circle cx="18" cy="18" r="3" fill="#4ade80"/>
<circle cx="30" cy="18" r="3" fill="#4ade80"/>
<circle cx="42" cy="18" r="3" fill="#fbbf24"/>
<circle cx="54" cy="18" r="3" fill="#4ade80"/>
<circle cx="66" cy="18" r="3" fill="#22d3ee"/>
</symbol>
<symbol id="ico-server" viewBox="0 0 70 80">
<rect x="12" y="8" width="46" height="64" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="2.4"/>
<path d="M12 28h46M12 48h46" stroke="#334155" stroke-width="2"/>
<circle cx="22" cy="18" r="3" fill="#22c55e"/>
<circle cx="22" cy="38" r="3" fill="#22c55e"/>
<circle cx="22" cy="58" r="3" fill="#f59e0b"/>
<rect x="32" y="14" width="18" height="8" rx="2" fill="#94a3b8"/>
<rect x="32" y="34" width="18" height="8" rx="2" fill="#94a3b8"/>
<rect x="32" y="54" width="18" height="8" rx="2" fill="#94a3b8"/>
</symbol>
<symbol id="ico-screen" viewBox="0 0 80 70">
<rect x="8" y="6" width="64" height="44" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="2.4"/>
<path d="M18 38 L30 26 L42 32 L58 16" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="28" y="50" width="24" height="6" fill="#64748b"/>
<rect x="20" y="56" width="40" height="6" rx="2" fill="#94a3b8"/>
</symbol>
<symbol id="ico-shield" viewBox="0 0 70 80">
<path d="M35 8 L58 18 V40 Q58 62 35 72 Q12 62 12 40 V18 Z" fill="#fde68a" stroke="#b45309" stroke-width="2.6"/>
<path d="M24 40 L32 48 L48 28" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
<symbol id="ico-stamp" viewBox="0 0 70 70">
<rect x="16" y="8" width="38" height="22" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2.4"/>
<rect x="24" y="30" width="22" height="10" fill="#c2410c"/>
<rect x="12" y="40" width="46" height="18" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2.4"/>
<text x="35" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">准</text>
</symbol>
<symbol id="ico-ticket" viewBox="0 0 70 80">
<rect x="16" y="8" width="38" height="64" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2.4"/>
<path d="M16 22h38M24 34h22M24 44h22M24 54h16" stroke="#fdba74" stroke-width="2.4"/>
<circle cx="35" cy="16" r="3" fill="#c2410c"/>
</symbol>
<symbol id="ico-match" viewBox="0 0 80 70">
<rect x="8" y="14" width="28" height="42" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2.4"/>
<rect x="44" y="14" width="28" height="42" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2.4"/>
<path d="M36 35 H44" stroke="#334155" stroke-width="3"/>
<circle cx="22" cy="28" r="4" fill="#15803d"/>
<circle cx="58" cy="42" r="4" fill="#c2410c"/>
</symbol>
</defs>
<style>
text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172338; }
.head { font-size: 30px; font-weight: 750; }
.sub { font-size: 22px; fill: #64748b; }
.card-title { font-size: 24px; font-weight: 750; }
.body { font-size: 21px; }
.small { font-size: 21px; fill: #475569; }
.num { font-size: 22px; font-weight: 800; fill: #fff; }
.edge { fill: none; stroke-width: 3; stroke-linecap: butt; stroke-linejoin: round; }
</style>
<rect width="1200" height="880" fill="#f7f9fc"/>
<rect x="20" y="16" width="1160" height="848" rx="22" fill="#fff" stroke="#e2e8f0"/>
<text x="48" y="62" class="head">收到行情后决定下单</text>
<text x="48" y="98" class="sub">一次反应可能经过这五段；图里是职责顺序，不是固定耗时。</text>

<rect id="s1" x="40" y="140" width="320" height="310" rx="16" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
<circle cx="72" cy="176" r="20" fill="#0f766e"/>
<text x="72" y="184" class="num" text-anchor="middle">1</text>
<text x="210" y="184" class="card-title" fill="#0f766e" text-anchor="middle">行情网络</text>
<use href="#ico-building" x="78" y="200" width="86" height="86"/>
<use href="#ico-packets" x="176" y="214" width="120" height="48"/>
<use href="#ico-switch" x="176" y="262" width="120" height="44"/>
<text x="200" y="368" class="body" text-anchor="middle">行情沿线路送到本机</text>
<text x="200" y="400" class="small" text-anchor="middle">路径、拥塞、丢包都可能等</text>

<rect id="s2" x="440" y="140" width="320" height="310" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<circle cx="472" cy="176" r="20" fill="#1d4ed8"/>
<text x="472" y="184" class="num" text-anchor="middle">2</text>
<text x="620" y="184" class="card-title" fill="#1d4ed8" text-anchor="middle">程序接收与计算</text>
<use href="#ico-server" x="478" y="204" width="78" height="88"/>
<use href="#ico-screen" x="568" y="214" width="140" height="92"/>
<text x="600" y="368" class="body" text-anchor="middle">读取行情并作出判断</text>
<text x="600" y="400" class="small" text-anchor="middle">本机程序开始工作</text>

<rect id="s3" x="840" y="140" width="320" height="310" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<circle cx="872" cy="176" r="20" fill="#b45309"/>
<text x="872" y="184" class="num" text-anchor="middle">3</text>
<text x="1020" y="184" class="card-title" fill="#b45309" text-anchor="middle">下单前风控</text>
<use href="#ico-shield" x="888" y="204" width="86" height="92"/>
<use href="#ico-stamp" x="996" y="214" width="92" height="88"/>
<text x="1000" y="368" class="body" text-anchor="middle">检查通过后才允许发单</text>
<text x="1000" y="400" class="small" text-anchor="middle">仍在本机程序之内</text>

<rect id="s4" x="240" y="530" width="320" height="250" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<circle cx="272" cy="566" r="20" fill="#c2410c"/>
<text x="272" y="574" class="num" text-anchor="middle">4</text>
<text x="420" y="574" class="card-title" fill="#c2410c" text-anchor="middle">订单网络</text>
<use href="#ico-ticket" x="278" y="588" width="70" height="78"/>
<use href="#ico-switch" x="360" y="608" width="150" height="52"/>
<text x="400" y="708" class="body" text-anchor="middle">订单沿线路发往交易所</text>
<text x="400" y="740" class="small" text-anchor="middle">又一次走在网络上</text>

<rect id="s5" x="640" y="530" width="320" height="250" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<circle cx="672" cy="566" r="20" fill="#15803d"/>
<text x="672" y="574" class="num" text-anchor="middle">5</text>
<text x="820" y="574" class="card-title" fill="#15803d" text-anchor="middle">交易所处理</text>
<use href="#ico-building" x="688" y="588" width="72" height="72"/>
<use href="#ico-match" x="780" y="596" width="130" height="78"/>
<text x="800" y="708" class="body" text-anchor="middle">交易所接受并处理订单</text>
<text x="800" y="740" class="small" text-anchor="middle">本课先看到达之前的等待</text>

<path class="edge" d="M372 295 H416" stroke="#0f766e" marker-end="url(#arr-cyan)"/>
<text x="394" y="278" class="small" text-anchor="middle" fill="#0f766e">送到</text>
<path class="edge" d="M772 295 H816" stroke="#1d4ed8" marker-end="url(#arr-blue)"/>
<text x="794" y="278" class="small" text-anchor="middle" fill="#1d4ed8">接着</text>
<path class="edge" d="M1000 462 V490 H400 V506" stroke="#b45309" marker-end="url(#arr-amber)"/>
<text x="700" y="478" class="small" text-anchor="middle" fill="#b45309">检查通过后发出订单</text>
<path class="edge" d="M572 655 H616" stroke="#c2410c" marker-end="url(#arr-orange)"/>
<text x="594" y="638" class="small" text-anchor="middle" fill="#c2410c">送达</text>

<text x="48" y="838" class="small">这是一条常见的反应顺序。具体实现可以不同，数字耗时留到第 04 章测量。</text>
</svg>
