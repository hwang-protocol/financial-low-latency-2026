<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>map：控制配置、逐核计数、记录命中</title><desc>map 是内核共享对象；数据包不会“经过”控制程序</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#475569}.label{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}</style><rect width="1200" height="700" rx="20" fill="#fff"/><text x="40" y="55" class="title">map：控制配置、逐核计数、记录命中</text><text x="40" y="94" class="sub">map 是内核共享对象；数据包不会“经过”控制程序</text>
<rect x="40" y="140" width="330" height="142" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="177" class="label">用户态控制程序</text>
<text x="60" y="213" class="body">先清 audit，再写 policy</text>
<text x="60" y="246" class="body">写字段后最后武装额度</text>
<text x="60" y="279" class="body">读取各 CPU counter 求和</text>
<rect x="440" y="140" width="330" height="142" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="460" y="177" class="label">policy · 共享 ARRAY</text>
<text x="460" y="213" class="body">目标 Locate、模式、期限</text>
<text x="460" y="246" class="body">remaining_drops = 1</text>
<text x="460" y="279" class="body">跨 CPU 共用同一额度</text>
<rect x="830" y="140" width="325" height="142" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850" y="177" class="label">audit · 共享 ARRAY</text>
<text x="850" y="213" class="body">成功抢到额度者记录</text>
<text x="850" y="246" class="body">Mold Sequence / Locate</text>
<text x="850" y="279" class="body">用于对齐 Feed GAP</text>
<path d="M370 192L440 192" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="330" height="145" rx="12" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="397" class="label">CPU 0：匹配包 A</text>
<text x="60" y="433" class="body">原子比较交换 1 → 0</text>
<text x="60" y="466" class="body">抢到唯一额度 → DROP</text>
<text x="60" y="499" class="body">记录该包身份</text>
<rect x="440" y="360" width="330" height="145" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="460" y="397" class="label">CPU 1：匹配包 B</text>
<text x="460" y="433" class="body">同一额度已经是 0</text>
<text x="460" y="466" class="body">比较交换失败 → PASS</text>
<text x="460" y="499" class="body">不能再次丢包</text>
<rect x="830" y="360" width="325" height="145" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="850" y="397" class="label">counters · PERCPU</text>
<text x="850" y="433" class="body">每颗 CPU 更新自己的槽</text>
<text x="850" y="466" class="body">用户态汇总所有副本</text>
<text x="850" y="499" class="body">计数低争用；非策略额度</text>
<path d="M550 282L550 320L200 320L200 360" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M605 282L605 360" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="40" y="579" class="small">两颗 CPU 的调度先后是示意；哪一包先抢到额度，以实际 audit 为准。</text>
<text x="40" y="625" class="small">整份多字段配置的原子更新需要额外设计；本课在静默、未武装阶段完成配置。</text>
</svg>
