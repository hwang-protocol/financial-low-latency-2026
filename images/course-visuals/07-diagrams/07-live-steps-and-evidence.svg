<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
<title id="title">运行⑤：脚本按什么顺序做，哪些输出证明生效</title>
<desc id="desc">七个自动步骤：预检编译、挂载、放行基线、开放一次额度、核对丢包与行情缺口、关闭策略重放、卸载并恢复原模式。核心历史证据为XDP丢1包且Sequence756，Feed gap_size1且next_expected756。数值来自20260905T084150Z历史RUN，非当前实测。</desc>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172554;font-size:24px}.title{font-size:34px;font-weight:700}.head{font-size:27px;font-weight:700}.small{font-size:22px}.bold{font-weight:700}.muted{fill:#475569}.red{fill:#9f1239}.green{fill:#166534}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1450" rx="20" fill="#fff"/>

<text x="40" y="55" class="title">运行⑤：脚本做什么，哪些输出证明生效？</text>
<text x="40" y="96" class="small muted">从上往下读；左边是自动操作，右边是输出文件与关键字段。</text>
<text x="40" y="127" class="small red">数值摘自历史 RUN 20260905T084150Z；示例序号不代替本次实际输出。</text>
<rect x="40" y="153" width="352" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="190" class="head">1  检查环境、编译</text>
<text x="60" y="219" class="small">确认无旧挂载，核对源码</text>
<text x="60" y="247" class="small">在 .2 生成本次加载对象</text>
<path d="M392 209.0 L423 209.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 265 L216 288" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="153" width="730" height="112" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="189" class="small muted">handoff-before.txt / 远端编译对象</text>
<text x="450" y="225" class="bold">环境检查通过，生成 BPF 对象</text>
<text x="450" y="254" class="small muted">说明：运行前的准备完成。</text>
<rect x="40" y="293" width="352" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="330" class="head">2  加载 Native XDP</text>
<text x="60" y="359" class="small">挂到 .2 的 ens64np1</text>
<text x="60" y="387" class="small">通过内核审核后开始接包</text>
<path d="M392 349.0 L423 349.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 405 L216 428" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="293" width="730" height="112" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="329" class="small muted">xdp-link-attached.txt</text>
<text x="450" y="365" class="bold">prog/xdp … jited</text>
<text x="450" y="394" class="small muted">说明：程序已挂载，还不能据此判断是否丢过包。</text>
<rect x="40" y="433" width="352" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="470" class="head">3  先全部放行</text>
<text x="60" y="499" class="small">额度为 0；临时切组播</text>
<text x="60" y="527" class="small">重放新 Session，等行情健康</text>
<path d="M392 489.0 L423 489.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 545 L216 568" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="433" width="730" height="112" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="469" class="small muted">feed-baseline.json</text>
<text x="450" y="505" class="bold">integrity=HEALTHY</text>
<text x="450" y="534" class="small muted">说明：未丢包时，行情能正常通过这条路径。</text>
<rect x="40" y="573" width="352" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="610" class="head">4  开放一次额度</text>
<text x="60" y="639" class="small">全 CPU 共用 1 次，限 5 秒</text>
<text x="60" y="667" class="small">等待匹配的 NVDA Type A</text>
<path d="M392 629.0 L423 629.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 685 L216 708" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="573" width="730" height="112" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="609" class="small muted">policy-block.txt</text>
<text x="450" y="645" class="small bold">mode=block  remaining=1  ttl_seconds=5.0</text>
<text x="450" y="674" class="small muted">说明：开关已打开；这一行本身不是丢包证据。</text>
<rect x="40" y="713" width="352" height="300" rx="13" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
<text x="60" y="750" class="head red">5  核对丢包与缺口</text>
<text x="60" y="779" class="small">读取 XDP 计数和丢包记录</text>
<text x="60" y="807" class="small">检查接收端 GAP、拒单</text>
<text x="60" y="835" class="small">再核对两个序号是否相同</text>
<path d="M392 863.0 L423 863.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 1013 L216 1036" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="216" y="950" class="bold red" text-anchor="middle">重点看右边这一组！</text>
<rect x="430" y="713" width="730" height="300" rx="13" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
<text x="450" y="752" class="head red">核心证据：XDP 丢的，正是接收程序缺的</text>
<rect x="450" y="772" width="320" height="137" rx="13" fill="#fff" stroke="#fda4af" stroke-width="2"/>
<text x="610" y="803" class="small muted" text-anchor="middle">drop-proof.txt</text>
<text x="610" y="845" class="bold red" text-anchor="middle">xdp_drop_packets=1</text>
<text x="610" y="883" class="bold red" text-anchor="middle">sequence=756</text>
<rect x="794" y="772" width="346" height="137" rx="13" fill="#fff" stroke="#fda4af" stroke-width="2"/>
<text x="967" y="803" class="small muted" text-anchor="middle">feed-gap.json</text>
<text x="967" y="845" class="bold red" text-anchor="middle">GAP / gap_size=1</text>
<text x="967" y="883" class="bold red" text-anchor="middle">next_expected=756</text>
<text x="782" y="883" class="bold red" text-anchor="middle">=</text>
<text x="450" y="948" class="small bold red">756 = 756：被丢序号与接收端等待的序号对上了。</text>
<text x="450" y="987" class="small">业务效果：HTTP 400 / FEED_NOT_HEALTHY（拒单）</text>
<rect x="40" y="1041" width="352" height="112" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="1078" class="head">6  关闭策略、重放</text>
<text x="60" y="1107" class="small">先恢复放行，再重放行情</text>
<text x="60" y="1135" class="small">此时 XDP 仍挂着</text>
<path d="M392 1097.0 L423 1097.0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M216 1153 L216 1176" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="1041" width="730" height="112" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450" y="1077" class="small muted">feed-recovered-inline.json</text>
<text x="450" y="1113" class="bold green">新 Session / integrity=HEALTHY</text>
<text x="450" y="1142" class="small muted">说明：关闭丢包后，接收程序重新建好订单簿。</text>
<rect x="40" y="1181" width="352" height="145" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="60" y="1218" class="head">7  卸载并恢复原模式</text>
<text x="60" y="1247" class="small">卸载本次 XDP、恢复模式</text>
<text x="60" y="1275" class="small">再次重放，验证两笔成交</text>
<path d="M392 1253.5 L423 1253.5" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="430" y="1181" width="730" height="145" rx="13" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="450" y="1217" class="small muted">feed-final.json / post-restore-orders.json</text>
<text x="450" y="1253" class="bold green">HEALTHY / OPEN / 两笔 ORDER_EXECUTED</text>
<text x="450" y="1289" class="small">handoff-after.txt：核对本次 XDP 已卸载。</text>
<text x="450" y="1318" class="small muted">说明：原接收路径和交易都恢复。</text>
<text x="600" y="1373" class="small bold" text-anchor="middle">全部检查通过才打印 result=PASS；evidence= 指向本次完整结果目录。</text>
<text x="600" y="1417" class="small muted" text-anchor="middle">正常流程由脚本完成；网页缺口可能一闪而过，以保存的结果为准。</text>
</svg>
