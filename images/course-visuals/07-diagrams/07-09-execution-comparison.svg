<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>同一条 NVDA 规则，四种执行落点</title><desc>统一比较职责与交付物；当前软件结果不能换算为硬件延迟排行榜</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#475569}.label{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}</style><rect width="1200" height="780" rx="20" fill="#fff"/><text x="40" y="55" class="title">同一条 NVDA 规则，四种执行落点</text><text x="40" y="94" class="sub">统一比较职责与交付物；当前软件结果不能换算为硬件延迟排行榜</text>
<rect x="40" y="155" width="260" height="103" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="192" class="label">08 · native XDP</text>
<text x="335" y="194" class="body">.2 驱动调用主机 CPU</text>
<text x="335" y="232" class="small">C → BPF ELF → JIT</text>
<text x="785" y="215" class="body">map 配规则 / 读计数</text>
<path d="M300 208L320 208" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="287" width="260" height="103" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="324" class="label">09 · P4 / BMv2</text>
<text x="335" y="326" class="body">软件交换机使用 CPU</text>
<text x="335" y="364" class="small">P4 → BMv2 JSON</text>
<text x="785" y="347" class="body">Thrift 配表 / register</text>
<path d="M300 340L320 340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="419" width="260" height="103" rx="12" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="456" class="label">09 · 7130 FPGA</text>
<text x="335" y="458" class="body">网络中的应用 FPGA</text>
<text x="335" y="496" class="small">RTL + FDK → bit / swix</text>
<text x="785" y="479" class="body">EOS 应用 → 寄存器</text>
<path d="M300 472L320 472" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="551" width="260" height="103" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="588" class="label">10 · FPGA 网卡</text>
<text x="335" y="590" class="body">主机 DMA 前的 FPGA</text>
<text x="335" y="628" class="small">RTL + NIC shell → bit</text>
<text x="785" y="611" class="body">PCIe BAR → 寄存器</text>
<path d="M300 604L320 604" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="727" class="small">本课第 09章现跑 Verilator CPU 模型；最下面一行是换成实体板卡后的设计。</text>
</svg>
