<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">eBPF 的三个应用：测交易时延、挡攻击、分配流量</title>
<desc id="desc">同一张图从上到下：EPAM/Deltix 在 TC 入站和出站提取 FIX 订单标识与时间戳，由用户态配对计算请求到首个响应的耗时；Cloudflare L4Drop 在 XDP 丢弃命中攻击规则的流量；Meta Katran 在 XDP 为访问连接选择后端。A123 仅示意订单标识，没有展示实测数字。</desc>
<style>text{font-family:'Noto Sans CJK SC',sans-serif}</style>
<defs>
<marker id="slate" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
<marker id="red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e11d48"/></marker>
<marker id="green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#16a34a"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="1400" rx="22" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="36" y="52" font-size="36" fill="#0f172a" font-weight="800" text-anchor="start">eBPF 的三个真实应用</text>
<text x="36" y="93" font-size="25" fill="#64748b" font-weight="400" text-anchor="start">测交易时延  ·  提前挡攻击  ·  给访问流量选后端</text>
<rect x="24" y="120" width="1152" height="434" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="48" y="142" width="42" height="42" rx="13" fill="#2563eb" stroke="none" stroke-width="2"/>
<text x="69" y="172" font-size="26" fill="white" font-weight="700" text-anchor="middle">1</text>
<text x="106" y="172" font-size="29" fill="#172554" font-weight="700" text-anchor="start">EPAM / Deltix：测交易请求响应时延</text>
<rect x="986" y="147" width="164" height="32" rx="16" fill="white" stroke="#bfdbfe" stroke-width="2"/>
<text x="1068" y="170" font-size="20" fill="#2563eb" font-weight="700" text-anchor="middle">金融交易 / TC</text>
<text x="50" y="211" font-size="25" fill="#334155" font-weight="400" text-anchor="start">请求进入服务器，到同一订单的首个响应离开，花了多久？</text>
<text x="50" y="247" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">受测交易服务器</text>
<g class="node">
<rect x="55" y="264" width="284" height="118" rx="14" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="197.0" y="305" font-size="26" fill="#1e40af" font-weight="700" text-anchor="middle">请求进入</text>
<text x="197.0" y="336" font-size="24" fill="#1e293b" font-weight="600" text-anchor="middle">订单号 A123 · t1</text>
<text x="197.0" y="365" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">TC 入站 eBPF 记录</text>
</g>
<g class="node">
<rect x="455" y="264" width="290" height="118" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="600.0" y="310" font-size="28" fill="#4338ca" font-weight="700" text-anchor="middle">交易服务处理</text>
<text x="600.0" y="352" font-size="23" fill="#475569" font-weight="400" text-anchor="middle">处理订单并生成响应</text>
</g>
<g class="node">
<rect x="861" y="264" width="284" height="118" rx="14" fill="white" stroke="#93c5fd" stroke-width="2"/>
<text x="1003.0" y="305" font-size="26" fill="#1e40af" font-weight="700" text-anchor="middle">首个响应离开</text>
<text x="1003.0" y="336" font-size="24" fill="#1e293b" font-weight="600" text-anchor="middle">订单号 A123 · t2</text>
<text x="1003.0" y="365" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">TC 出站 eBPF 记录</text>
</g>
<path d="M351 323 H431" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="butt" marker-end="url(#slate)"/>
<path d="M757 323 H837" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="butt" marker-end="url(#slate)"/>
<g class="node">
<rect x="308" y="431" width="584" height="80" rx="14" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/>
<text x="600.0" y="466" font-size="23" fill="white" font-weight="600" text-anchor="middle">用户态：按同一订单号配对</text>
<text x="600.0" y="496" font-size="23" fill="white" font-weight="700" text-anchor="middle">响应耗时 = t2 − t1   →   平均值 / P99</text>
</g>
<path d="M197 394 V468 H284" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-dasharray="7 6" marker-end="url(#blue)"/>
<path d="M1003 394 V468 H916" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-dasharray="7 6" marker-end="url(#blue)"/>
<text x="50" y="540" font-size="20" fill="#475569" font-weight="400" text-anchor="start">A123 为示意订单号；测响应耗时与尾延迟，本课未实测该工具。</text>
<rect x="24" y="578" width="1152" height="344" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<rect x="48" y="600" width="42" height="42" rx="13" fill="#ea580c" stroke="none" stroke-width="2"/>
<text x="69" y="630" font-size="26" fill="white" font-weight="700" text-anchor="middle">2</text>
<text x="106" y="630" font-size="29" fill="#172554" font-weight="700" text-anchor="start">Cloudflare · L4Drop：尽早挡住攻击包</text>
<rect x="986" y="605" width="164" height="32" rx="16" fill="white" stroke="#fed7aa" stroke-width="2"/>
<text x="1068" y="628" font-size="20" fill="#ea580c" font-weight="700" text-anchor="middle">防攻击 / XDP</text>
<text x="50" y="669" font-size="24" fill="#475569" font-weight="400" text-anchor="start">攻击流量涌入时，提前丢掉命中规则的包，减轻后续处理负担。</text>
<g class="node">
<rect x="55" y="716" width="280" height="108" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="195.0" y="758" font-size="27" fill="#334155" font-weight="700" text-anchor="middle">访问流量</text>
<text x="195.0" y="795" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle">正常请求 + 攻击包</text>
</g>
<g class="node">
<rect x="455" y="716" width="290" height="108" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
<text x="600.0" y="758" font-size="28" fill="#9a3412" font-weight="700" text-anchor="middle">L4Drop / XDP</text>
<text x="600.0" y="795" font-size="24" fill="#9a3412" font-weight="400" text-anchor="middle">检查攻击规则</text>
</g>
<g class="node">
<rect x="898" y="685" width="246" height="68" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<text x="1021.0" y="728" font-size="26" fill="#be123c" font-weight="700" text-anchor="middle">DROP：丢弃</text>
</g>
<g class="node">
<rect x="898" y="791" width="246" height="68" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="1021.0" y="834" font-size="25" fill="#166534" font-weight="700" text-anchor="middle">继续后续处理</text>
</g>
<path d="M347 770 H431" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="butt" marker-end="url(#slate)"/>
<path d="M757 747 H800 V719 H874" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="butt" marker-end="url(#red)"/>
<path d="M757 795 H800 V825 H874" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="butt" marker-end="url(#green)"/>
<text x="837" y="702" font-size="21" fill="#be123c" font-weight="600" text-anchor="middle">命中</text>
<text x="837" y="854" font-size="21" fill="#166534" font-weight="600" text-anchor="middle">未命中</text>
<text x="50" y="896" font-size="23" fill="#475569" font-weight="400" text-anchor="start">把处理能力留给其余流量；未命中仍需经过后续安全与业务处理。</text>
<rect x="24" y="946" width="1152" height="344" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
<rect x="48" y="968" width="42" height="42" rx="13" fill="#15803d" stroke="none" stroke-width="2"/>
<text x="69" y="998" font-size="26" fill="white" font-weight="700" text-anchor="middle">3</text>
<text x="106" y="998" font-size="29" fill="#172554" font-weight="700" text-anchor="start">Meta · Katran：把连接分配给后端</text>
<rect x="986" y="973" width="164" height="32" rx="16" fill="white" stroke="#bbf7d0" stroke-width="2"/>
<text x="1068" y="996" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">负载均衡 / XDP</text>
<text x="50" y="1037" font-size="24" fill="#475569" font-weight="400" text-anchor="start">一个服务入口背后有多台服务器，先决定这条连接交给谁。</text>
<g class="node">
<rect x="55" y="1084" width="280" height="108" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="195.0" y="1126" font-size="26" fill="#334155" font-weight="700" text-anchor="middle">用户访问服务 IP</text>
<text x="195.0" y="1163" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle">同一个服务入口</text>
</g>
<g class="node">
<rect x="455" y="1084" width="290" height="108" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="600.0" y="1126" font-size="28" fill="#166534" font-weight="700" text-anchor="middle">Katran / XDP</text>
<text x="600.0" y="1163" font-size="24" fill="#166534" font-weight="400" text-anchor="middle">按连接选择后端</text>
</g>
<g class="node">
<rect x="898" y="1053" width="246" height="68" rx="14" fill="white" stroke="#86efac" stroke-width="2"/>
<text x="1021.0" y="1096" font-size="25" fill="#166534" font-weight="700" text-anchor="middle">后端服务器 A</text>
</g>
<g class="node">
<rect x="898" y="1159" width="246" height="68" rx="14" fill="white" stroke="#86efac" stroke-width="2"/>
<text x="1021.0" y="1202" font-size="25" fill="#166534" font-weight="700" text-anchor="middle">后端服务器 B</text>
</g>
<path d="M347 1138 H431" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="butt" marker-end="url(#slate)"/>
<path d="M757 1115 H800 V1087 H874" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="butt" marker-end="url(#green)"/>
<path d="M757 1163 H800 V1193 H874" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="butt" marker-end="url(#green)"/>
<text x="837" y="1070" font-size="21" fill="#166534" font-weight="600" text-anchor="middle">连接甲</text>
<text x="837" y="1222" font-size="21" fill="#166534" font-weight="600" text-anchor="middle">连接乙</text>
<text x="50" y="1264" font-size="23" fill="#475569" font-weight="400" text-anchor="start">同一连接通常保持同一后端，把访问流量分散到多台服务器。</text>
<text x="36" y="1333" font-size="22" fill="#475569" font-weight="400" text-anchor="start">交易案例使用 TC；后两个案例使用 XDP。图中只画理解用途所需的流程。</text>
<text x="36" y="1370" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">来源：EPAM / Deltix、Cloudflare、Meta 官方公开资料 · 机制示意</text>
</svg>
