<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" role="img" aria-labelledby="title desc">
<title id="title">从 C 源码到 XDP 程序：当前运行④</title>
<desc id="desc">三张任务卡依次为查看源码、编译检查、装载挂载；每张卡下列出核心命令，绿色卡表示当前步骤。运行④会重新编译当前源码，然后装载本次对象。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker></defs>
<style>
text {font-family:'Noto Sans CJK SC',sans-serif;fill:#1e293b}
.title {font-size:32px;font-weight:700}
.subtitle {font-size:23px;fill:#475569}
.heading {font-size:28px;font-weight:700}
.task {font-size:24px;fill:#475569}
.command {font-family:'Noto Sans Mono CJK SC','Noto Sans CJK SC',monospace;font-size:25px;white-space:pre;fill:#1e293b}
.badge {font-size:21px;font-weight:700;fill:#fff}
</style>
<rect width="1200" height="966" rx="20" fill="#fff"/>
<text x="36" y="47" class="title">C 源码 → BPF 对象 → 内核中的 XDP 程序</text>
<text x="36" y="82" class="subtitle">命令按源码所在目录书写 · 绿色为当前步骤，实际执行正文绿色入口。</text>
<g id="step-2" data-current="false">
<rect x="36" y="110" width="1128" height="154" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="153" class="heading" style="fill:#475569">运行② · 查看 C 源码</text>
<text x="62" y="189" class="task">任务：阅读过滤条件；输入是 flle_xdp_mold_itch.c。</text>
<rect x="60" y="202" width="1080" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
<text x="80" y="236" xml:space="preserve" class="command">nl -ba flle_xdp_mold_itch.c</text>
</g>
<g id="step-3" data-current="false">
<rect x="36" y="320" width="1128" height="280" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="62" y="363" class="heading" style="fill:#475569">运行③ · 编译并检查 BPF 对象</text>
<text x="62" y="399" class="task">任务：Clang 把 .c 编成 .o，再用 LLVM 工具检查 .o。</text>
<rect x="60" y="416" width="1080" height="169" rx="10" fill="#fff" stroke="#e2e8f0"/>
<text x="80" y="450" xml:space="preserve" class="command">clang -O2 -g -target bpf \</text>
<text x="80" y="483" xml:space="preserve" class="command">  -D__TARGET_ARCH_x86 -I/usr/include/x86_64-linux-gnu \</text>
<text x="80" y="516" xml:space="preserve" class="command">  -c flle_xdp_mold_itch.c -o flle_xdp_mold_itch.o</text>
<text x="80" y="567" xml:space="preserve" class="command">llvm-objdump -h flle_xdp_mold_itch.o</text>
</g>
<g id="step-4" data-current="true">
<rect x="36" y="656" width="1128" height="238" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="62" y="699" class="heading" style="fill:#166534">运行④ · 装载到内核，挂到网卡入口</text>
<text x="62" y="735" class="task">任务：装载 BPF 对象，经 Verifier 检查后挂到 ens64np1。</text>
<rect x="60" y="751" width="1080" height="134" rx="10" fill="#fff" stroke="#e2e8f0"/>
<rect x="1026" y="674" width="112" height="34" rx="17" fill="#15803d"/>
<text x="1082" y="699" text-anchor="middle" class="badge">当前步骤</text>
<text x="80" y="785" xml:space="preserve" class="command">ip link set dev ens64np1 xdpdrv \</text>
<text x="80" y="818" xml:space="preserve" class="command">  obj flle_xdp_mold_itch.o sec xdp</text>
<text x="80" y="867" xml:space="preserve" class="command">ip -details link show dev ens64np1</text>
</g>
<path d="M600 276 V296" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<path d="M600 612 V632" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
<text x="36" y="934" class="subtitle">运行④先重新编译当前源码，再装载本次 .o；挂载后才开始处理报文。</text>
</svg>
