<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>eBPF 怎么装进去，XDP 怎么逐包执行</title><desc>两条时间线：装载时检查一次；收包时执行已装载的程序</desc><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#475569}.label{font-size:25px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}</style><rect width="1200" height="740" rx="20" fill="#fff"/><text x="40" y="55" class="title">eBPF 怎么装进去，XDP 怎么逐包执行</text><text x="40" y="94" class="sub">两条时间线：装载时检查一次；收包时执行已装载的程序</text>
<rect x="40" y="135" width="335" height="120" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="172" class="label">① C → eBPF ELF</text>
<text x="60" y="208" class="body">Clang：指令 + map 定义</text>
<text x="60" y="241" class="body">此时尚未进入内核</text>
<rect x="430" y="135" width="335" height="120" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="450" y="172" class="label">② Loader → Verifier</text>
<text x="450" y="208" class="body">核对指针、范围、控制流</text>
<text x="450" y="241" class="body">拒绝无法证明安全的程序</text>
<rect x="820" y="135" width="335" height="120" rx="12" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="840" y="172" class="label">③ JIT → Attach</text>
<text x="840" y="208" class="body">转成本机 CPU 指令</text>
<text x="840" y="241" class="body">把程序挂到驱动收包点</text>
<path d="M375 195L430 195" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M765 195L820 195" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="317" class="label">逐包路径 · 本课 native XDP 在主机 CPU 上运行</text>
<rect x="40" y="350" width="260" height="122" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="387" class="label">NIC 收包</text>
<text x="60" y="423" class="body">DMA 写主机内存</text>
<text x="60" y="456" class="body">RX 描述符就绪</text>
<rect x="350" y="350" width="330" height="122" rx="12" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="370" y="387" class="label">驱动 / NAPI → XDP</text>
<text x="370" y="423" class="body">从 data 读取报文字节</text>
<text x="370" y="456" class="body">调用已验证的程序</text>
<rect x="800" y="350" width="355" height="122" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="820" y="387" class="label">PASS → skb → 接收栈</text>
<text x="820" y="423" class="body">skb：内核报文描述对象</text>
<text x="820" y="456" class="body">交给 .2 行情接收程序</text>
<path d="M300 409L350 409" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M680 409L800 409" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M510 472L510 530" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="350" y="530" width="330" height="105" rx="12" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="370" y="567" class="label">DROP</text>
<text x="370" y="603" class="body">驱动回收接收缓冲</text>
<text x="40" y="690" class="small">提前 DROP 可省去后续栈处理；收包、DMA 与 XDP 自身的 CPU 成本仍然存在。</text>
</svg>
