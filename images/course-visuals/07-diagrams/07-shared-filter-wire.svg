<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img" aria-labelledby="title desc">
<title id="title">一包行情里，XDP 究竟检查什么</title>
<desc id="desc">从以太网、IPv4、UDP逐层展开MoldUDP64信封及ITCH新增订单消息，显示全部Type A字段、证券编号和股票代码、主机内一次性丢包条件及读取边界。本课布局示意，非抓包截图。</desc>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172554}.title{font-size:36px;font-weight:700}.section{font-size:28px;font-weight:700}.body{font-size:24px}.small{font-size:21px}.muted{fill:#475569}.strong{font-weight:700}.orange{fill:#9a3412}.white{fill:white}</style>
<rect width="1200" height="1550" rx="20" fill="#fff"/>

<text x="40" y="56" class="title">一包行情里，XDP 究竟检查什么？</text>
<text x="40" y="96" class="small muted">本课单消息报文示意；B = 字节。橙色标出筛选条件，方框不按字节比例缩放。</text>
<text x="40" y="148" class="section">① 先看整包：熟悉的 UDP 里面，装着行情</text>
<rect x="40" y="170" width="180" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="130.0" y="204" class="body strong" text-anchor="middle">以太网头</text>
<text x="130.0" y="238" class="small" text-anchor="middle">14 B · 字节 0–13</text>
<rect x="236" y="170" width="230" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="351.0" y="204" class="body strong" text-anchor="middle">IPv4 头</text>
<text x="351.0" y="238" class="small" text-anchor="middle">20 B · 字节 14–33</text>
<rect x="482" y="170" width="190" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="577.0" y="204" class="body strong" text-anchor="middle">UDP 头</text>
<text x="577.0" y="238" class="small" text-anchor="middle">8 B · 字节 34–41</text>
<rect x="688" y="170" width="472" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="924.0" y="204" class="body strong" text-anchor="middle">UDP 载荷：行情内容</text>
<text x="924.0" y="238" class="small" text-anchor="middle">58 B · 字节 42–99</text>
<text x="40" y="299" class="body orange">范围：IPv4 / UDP · 源 20.1.1.1 → 组播 233.74.125.32 · 目的端口 31032</text>
<text x="40" y="332" class="small muted">本图无 VLAN 标签、无 IP 选项、非分片；总长 100 B，不含以太网 FCS。</text>
<text x="40" y="388" class="section">② 展开 UDP 载荷：MoldUDP64 是装消息的“信封”</text>
<rect x="40" y="410" width="1120" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="443" class="body strong">信封头 20 B：标明哪一批行情、从哪条序号开始、里面有几条消息</text>
<rect x="60" y="460" width="325" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="222.5" y="491" class="small strong" text-anchor="middle">Session · 10 B</text>
<text x="222.5" y="526" class="small" text-anchor="middle">行情会话标识</text>
<rect x="397" y="460" width="405" height="84" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="599.5" y="491" class="small strong" text-anchor="middle">Sequence Number · 8 B</text>
<text x="599.5" y="526" class="small" text-anchor="middle">本包首条消息序号；用于缺口审计</text>
<rect x="814" y="460" width="326" height="84" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="977.0" y="491" class="small strong" text-anchor="middle">Message Count · 2 B</text>
<text x="977.0" y="526" class="small orange" text-anchor="middle">本课只解析 count = 1</text>
<rect x="60" y="558" width="380" height="82" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="250" y="589" class="body strong" text-anchor="middle">Message Length · 2 B</text>
<text x="250" y="623" class="small orange" text-anchor="middle">本条消息长度 = 36 B</text>
<rect x="460" y="558" width="680" height="82" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="800" y="589" class="body strong" text-anchor="middle">ITCH 消息内容 · 本例为 Type A，共 36 B</text>
<text x="800" y="623" class="small" text-anchor="middle">ITCH 是行情消息协议；A 表示“新增订单”</text>
<text x="40" y="696" class="small muted">count = 0 是心跳：信封里没有 ITCH 消息；多条消息时，会重复“长度 + 内容”。</text>
<text x="40" y="751" class="section">③ 展开 ITCH Type A：从左到右，再读下一行</text>
<text x="40" y="786" class="small muted">这里的字节编号从 ITCH 起点算起（0 对应整包字节 64），不是另一种包。</text>
<rect x="40" y="808" width="364" height="106" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="54" y="836" class="small orange">字节 0 · 1 B</text>
<text x="54" y="869" class="small strong">Message Type｜事件类型</text>
<text x="54" y="900" class="small">A = 新增订单</text>
<rect x="418" y="808" width="364" height="106" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="432" y="836" class="small orange">字节 1–2 · 2 B</text>
<text x="432" y="869" class="small strong">Stock Locate｜行情内部编号</text>
<text x="432" y="900" class="small">本课：37 苹果 / 8095 英伟达</text>
<rect x="796" y="808" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="810" y="836" class="small muted">字节 3–4 · 2 B</text>
<text x="810" y="869" class="small strong">Tracking Number｜跟踪号</text>
<text x="810" y="900" class="small">不参与本课筛选</text>
<rect x="40" y="928" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="54" y="956" class="small muted">字节 5–10 · 6 B</text>
<text x="54" y="989" class="small strong">Timestamp｜时间戳</text>
<text x="54" y="1020" class="small">不参与本课筛选</text>
<rect x="418" y="928" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="432" y="956" class="small muted">字节 11–18 · 8 B</text>
<text x="432" y="989" class="small strong">Order Reference｜订单编号</text>
<text x="432" y="1020" class="small">不参与本课筛选</text>
<rect x="796" y="928" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="810" y="956" class="small muted">字节 19 · 1 B</text>
<text x="810" y="989" class="small strong">Buy/Sell｜买卖方向</text>
<text x="810" y="1020" class="small">B 买 / S 卖；不筛选</text>
<rect x="40" y="1048" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="54" y="1076" class="small muted">字节 20–23 · 4 B</text>
<text x="54" y="1109" class="small strong">Shares｜股数</text>
<text x="54" y="1140" class="small">不参与本课筛选</text>
<rect x="418" y="1048" width="364" height="106" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="432" y="1076" class="small orange">字节 24–31 · 8 B</text>
<text x="432" y="1109" class="small strong">Stock｜股票代码</text>
<text x="432" y="1140" class="small">NVDA···· / AAPL····</text>
<rect x="796" y="1048" width="364" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="810" y="1076" class="small muted">字节 32–35 · 4 B</text>
<text x="810" y="1109" class="small strong">Price｜价格</text>
<text x="810" y="1140" class="small">不参与本课筛选</text>
<text x="40" y="1184" class="small muted">Stock：ASCII 字母和空格各占 1 B；NVDA + 4 个空格 = 8 B（图中 · 代表空格）。</text>
<text x="40" y="1213" class="small muted">Locate：当日固定，换交易日可能重新分配；8095 仅对应本课数据里的 NVDA。</text>
<text x="40" y="1250" class="section">④ 本课只有一条丢包规则：字段匹配 + 开关有效</text>
<rect x="40" y="1263" width="1120" height="62" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
<text x="600" y="1303" class="small strong orange" text-anchor="middle">满足上面的范围与格式条件，并且 Type = A、Locate = 8095、Stock = NVDA····</text>
<rect x="40" y="1339" width="1120" height="62" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="600" y="1379" class="body strong" text-anchor="middle">主机内控制（不在报文里）：mode = BLOCK · remaining_drops = 1 · 未过期</text>
<text x="600" y="1441" class="section" text-anchor="middle">全部满足 → DROP 一包，额度减为 0；其余情况 → PASS</text>
<text x="600" y="1482" class="small muted" text-anchor="middle">每次读字段前先检查字节够不够；data_end = 可读缓冲区的尾界，越界就 PASS。</text>
<text x="600" y="1520" class="small muted" text-anchor="middle">过滤决定整包去留，不修改股票代码、价格或其它报文字段。</text>
</svg>
