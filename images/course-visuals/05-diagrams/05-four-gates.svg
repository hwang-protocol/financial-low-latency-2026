<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:900}.k{font-size:16px;font-weight:800}.s{font-size:14px;fill:#475569}.p{font-size:13px;font-weight:800}.white{fill:#fff}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="496" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="54">四扇出站门，逐步接手更多事情</text>
  <text class="t s" x="52" y="82">旅客始终是同一笔 SoupBinTCP / OUCH 订单；本地填单方式逐步改变，最后一步还把 X2522 的所有权交给应用。</text>

  <rect x="40" y="110" width="270" height="300" rx="18" fill="#fff"/>
  <rect x="40" y="110" width="270" height="48" rx="18" fill="#f1f5f9"/>
  <path d="M40 140h270v18H40z" fill="#f1f5f9"/>
  <rect x="56" y="122" width="44" height="24" rx="12" fill="#64748b"/>
  <text class="t p white" x="78" y="139" text-anchor="middle">K</text>
  <text class="t k" x="175" y="141" text-anchor="middle">公共海关</text>
  <text class="t k" x="175" y="196" text-anchor="middle">普通单子</text>
  <text class="t s" x="175" y="228" text-anchor="middle">交给窗口代办</text>
  <text class="t s" x="175" y="252" text-anchor="middle">你在旁边等叫号</text>
  <text class="t s" x="175" y="292" text-anchor="middle">闸：海关在管</text>
  <text class="t s" x="175" y="328" text-anchor="middle">后文写法：Kernel Socket</text>
  <rect x="40" y="110" width="270" height="300" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="330" y="110" width="270" height="300" rx="18" fill="#fff"/>
  <rect x="330" y="110" width="270" height="48" rx="18" fill="#dbeafe"/>
  <path d="M330 140h270v18H330z" fill="#dbeafe"/>
  <rect x="346" y="122" width="44" height="24" rx="12" fill="#2563eb"/>
  <text class="t p white" x="368" y="139" text-anchor="middle">O</text>
  <text class="t k" x="465" y="141" text-anchor="middle">快速通道</text>
  <text class="t k" x="465" y="196" text-anchor="middle">还是那张普通单子</text>
  <text class="t s" x="465" y="228" text-anchor="middle">自助机自己刷</text>
  <text class="t s" x="465" y="252" text-anchor="middle">认不了的退回窗口</text>
  <text class="t s" x="465" y="292" text-anchor="middle">闸：海关在管</text>
  <text class="t s" x="465" y="328" text-anchor="middle">后文写法：OpenOnload</text>
  <rect x="330" y="110" width="270" height="300" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="620" y="110" width="270" height="300" rx="18" fill="#fff"/>
  <rect x="620" y="110" width="270" height="48" rx="18" fill="#dcfce7"/>
  <path d="M620 140h270v18H620z" fill="#dcfce7"/>
  <rect x="636" y="122" width="44" height="24" rx="12" fill="#15803d"/>
  <text class="t p white" x="658" y="139" text-anchor="middle">T</text>
  <text class="t k" x="755" y="141" text-anchor="middle">专用柜台</text>
  <text class="t k" x="755" y="196" text-anchor="middle">换成更短的专用单子</text>
  <text class="t s" x="755" y="228" text-anchor="middle">自己办、自己守着</text>
  <text class="t s" x="755" y="252" text-anchor="middle">显式推进 reactor、管理 buffer</text>
  <text class="t s" x="755" y="292" text-anchor="middle">闸：海关在管</text>
  <text class="t s" x="755" y="328" text-anchor="middle">后文写法：TCPDirect</text>
  <rect x="620" y="110" width="270" height="300" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="910" y="110" width="250" height="300" rx="18" fill="#fff"/>
  <rect x="910" y="110" width="250" height="48" rx="18" fill="#ffedd5"/>
  <path d="M910 140h250v18H910z" fill="#ffedd5"/>
  <rect x="926" y="122" width="44" height="24" rx="12" fill="#ea580c"/>
  <text class="t p white" x="948" y="139" text-anchor="middle">D</text>
  <text class="t k" x="1035" y="141" text-anchor="middle">出站闸承包</text>
  <text class="t k" x="1035" y="196" text-anchor="middle">F-Stack 的 TCP 单子</text>
  <text class="t s" x="1035" y="228" text-anchor="middle">线上仍是同一条 TCP</text>
  <text class="t s" x="1035" y="252" text-anchor="middle">整道闸也归应用</text>
  <text class="t s" x="1035" y="292" text-anchor="middle">收工必须交还</text>
  <text class="t s" x="1035" y="328" text-anchor="middle">后文写法：DPDK</text>
  <rect x="910" y="110" width="250" height="300" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="40" y="432" width="1120" height="52" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="600" y="465" font-size="15" font-weight="800" text-anchor="middle">共同交易任务与应用交棒合同固定；Transport、TCP 实现、辅助交棒和设备所有权按路径变化</text>
</svg>
