<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">从 ESXi 和 GRUB 到 IOMMU group 与安全 VFIO 的完整关系</title>
  <desc id="desc">上半部分展示开机配置链：ESXi 向 Guest 暴露虚拟 IOMMU，GRUB 保存 intel_iommu=on 与 iommu=pt，update-grub 后重启，Linux 才在当前 cmdline 中启用 IOMMU 并建立隔离组。下半部分展示运行时安全链：本机 group 7 只有 X2522，普通阶段由 sfc 管理；DPDK 阶段改由 vfio-pci 管理，VFIO 通过 IOMMU 只允许网卡 DMA 到已映射的大页。unsafe no-IOMMU 没有地址围栏，本课程拒绝使用。</desc>
  <defs>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .m{font-family:"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace;fill:#0f172a}
      .h{font-size:30px;font-weight:900}.sub{font-size:16px;fill:#475569}
      .k{font-size:21px;font-weight:900}.b{font-size:16px;font-weight:800}
      .s{font-size:14px;fill:#475569}.tiny{font-size:13px;fill:#64748b}.danger{fill:#991b1b}
      .badge{font-size:15px;font-weight:900;fill:#fff}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="blue" markerUnits="userSpaceOnUse" viewBox="0 0 18 12" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto" overflow="visible"><path d="M0 0L16 6L0 12Z" fill="#2563eb"/></marker>
    <marker id="purple" markerUnits="userSpaceOnUse" viewBox="0 0 18 12" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto" overflow="visible"><path d="M0 0L16 6L0 12Z" fill="#7c3aed"/></marker>
    <marker id="green" markerUnits="userSpaceOnUse" viewBox="0 0 18 12" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto" overflow="visible"><path d="M0 0L16 6L0 12Z" fill="#15803d"/></marker>
    <marker id="orange" markerUnits="userSpaceOnUse" viewBox="0 0 18 12" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto" overflow="visible"><path d="M0 0L16 6L0 12Z" fill="#d97706"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" viewBox="0 0 18 12" markerWidth="18" markerHeight="12" refX="1" refY="6" orient="auto" overflow="visible"><path d="M0 0L16 6L0 12Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="12" y="12" width="1376" height="796" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t h" x="52" y="58">先开地址围栏，再把 X2522 安全交给用户态</text>
  <text class="t sub" x="52" y="88">内存像仓库，DMA 像网卡自己的叉车；IOMMU 限定它能碰哪些货架，VFIO 负责在用户态接管时继续执行这道边界。</text>

  <g id="boot-chain">
    <rect x="42" y="116" width="1316" height="250" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="62" y="136" width="126" height="30" rx="15" fill="#2563eb"/>
    <text class="t badge" x="125" y="157" text-anchor="middle">A · 开机配置链</text>

    <rect x="78" y="190" width="300" height="132" rx="16" fill="#fff" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="112" cy="222" r="18" fill="#2563eb"/><text class="t badge" x="112" y="227" text-anchor="middle">1</text>
    <text class="t k" x="145" y="229">ESXi I/O MMU</text>
    <text class="t b" x="228" y="263" text-anchor="middle">把虚拟 IOMMU 暴露给 Guest</text>
    <text class="t s" x="228" y="291" text-anchor="middle">只有“门框”；Guest 还要自己启用</text>

    <path class="line" d="M378 256H452" stroke="#2563eb" marker-end="url(#blue)"/>

    <rect x="468" y="190" width="384" height="132" rx="16" fill="#fff" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="502" cy="222" r="18" fill="#7c3aed"/><text class="t badge" x="502" y="227" text-anchor="middle">2</text>
    <text class="t k" x="535" y="229">GRUB · 下次启动清单</text>
    <text class="m b" x="660" y="263" text-anchor="middle">intel_iommu=on  iommu=pt</text>
    <text class="t s" x="660" y="291" text-anchor="middle">update-grub 写启动项；重启后才生效</text>

    <path class="line" d="M852 256H926" stroke="#7c3aed" marker-end="url(#purple)"/>
    <text class="t tiny" x="889" y="238" text-anchor="middle">reboot</text>

    <rect x="942" y="190" width="338" height="132" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="976" cy="222" r="18" fill="#15803d"/><text class="t badge" x="976" y="227" text-anchor="middle">3</text>
    <text class="t k" x="1009" y="229">Linux Guest</text>
    <text class="t b" x="1111" y="263" text-anchor="middle">当前 cmdline 出现两个参数</text>
    <text class="t s" x="1111" y="291" text-anchor="middle">IOMMU 生效，sysfs 才能列出 group</text>
  </g>

  <path class="line" d="M1010 322V382H233V448" stroke="#15803d" marker-end="url(#green)"/>
  <path class="line" d="M1212 322V448" stroke="#15803d" marker-end="url(#green)"/>

  <g id="runtime-chain">
    <rect x="42" y="392" width="1316" height="360" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="62" y="412" width="146" height="30" rx="15" fill="#7c3aed"/>
    <text class="t badge" x="135" y="433" text-anchor="middle">B · 运行时安全链</text>

    <rect x="78" y="466" width="310" height="232" rx="18" fill="#fff" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="112" cy="499" r="18" fill="#d97706"/><text class="t badge" x="112" y="504" text-anchor="middle">4</text>
    <text class="t k" x="145" y="506">IOMMU group 7</text>
    <rect x="106" y="535" width="254" height="76" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text class="m b" x="233" y="567" text-anchor="middle">0000:03:00.0</text>
    <text class="t s" x="233" y="593" text-anchor="middle">X2522 · 组内唯一设备</text>
    <text class="t s" x="233" y="644" text-anchor="middle">“7”只是本机编号</text>
    <text class="t b" x="233" y="672" text-anchor="middle">关键是不能夹带其他设备</text>

    <path class="line" d="M388 546H462" stroke="#15803d" marker-end="url(#green)"/>
    <path class="line" d="M388 626H462" stroke="#7c3aed" marker-end="url(#purple)"/>

    <rect x="478" y="458" width="314" height="112" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text class="t b" x="635" y="490" text-anchor="middle">普通阶段 · owner = sfc</text>
    <text class="m s" x="635" y="519" text-anchor="middle">iommu=pt</text>
    <text class="t s" x="635" y="544" text-anchor="middle">非 VFIO 设备默认恒等映射</text>
    <text class="t tiny" x="635" y="563" text-anchor="middle">它不是关闭 IOMMU</text>

    <rect x="478" y="594" width="314" height="112" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2.5"/>
    <text class="t b" x="635" y="626" text-anchor="middle">DPDK 阶段 · owner = vfio-pci</text>
    <text class="t s" x="635" y="655" text-anchor="middle">VFIO 接管设备</text>
    <text class="t tiny" x="635" y="682" text-anchor="middle">IOMMU 只映射本进程获准的内存页</text>

    <path class="line" d="M792 650H866" stroke="#7c3aed" marker-end="url(#purple)"/>

    <rect x="882" y="466" width="438" height="232" rx="18" fill="#fff" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="916" cy="499" r="18" fill="#2563eb"/><text class="t badge" x="916" y="504" text-anchor="middle">5</text>
    <text class="t k" x="949" y="506">IOMMU 检查每次 DMA 地址</text>

    <rect x="914" y="536" width="166" height="74" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="t b" x="997" y="566" text-anchor="middle">X2522 DMA</text>
    <text class="t s" x="997" y="592" text-anchor="middle">网卡读 / 写内存</text>
    <path class="line" d="M1080 558H1134" stroke="#2563eb" marker-end="url(#blue)"/>
    <path class="line" d="M1134 588H1080" stroke="#2563eb" marker-end="url(#blue)"/>
    <rect x="1150" y="536" width="138" height="74" rx="13" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
    <text class="t b" x="1219" y="566" text-anchor="middle">已映射大页</text>
    <text class="t s" x="1219" y="592" text-anchor="middle">允许访问</text>

    <rect x="914" y="624" width="374" height="60" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text class="t b danger" x="1101" y="649" text-anchor="middle">unsafe no-IOMMU：没有地址围栏</text>
    <text class="t s danger" x="1101" y="672" text-anchor="middle">本课程拒绝使用</text>
  </g>

  <text class="t b" x="700" y="786" text-anchor="middle">验收顺序：ESXi 有门框 → 当前 cmdline 生效 → group 只含 X2522 → VFIO 才能安全接管</text>
</svg>
