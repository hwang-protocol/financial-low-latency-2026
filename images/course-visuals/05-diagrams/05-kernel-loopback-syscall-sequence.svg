<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
  <title id="title">一次本机 loopback 往返的客户端、内核与服务端顺序</title>
  <desc id="desc">按客户端线程与服务端线程的网络职责展示必要顺序：服务端先建立监听，随后 accept4 等待连接；客户端创建 socket 并 connect，Linux 内核完成配对。客户端发送 52 字节，服务端收到后返回 ACK。数据只经过本机 loopback，不经过物理网卡。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#15803d"/></marker>
    <marker id="arrow-slate" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#64748b"/></marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .mono{font-family:"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace;fill:#0f172a}
      .h{font-size:30px;font-weight:900}
      .sub{font-size:18px;fill:#475569}
      .lane{font-size:21px;font-weight:900}
      .stage{font-size:18px;font-weight:900}
      .call{font-size:18px;font-weight:900}
      .body{font-size:16px;fill:#334155}
      .small{font-size:14px;fill:#475569}
      .badge{font-size:17px;font-weight:900;fill:#fff}
    </style>
  </defs>

  <rect x="12" y="12" width="1476" height="1136" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="58">一次本机 loopback 往返：先开门，再建连，再来回一趟</text>
  <text class="t sub" x="52" y="91">同一 Python 进程 · 客户端线程 + 服务端线程 · 127.0.0.1；只讲网络职责和必要先后</text>

  <!-- 三列骨架保留，后续路径图可以沿用。 -->
  <g id="lane-frame" data-extension-role="stable-three-lane-frame">
    <rect x="50" y="122" width="410" height="764" rx="20" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="500" y="122" width="500" height="764" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1040" y="122" width="410" height="764" rx="20" fill="#f0fdf4" stroke="#94a3b8" stroke-width="2"/>

    <path d="M50 142q0-20 20-20h370q20 0 20 20v42H50z" fill="#dbeafe"/>
    <path d="M500 142q0-20 20-20h460q20 0 20 20v42H500z" fill="#e2e8f0"/>
    <path d="M1040 142q0-20 20-20h370q20 0 20 20v42h-410z" fill="#dcfce7"/>

    <text class="t lane" x="255" y="158" text-anchor="middle">客户端线程</text>
    <text class="t small" x="255" y="179" text-anchor="middle">连接 · 发送 52 B · 接收 ACK</text>
    <text class="t lane" x="750" y="158" text-anchor="middle">Linux 内核</text>
    <text class="t small" x="750" y="179" text-anchor="middle">socket 对象 · 监听队列 · TCP/IP · loopback</text>
    <text class="t lane" x="1245" y="158" text-anchor="middle">服务端线程</text>
    <text class="t small" x="1245" y="179" text-anchor="middle">监听 · 接收 52 B · 返回 ACK</text>
  </g>

  <!-- ① 服务端先把监听端准备好。 -->
  <g id="server-listen" data-extension-role="replace-server-listen">
    <circle cx="1070" cy="225" r="18" fill="#15803d"/><text class="t badge" x="1070" y="231" text-anchor="middle">1</text>
    <rect x="1100" y="198" width="318" height="188" rx="16" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text class="t stage" x="1118" y="226">服务端先把门开好</text>

    <text class="mono call" x="1118" y="252">socket()</text>
    <text class="t body" x="1118" y="273">申请一个监听 TCP socket</text>

    <line x1="1118" y1="284" x2="1400" y2="284" stroke="#dcfce7" stroke-width="2"/>
    <text class="mono call" x="1118" y="305">bind(127.0.0.1, 0)</text>
    <text class="t body" x="1118" y="326">绑到本机；0 让内核挑空闲端口</text>

    <line x1="1118" y1="337" x2="1400" y2="337" stroke="#dcfce7" stroke-width="2"/>
    <text class="mono call" x="1118" y="358">listen(1)</text>
    <text class="t body" x="1118" y="379">进入监听状态，准备接连接</text>

    <path d="M1100 282H938" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="610" y="235" width="310" height="94" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text class="t stage" x="765" y="266" text-anchor="middle">内核建立监听端</text>
    <text class="t body" x="765" y="293" text-anchor="middle">保存 127.0.0.1 与临时端口</text>
    <text class="t body" x="765" y="316" text-anchor="middle">并建立连接队列</text>
  </g>

  <rect x="574" y="401" width="352" height="42" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="t stage" x="750" y="428" text-anchor="middle">listen 完成，下面才能等待和建连</text>
  <path d="M1245 386V401" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <!-- ② 两边开始建立连接。 -->
  <g id="connection-setup" data-extension-role="replace-connection-setup">
    <circle cx="78" cy="503" r="18" fill="#2563eb"/><text class="t badge" x="78" y="509" text-anchor="middle">2</text>
    <rect x="108" y="468" width="318" height="145" rx="15" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <text class="t stage" x="126" y="496">客户端来敲门</text>
    <text class="mono call" x="126" y="529">socket()</text>
    <text class="t body" x="126" y="552">申请客户端 TCP socket</text>
    <text class="mono call" x="126" y="578">connect(address)</text>
    <text class="t body" x="126" y="601">连接刚才的监听地址</text>

    <circle cx="1070" cy="503" r="18" fill="#15803d"/><text class="t badge" x="1070" y="509" text-anchor="middle">2</text>
    <rect x="1100" y="468" width="318" height="145" rx="15" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text class="t stage" x="1118" y="496">服务端等客人</text>
    <text class="mono call" x="1118" y="529">accept4()</text>
    <text class="t body" x="1118" y="552">没有连接就等待</text>
    <text class="t body" x="1118" y="578">连接到达，返回已连接 socket</text>

    <path d="M426 537H610" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="630" y="474" width="240" height="112" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text class="t stage" x="750" y="507" text-anchor="middle">内核完成配对</text>
    <text class="mono body" x="750" y="538" text-anchor="middle">connect ↔ accept4</text>
    <text class="t small" x="750" y="565" text-anchor="middle">两端得到同一条 TCP 连接</text>
    <path d="M870 537H1082" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
  </g>

  <!-- ③ 客户端发 52 B，服务端接收。 -->
  <g id="request-path" data-extension-role="replace-request-path">
    <circle cx="78" cy="670" r="18" fill="#2563eb"/><text class="t badge" x="78" y="676" text-anchor="middle">3</text>
    <rect x="108" y="638" width="318" height="66" rx="13" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <text class="mono call" x="126" y="665">sendto(52 B)</text>
    <text class="t body" x="126" y="690">客户端发出 52 字节</text>

    <rect x="592" y="636" width="316" height="70" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text class="t stage" x="750" y="664" text-anchor="middle">TCP + loopback 递送</text>
    <text class="t small" x="750" y="689" text-anchor="middle">只在本机内核中送到对端缓冲区</text>

    <rect x="1085" y="638" width="306" height="66" rx="13" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text class="mono call" x="1103" y="665">recvfrom(52 B)</text>
    <text class="t body" x="1103" y="690">服务端收到 52 字节</text>
    <path d="M426 671H1067" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- ④ 服务端回 ACK，客户端接收。 -->
  <g id="ack-path" data-extension-role="replace-ack-path">
    <circle cx="1422" cy="770" r="18" fill="#15803d"/><text class="t badge" x="1422" y="776" text-anchor="middle">4</text>
    <rect x="1085" y="739" width="306" height="62" rx="13" fill="#fff" stroke="#4ade80" stroke-width="2"/>
    <text class="mono call" x="1103" y="764">sendto("ACK")</text>
    <text class="t body" x="1103" y="788">服务端返回 3 字节回执</text>

    <rect x="108" y="739" width="318" height="62" rx="13" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <text class="mono call" x="126" y="764">recvfrom(3 B)</text>
    <text class="t body" x="126" y="788">客户端收到 ACK</text>
    <path d="M1085 770H444" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#arrow-green)"/>
    <text class="t small" x="750" y="758" text-anchor="middle">ACK 沿同一条 loopback 路径返回</text>
  </g>

  <!-- 辅助查询与实验边界。 -->
  <g id="evidence-layer" data-extension-role="replace-only-after-new-run">
    <rect x="50" y="914" width="650" height="94" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text class="t stage" x="76" y="946">辅助查询：只问地址，不搬业务字节</text>
    <text class="mono call" x="76" y="977">getsockname() · getpeername()</text>
    <text class="t body" x="76" y="999">它们会穿插出现，但不改变上面的请求 / 应答主线。</text>

    <rect x="724" y="914" width="726" height="94" rx="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text class="t stage" x="750" y="946">本机回环效果</text>
    <text class="mono body" x="750" y="977">server_bytes=52 · client_reply=ACK</text>
    <text class="t body" x="750" y="999">经过 Linux TCP/IP 和 loopback；不经过 X2522、sfc、网线或另一台主机。</text>

    <rect x="50" y="1030" width="1400" height="78" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text class="t" x="750" y="1061" text-anchor="middle" font-size="17" font-weight="900">必要先后只有：先 listen → 再建连 → 再发送 52 B → 再返回 ACK</text>
    <text class="t" x="750" y="1088" text-anchor="middle" font-size="17" font-weight="900">strace -c 只汇总哪些网络门出现、各出现几次；表里的时间不是网络 RTT</text>
  </g>
</svg>
