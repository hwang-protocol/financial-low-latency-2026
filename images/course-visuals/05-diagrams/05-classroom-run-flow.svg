<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">第五章课堂运行顺序</title>
  <desc id="desc">准备 A 到 C 各检查一次，准备 D 停掉普通 AUTO / MANUAL 并换上测试客户端，运行一到四分别讲解并下单，运行五统一比较。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="28" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" fill="#0f2742" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="800">第 05 章课堂运行顺序</text>
  <text x="700" y="89" text-anchor="middle" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18">沿用第二章的平台 · 切换测试配置 · 最后统一比较</text>

  <g id="prepare-a-c" filter="url(#shadow)">
    <rect x="170" y="120" width="1060" height="112" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="225" cy="176" r="31" fill="#2563eb"/>
    <text x="225" y="183" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="800">A–C</text>
    <text x="278" y="165" fill="#1e3a8a" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="800">准备 A～C</text>
    <text x="278" y="200" fill="#334155" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20">Onload · IOMMU / VFIO · 固定制品与开工门</text>
    <rect x="1012" y="150" width="170" height="51" rx="12" fill="#dbeafe"/>
    <text x="1097" y="171" text-anchor="middle" fill="#1e40af" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700">每项只检查一次</text>
    <text x="1097" y="192" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="18" font-weight="800">PASS</text>
  </g>

  <path d="M 700 238 L 700 250" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g id="prepare-d" filter="url(#shadow)">
    <rect x="170" y="278" width="1060" height="112" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="225" cy="334" r="31" fill="#059669"/>
    <text x="225" y="342" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">D</text>
    <text x="278" y="323" fill="#065f46" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="800">准备 D</text>
    <text x="278" y="358" fill="#334155" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20">停掉 AUTO / MANUAL，换上测试客户端</text>
    <rect x="1012" y="304" width="170" height="60" rx="12" fill="#059669"/>
    <text x="1097" y="329" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="800">SFC / READY</text>
    <text x="1097" y="351" text-anchor="middle" fill="#d1fae5" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="14">环境就绪</text>
  </g>

  <path d="M 700 396 L 700 408" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g id="single-path-runs" filter="url(#shadow)">
    <rect x="170" y="436" width="1060" height="112" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="225" cy="492" r="31" fill="#7c3aed"/>
    <text x="225" y="499" text-anchor="middle" fill="#ffffff" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800">①–④</text>
    <text x="278" y="481" fill="#5b21b6" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="800">运行 ①～④</text>
    <text x="278" y="516" fill="#334155" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20">Socket → Onload → TCPDirect → DPDK</text>
    <rect x="938" y="462" width="244" height="60" rx="12" fill="#ede9fe"/>
    <text x="1060" y="487" text-anchor="middle" fill="#5b21b6" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">每次只讲一条路径</text>
    <text x="1060" y="509" text-anchor="middle" fill="#5b21b6" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">并下一笔单</text>
  </g>

  <path d="M 700 554 L 700 566" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g id="comparison-run" filter="url(#shadow)">
    <rect x="170" y="594" width="1060" height="112" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <circle cx="225" cy="650" r="31" fill="#ea580c"/>
    <text x="225" y="658" text-anchor="middle" fill="#ffffff" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="800">⑤</text>
    <text x="278" y="639" fill="#9a3412" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="800">运行 ⑤</text>
    <text x="278" y="674" fill="#334155" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20">统一预热 · 正式采样 · Williams 平衡比较</text>
    <rect x="1012" y="620" width="170" height="60" rx="12" fill="#ffedd5"/>
    <text x="1097" y="645" text-anchor="middle" fill="#9a3412" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">四条路径</text>
    <text x="1097" y="668" text-anchor="middle" fill="#9a3412" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800">统一比较</text>
  </g>

  <text x="700" y="742" text-anchor="middle" fill="#64748b" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">一次准备 → 四次单路 → 一次比较</text>
</svg>
