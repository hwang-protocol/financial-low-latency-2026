<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">四条网络路径的统一平衡测试方法</title>
  <desc id="desc">保持订单、交易所、协议和 CPU 条件一致，用四轮 Williams 顺序让四条路径在第一到第四测试位置各出现一次。每格先预热一百笔，再采集一千笔，最后将同一路径四格的对应分位数相加后除以四。每条路径轮流先测、后测，也轮流接在其他路径后面测，让测试顺序更公平。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#64748b"/></marker>
  </defs>

  <rect width="1400" height="900" rx="28" fill="#f8fafc"/>
  <text x="700" y="52" text-anchor="middle" fill="#0f2742" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="800">四条路径怎样做到公平比较</text>
  <text x="700" y="86" text-anchor="middle" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18">条件相同 → 顺序轮换 → 每格同样采样 → 四格等权汇总</text>

  <text x="55" y="130" fill="#0f2742" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800">① 先把比较条件固定</text>
  <g filter="url(#shadow)" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="55" y="150" width="300" height="105" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="183" text-anchor="middle" fill="#1e3a8a" font-size="19" font-weight="800">同一订单</text>
    <text x="205" y="211" text-anchor="middle" fill="#334155" font-size="15">AAPL 1 股可成交订单</text>
    <text x="205" y="235" text-anchor="middle" fill="#334155" font-size="15">正式单买、卖交替 · 逐笔成交</text>

    <rect x="385" y="150" width="300" height="105" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="535" y="183" text-anchor="middle" fill="#065f46" font-size="19" font-weight="800">同一业务与对端</text>
    <text x="535" y="211" text-anchor="middle" fill="#334155" font-size="15">同一 Exchange</text>
    <text x="535" y="235" text-anchor="middle" fill="#334155" font-size="15">同一 SoupBinTCP / OUCH</text>

    <rect x="715" y="150" width="300" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="865" y="183" text-anchor="middle" fill="#5b21b6" font-size="19" font-weight="800">同一本机条件</text>
    <text x="865" y="211" text-anchor="middle" fill="#334155" font-size="15">相同订单 CPU 与队列模式</text>
    <text x="865" y="235" text-anchor="middle" fill="#334155" font-size="15">相同计时起点与终点</text>

    <rect x="1045" y="150" width="300" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1195" y="183" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="800">采样时暂停什么</text>
    <text x="1195" y="206" text-anchor="middle" fill="#334155" font-size="15">暂停行情回放和网页观察</text>
    <text x="1195" y="227" text-anchor="middle" fill="#334155" font-size="15">Exchange 继续接单、撮合</text>
    <text x="1195" y="248" text-anchor="middle" fill="#334155" font-size="15">采样结束后恢复</text>
  </g>

  <text x="55" y="307" fill="#0f2742" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800">② 再用 Williams 平衡顺序</text>
  <text x="365" y="307" fill="#475569" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16">一种平衡拉丁方：轮换谁先测、接在谁后面测</text>

  <rect x="150" y="326" width="880" height="42" rx="12" fill="#e0f2fe" stroke="#0891b2"/>
  <text x="590" y="353" text-anchor="middle" fill="#155e75" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800">每个格子都一样：100 笔预热（不统计） → 1000 笔正式样本（统计）</text>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <text x="95" y="401" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">轮次</text>
    <text x="255" y="401" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">测试位置 1</text>
    <text x="475" y="401" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">测试位置 2</text>
    <text x="695" y="401" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">测试位置 3</text>
    <text x="915" y="401" text-anchor="middle" fill="#64748b" font-size="15" font-weight="700">测试位置 4</text>

    <text x="95" y="446" text-anchor="middle" fill="#334155" font-size="17" font-weight="800">第 1 轮</text>
    <rect x="150" y="416" width="210" height="48" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="255" y="446" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Kernel Socket</text>
    <rect x="370" y="416" width="210" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="475" y="446" text-anchor="middle" fill="#14532d" font-size="16" font-weight="800">Onload</text>
    <rect x="590" y="416" width="210" height="48" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="695" y="446" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">DPDK + F-Stack</text>
    <rect x="810" y="416" width="210" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="915" y="446" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">TCPDirect</text>

    <text x="95" y="506" text-anchor="middle" fill="#334155" font-size="17" font-weight="800">第 2 轮</text>
    <rect x="150" y="476" width="210" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="255" y="506" text-anchor="middle" fill="#14532d" font-size="16" font-weight="800">Onload</text>
    <rect x="370" y="476" width="210" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="475" y="506" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">TCPDirect</text>
    <rect x="590" y="476" width="210" height="48" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="695" y="506" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Kernel Socket</text>
    <rect x="810" y="476" width="210" height="48" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="915" y="506" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">DPDK + F-Stack</text>

    <text x="95" y="566" text-anchor="middle" fill="#334155" font-size="17" font-weight="800">第 3 轮</text>
    <rect x="150" y="536" width="210" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="255" y="566" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">TCPDirect</text>
    <rect x="370" y="536" width="210" height="48" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="475" y="566" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">DPDK + F-Stack</text>
    <rect x="590" y="536" width="210" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="695" y="566" text-anchor="middle" fill="#14532d" font-size="16" font-weight="800">Onload</text>
    <rect x="810" y="536" width="210" height="48" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="915" y="566" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Kernel Socket</text>

    <text x="95" y="626" text-anchor="middle" fill="#334155" font-size="17" font-weight="800">第 4 轮</text>
    <rect x="150" y="596" width="210" height="48" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="255" y="626" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">DPDK + F-Stack</text>
    <rect x="370" y="596" width="210" height="48" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="475" y="626" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">Kernel Socket</text>
    <rect x="590" y="596" width="210" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="695" y="626" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">TCPDirect</text>
    <rect x="810" y="596" width="210" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="915" y="626" text-anchor="middle" fill="#14532d" font-size="16" font-weight="800">Onload</text>
  </g>

  <g filter="url(#shadow)" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="1060" y="326" width="285" height="318" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1203" y="365" text-anchor="middle" fill="#0f2742" font-size="21" font-weight="800">怎样读这张 4×4 表</text>
    <circle cx="1095" cy="408" r="17" fill="#2563eb"/><text x="1095" y="414" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">1</text>
    <text x="1123" y="414" fill="#334155" font-size="16">每一行是一轮</text>
    <circle cx="1095" cy="456" r="17" fill="#2563eb"/><text x="1095" y="462" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">2</text>
    <text x="1123" y="462" fill="#334155" font-size="16">每一列是测试位置</text>
    <circle cx="1095" cy="504" r="17" fill="#2563eb"/><text x="1095" y="510" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">3</text>
    <text x="1123" y="498" fill="#334155" font-size="16">每条路径都轮到</text>
    <text x="1123" y="519" fill="#334155" font-size="16">第 1、2、3、4 位</text>
    <line x1="1090" y1="548" x2="1315" y2="548" stroke="#cbd5e1"/>
    <text x="1203" y="580" text-anchor="middle" fill="#5b21b6" font-size="18" font-weight="800">让测试顺序更公平</text>
    <text x="1203" y="608" text-anchor="middle" fill="#475569" font-size="15">轮流先测、后测，</text>
    <text x="1203" y="630" text-anchor="middle" fill="#475569" font-size="15">也轮流接在其他路径后面测。</text>
  </g>

  <text x="55" y="694" fill="#0f2742" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800">③ 最后按同一规则汇总</text>
  <g filter="url(#shadow)" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="720" width="265" height="92" rx="16" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
    <text x="203" y="755" text-anchor="middle" fill="#155e75" font-size="19" font-weight="800">16 个测试单元</text>
    <text x="203" y="785" text-anchor="middle" fill="#334155" font-size="15">4 条路径 × 4 轮</text>
    <rect x="390" y="720" width="265" height="92" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="523" y="755" text-anchor="middle" fill="#5b21b6" font-size="19" font-weight="800">每格先算分位数</text>
    <text x="523" y="785" text-anchor="middle" fill="#334155" font-size="15">分别计算 p50 / p95 / p99</text>
    <rect x="710" y="720" width="265" height="92" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="843" y="755" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="800">四格等权平均</text>
    <text x="843" y="785" text-anchor="middle" fill="#334155" font-size="15">例：四格 p50 相加，再除以 4</text>
    <rect x="1030" y="720" width="300" height="92" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="1180" y="755" text-anchor="middle" fill="#065f46" font-size="19" font-weight="800">得到四路比较主表</text>
    <text x="1180" y="785" text-anchor="middle" fill="#334155" font-size="15">共 16,000 笔正式样本</text>
  </g>
  <g stroke="#64748b" stroke-width="4" stroke-linecap="butt" fill="none" marker-end="url(#arrow)"><path d="M 347 766 L 364 766"/><path d="M 667 766 L 684 766"/><path d="M 987 766 L 1004 766"/></g>

  <rect x="160" y="840" width="1080" height="42" rx="12" fill="#dcfce7"/>
  <text x="700" y="867" text-anchor="middle" fill="#14532d" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800">4 × 4 × (100 + 1000) = 17,600 笔；预热 1,600 笔不进主表，正式 16,000 笔进入统计</text>
</svg>
