<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">TCPDirect 的 ZF API、CPU 用户态 TCP 栈与 X2522 硬件数据路径</title>
  <desc id="desc">图中蓝色实线从 flle-trader-tcpdirect 经 ZF API、CPU 执行的 TCPDirect 用户态 TCP 栈和映射到进程的 VI 到 X2522，表示发送；绿色实线反向表示接收。橙色虚线表示通过 /dev/onload 登记 ZF stack 与 packet 的共享内存，供 zf_stackdump 旁路观察；ZF 栈本身由用户态库创建并执行。紫色虚线表示通过 /dev/sfc_char 申请 VI 资源。两条虚线都不是逐包业务路径。X2522 提供过滤器、队列、事件、DMA 和 CTPIO，完整 TCP 状态机仍由主机 CPU 执行。PCI function 仍绑定 sfc，普通 netdev 保留。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#15803d"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#d97706"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#7e22ce"/></marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .mono{font-family:"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace;fill:#0f172a}
      .h{font-size:29px;font-weight:900}
      .sub{font-size:16px;fill:#475569}
      .k{font-size:19px;font-weight:900}
      .body{font-size:15px;fill:#334155}
      .small{font-size:13px;fill:#475569}
      .badge{font-size:15px;font-weight:900;fill:#fff}
      .lane{font-size:16px;font-weight:900;fill:#fff}
    </style>
  </defs>

  <rect x="12" y="12" width="1476" height="1016" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="56">TCPDirect 真正在哪里运行，X2522 真正负责什么</text>
  <text class="t sub" x="52" y="86">蓝 / 绿实线是逐包 TX / RX；橙 / 紫虚线只在初始化时登记共享内存、申请硬件资源</text>

  <g id="packet-hot-path" data-extension-role="retain-zf-to-x2522-spine">
    <rect x="50" y="112" width="1400" height="360" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="72" y="130" width="132" height="32" rx="16" fill="#2563eb"/>
    <text class="t lane" x="138" y="152" text-anchor="middle">逐包热路径</text>
    <text class="t small" x="222" y="151">`.2` 的交易客户端发标准 TCP；`.1` 的 Exchange 无需安装 TCPDirect</text>

    <rect x="72" y="188" width="228" height="212" rx="17" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="104" cy="220" r="18" fill="#2563eb"/><text class="t badge" x="104" y="226" text-anchor="middle">1</text>
    <text class="mono" x="132" y="216" font-size="15" font-weight="900">flle-trader-</text>
    <text class="mono" x="132" y="238" font-size="15" font-weight="900">tcpdirect</text>
    <text class="t body" x="186" y="270" text-anchor="middle">FLLE 真实下单客户端</text>
    <text class="t body" x="186" y="296" text-anchor="middle">SoupBinTCP 登录 / 分帧</text>
    <text class="t body" x="186" y="322" text-anchor="middle">OUCH Enter / Accepted</text>
    <text class="t body" x="186" y="346" text-anchor="middle">→ Executed</text>
    <text class="t small" x="186" y="374" text-anchor="middle">业务协议保持不变</text>
    <text class="t small" x="186" y="393" text-anchor="middle">只替换本地 Transport</text>

    <rect x="350" y="188" width="160" height="212" rx="17" fill="#f3e8ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="382" cy="220" r="18" fill="#7e22ce"/><text class="t badge" x="382" y="226" text-anchor="middle">2</text>
    <text class="mono k" x="430" y="227" text-anchor="middle">ZF API</text>
    <text class="mono small" x="430" y="258" text-anchor="middle">zft_connect</text>
    <text class="mono small" x="430" y="282" text-anchor="middle">zft_send_single</text>
    <text class="mono small" x="430" y="306" text-anchor="middle">zft_zc_recv</text>
    <text class="mono small" x="430" y="330" text-anchor="middle">zf_reactor_perform</text>
    <text class="t small" x="430" y="365" text-anchor="middle">不再调用普通</text>
    <text class="mono small" x="430" y="388" text-anchor="middle">socket/send/recv</text>

    <rect x="560" y="178" width="290" height="232" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="594" cy="212" r="18" fill="#2563eb"/><text class="t badge" x="594" y="218" text-anchor="middle">3</text>
    <text class="mono k" x="705" y="219" text-anchor="middle">libonload_zf</text>
    <text class="t k" x="705" y="253" text-anchor="middle">TCPDirect 用户态 TCP 栈</text>
    <text class="t body" x="705" y="291" text-anchor="middle">主机 CPU 执行 TCP 状态机</text>
    <text class="t body" x="705" y="319" text-anchor="middle">连接 · ACK · 重传 · packet buffer</text>
    <text class="t body" x="705" y="347" text-anchor="middle">应用主动 polling 推进事件</text>
    <text class="t small" x="705" y="390" text-anchor="middle">TCP 没搬进网卡；通用内核接力被缩短</text>

    <rect x="900" y="188" width="270" height="212" rx="17" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="934" cy="220" r="18" fill="#15803d"/><text class="t badge" x="934" y="226" text-anchor="middle">4</text>
    <text class="t k" x="1035" y="227" text-anchor="middle">映射到进程的 VI</text>
    <text class="t body" x="1035" y="266" text-anchor="middle">RX / TX / Event 队列</text>
    <text class="t body" x="1035" y="294" text-anchor="middle">连接过滤器</text>
    <text class="t body" x="1035" y="322" text-anchor="middle">用户态直接 post / poll</text>
    <text class="t small" x="1035" y="365" text-anchor="middle">受保护的硬件车道</text>
    <text class="t small" x="1035" y="388" text-anchor="middle">不等于独占整块设备</text>

    <rect x="1220" y="188" width="210" height="212" rx="17" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="1254" cy="220" r="18" fill="#ea580c"/><text class="t badge" x="1254" y="226" text-anchor="middle">5</text>
    <text class="t k" x="1325" y="227" text-anchor="middle">X2522</text>
    <text class="t body" x="1325" y="266" text-anchor="middle">硬件过滤与事件</text>
    <text class="t body" x="1325" y="294" text-anchor="middle">DMA 收发缓冲</text>
    <text class="t body" x="1325" y="322" text-anchor="middle">CTPIO / DMA 发送</text>
    <text class="t small" x="1325" y="365" text-anchor="middle">现场 key：Plus / TCP Direct</text>
    <text class="t small" x="1325" y="388" text-anchor="middle">再从物理端口上网线</text>

    <path d="M300 236H332" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M510 236H542" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M850 236H882" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M1170 236H1202" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text class="t small" x="316" y="220" text-anchor="middle">TX</text>

    <path d="M1220 352H1188" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
    <path d="M900 352H868" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
    <path d="M560 352H528" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
    <path d="M350 352H318" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text class="t small" x="1204" y="377" text-anchor="middle">RX</text>

  </g>

  <g id="setup-and-resource-path" data-extension-role="retain-control-not-packet-path">
    <rect x="50" y="496" width="1400" height="232" rx="22" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="72" y="514" width="164" height="32" rx="16" fill="#7e22ce"/>
    <text class="t lane" x="154" y="536" text-anchor="middle">启动与资源准备</text>

    <rect x="295" y="570" width="420" height="112" rx="17" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text class="mono k" x="505" y="604" text-anchor="middle">/dev/onload  ↔  onload.ko</text>
    <text class="t body" x="505" y="637" text-anchor="middle">登记 ZF stack / packet 共享内存</text>
    <text class="t small" x="505" y="666" text-anchor="middle">供 stackdump 旁路查看；不创建或执行 ZF TCP 栈</text>

    <rect x="785" y="570" width="420" height="112" rx="17" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <text class="mono k" x="995" y="604" text-anchor="middle">/dev/sfc_char  ↔  sfc_char.ko</text>
    <text class="t body" x="995" y="637" text-anchor="middle">申请 VI / 队列 / 过滤器 · 映射 DMA 资源</text>
    <text class="t small" x="995" y="666" text-anchor="middle">通道准备完成后，逐包收发走上方实线</text>

    <path d="M650 410V480H505V552" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
    <path d="M1050 400V488H995V552" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/>

    <rect x="410" y="687" width="680" height="35" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text class="t small" x="750" y="701" text-anchor="middle">PCI function 仍绑定 sfc.ko：普通 netdev / Kernel 流量继续保留</text>
    <text class="t small" x="750" y="717" text-anchor="middle">TCPDirect 逐包热路径不经过 Linux TCP/IP 与 sfc 普通 netdev</text>
  </g>

  <g id="why-it-is-faster" data-extension-role="retain-benefit-and-boundary">
    <rect x="50" y="754" width="430" height="150" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text class="t k" x="265" y="788" text-anchor="middle">软件少做什么</text>
    <text class="t body" x="265" y="825" text-anchor="middle">减少高频收发 syscall、用户 / 内核切换</text>
    <text class="t body" x="265" y="853" text-anchor="middle">绕开 Linux TCP/IP 与普通 netdev 接力</text>
    <text class="t small" x="265" y="884" text-anchor="middle">ZF API 更短，但必须改写应用</text>

    <rect x="535" y="754" width="430" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text class="t k" x="750" y="788" text-anchor="middle">硬件贡献什么</text>
    <text class="t body" x="750" y="825" text-anchor="middle">把 VI、队列、过滤器映射给进程</text>
    <text class="t body" x="750" y="853" text-anchor="middle">DMA / CTPIO 缩短 CPU 与物理端口交接</text>
    <text class="t small" x="750" y="884" text-anchor="middle">这就是 X2522 + Plus 的实际价值</text>

    <rect x="1020" y="754" width="430" height="150" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text class="t k" x="1235" y="788" text-anchor="middle">CPU 仍承担什么</text>
    <text class="t body" x="1235" y="825" text-anchor="middle">TCP 建连、序号、ACK、窗口与重传</text>
    <text class="t body" x="1235" y="853" text-anchor="middle">主动轮询可用更多 CPU 换更低延迟</text>
    <text class="t small" x="1235" y="884" text-anchor="middle">它不是网卡 TCP offload engine</text>
  </g>

  <g id="evidence-boundary" data-extension-role="replace-after-ctpio-counter-run">
    <rect x="50" y="930" width="1400" height="72" rx="18" fill="#f3e8ff" stroke="#a78bfa" stroke-width="2"/>
    <text class="t" x="750" y="958" text-anchor="middle" font-size="17" font-weight="900">实测：ZF 交易客户端经 X2522 专用数据面完成真实 SoupBinTCP / OUCH 订单</text>
    <text class="t body" x="750" y="986" text-anchor="middle">ctpio=3 使缺少 CTPIO 成为启动失败；本轮成功建栈只证明能力合同满足，zf_stackdump 不提供逐包 CTPIO 计数</text>
  </g>
</svg>
