<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible"><path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:26px;font-weight:900}.k{font-size:18px;font-weight:800}.s{font-size:15px;fill:#475569}</style>
  </defs>
  <rect x="12" y="12" width="1176" height="396" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="52" y="58">棒交完了，还要走出这台机器</text>
  <text class="t s" x="52" y="90">旅客不换。本章先问填哪张单子、谁来办；出站闸归谁，要单独问。</text>

  <rect x="52" y="126" width="280" height="196" rx="18" fill="#fff"/>
  <rect x="52" y="126" width="280" height="44" rx="18" fill="#f1f5f9"/>
  <path d="M52 152h280v18H52z" fill="#f1f5f9"/>
  <text class="t k" x="192" y="156" text-anchor="middle">第四章已完成</text>
  <text class="t k" x="192" y="214" text-anchor="middle">棒在下单线程手里</text>
  <text class="t s" x="192" y="250" text-anchor="middle">储物格 · 交棒规则 · 座位</text>
  <text class="t s" x="192" y="280" text-anchor="middle">本章不回头改这里</text>
  <rect x="52" y="126" width="280" height="196" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M348 224H392" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="408" y="126" width="320" height="196" rx="18" fill="#eff6ff"/>
  <rect x="408" y="126" width="320" height="44" rx="18" fill="#dbeafe"/>
  <path d="M408 152h320v18H408z" fill="#dbeafe"/>
  <text class="t k" x="568" y="156" text-anchor="middle">本章主战场</text>
  <text class="t k" x="568" y="214" text-anchor="middle">出站手续</text>
  <text class="t s" x="568" y="250" text-anchor="middle">填哪张单子</text>
  <text class="t s" x="568" y="280" text-anchor="middle">交给窗口，还是自己办</text>
  <rect x="408" y="126" width="320" height="196" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <path d="M744 224H788" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="804" y="126" width="280" height="196" rx="18" fill="#fff"/>
  <rect x="804" y="126" width="280" height="44" rx="18" fill="#f1f5f9"/>
  <path d="M804 152h280v18H804z" fill="#f1f5f9"/>
  <text class="t k" x="944" y="156" text-anchor="middle">出站闸</text>
  <text class="t k" x="944" y="214" text-anchor="middle">这台机器的物理门</text>
  <text class="t s" x="944" y="250" text-anchor="middle">现在还由 Linux 管着</text>
  <text class="t s" x="944" y="280" text-anchor="middle">最后一种会整道承包</text>
  <rect x="804" y="126" width="280" height="196" rx="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="52" y="348" width="1032" height="40" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t" x="568" y="375" font-size="16" font-weight="800" text-anchor="middle">旅客不换；单子可以换，闸不一定跟着换主人。后文的 syscall / Onload / TCPDirect / DPDK，只是这三格的精确写法</text>
</svg>
