<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img"><title>同一笔订单，四种本机收发方式</title><desc>比较的是代码怎样收发、谁管理网卡；从左到右不代表越来越快。</desc><defs>
<marker id="arr-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#2563eb"/></marker>
<marker id="arr-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#7e22ce"/></marker>
<marker id="arr-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#15803d"/></marker>
<marker id="arr-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#c76a08"/></marker>
<marker id="arr-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#64748b"/></marker>
<marker id="arr-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 -6 12 12" refX="0" refY="0" orient="auto-start-reverse" overflow="visible"><path d="M0,-6 L12,0 L0,6 Z" fill="#172338"/></marker>
<symbol id="chip" viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="6"/><rect x="23" y="23" width="18" height="18" rx="2"/><path d="M20 4v8m12-8v8m12-8v8M20 52v8m12-8v8m12-8v8M4 20h8m-8 12h8m-8 12h8m40-24h8m-8 12h8m-8 12h8"/></symbol>
<symbol id="file" viewBox="0 0 64 64"><path d="M16 5h23l12 12v42H16zM39 5v14h12M24 29h19M24 38h19M24 47h13"/></symbol>
<symbol id="packet" viewBox="0 0 64 64"><rect x="6" y="13" width="52" height="38" rx="5"/><path d="m7 15 25 20 25-20M7 49l16-15m34 15L41 34"/></symbol>
<symbol id="box" viewBox="0 0 64 64"><path d="m6 19 26-13 26 13v29L32 60 6 48zM6 19l26 13 26-13M32 32v28M19 12l26 13v12"/></symbol>
<symbol id="server" viewBox="0 0 64 64"><rect x="12" y="5" width="40" height="54" rx="5"/><path d="M13 23h38M13 41h38M31 14h12M31 32h12M31 50h12"/><circle cx="22" cy="14" r="2"/><circle cx="22" cy="32" r="2"/><circle cx="22" cy="50" r="2"/></symbol>
<symbol id="cache" viewBox="0 0 64 64"><rect x="6" y="9" width="52" height="46" rx="5"/><path d="M7 32h50M24 20h16M24 43h16"/></symbol>
<symbol id="ram" viewBox="0 0 64 64"><rect x="3" y="16" width="58" height="30" rx="4"/><path d="M10 46v9m9-9v9m9-9v9m9-9v9m9-9v9m9-9v9"/><rect x="11" y="23" width="14" height="15"/><rect x="36" y="23" width="14" height="15"/></symbol>
<symbol id="clock" viewBox="0 0 64 64"><circle cx="32" cy="35" r="23"/><path d="M32 12V5m-9 0h18m10 8 6 6M32 21v15l12 7"/></symbol>
<symbol id="eye" viewBox="0 0 64 64"><path d="M3 32s11-18 29-18 29 18 29 18-11 18-29 18S3 32 3 32z"/><circle cx="32" cy="32" r="9"/></symbol>
<symbol id="check" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"/><path d="m17 32 10 10 22-23"/></symbol>
<symbol id="queue" viewBox="0 0 64 64"><rect x="4" y="22" width="13" height="22" rx="2"/><rect x="22" y="22" width="13" height="22" rx="2"/><rect x="40" y="22" width="13" height="22" rx="2"/><path d="M60 9v46M3 51h50"/></symbol>
<symbol id="gate" viewBox="0 0 64 64"><path d="M7 57V12h50v45M7 22h50M25 23v34M39 23v34M2 57h60"/></symbol>
<symbol id="key" viewBox="0 0 64 64"><circle cx="21" cy="25" r="13"/><path d="m30 34 24 24m-13-13 7-7m-1 13 7-7"/></symbol>
<symbol id="gear" viewBox="0 0 64 64"><path d="M25 6h14l2 10 9-3 7 12-8 7 8 7-7 12-9-3-2 10H25l-2-10-9 3-7-12 8-7-8-7 7-12 9 3z"/><circle cx="32" cy="32" r="10"/></symbol>
<symbol id="screen" viewBox="0 0 64 64"><rect x="4" y="8" width="56" height="39" rx="5"/><path d="M32 47v10M18 58h28M12 37l10-9 9 5 18-16"/></symbol>
</defs><rect width="1200" height="100%" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" fill="#172338" font-weight="700" text-anchor="start">同一笔订单，四种本机收发方式</text>
<text x="36" y="94" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">比较的是代码怎样收发、谁管理网卡；从左到右不代表越来越快。</text>
<rect x="30" y="145" width="255" height="332" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#gate" x="124" y="161" width="66" height="66" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="157" y="266" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">普通套接字</text>
<text x="157" y="303" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">Kernel Socket</text>
<text x="157" y="354" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">原来的接口</text>
<text x="157" y="392" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">Linux 处理 TCP</text>
<text x="157" y="430" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">网卡归 sfc</text>
<rect x="325" y="145" width="255" height="332" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#file" x="419" y="161" width="66" height="66" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="452" y="266" font-size="25" fill="#15803d" font-weight="700" text-anchor="middle">透明加速</text>
<text x="452" y="303" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">Onload</text>
<text x="452" y="354" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">同一份客户端</text>
<text x="452" y="392" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">用户态处理 TCP</text>
<text x="452" y="430" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">网卡仍归 sfc</text>
<rect x="620" y="145" width="255" height="332" rx="15" fill="#fff" stroke="#7e22ce" stroke-width="1.6"/>
<use href="#gear" x="714" y="161" width="66" height="66" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="747" y="266" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">专用接口</text>
<text x="747" y="303" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">TCPDirect</text>
<text x="747" y="354" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">改用 ZF 接口</text>
<text x="747" y="392" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">ZF 用户态栈处理 TCP</text>
<text x="747" y="430" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">网卡仍归 sfc</text>
<rect x="915" y="145" width="255" height="332" rx="15" fill="#fff" stroke="#c76a08" stroke-width="1.6"/>
<use href="#key" x="1009" y="161" width="66" height="66" fill="none" stroke="#c76a08" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1042" y="266" font-size="25" fill="#c76a08" font-weight="700" text-anchor="middle">接管收发队列</text>
<text x="1042" y="303" font-size="21" fill="#64748b" font-weight="400" text-anchor="middle">DPDK + F-Stack</text>
<text x="1042" y="354" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">F-Stack 处理 TCP</text>
<text x="1042" y="392" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">DPDK 操作队列</text>
<text x="1042" y="430" font-size="22" fill="#172338" font-weight="400" text-anchor="middle">卡交给 vfio-pci</text>
<rect x="30" y="514" width="1140" height="75" rx="15" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
<text x="600" y="560" font-size="25" fill="#172338" font-weight="700" text-anchor="middle">线上仍是 TCP / SoupBinTCP / OUCH；接收、成交和恢复要求保持一致。</text>
<text x="36" y="634" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">DPDK 活跃时独占同一网卡，前三路暂停；实验完成后交还，才能继续使用。</text>
</g></svg>
