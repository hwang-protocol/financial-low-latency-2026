</defs><g font-family="Noto Sans CJK SC, sans-serif">
<rect width="1200" height="850" fill="white"/>
<text x="36" y="51" font-size="32" fill="#172554" font-weight="700" text-anchor="start">一条 arm once，怎样改变 FPGA 里的一个状态</text>
<rect x="40" y="125" width="1120" height="280" rx="14" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="162" font-size="25" fill="#172554" font-weight="700" text-anchor="start">交换机管理 CPU：Python 和 CLI 在这里运行</text>
<g class="node">
<rect x="70" y="218" width="280" height="135" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="210.0" y="254" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">EOS 临时命令</text>
<text x="210.0" y="287" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">arm once / disarm</text>
<text x="210.0" y="316" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">show … counters</text>
</g>
<g class="node">
<rect x="460" y="218" width="280" height="135" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="600.0" y="254" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">后台管理程序</text>
<text x="600.0" y="287" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">RPC 只发本次操作</text>
<text x="600.0" y="316" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">write_reg / read_reg</text>
</g>
<g class="node">
<rect x="850" y="218" width="280" height="135" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="990.0" y="254" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">FDK 管理接口</text>
<text x="990.0" y="287" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">CSV：名字 → 寄存器号</text>
<text x="990.0" y="316" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">名称映射与设备通信</text>
</g>
<polyline points="350,285 436.0,285.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<polyline points="740,285 826.0,285.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<rect x="40" y="470" width="1120" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="507" font-size="25" fill="#172554" font-weight="700" text-anchor="start">FPGA：寄存器和丢包状态机是电路</text>
<g class="node">
<rect x="70" y="560" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="596" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">control_regs.sv</text>
<text x="210.0" y="629" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">command 写 1 → arm 脉冲</text>
<text x="210.0" y="658" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">command 写 2 → disarm</text>
</g>
<g class="node">
<rect x="460" y="560" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="596" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">drop_once.sv</text>
<text x="600.0" y="629" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">armed 保存一次额度</text>
<text x="600.0" y="658" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">命中一帧后自动清零</text>
</g>
<g class="node">
<rect x="850" y="560" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="990.0" y="596" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">只读状态</text>
<text x="990.0" y="629" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">drop_count / error_count</text>
<text x="990.0" y="658" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">last_sequence 高低 32 位</text>
</g>
<polyline points="990,353 990,434 20,434 20,622 46.0,622.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)" stroke-dasharray="8 6"/>
<polyline points="350,622 436.0,622.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<polyline points="740,622 826.0,622.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<text x="40" y="790" font-size="23" fill="#172554" font-weight="400" text-anchor="start">读状态按相反方向返回；最后丢包序号在撤销额度、确认稳定之后读取。</text>
<text x="36" y="825" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">命令不写入持久配置；重启默认禁丢；实际总线和跨时钟连接由 BVL 工程实现。</text>
</g></svg>