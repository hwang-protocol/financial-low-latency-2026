<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1820" viewBox="0 0 1200 1820" role="img" aria-labelledby="title desc"><title id="title">第4步：把过滤核心接进板卡工程</title><desc id="desc">4.1打开BVL参考工程并加入四份电路源码；4.2适配报文、管理控制和时钟复位接口；4.3核对模块层级、约束和依赖；4.4交付已适配的完整板卡工程。第5步由Vivado综合、布局布线生成PDI。此图为待取得完整开发包后的工程适配示意。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker></defs><rect width="1200" height="1820" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172554">
<text x="40" y="52" font-size="34" fill="#172554" font-weight="700">第4步：把过滤核心接进板卡工程</text>
<text x="40" y="94" font-size="24" fill="#172554" font-weight="400">像把分拣机构装上机器底座：接传送带、控制线，再接节拍与复位。</text>
<text x="40" y="128" font-size="23" fill="#475569" font-weight="400">操作位置：开发机　｜　BVL提供板卡设计，开发者完成接口适配</text>
<rect x="40" y="155" width="1120" height="270" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="198" font-size="28" fill="#2563eb" font-weight="700">4.1 打开 BVL 参考工程，加入本课源码</text>
<g class="node">
<rect x="65" y="220" width="510" height="175" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="85" y="259" font-size="26" fill="#2563eb" font-weight="700">厂商提供：BVL 板卡工程</text>
<text x="85" y="300" font-size="23" fill="#172554" font-weight="400">网口模块、管理接口、时钟与引脚约束</text>
<text x="85" y="337" font-size="23" fill="#172554" font-weight="400">器件启动与配置设计、配套工程脚本</text>
<text x="85" y="374" font-size="22" fill="#172554" font-weight="400">按开发包说明，用配套 Vivado 打开工程</text>
</g>
<g class="node">
<rect x="625" y="220" width="510" height="175" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="645" y="259" font-size="26" fill="#2563eb" font-weight="700">本课提供：四份电路描述</text>
<text x="645" y="300" font-size="23" fill="#172554" font-weight="400">frame_filter.sv + nvda_match.sv</text>
<text x="645" y="337" font-size="23" fill="#172554" font-weight="400">drop_once.sv + control_regs.sv</text>
<text x="645" y="374" font-size="22" fill="#172554" font-weight="400">加入工程源文件清单，准备连接模块</text>
</g>
<path d="M600,425 L600,456" data-target="600,480" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="480" width="1120" height="620" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="525" font-size="28" fill="#7e22ce" font-weight="700">4.2 在应用顶层接好三组接口</text>
<text x="65" y="565" font-size="23" fill="#172554" font-weight="400">① 报文通路：网口与本课核心之间做接口适配</text>
<g class="node">
<rect x="65" y="590" width="310" height="115" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="81" y="628" font-size="25" fill="#2563eb" font-weight="700">网口接收模块</text>
<text x="81" y="661" font-size="22" fill="#172554" font-weight="400">接收帧 → 输入适配</text>
<text x="81" y="692" font-size="20" fill="#172554" font-weight="400">MAC/PCS提供网口收发能力</text>
</g>
<g class="node">
<rect x="445" y="590" width="310" height="115" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="461" y="628" font-size="25" fill="#2563eb" font-weight="700">frame_filter</text>
<text x="461" y="661" font-size="22" fill="#172554" font-weight="400">匹配：nvda_match</text>
<text x="461" y="692" font-size="20" fill="#172554" font-weight="400">额度：drop_once</text>
</g>
<g class="node">
<rect x="825" y="590" width="310" height="115" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="841" y="628" font-size="25" fill="#2563eb" font-weight="700">网口发送模块</text>
<text x="841" y="661" font-size="22" fill="#172554" font-weight="400">输出适配 → 发送帧</text>
<text x="841" y="692" font-size="20" fill="#172554" font-weight="400">补齐网口发送要求</text>
</g>
<path d="M375,647 L421,647" data-target="445,647" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M755,647 L801,647" data-target="825,647" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="748" font-size="23" fill="#172554" font-weight="400">② 控制通路：写命令向右传递，状态与计数返回管理接口</text>
<g class="node">
<rect x="65" y="775" width="310" height="110" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="81" y="812" font-size="25" fill="#7e22ce" font-weight="700">BVL 管理接口</text>
<text x="81" y="845" font-size="22" fill="#172554" font-weight="400">接收管理 CPU 的读写</text>
<text x="81" y="874" font-size="20" fill="#172554" font-weight="400">配套总线适配</text>
</g>
<g class="node">
<rect x="445" y="775" width="310" height="110" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="461" y="812" font-size="25" fill="#7e22ce" font-weight="700">control_regs</text>
<text x="461" y="845" font-size="22" fill="#172554" font-weight="400">写命令 → arm / disarm</text>
<text x="461" y="874" font-size="20" fill="#172554" font-weight="400">读请求 → 状态与计数</text>
</g>
<g class="node">
<rect x="825" y="775" width="310" height="110" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="841" y="812" font-size="25" fill="#7e22ce" font-weight="700">frame_filter 内部</text>
<text x="841" y="845" font-size="22" fill="#172554" font-weight="400">drop_once 保存额度</text>
<text x="841" y="874" font-size="20" fill="#172554" font-weight="400">过滤通路提供状态与计数</text>
</g>
<path d="M375,824 L421,824" data-target="445,824" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M755,824 L801,824" data-target="825,824" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="935" font-size="23" fill="#7e22ce" font-weight="400">返回：过滤状态与计数 → control_regs → BVL 管理接口</text>
<g class="node">
<rect x="65" y="970" width="1070" height="103" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="85" y="1008" font-size="25" fill="#c2410c" font-weight="700">③ 时钟与复位：接到 frame_filter 和 control_regs</text>
<text x="85" y="1048" font-size="23" fill="#172554" font-weight="400">板级适配处理不同时钟之间的传递，使发令、读数和复位可靠。</text>
</g>
<path d="M600,1100 L600,1136" data-target="600,1160" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="node">
<rect x="40" y="1160" width="1120" height="220" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="65" y="1205" font-size="28" fill="#c2410c" font-weight="700">4.3 核对工程材料和接口连接</text>
<text x="65" y="1250" font-size="24" fill="#172554" font-weight="400">查源码：顶层能找到本课模块，报文、命令和状态连接完整。</text>
<text x="65" y="1291" font-size="24" fill="#172554" font-weight="400">查板卡：目标器件、引脚、时钟、复位及启动配置与参考工程一致。</text>
<text x="65" y="1332" font-size="24" fill="#172554" font-weight="400">查依赖：网口 IP 可用，工具版本、许可和工程脚本齐备。</text>
<text x="65" y="1366" font-size="22" fill="#172554" font-weight="400">完成后，整套设计具备交给第5步综合与实现的工程输入。</text>
</g>
<path d="M600,1380 L600,1416" data-target="600,1440" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="node">
<rect x="40" y="1440" width="1120" height="155" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="1485" font-size="28" fill="#2563eb" font-weight="700">4.4 本步交付：已适配的完整 BVL 板卡工程</text>
<text x="65" y="1528" font-size="23" fill="#172554" font-weight="400">包含：本课 .sv + 顶层与接口适配 + 板卡约束 + 厂商模块及工程脚本</text>
<text x="65" y="1568" font-size="24" fill="#172554" font-weight="400">像把整套施工图和物料清单备齐，接下来交给 Vivado 构建。</text>
</g>
<path d="M600,1595 L600,1631" data-target="600,1655" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g class="node">
<rect x="40" y="1655" width="1120" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="65" y="1698" font-size="26" fill="#4f46e5" font-weight="700">第5步读取这个工程：综合 → 资源映射 → 布局布线 → .pdi</text>
<text x="65" y="1740" font-size="24" fill="#172554" font-weight="400">构建在开发机完成；后续再把器件镜像装载到真实 FPGA。</text>
</g>
<text x="40" y="1804" font-size="22" fill="#475569" font-weight="400">工程适配示意：需完整 BVL 开发包；具体接口名和连接规则按包内说明。</text>
</g></svg>
