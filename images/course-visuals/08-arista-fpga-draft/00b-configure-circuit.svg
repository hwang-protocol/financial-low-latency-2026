<text x="1000.0" y="598" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">寄存器与缓存</text>
<text x="1000.0" y="631" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">记住额度、计数和序号</text>
<text x="1000.0" y="660" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">暂存报文，等待发送</text>
</g>
<polyline points="335,637 441.0,637.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
