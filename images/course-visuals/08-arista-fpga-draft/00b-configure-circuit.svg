<text x="200.0" y="631" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">设备管理程序写入配置</text>
<text x="200.0" y="660" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">让逻辑与连接生效</text>
</g>
<g class="node">
<rect x="465" y="562" width="270" height="150" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="598" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">电路处理报文</text>
<text x="600.0" y="631" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">读取字段、比较条件</text>
<text x="600.0" y="660" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">控制这一帧的去留</text>
</g>
<g class="node">
