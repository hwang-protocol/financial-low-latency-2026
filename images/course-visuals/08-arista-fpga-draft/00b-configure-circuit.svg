<text x="200.0" y="300" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">类比：用 C++ 写程序</text>
</g>
<g class="node">
<rect x="465" y="202" width="270" height="140" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="238" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">Vivado 构建</text>
<text x="600.0" y="271" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">作用类似 GCC 编译工具</text>
<text x="600.0" y="300" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">把电路设计做成配置文件</text>
</g>
<g class="node">
<rect x="865" y="202" width="270" height="140" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1000.0" y="238" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">.pdi 配置文件</text>
<text x="1000.0" y="271" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">类比：编译后的程序文件</text>
<text x="1000.0" y="300" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">实际用来配置 FPGA</text>
</g>
<text x="65" y="373" font-size="21" fill="#172554">Vivado 内部：把代码变成电路 → 安排位置 → 接好线路</text>
