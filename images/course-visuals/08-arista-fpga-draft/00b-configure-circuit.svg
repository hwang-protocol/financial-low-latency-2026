<text x="65" y="778" font-size="21" fill="#172554" font-weight="400" text-anchor="start">PDI 用于器件启动与配置；下方示意本课报文由配置后的电路处理。</text>
<text x="40" y="872" font-size="22" fill="#172554" font-weight="400" text-anchor="start">改电路逻辑：重建并装载 .pdi；只改一次额度：写寄存器。</text>
<text x="36" y="915" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">构建需要板卡引脚、时钟等信息；板级工程的准备见第⑦项。</text>
</g></svg>