<g class="node">
<rect x="432" y="235" width="335" height="200" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="599.5" y="271" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">FPGA 过滤电路</text>
<text x="599.5" y="304" font-size="21" fill="#2563eb" font-weight="700" text-anchor="middle">内部接口：Application1/1</text>
<text x="599.5" y="337" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">机箱内部，不占前面板插口</text>
<text x="599.5" y="370" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">接收 → 过滤逻辑 → 发送</text>
<text x="599.5" y="403" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">匹配且有额度：整帧丢弃</text>
</g>
