<text x="600" y="502" font-size="20" fill="#172554" font-weight="400" text-anchor="middle">② FPGA 输出 → Ethernet2 发送</text>
<polyline points="872,385 872,548 325,548 325.0,409.0" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m475569)"/>
<text x="600" y="533" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">③ Ethernet2 接收 → Ethernet1 发送，L1 直通</text>
<rect x="36" y="622" width="1128" height="250" rx="14" fill="#f0fdf4" stroke="#86b59a" stroke-width="2"/>
<text x="60" y="660" font-size="26" fill="#166534" font-weight="700">接线后：核对连接条件 → 检查路径 → 无额度试通</text>
<text x="60" y="702" font-size="22" fill="#172554">连接条件：show l1 source capabilities；端口对应镜像通道，速率 / 光模块 / FEC 匹配。</text>
<text x="60" y="745" font-size="22" fill="#172554">路径检查：链路 UP；show l1 source 与 show l1 path 核对图中①②③。</text>
<text x="60" y="788" font-size="22" fill="#172554">无额度试通：低速逐帧发送，入口 / 出口计数同步增加，出口字节与入口一致。</text>
<text x="60" y="831" font-size="22" fill="#172554">同时读数：策略丢弃、核心错误和板级 MAC / 队列错误计数均不增加。</text>
<text x="36" y="910" font-size="19" fill="#64748b">EOS 通用接口示例；7135V 实际端口映射与镜像通道须上机核对，尚未实机验证。</text>
</g></svg>