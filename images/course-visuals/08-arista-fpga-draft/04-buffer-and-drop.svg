</defs><g font-family="Noto Sans CJK SC, sans-serif">
<rect width="1200" height="950" fill="white"/>
<text x="36" y="51" font-size="32" fill="#172554" font-weight="700" text-anchor="start">收到股票字段之后，怎样决定整包去留</text>
<g class="node">
<rect x="40" y="130" width="285" height="145" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="182.5" y="166" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">① RECEIVE</text>
<text x="182.5" y="199" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">每拍接收最多 8 字节</text>
<text x="182.5" y="228" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">保存整帧与前 100 字节</text>
</g>
<g class="node">
<rect x="458" y="130" width="285" height="145" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.5" y="166" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">② DECIDE</text>
<text x="600.5" y="199" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">检查格式和股票</text>
<text x="600.5" y="228" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">本帧只作一次决定</text>
</g>
<g class="node">
<rect x="875" y="130" width="285" height="145" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1017.5" y="166" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">③ FORWARD</text>
<text x="1017.5" y="199" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">按原顺序发送保存字节</text>
<text x="1017.5" y="228" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">对端未 ready 时保持输出</text>
</g>
<polyline points="325,202 434.0,202.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<polyline points="743,202 851.0,202.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<text x="344" y="184" font-size="19" fill="#172554" font-weight="400" text-anchor="start">收完帧</text>
<text x="763" y="184" font-size="19" fill="#172554" font-weight="400" text-anchor="start">放行</text>
<rect x="40" y="330" width="1120" height="510" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="367" font-size="25" fill="#172554" font-weight="700" text-anchor="start">DECIDE 内部：条件命中还不够，必须有一次额度</text>
<g class="node">
<rect x="80" y="410" width="290" height="115" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="225.0" y="446" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">match_nvda</text>
<text x="225.0" y="479" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">地址、格式、股票均匹配</text>
</g>
<g class="node">
<rect x="80" y="585" width="290" height="115" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="225.0" y="621" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">armed 寄存器</text>
<text x="225.0" y="654" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">CPU 发令后置 1</text>
</g>
<g class="node">
<rect x="520" y="480" width="225" height="130" rx="11" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
<text x="632.5" y="516" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">逻辑与 &amp;&amp;</text>
<text x="632.5" y="549" font-size="18" fill="#172554" font-weight="400" text-anchor="middle">本拍 decision_valid</text>
<text x="632.5" y="578" font-size="18" fill="#172554" font-weight="400" text-anchor="middle">且无新控制命令</text>
</g>
<polyline points="370,467 425,467 425,513 496.0,513.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<polyline points="370,642 445,642 445,572 496.0,572.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<g class="node">
<rect x="870" y="430" width="250" height="215" rx="11" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="995.0" y="466" font-size="25" fill="#c2410c" font-weight="700" text-anchor="middle">命中后丢整帧</text>
<text x="995.0" y="499" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">m_valid 从未置 1</text>
<text x="995.0" y="528" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">armed 清为 0</text>
<text x="995.0" y="557" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">drop_count 加 1</text>
<text x="995.0" y="586" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">保存 last_sequence</text>
</g>
<polyline points="745,546 846.0,546.0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#mc2410c)"/>
<text x="80" y="765" font-size="24" fill="#172554" font-weight="700" text-anchor="start">丢弃或发完 → 回到 RECEIVE；下一帧继续正常处理。</text>
<text x="40" y="891" font-size="23" fill="#172554" font-weight="400" text-anchor="start">单缓冲版本便于看清机制；接收和发送分阶段，不宣称持续 25G 线速。</text>
<text x="36" y="925" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">MAC 与核心之间需要接收队列；队列满不会让物理链路停发，需要单独记录溢出。</text>
</g></svg>