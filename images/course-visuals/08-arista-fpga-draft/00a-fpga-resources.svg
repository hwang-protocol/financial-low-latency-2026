<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title>FPGA：像搭积木一样组合电路</title><defs>
<marker id="m2563eb" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
<marker id="m7e22ce" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#7e22ce"/></marker>
<marker id="mc2410c" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#c2410c"/></marker>
<marker id="m475569" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#475569"/></marker>
</defs><g font-family="Noto Sans CJK SC, sans-serif">
<rect width="1200" height="920" fill="white"/>
<text x="36" y="51" font-size="32" fill="#172554" font-weight="700" text-anchor="start">FPGA：像搭积木一样组合电路</text>
<text x="40" y="105" font-size="23" fill="#172554" font-weight="400" text-anchor="start">FPGA（现场可编程门阵列）：安排每块做什么，再把它们连接起来</text>
<rect x="40" y="145" width="1120" height="610" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="182" font-size="25" fill="#172554" font-weight="700" text-anchor="start">芯片里的四类“积木”（功能示意，不代表实际摆放位置）</text>
<g class="node">
<rect x="75" y="230" width="300" height="155" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="225.0" y="266" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">LUT：做判断</text>
<text x="225.0" y="299" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">规则可以重新设置</text>
<text x="225.0" y="328" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">多个单元组合识别 NVDA</text>
</g>
<g class="node">
<rect x="450" y="230" width="300" height="155" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="266" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">寄存器：记结果</text>
<text x="600.0" y="299" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">像手边的小便签</text>
<text x="600.0" y="328" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">记住：还能丢 1 包</text>
</g>
<g class="node">
<rect x="825" y="230" width="300" height="155" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="975.0" y="266" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">片上 RAM：存数据</text>
<text x="975.0" y="299" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">像芯片里的内存</text>
<text x="975.0" y="328" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">可暂存报文，断电不保留</text>
</g>
<g class="node">
<rect x="210" y="472" width="780" height="125" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="600.0" y="508" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">可编程互连：把积木接起来</text>
<text x="600.0" y="541" font-size="23" fill="#172554" font-weight="400" text-anchor="middle">用已有线路，把做判断、记结果和存数据的单元连接起来</text>
</g>
<polyline points="225,385 225.0,448.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<polyline points="600,385 600.0,448.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<polyline points="975,385 975.0,448.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<text x="75" y="663" font-size="24" fill="#172554" font-weight="700" text-anchor="start">写入配置：设定判断规则，选好各块之间的连接。</text>
<text x="75" y="710" font-size="23" fill="#172554" font-weight="400" text-anchor="start">处理报文：电路做判断，寄存器记结果，缓存暂存数据。</text>
<text x="40" y="815" font-size="24" fill="#172554" font-weight="700" text-anchor="start">芯片里已有逻辑单元和可配置连线。</text>
<text x="40" y="855" font-size="24" fill="#172554" font-weight="700">写入配置，就是设定各单元做什么、彼此怎样连接。</text>
<text x="36" y="895" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">资料：AMD UG574 / UG573；本课缓存使用哪类存储，要看最终构建结果。</text>
</g></svg>