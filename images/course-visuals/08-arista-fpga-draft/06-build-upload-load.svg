</defs><g font-family="Noto Sans CJK SC, sans-serif">
<rect width="1200" height="1070" fill="white"/>
<text x="36" y="51" font-size="32" fill="#172554" font-weight="700" text-anchor="start">源码、安装包、镜像：三种东西怎样接力</text>
<rect x="35" y="112" width="1130" height="290" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="149" font-size="25" fill="#172554" font-weight="700" text-anchor="start">开发机：已具备配套许可，并完成板级适配</text>
<g class="node">
<rect x="65" y="199" width="280" height="140" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="205.0" y="235" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">完成适配的工程</text>
<text x="205.0" y="268" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">MAC / 队列 / 总线 / CDC</text>
<text x="205.0" y="297" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">.sv 与匹配板型的 .xdc</text>
</g>
<g class="node">
<rect x="460" y="199" width="280" height="140" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="235" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">综合 → 布局布线</text>
<text x="600.0" y="268" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">逻辑网表 → 资源与连接</text>
<text x="600.0" y="297" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">检查时序 / DRC</text>
</g>
<g class="node">
<rect x="855" y="199" width="280" height="140" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="995.0" y="235" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">flle_filter-bvl.pdi</text>
<text x="995.0" y="268" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">Versal 配置数据</text>
<text x="995.0" y="297" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">与 Python、CSV 一起打包</text>
</g>
<polyline points="345,269 436.0,269.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<polyline points="740,269 831.0,269.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<text x="65" y="376" font-size="22" fill="#172554" font-weight="400" text-anchor="start">所需：完整 FDK、授权 MAC/PCS、Vivado 器件/IP 许可、三组板级连接。</text>
<rect x="35" y="455" width="1130" height="230" rx="14" fill="#f3e8ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="492" font-size="25" fill="#172554" font-weight="700" text-anchor="start">交换机管理 CPU：接收文件，再安装应用</text>
<g class="node">
<rect x="65" y="535" width="280" height="112" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="205.0" y="571" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">scp 上传 .swix</text>
<text x="205.0" y="604" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">只是复制安装包</text>
</g>
<g class="node">
<rect x="460" y="535" width="280" height="112" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="600.0" y="571" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">extension</text>
<text x="600.0" y="604" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">展开文件、登记应用</text>
</g>
<g class="node">
<rect x="855" y="535" width="280" height="112" rx="11" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
<text x="995.0" y="571" font-size="25" fill="#7e22ce" font-weight="700" text-anchor="middle">fpga / 镜像.pdi</text>
<text x="995.0" y="604" font-size="19" fill="#172554" font-weight="400" text-anchor="middle">镜像已经在设备存储中</text>
</g>
<polyline points="995,339 995,425 20,425 20,591 41.0,591.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)" stroke-dasharray="8 6"/>
<polyline points="345,591 436.0,591.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<polyline points="740,591 831.0,591.0" fill="none" stroke="#7e22ce" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m7e22ce)"/>
<rect x="35" y="746" width="1130" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="55" y="783" font-size="25" fill="#172554" font-weight="700" text-anchor="start">应用启动：真正配置 FPGA</text>
<g class="node">
<rect x="65" y="829" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="205.0" y="865" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">EOS 应用启用</text>
<text x="205.0" y="898" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">flle_filter / no disabled</text>
</g>
<g class="node">
<rect x="460" y="829" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="600.0" y="865" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">Python 装载调用</text>
<text x="600.0" y="898" font-size="18" fill="#172554" font-weight="400" text-anchor="middle">fpga.load_image(pdi, …)</text>
</g>
<g class="node">
<rect x="855" y="829" width="280" height="125" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="995.0" y="865" font-size="25" fill="#2563eb" font-weight="700" text-anchor="middle">FPGA 配置生效</text>
<text x="995.0" y="898" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">等待 applied / 核对标识</text>
<text x="995.0" y="927" font-size="21" fill="#172554" font-weight="400" text-anchor="middle">默认禁丢，再接线验收</text>
</g>
<polyline points="345,891 436.0,891.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<polyline points="740,891 831.0,891.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#m2563eb)"/>
<text x="36" y="1045" font-size="19" fill="#64748b" font-weight="400" text-anchor="start">BVL 板级适配及 PDI 尚未构建；EOS 装载与端口验收仍需真机确认。</text>
</g></svg>