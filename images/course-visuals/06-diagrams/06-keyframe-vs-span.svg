<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>SPAN copy versus Keyframe</title>
  <desc>SPAN mirrors the market frame and appends a 4-byte short stamp. Keyframe is a separate IP protocol 253 packet generated by the 7150, carrying full time and the current counter. Both leave Et11 toward .11. Analyzer combines the short stamp with the nearest Keyframe to recover T_in.</desc>
  <defs>
    <marker id="arr-orange" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0 1 L16 6 L0 11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arr-purple" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0 1 L16 6 L0 11 Z" fill="#7e22ce"/>
    </marker>
    <marker id="arr-slate" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0 1 L16 6 L0 11 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerUnits="userSpaceOnUse" viewBox="0 0 16 12" refX="16" refY="6" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M0 1 L16 6 L0 11 Z" fill="#15803d"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .white{fill:#ffffff}
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="696" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t" x="40" y="50" font-size="26" font-weight="900">Keyframe 不是第二份行情</text>
  <text class="t" x="40" y="78" font-size="16" fill="#475569">Et11 上同时有两种包：SPAN 复制的业务帧，以及交换机自己定期发出的 Keyframe。</text>

  <rect x="40" y="104" width="200" height="88" rx="14" fill="#fff7ed" stroke="#ea580c"/>
  <text class="t" x="140" y="140" text-anchor="middle" font-size="18" font-weight="900">.1 Exchange</text>
  <text class="t" x="140" y="168" text-anchor="middle" font-size="14" fill="#475569">真实 UDP 行情</text>
  <path d="M240 148 H300" stroke="#ea580c" stroke-width="3" marker-end="url(#arr-orange)"/>

  <rect x="300" y="96" width="280" height="280" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="t" x="440" y="128" text-anchor="middle" font-size="18" font-weight="900">7150</text>
  <text class="t" x="440" y="152" text-anchor="middle" font-size="14" fill="#64748b">Et1 入口记短戳</text>
  <rect x="320" y="172" width="240" height="72" rx="12" fill="#ffedd5" stroke="#ea580c"/>
  <text class="t" x="440" y="202" text-anchor="middle" font-size="15" font-weight="900">SPAN 副本 · UDP</text>
  <text class="t" x="440" y="226" text-anchor="middle" font-size="13" fill="#7c2d12">行情内容 + 末尾 4 字节短戳</text>
  <rect x="320" y="260" width="240" height="92" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-dasharray="6 4"/>
  <text class="t" x="440" y="290" text-anchor="middle" font-size="15" font-weight="900">Keyframe · IP 253</text>
  <text class="t" x="440" y="314" text-anchor="middle" font-size="13" fill="#581c87">交换机自己生成</text>
  <text class="t" x="440" y="336" text-anchor="middle" font-size="13" fill="#581c87">完整时刻 + 当前计数器</text>

  <path d="M580 124 H900" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr-slate)"/>
  <text class="t" x="740" y="114" text-anchor="middle" font-size="13" fill="#475569">原帧从 Et2 出去，不加短戳</text>
  <rect x="900" y="88" width="260" height="72" rx="14" fill="#f1f5f9" stroke="#64748b"/>
  <text class="t" x="1030" y="120" text-anchor="middle" font-size="17" font-weight="900">.2 Trader</text>
  <text class="t" x="1030" y="144" text-anchor="middle" font-size="13" fill="#475569">live.pcap · 硬件 RX 戳</text>

  <path d="M580 208 H700" stroke="#ea580c" stroke-width="3" marker-end="url(#arr-orange)"/>
  <text class="t" x="640" y="196" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">Et11 · UDP</text>
  <path d="M580 306 H700" stroke="#7e22ce" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-purple)"/>
  <text class="t" x="640" y="294" text-anchor="middle" font-size="13" fill="#7e22ce" font-weight="700">Et11 · IP 253</text>

  <rect x="700" y="172" width="460" height="204" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="t" x="930" y="204" text-anchor="middle" font-size="18" font-weight="900">.11 copy.pcap</text>
  <text class="t" x="930" y="228" text-anchor="middle" font-size="14" fill="#155e75">同一条线、同一次抓包，两种包</text>
  <rect x="720" y="248" width="200" height="104" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text class="t" x="820" y="286" text-anchor="middle" font-size="15" font-weight="900">UDP 副本</text>
  <text class="t" x="820" y="312" text-anchor="middle" font-size="13" fill="#7c2d12">短戳单独看</text>
  <text class="t" x="820" y="334" text-anchor="middle" font-size="13" fill="#7c2d12">还原不出 T_in</text>
  <rect x="940" y="248" width="200" height="104" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-dasharray="6 4"/>
  <text class="t" x="1040" y="286" text-anchor="middle" font-size="15" font-weight="900">Keyframe</text>
  <text class="t" x="1040" y="312" text-anchor="middle" font-size="13" fill="#581c87">不是行情</text>
  <text class="t" x="1040" y="334" text-anchor="middle" font-size="13" fill="#581c87">是交换机的说明书</text>

  <path d="M820 396 V430" stroke="#15803d" stroke-width="3" marker-end="url(#arr-green)"/>
  <path d="M1040 396 V430" stroke="#15803d" stroke-width="3" marker-end="url(#arr-green)"/>
  <rect x="40" y="456" width="1120" height="220" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text class="t" x="600" y="496" text-anchor="middle" font-size="20" font-weight="900">分析器拿最近一帧 Keyframe，把 4 字节短戳还原成 T_in</text>
  <rect x="90" y="524" width="300" height="112" rx="14" fill="#ffffff" stroke="#ea580c"/>
  <text class="t" x="240" y="568" text-anchor="middle" font-size="16" font-weight="900">短戳</text>
  <text class="t" x="240" y="598" text-anchor="middle" font-size="14" fill="#475569">副本末尾 4 字节</text>
  <text class="t" x="420" y="590" text-anchor="middle" font-size="36" font-weight="900" fill="#4f46e5">+</text>
  <rect x="470" y="524" width="300" height="112" rx="14" fill="#ffffff" stroke="#7e22ce"/>
  <text class="t" x="620" y="568" text-anchor="middle" font-size="16" font-weight="900">Keyframe</text>
  <text class="t" x="620" y="598" text-anchor="middle" font-size="14" fill="#475569">完整时刻 + 计数器</text>
  <text class="t" x="800" y="590" text-anchor="middle" font-size="36" font-weight="900" fill="#4f46e5">=</text>
  <rect x="830" y="524" width="290" height="112" rx="14" fill="#dcfce7" stroke="#15803d"/>
  <text class="t" x="975" y="568" text-anchor="middle" font-size="16" font-weight="900">T_in</text>
  <text class="t" x="975" y="598" text-anchor="middle" font-size="14" fill="#166534">入口完整时刻</text>
</svg>
