<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <title>Et2 改读 DSCP，订单进入 Q5</title>
  <desc>本课无标签 IP 订单帧：原来信任 CoS，使用端口默认 CoS 0，按默认表进入 TC1 和 Q1；配置 qos trust dscp 后，读取订单 DSCP 46，按默认表进入 TC5 和 Q5。两种分类都有默认映射。</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" overflow="visible"><path d="M0 -6 L12 0 L0 6 Z" fill="#64748b"/></marker><style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    .heading{font-size:30px;font-weight:800}
    .body{font-size:22px;fill:#334155}
    .label{font-size:24px;font-weight:700}
    .small{font-size:20px;fill:#475569}
    .number{font-size:32px;font-weight:800}
    .binary{font-family:"DejaVu Sans Mono",monospace;font-size:26px}
  </style></defs>
  <rect x="12" y="12" width="1176" height="576" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="heading" x="48" y="60">Et2 改读 DSCP，订单进入 Q5</text>
  <text class="body" x="48" y="98">本课 Et2 收到的是不带 802.1Q 标签的 IP 订单帧。</text>
  <text class="small" x="466" y="145" text-anchor="middle">入接口分类依据</text>
  <text class="small" x="773" y="145" text-anchor="middle">内部分类</text>
  <text class="small" x="1045" y="145" text-anchor="middle">出口队列</text>
  <text class="label" x="60" y="208">原来：信任 CoS</text>
  <text class="small" x="60" y="245">无标签，用端口默认值</text>
  <rect x="336" y="166" width="260" height="112" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="678" y="166" width="190" height="112" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="950" y="166" width="190" height="112" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="number" x="466" y="214" text-anchor="middle">CoS 0</text>
  <text class="small" x="466" y="251" text-anchor="middle">端口默认 CoS</text>
  <text class="number" x="773" y="214" text-anchor="middle">TC1</text>
  <text class="small" x="773" y="251" text-anchor="middle">默认映射</text>
  <text class="number" x="1045" y="214" text-anchor="middle">Q1</text>
  <text class="small" x="1045" y="251" text-anchor="middle">默认映射</text>
  <path d="M596 222 H654" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M868 222 H926" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text class="label" x="60" y="368">改后：信任 DSCP</text>
  <text class="small" x="60" y="405">读订单 IP 头中的值</text>
  <rect x="336" y="326" width="260" height="112" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="678" y="326" width="190" height="112" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="950" y="326" width="190" height="112" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="466" y="374" text-anchor="middle">DSCP 46</text>
  <text class="small" x="466" y="411" text-anchor="middle">订单报文的 DSCP</text>
  <text class="number" x="773" y="374" text-anchor="middle">TC5</text>
  <text class="small" x="773" y="411" text-anchor="middle">默认映射</text>
  <text class="number" x="1045" y="374" text-anchor="middle">Q5</text>
  <text class="small" x="1045" y="411" text-anchor="middle">默认映射</text>
  <path d="M596 382 H654" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M868 382 H926" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="48" y="478" width="1104" height="88" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text class="label" x="72" y="515">CoS 和 DSCP 都有默认映射；trust 决定按哪个字段分类。</text>
  <text class="body" x="72" y="549">本课沿用默认映射，在 Et2 配置 qos trust dscp。</text>
</svg>
