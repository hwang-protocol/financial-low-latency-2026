<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <title>DSCP 46 的六位二进制表示</title>
  <desc>IPv4 DS 字节中，高六位为 DSCP。本课订单的 DSCP 46 写成二进制是 101110，低两位 ECN 为 00，整字节为 10111000，即十六进制 0xb8。</desc>
  <defs><style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    .heading{font-size:30px;font-weight:800}
    .body{font-size:22px;fill:#334155}
    .label{font-size:24px;font-weight:700}
    .small{font-size:20px;fill:#475569}
    .number{font-size:32px;font-weight:800}
    .binary{font-family:"DejaVu Sans Mono",monospace;font-size:26px}
  </style></defs>
  <rect x="12" y="12" width="1176" height="406" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="heading" x="48" y="60">DSCP 46 写成六位二进制，就是 101110</text>
  <text class="body" x="48" y="100">IPv4 头中的 DS 字节：前 6 位是 DSCP，后 2 位是 ECN。</text>
  <rect x="72" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="132" y="193" text-anchor="middle">1</text>
  <rect x="204" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="264" y="193" text-anchor="middle">0</text>
  <rect x="336" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="396" y="193" text-anchor="middle">1</text>
  <rect x="468" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="528" y="193" text-anchor="middle">1</text>
  <rect x="600" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="660" y="193" text-anchor="middle">1</text>
  <rect x="732" y="136" width="120" height="88" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="number" x="792" y="193" text-anchor="middle">0</text>
  <rect x="864" y="136" width="120" height="88" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="number" x="924" y="193" text-anchor="middle">0</text>
  <rect x="996" y="136" width="120" height="88" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="number" x="1056" y="193" text-anchor="middle">0</text>
  <path d="M72 238 H852 M864 238 H1116" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="462" y="279" text-anchor="middle">DSCP：101110（二进制）= 46（十进制）</text>
  <text class="label" x="990" y="279" text-anchor="middle">ECN：00</text>
  <rect x="48" y="320" width="1104" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="label" x="600" y="364" text-anchor="middle">合成一个字节：10111000（二进制）= 0xb8（十六进制）</text>
</svg>
