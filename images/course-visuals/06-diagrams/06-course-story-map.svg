<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">第六章从事故到定位的三幕故事</title>
  <desc id="desc">行情变慢或丢失后，依次检查转发与排队、统一时间、带戳副本定位。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:800}.sub{font-size:18px;fill:#475569}.card{fill:#fff;stroke-width:2;rx:18;filter:url(#shadow)}.n{font-size:17px;font-weight:800}.ch{font-size:26px;font-weight:800}.body{font-size:18px}.small{font-size:16px;fill:#475569}.pill{font-size:15px;font-weight:700}.line{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <text class="t h" x="48" y="60">一条 Tick 变慢以后：网络工程师怎样把“猜”变成“证据”</text>
  <text class="t sub" x="48" y="92">先问数据怎么走，再问钟能不能比，最后用旁路副本把这段时间切成两截。</text>

  <rect x="48" y="125" width="1104" height="78" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="91" cy="164" r="23" fill="#ea580c"/><text class="t n" x="84" y="171" fill="#fff">!</text>
  <text class="t body" x="130" y="155" font-weight="800">09:30:00，Trader 说一条行情晚了几十微秒；交易所说按时发出；端口计数一切正常。</text>
  <text class="t small" x="130" y="183">问题不是立刻找“谁背锅”，而是建立三个互相独立的观察面。</text>

  <path class="line" d="M385 362H425"/><path class="line" d="M775 362H815"/>

  <rect class="card" x="48" y="235" width="337" height="255" stroke="#0891b2"/>
  <rect x="70" y="257" width="84" height="30" rx="15" fill="#cffafe"/><text class="t pill" x="88" y="278" fill="#155e75">第一幕</text>
  <text class="t ch" x="70" y="326">数据为什么慢？</text>
  <text class="t body" x="70" y="365">Cut-through / 序列化</text>
  <text class="t body" x="70" y="399">Fan-in / 共享缓冲 / LANZ</text>
  <text class="t small" x="70" y="441">证据：工作模式、出口队列事件</text>
  <rect x="70" y="458" width="269" height="38" rx="9" fill="#ecfeff"/><text class="t n" x="87" y="483" fill="#155e75">回答：慢在转发还是排队？</text>

  <rect class="card" x="431" y="235" width="337" height="255" stroke="#7c3aed"/>
  <rect x="453" y="257" width="84" height="30" rx="15" fill="#ede9fe"/><text class="t pill" x="471" y="278" fill="#5b21b6">第二幕</text>
  <text class="t ch" x="453" y="326">两只表能相减吗？</text>
  <text class="t body" x="453" y="365">NIC PHC / ptp4l / phc2sys</text>
  <text class="t body" x="453" y="399">GM / BC / TC / correction</text>
  <text class="t small" x="453" y="441">证据：SLAVE、offset、时间域</text>
  <rect x="453" y="458" width="269" height="38" rx="9" fill="#f5f3ff"/><text class="t n" x="470" y="483" fill="#5b21b6">回答：这些时刻是否可比较？</text>

  <rect class="card" x="815" y="235" width="337" height="255" stroke="#16a34a"/>
  <rect x="837" y="257" width="84" height="30" rx="15" fill="#dcfce7"/><text class="t pill" x="855" y="278" fill="#166534">第三幕</text>
  <text class="t ch" x="837" y="326">慢在哪一段？</text>
  <text class="t body" x="837" y="365">生产 SPAN / 独立 TAP TOOL</text>
  <text class="t body" x="837" y="399">交换机帧内时间戳 / Keyframe</text>
  <text class="t small" x="837" y="441">证据：副本、sequence、到达节奏</text>
  <rect x="837" y="458" width="269" height="38" rx="9" fill="#f0fdf4"/><text class="t n" x="854" y="483" fill="#166534">回答：上游就晚，还是出口之后？</text>

  <rect x="48" y="530" width="1104" height="48" rx="12" fill="#0f2742"/>
  <text x="600" y="561" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#fff">课堂原则：能安全复跑的才叫实验；其余用图、命令骨架、验证点和回滚边界讲成完整故事。</text>
</svg>
