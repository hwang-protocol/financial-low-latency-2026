<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930">
<title>QoS 对照：A 组订单与背景共用 Q1，B 组订单进入 Q5</title>
<desc>上下两组依次运行，框高与节点位置相同，两路入口均为水平直线。Et2 都信任 DSCP。A 组订单 DSCP 0 经 TC1 与背景共用 Et1 出口 Q1；B 组订单 DSCP 46 经 TC5 进入严格优先级 Q5，背景留在 Q1。两路在同一个 Et1 出口汇合，背景由 .1 网卡过滤，订单由 Exchange 接收。汇合线仅表示共享出口，不表示复制报文。回报经 Et2 出口 Q1 返回 Trader。</desc>
  <defs>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" viewBox="0 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" overflow="visible"><path d="M0 -6 L12 0 L0 6 Z" fill="#ea580c"/></marker>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" viewBox="0 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" overflow="visible"><path d="M0 -6 L12 0 L0 6 Z" fill="#0891b2"/></marker>
    <marker id="arrow-slate" markerUnits="userSpaceOnUse" viewBox="0 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" orient="auto" overflow="visible"><path d="M0 -6 L12 0 L0 6 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .heading{font-size:30px;font-weight:800}
      .label{font-size:24px;font-weight:700}
      .body{font-size:22px;fill:#334155}
      .small{font-size:20px;fill:#475569}
    </style>
  </defs>
<rect x="12" y="12" width="1176" height="906" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40" y="60" class="heading">QoS 对照：未标记订单进 Q1，标记订单进 Q5</text>
<text x="40" y="94" class="body">两组依次运行，Et2 都配置 qos trust dscp；只改变订单的 DSCP 标记。</text>
<g id="panel-A" transform="translate(0 120)">
<rect x="32" y="0" width="1136" height="320" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="38" class="label">A 组：未标记订单与背景流量共用 Q1</text>
<rect x="54" y="94" width="236" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="172" y="125" class="label" text-anchor="middle">.11 背景发流</text>
<text x="172" y="155" class="small" text-anchor="middle">两路背景流量</text>
<rect x="54" y="202" width="236" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="172" y="233" class="label" text-anchor="middle">.2 Trader</text>
<text x="172" y="263" class="small" text-anchor="middle">未标记订单 · DSCP 0</text>
<rect x="460" y="56" width="436" height="238" rx="14" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
<text x="480" y="87" class="label">7150 · Et1 出口</text>
<rect x="498" y="106" width="240" height="160" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="618" y="175" class="label" text-anchor="middle">Q1 · 轮转</text>
<text x="618" y="211" class="body" text-anchor="middle">背景＋A 组订单</text>
<rect x="966" y="132" width="180" height="108" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="1056" y="175" class="body" text-anchor="middle">Exchange .1</text>
<text x="1056" y="211" class="small" text-anchor="middle">接收订单</text>
<path d="M290 132 H474" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-orange)" data-target-x="498" data-role="input-background"/>
<path d="M738 132 H858 V186" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" data-role="merge-background"/>
<text x="385" y="119" class="small" text-anchor="middle">Et11 / Et12</text>
<path d="M290 240 H474" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-orange)" data-target-x="498" data-role="input-order"/>
<path d="M738 240 H858 V186" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" data-role="merge-order"/>
<text x="385" y="227" class="small" text-anchor="middle">Et2</text>
<path d="M858 186 H942" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-target-x="966" data-role="output"/>
<text x="800" y="177" class="small" text-anchor="middle">共享出口</text>
</g>
<g id="panel-B" transform="translate(0 450)">
<rect x="32" y="0" width="1136" height="320" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="38" class="label">B 组：订单标记 DSCP 46，进入严格优先级 Q5</text>
<rect x="54" y="94" width="236" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="172" y="125" class="label" text-anchor="middle">.11 背景发流</text>
<text x="172" y="155" class="small" text-anchor="middle">两路背景流量</text>
<rect x="54" y="202" width="236" height="76" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="172" y="233" class="label" text-anchor="middle">.2 Trader</text>
<text x="172" y="263" class="small" text-anchor="middle">标记订单 · DSCP 46</text>
<rect x="460" y="56" width="436" height="238" rx="14" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
<text x="480" y="87" class="label">7150 · Et1 出口</text>
<rect x="498" y="98" width="240" height="68" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="618" y="127" class="label" text-anchor="middle">Q1 · 轮转</text>
<text x="618" y="154" class="small" text-anchor="middle">背景流量</text>
<rect x="498" y="206" width="240" height="68" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
<text x="618" y="235" class="label" text-anchor="middle">Q5 · 严格优先级</text>
<text x="618" y="262" class="small" text-anchor="middle">B 组订单</text>
<rect x="966" y="132" width="180" height="108" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="1056" y="175" class="body" text-anchor="middle">Exchange .1</text>
<text x="1056" y="211" class="small" text-anchor="middle">接收订单</text>
<path d="M290 132 H474" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-orange)" data-target-x="498" data-role="input-background"/>
<path d="M738 132 H858 V186" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" data-role="merge-background"/>
<text x="385" y="119" class="small" text-anchor="middle">Et11 / Et12</text>
<path d="M290 240 H474" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-cyan)" data-target-x="498" data-role="input-order"/>
<path d="M738 240 H858 V186" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" data-role="merge-order"/>
<text x="385" y="227" class="small" text-anchor="middle">Et2</text>
<path d="M858 186 H942" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#arrow-slate)" data-target-x="966" data-role="output"/>
<text x="800" y="177" class="small" text-anchor="middle">先发 Q5</text>
</g>
<rect x="32" y="802" width="1136" height="96" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="54" y="838" class="small">两组背景流量都经过 Et1，由 .1 网卡过滤；订单交给 Exchange 处理。</text>
<text x="54" y="874" class="small">回报方向：Exchange → Et1 入接口 → Et2 出口 Q1 → Trader；本课不打标。</text>
</svg>
