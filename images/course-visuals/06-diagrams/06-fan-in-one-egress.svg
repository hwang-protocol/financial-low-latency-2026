<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>多入口争用同一个出口：一帧发送，另一帧等待</title>
  <desc>两个入口的帧 A、B 同时就绪，需要从同一个出口发送。本例调度器先选中 A，B 在缓冲区等待；A 发完后 B 才能开始发送。这是发送与等待关系示意，不表示芯片内部的物理布局。</desc>
  <defs>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#ea580c"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font-size:30px;font-weight:900}
      .sub{font-size:16px;fill:#475569}
      .label{font-size:19px;font-weight:900}
      .body{font-size:17px;fill:#334155}
      .small{font-size:14px;fill:#475569}
      .big{font-size:28px;font-weight:900}
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="696" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="54" y="59">多入口汇聚：同一个出口，一帧一帧发</text>
  <text class="t sub" x="54" y="90">发送与等待关系示意：两帧同时就绪，本例先选择 A。颜色用于区分发送与等待。</text>

  <rect x="60" y="118" width="1080" height="76" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="84" y="140" width="104" height="32" rx="16" fill="#0891b2"/>
  <text x="136" y="162" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="900" fill="#ffffff">一句话</text>
  <text class="t label" x="218" y="166">出口正在发送一帧时，其他需要从这里发送的帧就要等。</text>

  <!-- Two independent ingress streams -->
  <rect x="70" y="248" width="250" height="96" rx="17" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text class="t label" x="94" y="281">入口 A</text>
  <text class="t body" x="94" y="316">帧 A 已就绪</text>
  <g class="flat-icon" fill="none" stroke="#0891b2" stroke-width="2.5">
    <rect x="252" y="272" width="40" height="44" rx="5"/>
    <path d="M261 283H283M261 293H283M261 303H276"/>
  </g>

  <rect x="70" y="414" width="250" height="96" rx="17" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text class="t label" x="94" y="447">入口 B</text>
  <text class="t body" x="94" y="482">帧 B 已就绪</text>
  <g class="flat-icon" fill="none" stroke="#0891b2" stroke-width="2.5">
    <rect x="252" y="438" width="40" height="44" rx="5"/>
    <path d="M261 449H283M261 459H283M261 469H276"/>
  </g>

  <!-- Both streams converge on one egress -->
  <path d="M320 296H430V336H532" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-cyan)"/>
  <path d="M320 462H430V394H532" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-cyan)"/>
  <text class="t small" x="356" y="282">帧 A</text>
  <text class="t small" x="356" y="487">帧 B</text>

  <rect x="560" y="272" width="270" height="178" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="586" y="294" width="218" height="34" rx="17" fill="#2563eb"/>
  <text x="695" y="317" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="900" fill="#ffffff">同一个出口的调度器</text>
  <text class="t body" x="695" y="361" text-anchor="middle">两帧都需要发送</text>
  <text class="t big" x="695" y="405" text-anchor="middle">本例先选中 A</text>
  <text class="t small" x="695" y="432" text-anchor="middle">一次只能开始发送一帧</text>

  <!-- A is transmitting while B waits -->
  <path d="M830 354H902" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-green)"/>
  <text class="t small" x="872" y="335" text-anchor="middle">获得出口</text>

  <rect x="930" y="294" width="200" height="122" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text class="t label" x="1030" y="324" text-anchor="middle">正在发送</text>
  <text class="t big" x="1030" y="369" text-anchor="middle">帧 A</text>
  <text class="t small" x="1030" y="400" text-anchor="middle">逐比特发出，需要时间</text>

  <path d="M695 450V476" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow-orange)"/>
  <rect x="560" y="504" width="270" height="94" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text class="t label" x="584" y="536">帧 B 留在缓冲区等待</text>
  <g fill="#fb923c" stroke="#c2410c" stroke-width="1.5">
    <rect x="584" y="553" width="48" height="24" rx="4"/>
  </g>
  <text class="t small" x="608" y="571" text-anchor="middle">B</text>
  <text class="t small" x="646" y="571">等 A 发完才能开始</text>
  <rect x="70" y="626" width="1060" height="56" rx="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t label" x="600" y="662" text-anchor="middle">A 发完后，再发送 B；B 等待的时间就是排队延迟。</text>
</svg>
