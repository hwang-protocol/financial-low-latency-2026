<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940">
  <title>PHC、Transparent Clock 与 Boundary Clock 的工作关系</title>
  <desc>从同一个上游时间源出发，对比 PTP 经过 Transparent Clock 和 Boundary Clock 的两条常见路径，并说明两条路径最终如何校准端点网卡里的 PTP Hardware Clock。</desc>
  <defs>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#7e22ce"/>
    </marker>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="20" markerHeight="15" orient="auto" overflow="visible">
      <path d="M0 1.5 L17 7.5 L0 13.5 Z" fill="#2563eb"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font-size:30px;font-weight:900}
      .sub{font-size:16px;fill:#475569}
      .section{font-size:21px;font-weight:900}
      .label{font-size:18px;font-weight:900}
      .body{font-size:16px;fill:#334155}
      .small{font-size:13px;fill:#475569}
      .badge{font-size:13px;font-weight:900}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:14px;font-weight:800;fill:#0f172a}
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="916" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="54" y="59">PHC、TC、BC：三个 “Clock” 到底怎样工作</text>
  <text class="t sub" x="54" y="90">PHC 是会实际走时的网卡硬件钟；TC 与 BC 是中间网络设备处理 PTP 的两种角色。</text>

  <!-- Shared upstream time source -->
  <rect x="410" y="116" width="380" height="76" rx="17" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="440" y="132" width="90" height="28" rx="14" fill="#475569"/>
  <text x="485" y="151" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="900" fill="#ffffff">参考源</text>
  <text class="t label" x="548" y="153">上游时间源 · Grandmaster</text>
  <text class="t small" x="600" y="179" text-anchor="middle">给两条示意路径提供同一个参考时间</text>

  <path d="M600 192V212H309V298" fill="none" stroke="#7e22ce" stroke-width="3.5" marker-end="url(#arrow-purple)"/>
  <path d="M600 212H891V298" fill="none" stroke="#7e22ce" stroke-width="3.5" marker-end="url(#arrow-purple)"/>

  <!-- Path A: Transparent Clock -->
  <rect x="44" y="230" width="530" height="520" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="44" y="230" width="530" height="52" rx="22" fill="#ecfeff"/>
  <path d="M44 260h530v22H44z" fill="#ecfeff"/>
  <text class="t section" x="70" y="263">路径 A：中间设备采用 TC</text>

  <rect x="82" y="314" width="454" height="206" rx="18" fill="#f8fafc" stroke="#0891b2" stroke-width="2.5"/>
  <rect x="104" y="330" width="238" height="30" rx="15" fill="#0891b2"/>
  <text x="223" y="350" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="900" fill="#ffffff">TC · Transparent Clock</text>
  <text class="t small" x="358" y="350">透明时钟</text>

  <circle cx="122" cy="400" r="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text class="t badge" x="122" y="405" text-anchor="middle">入</text>
  <text class="t small" x="122" y="430" text-anchor="middle">记 t_in</text>

  <rect x="165" y="374" width="288" height="72" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="t mono" x="309" y="403" text-anchor="middle">residence = t_out - t_in</text>
  <text class="t mono" x="309" y="428" text-anchor="middle">correctionField += residence</text>

  <circle cx="496" cy="400" r="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text class="t badge" x="496" y="405" text-anchor="middle">出</text>
  <text class="t small" x="496" y="430" text-anchor="middle">记 t_out</text>

  <path d="M140 400H149" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M453 400H462" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <text class="t body" x="309" y="478" text-anchor="middle">同一 PTP 会话继续穿过</text>
  <text class="t body" x="309" y="502" text-anchor="middle">TC 不终止会话，也不重新充当 Master</text>

  <path d="M309 520V524" fill="none" stroke="#7e22ce" stroke-width="3.5" marker-end="url(#arrow-purple)"/>

  <rect x="82" y="540" width="454" height="184" rx="18" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
  <rect x="104" y="558" width="72" height="28" rx="14" fill="#7e22ce"/>
  <text x="140" y="577" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="900" fill="#ffffff">PHC</text>
  <text class="t label" x="192" y="578">PTP Hardware Clock</text>
  <text class="t body" x="104" y="612">实体硬件钟就在端点网卡里</text>
  <text class="t body" x="104" y="637">Linux 节点：/dev/ptp0</text>
  <text class="t body" x="104" y="662">ptp4l 用带 correction 的 PTP 信息调整它</text>
  <text class="t body" x="104" y="687">同步后，NIC 硬件时间戳进入共同时间域</text>

  <!-- Path B: Boundary Clock -->
  <rect x="626" y="230" width="530" height="520" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="626" y="230" width="530" height="52" rx="22" fill="#eff6ff"/>
  <path d="M626 260h530v22H626z" fill="#eff6ff"/>
  <text class="t section" x="652" y="263">路径 B：中间设备采用 BC</text>

  <rect x="664" y="314" width="454" height="206" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="686" y="330" width="226" height="30" rx="15" fill="#2563eb"/>
  <text x="799" y="350" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="900" fill="#ffffff">BC · Boundary Clock</text>
  <text class="t small" x="928" y="350">边界时钟</text>

  <rect x="688" y="378" width="112" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t badge" x="744" y="402" text-anchor="middle">上游端口</text>
  <text class="t body" x="744" y="426" text-anchor="middle">SLAVE</text>

  <rect x="835" y="378" width="112" height="62" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text class="t badge" x="891" y="402" text-anchor="middle">本机时间</text>
  <text class="t body" x="891" y="426" text-anchor="middle">先跟上游</text>

  <rect x="982" y="378" width="112" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t badge" x="1038" y="402" text-anchor="middle">下游端口</text>
  <text class="t body" x="1038" y="426" text-anchor="middle">MASTER</text>

  <path d="M800 409H819" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M947 409H966" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="t body" x="891" y="478" text-anchor="middle">上游 PTP 会话在 BC 终止</text>
  <text class="t body" x="891" y="502" text-anchor="middle">下游从 BC 开始一段新的 PTP 会话</text>

  <path d="M891 520V524" fill="none" stroke="#7e22ce" stroke-width="3.5" marker-end="url(#arrow-purple)"/>

  <rect x="664" y="540" width="454" height="184" rx="18" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
  <rect x="686" y="558" width="72" height="28" rx="14" fill="#7e22ce"/>
  <text x="722" y="577" text-anchor="middle" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="900" fill="#ffffff">PHC</text>
  <text class="t label" x="774" y="578">PTP Hardware Clock</text>
  <text class="t body" x="686" y="612">实体硬件钟就在端点网卡里</text>
  <text class="t body" x="686" y="637">Linux 节点：/dev/ptp0</text>
  <text class="t body" x="686" y="662">端点与 BC 的下游 MASTER 交换 PTP 报文</text>
  <text class="t body" x="686" y="687">ptp4l 调整 PHC；BC 接住另一段的上游</text>

  <!-- One-glance summary -->
  <rect x="44" y="772" width="1112" height="134" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t label" x="70" y="806">先分层：</text>
  <text class="t body" x="180" y="806">PHC 是实体硬件钟；TC / BC 是网络设备在 PTP 中扮演的角色。</text>
  <text class="t body" x="180" y="830">左、右是两条常见路径，不是 “TC → BC → PHC” 的三级串联。</text>

  <rect x="70" y="848" width="320" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t badge" x="88" y="873">PHC</text>
  <text class="t body" x="150" y="873">保存并输出端点时间</text>

  <rect x="440" y="848" width="320" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t badge" x="458" y="873">TC</text>
  <text class="t body" x="510" y="873">报告设备驻留了多久</text>

  <rect x="810" y="848" width="320" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="t badge" x="828" y="873">BC</text>
  <text class="t body" x="880" y="873">终止并重建 PTP 会话</text>
</svg>
