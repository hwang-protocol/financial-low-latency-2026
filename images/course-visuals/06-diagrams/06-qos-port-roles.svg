<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <title>Order direction, port config, and TC to TX queue</title>
  <desc>Trader enters at Et2, Exchange leaves at Et1. Et2 trusts DSCP, the ASIC maps DSCP 46 to TC5 then TX queue 5, Et1 makes Q5 priority strict. Return Execution is unmarked in this lesson.</desc>
  <defs>
    <marker id="arr-cyan" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="14" markerHeight="12" orient="auto">
      <path d="M0 2 L16 7.5 L0 13 Z" fill="#0891b2"/>
    </marker>
    <marker id="arr-orange" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="14" markerHeight="12" orient="auto">
      <path d="M0 2 L16 7.5 L0 13 Z" fill="#ea580c"/>
    </marker>
    <marker id="arr-slate" markerUnits="userSpaceOnUse" viewBox="0 0 20 15" refX="1" refY="7.5" markerWidth="14" markerHeight="12" orient="auto">
      <path d="M0 2 L16 7.5 L0 13 Z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-family:"Noto Sans CJK SC","Noto Sans CJK SC Regular","Microsoft YaHei",sans-serif;fill:#0f172a}
      .h{font-size:28px;font-weight:900}
      .sub{font-size:16px;fill:#475569}
      .label{font-size:18px;font-weight:900}
      .body{font-size:15px;fill:#334155}
      .small{font-size:14px;fill:#475569}
      .white{fill:#ffffff}
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="676" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="t h" x="48" y="54">订单从哪进、配置落在哪、TC 怎样进队列</text>
  <text class="t sub" x="48" y="82">青色是本课验证的 Trader 到 Exchange；灰色虚线是回程，本课不打标。</text>

  <rect x="40" y="168" width="210" height="168" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <rect x="58" y="186" width="174" height="32" rx="16" fill="#0891b2"/>
  <text class="t white" x="145" y="208" text-anchor="middle" font-size="15" font-weight="900">.2 Trader</text>
  <text class="t label" x="145" y="242" text-anchor="middle">Socket 订单</text>
  <text class="t body" x="145" y="268" text-anchor="middle">应用设置 DSCP 46</text>
  <text class="t small" x="145" y="294" text-anchor="middle">.2 到 .1:43120</text>
  <text class="t small" x="145" y="316" text-anchor="middle">TOS 0xb8</text>

  <rect x="950" y="168" width="210" height="168" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <rect x="968" y="186" width="174" height="32" rx="16" fill="#15803d"/>
  <text class="t white" x="1055" y="208" text-anchor="middle" font-size="15" font-weight="900">.1 Exchange</text>
  <text class="t label" x="1055" y="242" text-anchor="middle">收到 OUCH</text>
  <text class="t body" x="1055" y="268" text-anchor="middle">回 Execution</text>
  <text class="t small" x="1055" y="294" text-anchor="middle">回程本课不打标</text>
  <text class="t small" x="1055" y="316" text-anchor="middle">走默认分类</text>

  <rect x="300" y="118" width="600" height="360" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="320" y="134" width="220" height="32" rx="16" fill="#2563eb"/>
  <text class="t white" x="430" y="156" text-anchor="middle" font-size="15" font-weight="900">7150S / FM6000</text>
  <text class="t small" x="556" y="148">芯片带着 TC 转发</text>
  <text class="t small" x="556" y="166">不是 IP 头里多一个字段</text>

  <rect x="320" y="188" width="168" height="132" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="336" y="202" width="136" height="28" rx="14" fill="#0891b2"/>
  <text class="t white" x="404" y="222" text-anchor="middle" font-size="14" font-weight="900">Et2 入口</text>
  <text class="t label" x="404" y="252" text-anchor="middle">qos trust dscp</text>
  <text class="t body" x="404" y="278" text-anchor="middle">在这里读 DSCP</text>
  <text class="t small" x="404" y="302" text-anchor="middle">得到内部 TC</text>

  <rect x="516" y="188" width="168" height="132" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="532" y="202" width="136" height="28" rx="14" fill="#4f46e5"/>
  <text class="t white" x="600" y="222" text-anchor="middle" font-size="14" font-weight="900">芯片映射</text>
  <text class="t body" x="600" y="254" text-anchor="middle">DSCP 40 到 47</text>
  <text class="t label" x="600" y="280" text-anchor="middle">到 TC5</text>
  <text class="t label" x="600" y="306" text-anchor="middle">到 TX queue 5</text>

  <rect x="712" y="188" width="168" height="132" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="728" y="202" width="136" height="28" rx="14" fill="#ea580c"/>
  <text class="t white" x="796" y="222" text-anchor="middle" font-size="14" font-weight="900">Et1 出口</text>
  <text class="t body" x="796" y="252" text-anchor="middle" font-weight="900">Q5 priority strict</text>
  <text class="t body" x="796" y="278" text-anchor="middle">队列证据看这里</text>
  <text class="t small" x="796" y="302" text-anchor="middle">Q3 到 Q0 属 WRR</text>

  <path d="M250 252 H310" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
  <path d="M488 254 H508" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
  <path d="M684 254 H704" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <path d="M880 252 H950" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text class="t small" x="280" y="238" text-anchor="middle">订单入</text>
  <text class="t small" x="915" y="238" text-anchor="middle">订单出</text>

  <rect x="320" y="336" width="560" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="t label" x="600" y="364" text-anchor="middle">出口队列怎么排</text>
  <rect x="344" y="380" width="150" height="58" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text class="t body" x="419" y="404" text-anchor="middle">Q7 / Q6</text>
  <text class="t small" x="419" y="426" text-anchor="middle">更高，本课不用</text>
  <rect x="514" y="380" width="150" height="58" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text class="t body" x="589" y="404" text-anchor="middle">Q5 strict</text>
  <text class="t small" x="589" y="426" text-anchor="middle">本课订单</text>
  <rect x="684" y="380" width="176" height="58" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t body" x="772" y="404" text-anchor="middle">Q1 默认 / WRR</text>
  <text class="t small" x="772" y="426" text-anchor="middle">背景和回程</text>

  <path d="M1055 336 V526 H932" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M268 526 H145 V336" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr-slate)"/>
  <rect x="280" y="494" width="640" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="t body" x="600" y="520" text-anchor="middle">回程 Execution：Et1 入，默认 TC1 / Q1，再从 Et2 出</text>
  <text class="t small" x="600" y="542" text-anchor="middle">本课只验订单这一向</text>

  <rect x="40" y="572" width="1120" height="100" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text class="t label" x="64" y="604">记三个落点</text>
  <text class="t body" x="64" y="630">Et2 管信任：读不读主机带来的 DSCP。芯片管映射：DSCP 到 Traffic Class 再到 TX queue。</text>
  <text class="t body" x="64" y="654">Et1 管出队：Q5 先走，Q1 里的背景继续排队。</text>
</svg>
