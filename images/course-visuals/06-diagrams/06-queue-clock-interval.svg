<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>本章三部分：耗时、队列、测量</title><desc>先认识耗时来源，再调整出口队列，最后用时间戳测量延迟。</desc><defs>
