</defs><rect width="1200" height="100%" fill="#f7f9fc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172338">
<text x="36" y="52" font-size="32" fill="#172338" font-weight="700" text-anchor="start">本章三部分：耗时、队列、测量</text>
<text x="36" y="94" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">先认识耗时来源，再调整出口队列，最后用时间戳测量延迟。</text>
<rect x="35" y="155" width="340" height="260" rx="15" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
<use href="#chip" x="53" y="173" width="58" height="58" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="123" y="208" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start">① 链路五项耗时</text>
<text x="57" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">先认识五项耗时来源</text>
<text x="57" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">抓住出口排队这个变动项</text>
<text x="57" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">按序展开机制与实例</text>
<rect x="430" y="155" width="340" height="260" rx="15" fill="#fff" stroke="#7e22ce" stroke-width="1.6"/>
<use href="#queue" x="448" y="173" width="58" height="58" fill="none" stroke="#7e22ce" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="518" y="208" font-size="26" fill="#7e22ce" font-weight="700" text-anchor="start">② QoS 与队列</text>
<text x="452" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">订单分类，映射到出口队列</text>
<text x="452" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">按优先级安排发送顺序</text>
<text x="452" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">LANZ 记录出口拥塞事件</text>
<rect x="825" y="155" width="340" height="260" rx="15" fill="#fff" stroke="#15803d" stroke-width="1.6"/>
<use href="#clock" x="843" y="173" width="58" height="58" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="913" y="208" font-size="26" fill="#15803d" font-weight="700" text-anchor="start">③ PTP 对时与测量</text>
<text x="847" y="260" font-size="23" fill="#172338" font-weight="400" text-anchor="start">先确定计时起点与终点</text>
<text x="847" y="295" font-size="23" fill="#172338" font-weight="400" text-anchor="start">同步时钟，配对同一帧</text>
<text x="847" y="330" font-size="23" fill="#172338" font-weight="400" text-anchor="start">时间戳相减，算出延迟</text>
<path d="M387,280 L406.00,280.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<path d="M782,280 L801.00,280.00" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#arr-gray)"/>
<rect x="35" y="467" width="1130" height="90" rx="15" fill="#fff8ee" stroke="#c76a08" stroke-width="1.6"/>
<text x="600" y="504" font-size="26" fill="#172338" font-weight="700" text-anchor="middle">时间花在哪里？怎样让订单先发？报文经过这段用了多久？</text>
<text x="600" y="538" font-size="23" fill="#64748b" font-weight="400" text-anchor="middle">五项耗时建立全貌，QoS 与 LANZ 调整和观察队列，PTP 为测量对时。</text>
</g></svg>