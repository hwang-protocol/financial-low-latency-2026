<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FLLE 普通 Linux 交易系统运行架构</title>
  <desc id="desc">管理机把当前客户端源码送到101编译，并分发已验签运行包。行情与订单在1与2之间走C++热路径。网页从2上的client读盘口，手工单先到MANUAL进程，再由该进程向Exchange下单。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="exchange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="trader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" viewBox="0 0 16 12" refX="1" refY="6" orient="auto" overflow="visible">
      <path d="M0 1 L14 6 L0 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" viewBox="0 0 16 12" refX="1" refY="6" orient="auto" overflow="visible">
      <path d="M0 1 L14 6 L0 11 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" viewBox="0 0 16 12" refX="1" refY="6" orient="auto" overflow="visible">
      <path d="M0 1 L14 6 L0 11 Z" fill="#7e22ce"/>
    </marker>
    <marker id="arrow-slate" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" viewBox="0 0 16 12" refX="1" refY="6" orient="auto" overflow="visible">
      <path d="M0 1 L14 6 L0 11 Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}
      .ink{fill:#0f172a}
      .muted{fill:#475569}
      .body{fill:#334155}
      .eyebrow{font-size:15px;font-weight:800;letter-spacing:1.5px;fill:#475569}
      .title{font-size:26px;font-weight:900;fill:#0f172a}
      .host{font-size:17px;font-weight:900}
      .line{font-size:15px;font-weight:650}
      .small{font-size:13px;font-weight:700}
      .pill{font-size:12px;font-weight:850}
      .footer{font-size:15px;font-weight:700;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="48" y="46" class="eyebrow">FLLE · HOST-NATIVE BASELINE</text>
  <text x="48" y="80" class="title">普通 Linux 交易系统：先部署，再把热路径和网页分开</text>

  <g filter="url(#shadow)">
    <rect x="48" y="104" width="320" height="136" rx="20" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <rect x="48" y="104" width="320" height="36" rx="20" fill="#dbeafe"/>
    <rect x="48" y="122" width="320" height="18" fill="#dbeafe"/>
    <text x="68" y="128" class="host" fill="#1e3a8a">管理机 · 10.1.1.111</text>
    <text x="68" y="168" class="line body">持久 Git 工作区 + 部署脚本</text>
    <text x="68" y="194" class="line body">AAPL / NVDA 官方 ITCH 制品</text>
    <rect x="68" y="206" width="148" height="22" rx="11" fill="#eff6ff"/>
    <text x="80" y="221" class="pill" fill="#1d4ed8">快照后仍保留</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="832" y="104" width="320" height="136" rx="20" fill="#fff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="832" y="104" width="320" height="36" rx="20" fill="#e0e7ff"/>
    <rect x="832" y="122" width="320" height="18" fill="#e0e7ff"/>
    <text x="852" y="128" class="host" fill="#312e81">Builder / UI · 10.1.1.101</text>
    <text x="852" y="168" class="line body">g++-11 构建原生客户端</text>
    <text x="852" y="194" class="line body">Python 网关 + 浏览器看盘下单</text>
    <rect x="852" y="206" width="168" height="22" rx="11" fill="#eef2ff"/>
    <text x="864" y="221" class="pill" fill="#4338ca">不进入交易热路径</text>
  </g>

  <path d="M368 172H807" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <text x="478" y="158" class="small" fill="#1d4ed8">① 源码 + 行情制品</text>

  <path d="M250 240V305" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <text x="268" y="278" class="small" fill="#1d4ed8">② 已验签 Exchange + ITCH</text>

  <path d="M992 240V305" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <text x="1004" y="292" class="small" fill="#1d4ed8">② 客户端</text>

  <g filter="url(#shadow)">
    <rect x="48" y="330" width="510" height="292" rx="22" fill="url(#exchange)" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="48" y="330" width="510" height="46" rx="22" fill="#fed7aa"/>
    <rect x="48" y="354" width="510" height="22" fill="#fed7aa"/>
    <text x="68" y="360" class="host" fill="#9a3412">.1 Exchange · C++</text>
    <text x="68" y="408" class="line body">读取 2026-06-12 官方 ITCH 事件</text>
    <text x="68" y="436" class="line body">经 UDP 单播/组播发布 AAPL / NVDA</text>
    <text x="68" y="464" class="line body">在独立纸面账本上接收并撮合订单</text>
    <rect x="68" y="486" width="108" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="122" y="505" text-anchor="middle" class="pill" fill="#9a3412">History</text>
    <rect x="186" y="486" width="108" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="240" y="505" text-anchor="middle" class="pill" fill="#9a3412">Market</text>
    <rect x="304" y="486" width="108" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="358" y="505" text-anchor="middle" class="pill" fill="#9a3412">Paper</text>
    <rect x="422" y="486" width="108" height="28" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="476" y="505" text-anchor="middle" class="pill" fill="#9a3412">Execution</text>
    <text x="68" y="546" class="small muted">历史回放 · 行情发布 · 纸面账本 · 成交回执</text>
    <text x="68" y="572" class="small muted">热路径：UDP 行情 + TCP 订单会话</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="642" y="330" width="510" height="292" rx="22" fill="url(#trader)" stroke="#059669" stroke-width="2.5"/>
    <rect x="642" y="330" width="510" height="46" rx="22" fill="#a7f3d0"/>
    <rect x="642" y="354" width="510" height="22" fill="#a7f3d0"/>
    <text x="662" y="360" class="host" fill="#065f46">.2 原生客户端 · AUTO / MANUAL</text>
    <text x="662" y="408" class="line body">各自收行情、维护订单簿、建立订单会话</text>
    <rect x="662" y="428" width="226" height="86" rx="14" fill="#fff" stroke="#10b981"/>
    <text x="678" y="456" class="small" fill="#065f46">AUTO · :48121</text>
    <text x="678" y="480" class="small muted">策略与风控自行下单</text>
    <text x="678" y="500" class="small muted">独立 Soup / OUCH 会话</text>
    <rect x="906" y="428" width="226" height="86" rx="14" fill="#fff" stroke="#10b981"/>
    <text x="922" y="456" class="small" fill="#065f46">MANUAL · :48122</text>
    <text x="922" y="480" class="small muted">接收网页手工意图</text>
    <text x="922" y="500" class="small muted">独立 Soup / OUCH 会话</text>
    <text x="662" y="546" class="small muted">网页从这里读盘口与成交</text>
    <text x="662" y="572" class="small muted">手工单先进入 MANUAL，再发向 Exchange</text>
  </g>

  <path d="M558 412H617" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="600" y="398" text-anchor="middle" class="small" fill="#0e7490">ITCH</text>
  <path d="M642 528H583" fill="none" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="600" y="552" text-anchor="middle" class="small" fill="#6b21a8">OUCH</text>

  <path d="M1108 330V265" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-slate)"/>
  <text x="1118" y="292" class="small muted">③ 看盘</text>
  <path d="M1072 240V403" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-slate)"/>
  <text x="1082" y="390" class="small muted">④ 下单</text>

  <rect x="48" y="644" width="1104" height="48" rx="16" fill="#e2e8f0"/>
  <text x="600" y="674" text-anchor="middle" class="footer">图中显示原生 Socket 路径；Onload、TCPDirect 也在第二章部署并启动</text>
</svg>
