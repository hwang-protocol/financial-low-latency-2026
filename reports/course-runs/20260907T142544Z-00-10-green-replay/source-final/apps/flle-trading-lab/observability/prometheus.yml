global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: flle-trading
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.1.101:8088"]
        labels:
          course: flle
          profile: display

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
